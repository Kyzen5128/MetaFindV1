  criterion: "object-level leakage_count == 0 AND admitted + quarantined == len(manifest)\
    \ AND quarantine_rate <= 0.02 AND both evaluation protocols are defined with explicit\
    \ query and gallery scopes AND stage1_encoding_protocol.status == \"resolved\"\
    , with text_serialization,\n    image_aggregation, paper_clip_train_scope, actual_clip_train_scope\
    \ and\n    missing_modality_representation each naming a choice\nAND paper_clip_train_scope_basis\
    \ is non-empty AND paper_clip_train_scope_confidence in {low, moderate, high}\n\
    \    -- without these two, a protocol reading `paper_clip_train_scope: frozen`\n\
    \    with an empty basis PASSES, and n21 reaches the report with a decision\n\
    \    it cannot cite. The scope alone does not say why.\n    (U-15, U-14, U-34\
    \ x2, U-11)\n    [CORRECTED] This listed three fields after the channel grew to\
    \ five.\n    A protocol missing paper_clip_train_scope or\n    missing_modality_representation\
    \ therefore PASSED the gate and was\n    then rejected by Stage1RuntimeConfig.from_protocols.\
    \ Failing closed\n    at the executor is right, but a gate that says PASS on something\
    \ the\n    executor refuses is not a barrier -- it is a second opinion nobody\n\
    \    asked for.\nAND stage1_protocol.status == \"resolved\", with fusion, tower_sharing,\n\
    \    allow_all_masked, similarity and hyperparameter_config_hash each\n    naming\
    \ a choice (U-13, U-16, U-23, U-24, U-22)\nAND stage1_hyperparameters.sha256 ==\
    \ stage1_protocol.hyperparameter_config_hash,\n    and stage1_hyperparameters.values\
    \ names every field of U-22\n    (optimizer, learning_rate, weight_decay, scheduler,\
    \ batch_size,\n     epochs, p_mask, init_temperature, learnable_temperature,\n\
    \     max_logit_scale, seed) -- presence of the hash is not enough,\n    because\
    \ a hash nothing dereferences leaves the run on library\n    defaults. [CORRECTED]\
    \ This clause used to demand a dereference G3 had\n    no channel to perform:\
    \ the artifact existed only as a dict passed\n    into Python from outside the\
    \ graph.\nAND stage1_hyperparameters.values.p_mask == 0.30 unless the run is a\n\
    \    declared Table 3 modality-dropout variant\n    (paper 2.6 fixes 30%; Table\
    \ 3 ablates 10% and 50%. Carrying p_mask\n     in the U-22 artifact made a paper-stated\
    \ constant look like one of\n     the values the paper omits, so an artifact saying\
    \ 0.50 would hash\n     correctly and silently run the ablation as the main line.)"
