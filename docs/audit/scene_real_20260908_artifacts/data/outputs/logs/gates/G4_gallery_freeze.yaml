  collapse_note: 'This criterion cannot detect a collapsed index: every vector ties
    for the maximum, so the target is in the argmax tie set. MEASURED 2026-08-30,
    and the bound is the measurement, not a proof -- 120 trials over 3 shapes (d=8/ng=30,
    d=1280/ng=999, d=1280/ng=4569), 0 of 120 failed. It is NOT analytically guaranteed:
    retrieval.rank_of_target records identical GEMM columns differing by one ULP in
    61 of 400 collapsed galleries, in a toy regime (small d, unnormalised). At that
    rate a collapsed index could fail this criterion by ACCIDENT, which is not the
    same as being detected. The [CORRECTED] change to validation_plan.yaml bought
    tie-safety and paid in collapse-blindness. effective_rank is recorded for that
    reason and is NOT a pass condition.'
  corpus_note: The id and count clauses compare n11's OUTPUT against n11's own INPUT.
    len(admitted) is derived from splits.json object train+test, which is the same
    artifact gallery_index.main built its id list from, so a mismatch means an n11
    bug -- a dropped, duplicated or misnamed row -- and NOT a wrong corpus. If splits.json
    itself names the wrong assets, the index will agree with it and this gate will
    PASS. G3_object_corpus is the gate that judges the corpus; this one judges the
    encode.
