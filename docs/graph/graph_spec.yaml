risks_unknowns:
  - {id: U-01, marked: UNKNOWN, blocking: false, item: "asset count: paper says ~48,000, manifest holds 46,052", affects: "every denominator", resolution: "use len(manifest); record its sha256", fallback: "n/a"}
  - {id: U-02, marked: UNKNOWN, blocking: false, item: "whether self-sampled point clouds match ULIP-2's training distribution", affects: "every PC embedding", resolution: "L2-PC-ULIP-REF diagnostic against a small sample of ULIP's released clouds; G2 now checks only that our clouds are structurally valid", fallback: "download a reference subset of ULIP's point clouds"}
  - {id: U-03, marked: UNKNOWN, blocking: false, item: "camera placement for the 11 views. PAPER FACT: the count, 11, and nothing else -- 2.3 says only 'rendered from 11 orthogonal viewpoints', with no coordinates, axis, elevation or figure. No official MetaFind rendering implementation was found; MetaSpatial (same group, arXiv:2503.18470) publishes Blender code but nothing that reconstructs an 11-view object rig, so it is not evidence here.", affects: "the image modality: Table 1's Image Only, T+I, I+PC and T+I+PC columns", resolution: "PRIMARY: equal-azimuth orbit, 11 views, delta-azimuth = 360/11 = 32.7273 deg. Labelled UPSTREAM-INFORMED CHOICE, not paper truth -- MetaFind states it builds on ULIP-2, and ULIP-2's Objaverse pipeline is '12 images per shape, spaced equally by 30 degrees', a single-axis orbit; swapping 12 for MetaFind's stated 11 is the smallest step from a documented upstream method. VARIANT: fibonacci_sphere_11, the previous primary. MEASURED over 100 assets: silhouette coverage is indistinguishable (0.1667 vs 0.1653, median paired difference +0.0009) but mean inter-view similarity differs, 0.507 for the orbit against 0.442 for Fibonacci, with 53 of 100 assets differing by more than 0.05 -- a fixed-elevation orbit never sees the top or bottom, so its 11 views are systematically more redundant. The ambiguity is therefore NOT empirically negligible and is worth an ablation if there is budget.", fallback: "n/a"}
  - {id: U-03b, marked: UNKNOWN, blocking: false, item: "the orbit's elevation. Not derivable from MetaFind, from ULIP-2, or from any published code -- ULIP-2 states the azimuth spacing and nothing about elevation.", affects: "how much of an asset's top surface any view sees", resolution: "fixed at 20 degrees and versioned in renderer_version; recorded per asset as an implementation choice. No top view is added -- nothing supports one.", fallback: "n/a"}
  - {id: U-03a, marked: UNKNOWN, blocking: false, item: "orthographic or perspective projection. 2.3 says '11 orthogonal viewpoints'. Eleven mutually orthogonal directions do not exist in R^3, so 'orthogonal' cannot be literal -- but that is NOT evidence for orthographic projection. A viewpoint is a camera pose; orthographic is a projection model, and an author meaning the latter would more naturally write 'orthographic views'. The sentence is underspecified, possibly imprecise, and settles nothing.", affects: "the image modality; apparent size becomes distance-dependent under perspective", resolution: "PRIMARY: orthographic, labelled CURRENT IMPLEMENTATION CHOICE. It is explicitly NOT recorded as the more likely reading of 'orthogonal', because no reading is supported. perspective stays executable via render_views(projection=...). [CORRECTED] An earlier version of this entry said 'orthogonal is being read as a projection type', which promoted an implementation choice into an inference about the paper.", fallback: "n/a"}
  - {id: U-04, marked: UNKNOWN, blocking: false, item: "render resolution", affects: "image tower input", resolution: "224px, matching ULIP-2's convention", fallback: "512px if annotation quality suffers"}
  - {id: U-05, marked: UNKNOWN, blocking: false, item: "adjacency criterion for physical edges", affects: "ESSGNN input", resolution: "kNN k=8, recorded with the artifact", fallback: "radius mode available"}
  - {id: U-06, marked: UNKNOWN, blocking: false, item: "which object pairs get a semantic edge, and the width of e_ij", affects: "ESSGNN input", resolution: "record the choice; list in the report", fallback: "n/a"}
  - {id: U-07, marked: UNKNOWN, blocking: false, item: "ProcTHOR ships 10k/1k/1k but the paper says 80/20", affects: "scene splits", resolution: "main line follows the paper; both recorded", fallback: "n/a"}
  - {id: U-08, marked: RESOLVED, blocking: false, item: "how Stage 2 training samples are constructed from ProcTHOR. Kept as the umbrella that U-08a (positive identity), U-08b (target modalities), U-08c (asset cardinality) and U-08d (sample construction) decompose into.", affects: "all of Table 2 and 3", decided: "fully decomposed; every sub-question is answered in U-08a, U-08b and U-08d, with U-08c remaining an open provenance question that does not block execution.", decided_by: 'Kyzen (relayed review)', decided_at: '2026-08-16', decision_basis: "This entry stayed marked UNKNOWN after its named sub-questions were answered, which made it look either redundant or like a fifth open item. It was neither: U-08d was genuinely missing and hiding under it. An umbrella that outlives its parts is where a real gap hides -- the reviewer found U-08d exactly there.", confidence: moderate, reopen_if: "a Stage 2 construction question arises that none of U-08a/b/c/d covers."}
  - {id: U-08a, marked: RESOLVED, blocking: false, item: "which gallery entry is Stage 2's positive -- ProcTHOR assetIds and Objaverse uids have zero measured overlap (0 of 995)", affects: "Eq. 7a/7b have no positive; Stage 2 cannot be built", resolution: "n09b_resolve_stage2_protocol; enforced by G6_stage2_ready", fallback: "none -- this is a decision, not a computation", decided: "Stage 2 uses its own ProcTHOR gallery; the positive is the SAME assetId, so no ProcTHOR-to-Objaverse correspondence is needed at all.", decided_by: 'Kyzen (relayed GPT analysis, verified against paper text and our own I-Design wrapper)', decided_at: '2026-08-16', decision_basis: "The blocking premise was ours, not the paper's: we had assumed Stage 2 must reuse Stage 1's Objaverse catalog. VERIFIED against the text -- 2.6 says 'Only the query-side fuser and the ESSGNN module are updated; the gallery encoder is frozen', which fixes WEIGHTS, and Eq. 7a/7b sum over the batch B, not over a named catalog. Nothing binds the Stage 2 index to Objaverse. A frozen encoder and a rebuilt index are routine in retrieval; encoder is not index. So the target is a ProcTHOR asset, the positive is that same asset encoded by the same frozen gallery encoder, and the identity is Fridge_19 -> Fridge_19. Rejected: category-random and embedding-nearest Objaverse matches, both pseudo-labels; and scene-as-context-only with an Objaverse self-positive, which lets the model ignore ESSGNN entirely and still minimise the loss -- computable but no longer measuring scene-aware compatibility. MEASURED (F25): that gallery holds 1,467 assets, not the 3,000+ the paper cites.", confidence: moderate, reopen_if: "MetaFind code or its authors describe a different Stage 2 target, gallery scope, placement owner or evaluation scene source."}
  - {id: U-08b, marked: RESOLVED, blocking: false, item: "where the Stage 2 target's text / image / point cloud come from; ProcTHOR ships metadata and coordinates only", affects: "Eq. 6 has no modality inputs", resolution: "n09b_resolve_stage2_protocol; enforced by G6_stage2_ready", fallback: "none", decided: "ProcTHOR-side modalities are generated with AI2-THOR isolated rendering under n04's image protocol; point clouds are multi-view depth shells and the query side may omit the point cloud.", decided_by: 'Kyzen (relayed GPT analysis, verified against paper text and our own I-Design wrapper)', decided_at: '2026-08-16', decision_basis: "F24 measured that AI2-THOR renders a single ProcTHOR asset in isolation, orthographic, 11 views, white background, matching n04 -- so the 'no source for the modalities' premise was false. The genuine residual gap is the point cloud: n03 samples a complete mesh surface, depth back-projection reaches only the visible hull, and the gallery encoder is frozen so PointBERT cannot adapt to that shift. The paper's own design absorbs this: the query encoder accepts any modality subset (2.4), so the query may run text+image with the point cloud optional, while the gallery stays modality-complete as 2.6 requires. Classified as an UNSPECIFIED HIGH-IMPACT REPRODUCTION CHOICE rather than a deviation: a deviation is 'the paper says X, we do Y', and here the paper requires Stage 2 modalities while never specifying how ProcTHOR's are produced -- we are instantiating a missing protocol, not contradicting a stated one.", confidence: moderate, reopen_if: "MetaFind code or its authors describe a different Stage 2 target, gallery scope, placement owner or evaluation scene source."}
  - {id: U-08c, marked: UNKNOWN, blocking: false, item: "which ProcTHOR asset cardinality MetaFind actually used. [PAPER] MetaFind states >3,000 curated/unique ProcTHOR assets, twice (2.3 and 3.1), so it is the authors' own claim and not our misreading. [UPSTREAM] ProcTHOR 2022 states 1,633 household asset instances across 108 categories, and separates asset identity from material randomisation and object states, which makes the variant-counting explanation weak. [MEASURED] this AI2-THOR 5.0.0 build reports 1,934 asset-database entries; the re-downloaded 12,000 houses use 1,467 distinct assetIds. Ruled out: our copy being wrong (byte-identical on re-download), a revision difference (the older revision is identical), and houses sampling a larger library (the library is 1,934). Also ruled out: object instances, since ProcTHOR reports 76+/-48 objects per house, which is hundreds of thousands, not 3,000.", affects: "Stage 2 negative diversity, hard-negative frequency, target coverage and sampling dynamics -- NOT the mathematical definition of Eq. 7, whose negatives are in-batch. Table 2 stays comparable but not protocol-identical; impact MODERATE, direction unknown.", resolution: "Derive every executable cardinality from the installed versioned build. Hard-code no published figure. Record the provenance discrepancy as a table in the report. Run a Stage-2 asset-universe sensitivity diagnostic over subsets of the observed set rather than fabricating assets to reach 3,000.", open_alternatives: "(a) the authors used an unpublished or custom expanded asset universe; (b) they used the public corpus and reported the cardinality incorrectly. Both fit every public artifact; neither is asserted.", reopen_if: "official MetaFind code, an asset manifest, or author clarification reveals the Stage 2 asset universe."}
  - {id: U-08d, marked: RESOLVED, blocking: false, item: "how a Stage 2 training tuple (G_context, Q_j, A_j+) is constructed from a ProcTHOR house. U-08a fixed the positive and U-08b fixed its modalities, but nothing said which object becomes the target, how many samples a house yields, whether the target is removed from the graph before ESSGNN runs, or what an epoch is. Left open, a DataLoader default would have answered all four silently.", affects: "Stage 2 training signal and therefore every Table 2 and Table 3 number", decided: "leave-one-out per eligible object instance: sampling_unit=object_instance, target_eligibility = the assetId has an entry in procthor_asset_modalities AND that entry has a point cloud -- F26 measured 24 of 1,467 assets with transparent materials that AI2-THOR's depth prepass omits entirely, and 2.6 requires a modality-complete gallery, so they are excluded from the Stage 2 gallery and therefore cannot be positives, target_removed_before_essgnn=true, samples_per_house=all_eligible, instance_resampling=fixed, epoch_definition = one pass over the enumerated samples.", decided_by: 'Kyzen (relayed review)', decided_at: '2026-08-16', decision_basis: "Removing the target before ESSGNN is the load-bearing part: leaving it in lets the layout encoder see the answer, and the loss would drop without the model learning anything about compatibility. Enumerating every eligible instance rather than sampling one target per house is recorded because the two differ by two orders of magnitude -- MEASURED 827,730 instances across 12,000 houses, ~662,000 in the 9,600 train houses, against 9,600 for one-per-house. instance_resampling=fixed so a rerun trains on the same tuples. The paper specifies none of this.", confidence: moderate, reopen_if: "MetaFind code or its authors describe a different Stage 2 sampling policy."}
  - {id: U-08e, marked: RESOLVED, blocking: false, item: "how a Stage 2 contrastive batch handles the same assetId appearing twice. U-08d made every eligible object instance a sample, which is right, but 665,320 train instances draw on only 1,467 distinct assets, so an assetId recurs constantly. Under Eq. 7a/7b a second occurrence lands in the denominator as a NEGATIVE while being the same asset as the positive.", affects: "every Stage 2 gradient, hence all of Table 2 and Table 3", decided: "batch_positive_uniqueness = true -- the sampler admits each positive_asset_id at most once per contrastive batch. All 665,320 instances are still used within an epoch; only their co-occurrence in one batch is constrained.", decided_by: 'Kyzen (relayed review)', decided_at: '2026-08-16', decision_basis: "MEASURED on the real frequency distribution: at batch 64, 99.3% of batches contain at least one duplicate positive; at 128 and above it is 100%. The magnitude of the direct damage is modest -- the irreducible loss floor is 0.098 nats at batch 64 against log(64)=4.159 for random guessing -- but the floor is not the problem. The gallery embedding of a given assetId is IDENTICAL under a frozen encoder, so sim(q, g_dup) == sim(q, g_pos) exactly, and the false-negative gradient asks the model to separate two identical vectors. That objective is unachievable, so it contributes noise rather than signal, in 99.3% of batches. Rejected: switching to multi-positive InfoNCE, which would change Eq. 7 itself -- the paper states a standard paired in-batch objective and a sampler constraint leaves it intact.", confidence: moderate, reopen_if: "MetaFind code or its authors describe a multi-positive Stage 2 objective or a different batch construction."}
  - {id: U-09, marked: UNKNOWN, blocking: false, item: "gallery scope AND query scope for Table 1 -- paper 3.1 gives only '80% training, 20% testing' and never says the queries are the test split", affects: "every R@k", resolution: "run both gallery protocols and report both; query=test is recorded as an assumption", fallback: "n/a"}
  - {id: U-10, marked: UNKNOWN, blocking: false, item: "which IDesign aspect maps to Table 2's Scene Coherence", affects: "Table 2 column mapping", resolution: "record the assumed mapping", fallback: "n/a"}
  - {id: U-11, marked: UNKNOWN, blocking: false, item: "how an absent modality is represented -- paper 2.6 rules out zero-padding ('Rather than zero-padding, we apply masked embeddings') but does not say whether that is a learned mask token or a mask applied inside the fusion layer", affects: "every partial-modality query", resolution: "record our choice; the only paper-backed assertion is that it differs from zero-padding", fallback: "n/a"}
  - {id: U-12, marked: UNKNOWN, blocking: false, item: "how ProcTHOR metadata becomes the sentence behind t_i", affects: "ESSGNN node features", resolution: "record our template", fallback: "n/a"}
  - {id: U-13, marked: UNKNOWN, blocking: false, item: "which fusion strategy the Full model uses. The paper gives TWO DIFFERENT candidate lists: 2.2 says 'a fusion layer (e.g., mean pooling, an MLP, or a Transformer-based module)' -- three -- while 2.4 says 'mean pooling, MLP, masked MLP, gated fusion, or Transformer-based fusion' -- five. Neither says which is MetaFind's. Table 3 rules out Mean (9.4) and MLPs (9.9) against Full (11.4), and the 'Padding missing modalities with 0' row (10.5) plus 3.4's 'Masked modality fusion outperformed zero-padding' show Full masks. That leaves masked MLP, gated and Transformer.", affects: "every Table 1 and Table 3 number", resolution: "primary = masked_mlp (implemented default in metafind/models/fusion.py); gated and transformer kept selectable and reported as alternatives", fallback: "n/a"}
  - {id: U-14, marked: UNKNOWN, blocking: false, item: "how 11 rendered views become one image embedding. Paper 2.3 says each asset is 'rendered from 11 orthogonal viewpoints' and never states the aggregation. It applies to the QUERY side too: 2.1 defines the query as containing 'images q_img', plural.", affects: "Image Only, T+I, I+PC and T+I+PC -- four of Table 1's seven conditions", resolution: "record the choice among {random single view per step, fixed view, mean of 11 embeddings, max, learned multi-view fusion}", fallback: "n/a"}
  - {id: U-15, marked: UNKNOWN, blocking: false, item: "how a structured annotation is serialised into the string the text encoder sees. Paper 2.3 gives the fields but no format.", affects: "every text embedding, hence Text Only, T+I, T+PC, T+I+PC", resolution: "record the exact template and pin it with a golden-string test", fallback: "n/a"}
  - {id: U-16, marked: UNKNOWN, blocking: false, item: "whether the query and gallery towers share backbone weights. Paper 2.4 says 'a dedicated query encoder' and 2.6 says 'Both query and gallery encoders are trained', but never states sharing.", affects: "parameter count, Stage 1 dynamics, and the PC-Only figure the paper itself calls out as the dual-tower signature", resolution: "record the choice among {shared backbone + separate fusion, fully separate copies, fully shared}", fallback: "n/a"}
  - {id: U-17, marked: UNKNOWN, blocking: false, item: "d_ij or d_ij^2 in ESSGNN. Paper 2.5 defines d_ij = ||x_i - x_j||_2; Appendix C Eq. 10-12 uses ||x_i - x_j||^2, as does the original EGNN.", affects: "the numeric input to f_h and f_x, hence every trained ESSGNN", resolution: "BOTH executable via ESSGNNConfig.distance. Current primary: squared, following Appendix C and the reference EGNN; both are SE(3)-invariant so neither breaks the proof. The resolved essgnn_arch_protocol records which a run used.", fallback: "n/a"}
  - {id: U-18, marked: RESOLVED, blocking: false, item: "what Algorithm 1 line 7 ('Place A*_i into the scene, update scene graph') actually produces. The next iteration calls ESSGNN(G), which needs the new node's t_i, position, orientation, scale, physical edges and semantic edges. None is specified.", affects: "every iteration after the first, hence all of Table 2", resolution: "n15b_resolve_composition_protocol; enforced by G7_composition_protocol", fallback: "none", decided: "The layout source owns the slot; the retriever never invents placement. Stage 2 training reuses the removed object's original ProcTHOR pose; Table 2 uses I-Design's planned slot. The new node's t_i is the RETRIEVED asset's annotation, not the query text. EDGES, which the first version of this decision left as an unfilled field: new_phys_edges = support taken from the layout source's own placement relation (I-Design's scene_graph.json carries prepositions, and on/under map to support; in Stage 2 training it is the removed object's original ProcTHOR parent link), plus adjacency RECOMPUTED by n07's rule -- kNN k=8 over the updated node set, symmetric, support pairs excluded -- so the graph stays internally consistent with the ones ESSGNN was trained on. new_sem_edges = the same SG2 pipeline as n08, same prompt, same model, SAME CACHE KEY, run over the new node's pairs only; a pair whose two descriptions were seen before costs nothing, which is what makes per-iteration regeneration affordable at all.", decided_by: 'Kyzen (relayed GPT analysis, verified against paper text and our own I-Design wrapper)', decided_at: '2026-08-16', decision_basis: "I-Design plans a scene graph with coordinates and THEN retrieves, so MetaFind is a drop-in replacement for its OpenShape retrieval step -- which is also what 'plug-and-play layout encoder' claims. Writing our own placement rule was rejected: it would make Table 2 measure MetaFind retrieval plus our placement algorithm, and the aesthetic and coherence scores could no longer be attributed to retrieval. t_i uses the retrieved asset's annotation because 2.1 defines nodes as EXISTING objects; after line 7 the retrieved asset is what exists. Keeping the query text would describe the scene someone wanted rather than the scene that is there, and the paper's stated behaviour is 'continuously adapting retrieval results to current scene updates'. Both strings are stored; only t_i is the retrieved one.", confidence: moderate, reopen_if: "MetaFind code or its authors describe a different Stage 2 target, gallery scope, placement owner or evaluation scene source."}
  - {id: U-19, marked: UNKNOWN, blocking: false, item: "edge directionality. Paper 2.3 names 'physical-relation edges' and 'semantic-relation edges' without saying whether they are directed, and does not say whether relation(A,B) equals relation(B,A).", affects: "message passing -- a directed support edge and a symmetric one give different h updates", resolution: "record the choice; L1-SCENE-SUPPORT currently asserts symmetric support edges, which is our convention rather than a paper requirement", fallback: "n/a"}
  - {id: U-20, marked: RESOLVED, blocking: false, item: "which encoder produces t_i. Paper 2.5 says only 'a text-derived feature t_i in R^d'. It names a frozen text encoder ('e.g., CLIP or BERT') for the semantic EDGE embeddings, not for t_i, and does not say the two are the same encoder.", affects: "ESSGNN node features and the width d", resolution: "record the choice and the resulting d", fallback: "n/a", decided: "same frozen text encoder as e_ij -- laion/CLIP-ViT-B-32-laion2B-s34B-b79K, 512-d, declared in semantic_edges_run.EDGE_DIM. t_i and e_ij both feed f_h; letting n08 pick one encoder and a later node pick another would put ESSGNN's node and edge features in two unrelated semantic spaces for no stated reason. NOT the tower's ViT-bigG-14: F8 measured that a 1280-wide e_ij suppresses geometric sensitivity ~45-fold against the single scalar ||x_i-x_j||^2, and ESSGNN projects node features to hidden_dim=128 regardless, so t_i's raw width does not buy anything back.", decided_at: '2026-08-16', decided_by: 'Claude (recorded with n08 implementation)', decision_basis: "t_i and e_ij both feed f_h, so one encoder keeps ESSGNN's node and edge features in a single space. NOT the tower's ViT-bigG-14: F8 measured that a 1280-wide e_ij suppresses geometric sensitivity ~45-fold against the single scalar ||x_i-x_j||^2, and ESSGNN projects node features to hidden_dim=128 regardless, so t_i's raw width buys nothing back.", confidence: moderate}
  - {id: U-21, marked: RESOLVED, blocking: false, item: "where Algorithm 1's G_0 and {Q_1..Q_N} come from. The paper says two things that do not obviously agree: 3.1 states 'Scene-level layout-aware retrieval is conducted on ProcTHOR-10K', while 3.3 states the evaluation is 'on the scene generation pipeline of I-Design on a set of 200 randomly sampled scenes'. Reading A: 200 scenes sampled from ProcTHOR-10K and run through I-Design's pipeline. Reading B: 200 scenes generated by I-Design from text prompts, with ProcTHOR used only for Stage 2 training. Whichever holds, the graph had no channel for the evaluation input at all, and n16 was reading ProcTHOR houses -- which under Reading B is simply the wrong dataset, and under Reading A is still the wrong OBJECT, since Algorithm 1 needs a generation request rather than a finished layout.", affects: "all of Table 2 and Table 3's two scene columns", resolution: "n15b_resolve_composition_protocol picks a reading and records it; then n15c_prepare_eval_scenes; enforced by G7_composition_protocol", fallback: "none", decided: "Reading B. ProcTHOR is Stage 2 training data; I-Design generates Table 2's 200 scenes, their query list and their layout. G_0 holds only objects already placed.", decided_by: 'Kyzen (relayed GPT analysis, verified against paper text and our own I-Design wrapper)', decided_at: '2026-08-16', decision_basis: "3.3 names 'the scene generation pipeline of I-Design' explicitly, and VERIFIED against our own wrapper: tools/idesign_generate.py calls IDesign(no_of_objects, user_input, room_dimensions) -- a text prompt and room dimensions, with no interface that accepts a ProcTHOR house. Under Reading B, 3.1 and 3.3 stop conflicting because they describe different stages. 'randomly sampled scenes' leans slightly toward Reading A but never says sampled FROM ProcTHOR, and 200 sampled prompts or configurations parse equally well, so it cannot settle it. Future slots are NOT pre-loaded into G_0; doing so would empty 'update scene graph' of meaning. Reading A survives as a diagnostic -- ProcTHOR leave-one-out scene completion -- and is NOT reported as Table 2.", confidence: moderate, reopen_if: "MetaFind code or its authors describe a different Stage 2 target, gallery scope, placement owner or evaluation scene source."}
  - {id: U-22, marked: UNKNOWN, blocking: false, item: "training hyperparameters. The paper reports none: no optimizer, learning rate, batch size, epoch count, weight decay, scheduler, tau initialisation, lambda initialisation, ESSGNN depth L ('After L layers'), ESSGNN hidden width, or pooling type.", affects: "every trained number; without this list a mismatch cannot be attributed between architecture and recipe", resolution: "maintain the explicit table in 01_GRAPH_SPEC section 15; every value there is ours and is reported as such", fallback: "n/a"}
  - {id: U-27, marked: UNKNOWN, blocking: true, item: "I-Design's own inputs. Its API is IDesign(no_of_objects, user_input, room_dimensions); paper 3.3 says only '200 randomly sampled scenes' and gives no prompt list, no room dimensions and no object counts. MEASURED: I-Design cannot consume a ProcTHOR house at all -- there is no such entry point -- so U-21's Reading A is not executable as literally stated.", affects: "what the 200 evaluation scenes actually are, hence all of Table 2", resolution: "record the prompt list, room dimensions and object counts we use; they are ours, not the paper's", fallback: "n/a", gate: G7_composition_protocol, resolved_by_node: n15a_resolve_eval_scene_protocol, blocking_note: "Reclassified 2026-08-16. It was non-blocking while U-21 was open, because the scene source itself was undecided and a prompt list would have been premature. Once U-21 fixed Reading B, this became the ONLY thing standing between the graph and Table 2: I-Design takes (no_of_objects, user_input, room_dimensions), and no channel supplied any of them. Marking it non-blocking would have meant the 200 requests arrive by hand at the console with no record of what was run -- and under Reading B the prompts ARE the experiment, so an unrecorded prompt set is an unreproducible Table 2.", blocking_scope: "Table 2 / scene-composition branch ONLY. Data preprocessing, Stage 1 training and Stage 2 training are unaffected -- n07b processed all 1,467 ProcTHOR assets with U-27 open. G7_composition_protocol is where it bites, and nowhere earlier. Saying it blocks nothing is as wrong as saying it blocks everything.", do_not_rush: "The 200 prompts should be designed AFTER the training protocol settles -- a reproducible set with a stated room-type and object-count distribution. Picking 200 at random now would build Table 2 on an input nobody can reconstruct."}
  - {id: U-28, marked: UNKNOWN, blocking: false, item: "what e_layout is when Table 1 evaluates 'MetaFind w/ ESSGNN' on Objaverse-LVIS, which has no scenes. Paper 3.2 acknowledges the situation ('feature-attribution mismatch when evaluating on layout-free datasets') without saying whether lambda*e_layout is omitted, zeroed, or something else. It also floats 'two fusion heads, selected at inference by context availability' as a mitigation without saying whether MetaFind implements it.", affects: "the entire MetaFind w/ ESSGNN row of Table 1 -- 7 of its 14 cells", resolution: "record the choice; the 30% scene-dropout path already defines an omit behaviour, which is the most likely reading. Two fusion heads are NOT implemented.", fallback: "n/a"}
  - {id: U-29, marked: UNKNOWN, blocking: false, item: "how PHYSICAL edges enter ESSGNN at all. Paper 2.3 defines two edge types, physical-relation (support, adjacency) and semantic-relation. But 2.5's f_h and f_x take exactly one edge argument, e_ij, and 2.5 plus Appendix C both define e_ij as the LLM relation sentence encoded by a frozen text encoder -- i.e. the SEMANTIC edge. Nothing says whether a physical edge (a) only determines the neighbourhood N(i), (b) carries a feature of its own, (c) is unioned with the semantic edge on the same edge, or (d) is a parallel edge. Nor whether support and adjacency are distinguishable once inside the network.", affects: "the ESSGNN architecture itself, hence every Table 2 and Table 3 scene number", resolution: "record the choice explicitly; it is an architecture decision, not a hyperparameter", fallback: "n/a"}
  - {id: U-30, marked: UNKNOWN, blocking: false, item: "the tensor contract for an edge with no semantic embedding. f_h : R^(2d+1+e) -> R^d has a FIXED input width, so an edge that reaches the network without an e_ij still needs e slots filled. The spec forbids zero-filling (a zero vector is indistinguishable from a real embedding) and records semantic_edge_missing, but recording a flag does not say what the MLP receives. Candidates: a learned missing-edge embedding, an appended validity bit, a separate geometry-only MLP, an edge-type embedding, or excluding the edge from message passing entirely.", affects: "every scene graph where a semantic edge failed or was never requested -- including all physical-only edges, if U-29 resolves that way", resolution: "record the mechanism; it must be distinguishable from a valid embedding", fallback: "n/a"}
  - {id: U-31, marked: UNKNOWN, blocking: false, item: "whether ESSGNN's L layers share one set of parameters. Paper 2.5 writes f_h(...; theta_h) and f_x(...; theta_x) with no layer index on theta, and never says whether each layer has its own weights or all L layers share one. The choice changes the parameter count and changes F11: with independent layers the final layer's coordinate head has no loss path, but with shared weights the same f_x still receives gradient from layers 1..L-1.", affects: "parameter count, and whether F11's observation generalises", resolution: "BOTH executable via ESSGNNConfig.layer_sharing. Current primary: independent. MEASURED consequence: under shared the final layer f_x DOES receive gradient, from its use at layers 1..L-1, so F11 holds only for independent layers.", fallback: "n/a"}
  - {id: U-34, marked: RESOLVED, blocking: false, item: "whether MetaFind's Stage 1 trains the OpenCLIP text and image encoders. EVIDENCE FOR FROZEN: MetaFind builds on ULIP-2, whose paper 3.3 states 'We adopt the largest version of encoders from OpenCLIP (ViT-G/14) ... and freeze it during pre-training' and extracts features 'based on the frozen encoders', with Eq. 3's objective min_{E_P} training the 3D encoder only. (An earlier version of this entry quoted 'the pre-aligned and frozen image encoder and text encoder', which is a paraphrase fusing two separate sentences and appears nowhere in the paper.) EVIDENCE FOR TRAINABLE: MetaFind 2.6 says 'Both query and gallery encoders are trained', 3.4 says 'Fine-tuning the entire encoder outperformed training the fuser only', and 2.4 explicitly contrasts MetaFind with prior work that freezes text and image encoders in a fixed CLIP space. MetaFind does not enumerate which modules train; for this reproduction the ambiguity is resolved to frozen on the inherited ULIP-2 design and the absence of any stated policy change.", affects: "whether text/image embeddings may be cached, whether ViT-bigG-14 enters the optimizer, and therefore whether Stage 1 fits on 24 GB at all -- every Table 1 number", resolution: "RESOLVED 2026-08-16: paper_clip_train_scope = frozen AND actual_clip_train_scope = frozen, both recorded by n05b with basis and confidence. D-1 evaluates inactive. RA-3 is retained as an ALTERNATIVE trainable-scope feasibility audit, not as an open reading.", fallback: "n/a", decided: frozen, decided_by: 'Kyzen (relayed GPT analysis)', decided_at: '2026-08-16', decision_basis: "MetaFind states no per-module freeze scope. Follows ULIP-2 3.3 because MetaFind explicitly builds on ULIP-2 and never states it changes that policy. 2.6's 'both encoders are trained' is tower-level; 3.4's 'entire encoder' separates the full model from the fuser-only ablation, which the trainable point encoder already does; 2.4 vs 2.6 is the Stage 1/Stage 2 boundary. NOT 'the paper says CLIP is frozen' -- it never says that. Reopen on code or author confirmation.", confidence: moderate}
  - {id: U-35, marked: UNKNOWN, blocking: false, item: "the internal structure of f_h and f_x. MetaFind 2.5 says only 'approximated using MLPs' and gives neither depth, activation, nor whether the output carries one. Our code uses ONE shape for both -- Linear -> SiLU -> Linear -- which was never a decision, just what _mlp happened to be. The EGNN paper's Appendix C specifies THREE DIFFERENT shapes: phi_e is Linear -> Swish -> Linear -> Swish (activation on the output), phi_x is Linear -> Swish -> Linear (none), phi_h is Linear -> Swish -> Linear plus a residual add of h_i. So our f_x matches EGNN's phi_x exactly and our f_h matches none of them. SiLU and Swish are the same function, so only the trailing activation and the residual actually differ.", affects: "every ESSGNN number, and Table 1's w/ ESSGNN rows in particular", resolution: "essgnn_arch_protocol.mlp_structure records the choice, enforced by G6 like the other architecture fields. EGNN Appendix C supplies the VARIANT LIST, not the answer: a dependency paper cannot fill in what MetaFind leaves unsaid, and MetaFind here is genuinely silent rather than ambiguous.", fallback: "n/a"}
  - {id: U-33, marked: UNKNOWN, blocking: false, item: "whether ESSGNN keeps EGNN's input/output projections. Paper 2.5 goes t_i -> h^(0) -> L layers -> Pooling({h^(L)}) = e_layout, with no projection on either side. The reference EGNN (vgsatorras/egnn, egnn_clean.py) wraps its layers in embedding_in and embedding_out, and this implementation inherited that. Two extra learnable layers is not the same architecture, and upstream convention is not MetaFind paper truth.", affects: "ESSGNN parameter count and what e_layout is a function of", resolution: "use_io_projections flag; True follows the reference EGNN and is the current primary, False reproduces 2.5 literally and requires node_feat_dim == hidden_dim == out_dim. Report which was run.", fallback: "n/a"}
  - {id: U-32, marked: UNKNOWN, blocking: false, item: "scene-dropout granularity. Paper 2.6 says the layout vector 'is omitted in 30% of BATCHES', which reads as one Bernoulli draw per batch applied to the whole batch. The implementation now follows the literal reading: DualTowerConfig.scene_dropout_granularity defaults to `batch` and sample_scene_dropout takes one draw per batch. `sample` remains selectable as a variant, and L1-SCENE-DROPOUT-30 checks whichever the protocol names. The two give different training distributions for an in-batch contrastive loss: batch-level means every negative in a batch shares the layout condition, sample-level means they do not.", affects: "Stage 2 training distribution", resolution: "Paper literal: batch. Current primary: batch (DualTowerConfig.scene_dropout_granularity). Alternative variant: sample.", fallback: "n/a"}
  - {id: U-25, marked: UNKNOWN, blocking: false, item: "'adaptive freezing strategies'. Paper 2.2 says Stage 2 fine-tunes the query encoder 'with adaptive freezing strategies', but 2.6 states a single fixed freeze ('Only the query-side fuser and the ESSGNN module are updated'). Nothing anywhere says what is adaptive about it, or what varies.", affects: "Stage 2 optimisation", resolution: "implement the fixed freeze that 2.6 specifies, and record that 2.2's 'adaptive' is unimplemented because it is undefined", fallback: "n/a"}
  - {id: U-26, marked: RESOLVED, blocking: false, item: "whether f_h and f_x share a message, AND which h the coordinate head sees. Two differences, not one. (a) Parameterisation: 2.5 gives two independent MLPs over the same inputs (Eq. 2, Eq. 3); Appendix C Eq. 10/13/14 computes ONE message m_ij = phi_e(...) then applies phi_h(m_ij) and phi_x(m_ij) to it, as the original EGNN does. (b) Update ordering: Eq. 3 feeds f_x the ALREADY-UPDATED h_i^(l+1), h_j^(l+1), while Appendix C's m_ij is built from the OLD h^l. Equivariance survives either way, but the numbers differ.", affects: "ESSGNN parameter count and what the coordinate head can see", resolution: "RESOLVED 2026-08-17 -> appendix_shared_msg. Both families are implemented (essgnn.py ESSGCLShared and ESSGCL) and essgnn_arch_protocol.architecture_family selects. The appendix is primary because 2.5 carries three transcription errors in one paragraph (h0=Concat(x,t) against the appendix premise, a width that does not close, f_x typed R^3 where the proof needs a scalar) while the appendix is internally coherent and is what the equivariance proof is written about. This is [INFERENCE]: the paper specifies both and never says which it ran, so sec25_two_mlp stays as a competing hypothesis, not a fallback. Note the neighbourhood is NOT part of this fork -- EGNN model.tex states j in N(i) is available to either.", decided: "appendix_shared_msg", decided_by: "user + external review", decided_at: "2026-08-17", decision_basis: "TeX cross-check; 2.5 has three errors in one paragraph; appendix matches the proof and upstream EGNN. This is an INFERENCE, not a paper fact.", confidence: "moderate", fallback: "n/a"}
  - {id: U-23, marked: UNKNOWN, blocking: false, item: "what a query with all three modalities masked means. Paper 2.6 masks each modality INDEPENDENTLY at 30%, so 2.7% of queries carry no information at all, yet Eq. 5 still matches them against a gallery item.", affects: "Stage 1 training signal", resolution: "the literal reading is implemented (allow_empty=True); a flag forces at least one modality, and the choice is recorded", fallback: "n/a"}
  - {id: U-24, marked: UNKNOWN, blocking: false, item: "the similarity function. Eq. 5 and Eq. 7a/7b write sim(.,.) and never define it.", affects: "every loss and every retrieval ranking", resolution: "cosine, matching CLIP and ULIP convention; recorded as a choice", fallback: "n/a"}
  - id: R-01
    marked: RISK
    status: "PARTIALLY MEASURED 2026-08-15 -- installs and starts; no scene completed"
    item: >
      Whether I-Design can produce the 200 evaluation scenes paper 3.3 needs.
    affects: "all of Table 2 and Table 3's two scene columns"
    measured:
      installs: >
        Yes. Its README and Dockerfile call for MinkowskiEngine, dgl and
        torch 1.12, but tracing the import graph shows those are reachable only
        from retrieve.py -- the OpenShape retrieval step MetaFind replaces. The
        scene-generation half needs autogen, networkx, jsonschema, matplotlib
        and opencv. Note requirements.txt pins ag2==0.2.0, which does not exist
        on PyPI; pyautogen==0.2.0 is the package the code was written against.
      runs: >
        Yes to the first stage. create_initial_design (designer, architect,
        engineer) completes and passes I-Design's own schema validation.
      completes_a_scene: >
        NO. Five attempts with Qwen2.5-7B-Instruct produced zero finished
        scenes. Each attempt failed in a different downstream code path:
        an unbounded corrector loop (236 identical rounds); a wall id placed in
        objects_in_room; a preposition outside the schema's enum; a reference
        to a nonexistent object; and duplicate new_object_id entries, where the
        corrector edits the first while build_graph keeps re-adding the second's
        edges, so the same conflict is regenerated regardless of the answer.
    not_measured: >
      WHAT A NORMAL SUCCESS RATE LOOKS LIKE. We have no baseline. I-Design has
      not been run with its original planner here, and nothing in either paper
      states one. So we CANNOT currently classify the five failures as defects
      rather than an ordinary failure rate that is handled by generating more
      attempts than are kept.
    paper_says: >
      NOTHING beyond "the scene generation pipeline of I-Design on a set of 200
      randomly sampled scenes" (3.3). No planner model, no I-Design
      configuration, no prompts, no room dimensions, no object counts, and no
      statement of how failed scenes were handled or whether 200 is a kept
      subset of a larger number of attempts.
    resolution: >
      Undecided, and deliberately not decided by guessing. The five patches in
      setup/patches/ were written to get a scene to complete; they are
      engineering choices with no basis in either paper and must be reported as
      such. Establishing a baseline -- by contacting the authors, or by running
      I-Design's original planner -- is what would turn this from an open
      question into a measurement.
    fallback: "Tables 2/3 => INSUFFICIENT_EVIDENCE"
