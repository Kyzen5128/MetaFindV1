    - name: composition_protocol
      type: "{status: unresolved|resolved, source: idesign_generated|procthor_leave_one_out, g0_source, query_list_source, placement_rule, new_node_t_i, new_phys_edges, new_sem_edges, decided_by, decided_at}"
      writers: [n15b_resolve_composition_protocol]
      readers: [G7_composition_protocol, n15a_resolve_eval_scene_protocol, n15c_prepare_eval_scenes, n16_compose_scenes, n19_eval_ablations]
      merge: replace
      lifetime: persistent
      note: >
        [U-18 / U-21 RESOLVED 2026-08-16] Main line, fixed:
          source              idesign_generated
          g0_source           already_placed_objects
          query_list_source   idesign_planner
          placement_rule      idesign_slot
          new_node_t_i        retrieved_asset_annotation
        [ENUM CHANGED] `source` was `procthor_via_idesign|idesign_generated`,
        two equally-weighted candidates. Leaving them equal would have made
        "RESOLVED" a label on a document while n15c could still pick either at
        run time. The second value is now `procthor_leave_one_out` and names
        what it is: a DIAGNOSTIC that completes a held-out ProcTHOR scene, never
        reported as Table 2.
        [U-21] 3.3 names "the scene generation pipeline of I-Design", and its
        interface takes a prompt and room dimensions -- verified against our own
        wrapper, tools/idesign_generate.py, which calls
        IDesign(no_of_objects, user_input, room_dimensions). Under this reading
        3.1 and 3.3 describe different stages instead of conflicting. An earlier
        draft had n16 read `scene_graphs`; a ProcTHOR house is a finished
        layout, not a generation request, and no gate noticed because no channel
        for I-Design output existed.
        [U-18] Algorithm 1 line 7 is "Place A*_i into the scene, update scene
        graph" and nothing more, while the next iteration calls ESSGNN(G). The
        resolution is that the LAYOUT SOURCE owns the slot -- I-Design supplies
        position, facing, size_in_meters and its placement prepositions, all of
        which its scene_graph.json already carries -- and the retriever never
        invents placement. `new_node_t_i` is the retrieved asset's annotation,
        not the query text: 2.1 defines nodes as EXISTING objects, and after
        line 7 the retrieved asset is what exists.

    - name: idesign_eval_requests
      type: "map[scene_id -> {prompt, prompt_sha256, room_dimensions, n_objects, seed, source: authored|sampled_from_corpus, provenance}]"
      writers: [n15a_resolve_eval_scene_protocol]
      readers: [G7_composition_protocol, n15c_prepare_eval_scenes, n19_eval_ablations]
      merge: write_once
      lifetime: persistent
      note: >
        [U-27 -- BLOCKING for Table 2] What I-Design is actually ASKED for.
        U-21 settled that Table 2's scenes come from I-Design; it did not say
        what I-Design is given. Its interface is
        IDesign(no_of_objects, user_input, room_dimensions), so without this
        channel the 200 scenes have no inputs and Table 2 cannot start -- and
        the gap is the kind that gets filled by hand at the console, leaving no
        record of what was run.
        [PAPER 3.3] says only "200 randomly sampled scenes". No prompt list, no
        room dimensions, no object counts. Every value here is OURS and the
        report must say so.
        [2026-08-16, I-Design arXiv TeX] Two things changed, neither resolving
        this. (a) A citable BASIS now exists: I-Design's own supplementary
        publishes 60 prompts with room dimensions --
        docs/paper/idesign_source/tabs/tab_promptlist_minimal.tex (20 short-form,
        bedroom and living room) and tab_promptlist_others.tex (40 detailed,
        across living room / home office / kitchen / bedroom / bathroom /
        dining room / playroom / fitness room). Extending a published
        distribution to 200 is defensible in a way inventing 200 is not.
        (b) `no_of_objects` is NOT a paper-level input. I-Design's main.tex
        describes its input as "an unstructured, grammar-free natural language
        user input"; the object count is decided by its agents. The signature
        below is the RELEASED CODE's entry point -- a measured implementation
        fact -- and must not be read as the paper's interface.
        `prompt_sha256` and `provenance` exist because the prompts ARE the
        experiment under Reading B: a different prompt set is a different Table
        2, and nothing downstream would reveal the substitution.

    - name: evaluation_scene_inputs
      type: "map[scene_id -> {g0_uri, query_list, room_type, source, source_revision, prompt, prompt_sha256, room_dimensions, n_objects_requested, seed, planner_model, generator_revision, generator_patch_sha256}]"
      writers: [n15c_prepare_eval_scenes]
      readers: [n16_compose_scenes, n19_eval_ablations]
      merge: write_once
      lifetime: persistent
      note: >
        [PAPER 3.3] The 200 evaluation scenes.
        [RENAMED from idesign_scenes] The old name decided U-21 by wording. The
        paper gives two statements that do not settle the source:
          3.1 "Scene-level layout-aware retrieval is conducted on ProcTHOR-10K"
          3.3 "the scene generation pipeline of I-Design on a set of 200
               randomly sampled scenes"
        Both readings stay open, so the channel is named for its ROLE (the input
        Algorithm 1 consumes) rather than for one candidate producer.
        `source` records which reading was taken:
          procthor_via_idesign  -- Reading A: sample ProcTHOR scenes, run them
                                   through I-Design's pipeline.
                                   NOT CURRENTLY A LEGAL RESOLVED VALUE. U-27
                                   measured that I-Design has no entry point
                                   accepting a ProcTHOR house: its API is
                                   IDesign(no_of_objects, user_input,
                                   room_dimensions). Letting n15c READ the
                                   ProcTHOR channels does not tell it how to
                                   turn a finished house into a generation
                                   request; that adapter does not exist. G7
                                   rejects this value until
                                   procthor_to_idesign_adapter is specified and
                                   its output validated.
          idesign_generated     -- Reading B: I-Design generates from a prompt.
                                   The only value G7 currently accepts.
        U-21 resolved to Reading B; Reading A survives only as the
        `procthor_leave_one_out` diagnostic. What is refused is
        RESOLVING to it while the conversion is undefined.
        [R-01, MEASURED] I-Design installs and its first stage runs, but five
        attempts with a 7B planner completed zero scenes. There is no baseline
        for what a normal completion rate is, so that is not yet a verdict.
        If no source can produce the scenes, every Table 2 cell and Table 3's
        two scene columns become INSUFFICIENT_EVIDENCE.

    - name: composed_scenes
      type: "map[(variant, scene_id) -> {graph_uri, placed_count, incomplete}]"
      writers: [n16_compose_scenes, n19_eval_ablations, sg4_instance]
      readers: [n17_judge_scenes, n20_aggregate]
      merge: upsert_by_key
      lifetime: persistent

    - name: composition_incomplete
      type: "set[(variant, scene_id)]"
      writers: [n16_compose_scenes, sg4_instance]
      readers: [n17_judge_scenes, n20_aggregate]
      merge: set_union
      lifetime: persistent
      note: >
        [SELECTION BIAS -- REPORTING CONTRACT] EXHAUSTED scenes are excluded
        from the mean, which biases it upward if harder scenes are likelier to
        exhaust. The paper says only "200 randomly sampled scenes"; it never
        licenses dropping any.
        Table 2 must therefore report, per method:
          n_total (200), n_complete, n_incomplete, completion_rate,
          mean_over_complete
        and the comparison against the paper's figures must state that ours is
        a mean over completed scenes only. A single unqualified number is not
        an acceptable output of this channel.
        The bounds that decide "incomplete" -- 25 objects, 600 s, 30 external
        calls, and the 10% stage-failure threshold -- are OUR budget choices,
        not paper values.

    - name: judge_scores
      type: "map[(method, scene_id, dimension) -> float]"
      writers: [n17_judge_scenes, n19_eval_ablations]
      readers: [n20_aggregate, n21_compare_to_paper]
      merge: upsert_by_key
      lifetime: persistent

    - name: quarantine
      type: "list[{uid, stage, failure_class, exception_type, exception_msg, code_revision, timestamp}]"
      writers: [n03_sample_pointclouds, n04_render_views, n05_annotate, n07_scene_graphs, n07b_procthor_asset_modalities, n08_semantic_edges]
      readers: [G3_object_corpus, n22_publish_report]
      merge: append
      lifetime: persistent
      note: "Without the real exception per item, a shortfall is undiagnosable months later."

    - name: gate_records
      type: "list[gate_record]"
      writers: [G1_sources_valid, G2_pc_sanity, G3_object_corpus, G4_gallery_freeze, G5_report_release, G6_stage2_ready, G7_composition_protocol]
      readers: [G5_report_release, n12_promote_index, n22_publish_report]
      merge: append
      lifetime: persistent
      note: "GD -- a gate may never backfill its own record. Missing record == not passed."

    - name: audit_records
      type: "list[required_audit_record]"
      writers: [RA-1, RA-2, RA-3, RA-4, n14_equivariance_probe]
      readers: [G5_report_release, n22_publish_report]
      merge: append
      lifetime: persistent
      note: "Separate channel from gate_records so an audit can never be misread as a gate verdict."

    - name: cost_ledger
      type: "map[resource -> float]"
      writers: [ALL_NODES]
      readers: [G5_report_release]
      merge: numeric_add
      lifetime: persistent

    - name: aggregated_tables
      type: "map[table -> {rows: list[{label, cells: map[condition -> {value, unit, n, source_metric}]}], produced_from: {variant_ckpts, gallery_index_key, eval_protocol}}]"
      writers: [n20_aggregate]
      readers: [G5_report_release, n21_compare_to_paper, n22_publish_report]
      merge: replace
      lifetime: persistent
      note: >
        [ADDED] n20's purpose is "assemble Tables 1, 2 and 3" and it declared
        `writes: [run_progress]` -- a stage record, not a table. The tables
        existed only inside the process that built them.

    - name: comparison_results
      type: "map[(table, row, condition) -> {ours, paper, delta, verdict: REPRODUCED|NOT_REPRODUCED|INSUFFICIENT_EVIDENCE, reason}]"
      writers: [n21_compare_to_paper]
      readers: [G5_report_release, n22_publish_report]
      merge: replace
      lifetime: persistent
      note: >
        [ADDED] Same defect as aggregated_tables: n21 gives every cell exactly
        one of three verdicts and then wrote none of them anywhere. G5's
        criterion is stated over these verdicts, so it was checking a value it
        could not read.

    - name: report_staging
      type: "{uri, sha256, deviations_stated: list[deviation_id], unknowns_disposed: list[unknown_id], cells_covered: int}"
      writers: [n21_compare_to_paper]
      readers: [G5_report_release, n22_publish_report]
      merge: replace
      lifetime: persistent
      note: >
        [ADDED] G5's criterion required "every deviation is stated in the
        report body" while the body was produced by n22, AFTER G5. The gate was
        validating a document that did not exist yet, and n22 was then free to
        publish something G5 had never seen.
        This copies the pattern that already works for the gallery index:
        n11 stages, G4 verifies, n12 promotes. n21 stages the report, G5
        verifies THIS artifact by sha256, and n22 publishes that exact sha256 --
        the only irreversible node in the graph now publishes bytes a gate
        approved rather than bytes it regenerates.

    - name: run_progress
      type: "map[stage -> {status, started_at, ended_at, attempt, rc, stdout_broken}]"
      writers: [ALL_NODES]
      readers: [ALL_NODES]
      merge: upsert_by_key
      lifetime: persistent
      note: "B1 -- THIS is canonical progress, not stdout. Atomic tmp -> fsync -> rename."

    - name: degraded_flags
      type: "set[str]"
      writers: [ALL_NODES]
      readers: [G5_report_release, n20_aggregate, n21_compare_to_paper, n22_publish_report]
      merge: set_union
      lifetime: persistent
      note: "e.g. batch_size_reduced_oom, semantic_edge_missing, idesign_unavailable."

    # ---- SG4 internal
    - {name: placed_assets, type: "list[{uid, position, step}]", writers: [sg4_place], readers: [sg4_encode_layout, sg4_advance], merge: append, lifetime: run, visibility: private}
    - {name: placed_count, type: int, writers: [sg4_place], readers: [sg4_advance], merge: max, merge_note: "max, not numeric_add -- a retried iteration must not double-count", lifetime: run, visibility: private}
    - {name: layout_embedding, type: "tensor[D]", writers: [sg4_encode_layout], readers: [sg4_fuse], merge: replace, lifetime: iteration, reset_on: loop_entry, visibility: private}
    - {name: query_modality_embeds, type: "dict", writers: [sg4_encode_query], readers: [sg4_fuse], merge: replace, lifetime: iteration, reset_on: loop_entry, visibility: private}
    - {name: retrieval_trace, type: "list[{step, top5_ids, top5_scores, chosen, layout_contribution}]", writers: [n16_compose_scenes, sg4_fuse], readers: [n17_judge_scenes], merge: append, lifetime: run, note: "O4 -- without layout_contribution you cannot explain why a scene is incoherent"}

    # ---- SG1 internal
    - {name: item_attempt, type: int, writers: [sg1_validate], readers: [sg1_generate], merge: replace, lifetime: iteration, reset_on: item_entry, visibility: private}
    - {name: annotation_error_feedback, type: str, writers: [sg1_validate], readers: [sg1_generate], merge: replace, lifetime: iteration, reset_on: item_entry, visibility: private, note: "asset i-1's schema error must never reach asset i's prompt"}

  excluded_from_state:
    - {item: "rendered prompt strings", reason: "recomputable from the version tag plus canonical data"}
    - {item: "render pixels and mesh bytes", reason: "large blobs; only {uri, sha256, bytes} is stored"}
    - {item: "the evolving scene graph inside SG4", reason: "derivable from the initial graph plus placed_assets"}
    - {item: "model clients, CUDA streams", reason: "not serializable; these travel via runtime context"}

nodes_ref: "node_registry.yaml"

# ---------------------------------------------------------------- edges
edges:
  - {id: e01, from: n01_env_bootstrap, to: n02_download, kind: data, guard: "", join_group: default, carries: []}
  - {id: e02, from: n02_download, to: G1_sources_valid, kind: data, guard: "", join_group: default, carries: [asset_manifest, asset_glb, procthor_dataset, pretrained_weights]}

  - {id: e03, from: G1_sources_valid, to: n03_sample_pointclouds, kind: data, guard: "verdict == PASS", join_group: default, carries: [asset_glb]}
  - {id: e04, from: G1_sources_valid, to: n04_render_views, kind: data, guard: "verdict == PASS", join_group: default, carries: [asset_glb]}
  - {id: e05, from: G1_sources_valid, to: n07_scene_graphs, kind: data, guard: "verdict == PASS", join_group: default, carries: [procthor_dataset]}

  - {id: e06, from: n03_sample_pointclouds, to: G2_pc_sanity, kind: data, guard: "", join_group: default, carries: [pointclouds]}
  - {id: e07, from: n04_render_views, to: n05_annotate, kind: data, guard: "", join_group: default, carries: [renders]}
  - {id: e08b, from: n07_scene_graphs, to: n07b_procthor_asset_modalities, kind: data, guard: "", join_group: default, carries: [scene_graphs, procthor_object_text], rationale: "n07b needs the asset set the houses actually use, which is n07's output, not the raw JSONL."}
  - {id: e08c, from: n07b_procthor_asset_modalities, to: n11b_stage2_gallery_index, kind: data, guard: "", join_group: default, carries: [procthor_asset_modalities]}
  - {id: e08d, from: n10_train_stage1, to: n11b_stage2_gallery_index, kind: data, guard: "", join_group: default, carries: [stage1_ckpt], rationale: "2.6 freezes the gallery encoder DURING Stage 2, so the index must be built by Stage 1's FINAL weights. Encoding earlier would pin embeddings the deployed model never produces."}
  - {id: e08e, from: n11b_stage2_gallery_index, to: G6_stage2_ready, kind: data, guard: "", join_group: default, carries: [stage2_gallery_index, procthor_asset_modalities, procthor_node_embeddings, stage1_ckpt], rationale: "G6 verifies the decision was IMPLEMENTED, not merely recorded: no index, no Stage 2."}
  - {id: e08, from: n07_scene_graphs, to: n08_semantic_edges, kind: data, guard: "", join_group: default, carries: [scene_graphs, procthor_object_text]}
  - {id: e09a, from: n05_annotate, to: n05b_resolve_stage1_encoding, kind: data, guard: "", join_group: default, carries: [objaverse_annotations, renders]}
  - {id: e09, from: n05b_resolve_stage1_encoding, to: n06_encode_text_image, kind: data, guard: "stage1_encoding_protocol.actual_clip_train_scope == 'frozen'", join_group: default, carries: [objaverse_annotations, renders, stage1_encoding_protocol], rationale: "n06 cannot start before U-14/U-15/U-34 are answered: they decide what it should produce. Under `trainable` n06 does not run at all -- a cache is by construction the output of a network nobody is updating, so producing one would be 2-4 h spent on an artifact that reading would silently turn the run back into the frozen variant."}

  - {id: e10, from: G2_pc_sanity, to: n09_build_splits, kind: data, guard: "verdict == PASS", join_group: pointclouds, carries: [pointclouds]}
  - {id: e11, from: n06_encode_text_image, to: n09_build_splits, kind: data, guard: "stage1_encoding_protocol.actual_clip_train_scope == 'frozen'", join_group: stage1_text_image, carries: [text_image_embeddings]}
  - {id: e11b, from: n05b_resolve_stage1_encoding, to: n09_build_splits, kind: data, guard: "stage1_encoding_protocol.actual_clip_train_scope == 'trainable'", join_group: stage1_text_image, carries: [objaverse_annotations, renders], rationale: "[BRANCH] Under `trainable` there is no embedding cache, and an unconditional n06 -> n09 made that reading unreachable: n09's join required text_image_embeddings, so the route U-34 explicitly allows could never reach n10. What n09 actually needs is that every admitted asset HAS its text/image inputs, which under this reading is the raw annotations and renders."}
  - {id: e12, from: n08_semantic_edges, to: n09c_build_scene_splits, kind: data, guard: "", join_group: default, carries: [sem_edge_cache]}
  - {id: e12b, from: n07_scene_graphs, to: n09c_build_scene_splits, kind: data, guard: "", join_group: default, carries: [scene_graphs, procthor_object_text, procthor_dataset]}
  - {id: e12c, from: n09c_build_scene_splits, to: G6_stage2_ready, kind: data, guard: "", join_group: corpus, carries: [scene_splits]}
  - {id: e13, from: n09_build_splits, to: G3_object_corpus, kind: data, guard: "", join_group: default, carries: [splits, eval_protocols, stage1_protocol, stage1_encoding_protocol, stage1_hyperparameters, asset_manifest]}

  - {id: e13b, from: G3_object_corpus, to: n09b_resolve_stage2_protocol, kind: data, guard: "verdict == PASS", join_group: objaverse, carries: [asset_manifest, objaverse_annotations], rationale: "[CORRECTED] This carried scene_graphs, which G3 neither writes nor reads -- G3 was deliberately decoupled from the ProcTHOR branch, so it cannot testify that n07 has run. The ProcTHOR half now arrives on e13b2 from its actual producer."}
  - {id: e13b2, from: n07_scene_graphs, to: n09b_resolve_stage2_protocol, kind: data, guard: "", join_group: procthor, carries: [scene_graphs, procthor_object_text], rationale: "n09b decides how ProcTHOR assets pair to gallery entries (U-08a) and where the Stage 2 modalities come from (U-08b); both need the scene graphs themselves, from the node that builds them."}
  - {id: e13c, from: n09b_resolve_stage2_protocol, to: G6_stage2_ready, kind: data, guard: "", join_group: default, carries: [stage2_protocol, stage2_positive_map, essgnn_edge_protocol, essgnn_arch_protocol, stage1_protocol], rationale: "G6 must see Stage 1's tower_sharing: fully_shared cannot satisfy 2.6's Stage 2 freezing, and finding that out inside n13 wastes the whole Stage 1 run."}
  - {id: e13d, from: G6_stage2_ready, to: n13_train_stage2, kind: data, guard: "verdict == PASS", join_group: protocol, carries: [stage2_protocol, stage2_positive_map, procthor_asset_modalities, stage2_gallery_index, essgnn_edge_protocol, essgnn_arch_protocol, scene_splits, stage1_protocol]}
  - {id: e13e, from: G6_stage2_ready, to: HALT_BLOCKED, kind: escalation, guard: "verdict == BLOCKED_EVIDENCE", join_group: default, carries: [stage2_protocol], rationale: "U-08a/U-08b unresolved is a pause awaiting a decision, not a failure."}
  - {id: e14, from: G3_object_corpus, to: n10_train_stage1, kind: data, guard: "verdict == PASS", join_group: default, carries: [splits, pointclouds, text_image_embeddings, renders, objaverse_annotations, stage1_protocol, stage1_encoding_protocol, stage1_hyperparameters]}
  - {id: e14b, from: n10_train_stage1, to: n10b_post_stage1_encode, kind: data, guard: "", join_group: default, carries: [stage1_ckpt, stage1_encoding_protocol, stage1_protocol, text_image_embeddings, renders, objaverse_annotations], rationale: "n10b needs the final encoders AND both possible sources: under actual=frozen it passes n06's cache through, under actual=trainable it re-encodes from renders and annotations."}
  - {id: e15, from: n10_train_stage1, to: n11_gallery_index_staging, kind: data, guard: "", join_group: ckpt, carries: [stage1_ckpt]}
  - {id: e15b, from: n10b_post_stage1_encode, to: n11_gallery_index_staging, kind: data, guard: "", join_group: embeddings, carries: [post_stage1_embeddings]}
  - {id: e16, from: n11_gallery_index_staging, to: G4_gallery_freeze, kind: data, guard: "", join_group: default, carries: [gallery_index_staging, asset_manifest]}
  - {id: e17, from: G4_gallery_freeze, to: n12_promote_index, kind: data, guard: "verdict == PASS", join_group: default, carries: [gallery_index_staging]}
  - id: e18
    from: n10_train_stage1
    to: n13_train_stage2
    kind: data
    guard: ""
    join_group: default
    carries: [stage1_ckpt]
    rationale: >
      Stage 2 needs the frozen gallery ENCODER, not the gallery INDEX, so it runs
      parallel to n11/G4/n12.
      [CORRECTED] This edge also declared it carried scene_graphs and
      sem_edge_cache, which n10 does not write. Those reach n13 from the
      ProcTHOR branch via G6, not from Stage 1 training.
  - {id: e19, from: n13_train_stage2, to: n14_equivariance_probe, kind: data, guard: "", join_group: default, carries: [variant_ckpts]}

  - {id: e15c, from: n10b_post_stage1_encode, to: n13_train_stage2, kind: data, guard: "", join_group: embeddings, carries: [post_stage1_embeddings]}
  - {id: e15d, from: n10b_post_stage1_encode, to: n15_eval_retrieval, kind: data, guard: "", join_group: embeddings, carries: [post_stage1_embeddings]}
  - {id: e15e, from: n10b_post_stage1_encode, to: n18_train_ablations, kind: data, guard: "", join_group: embeddings, carries: [post_stage1_embeddings]}
  - {id: e20, from: n12_promote_index, to: n15_eval_retrieval, kind: data, guard: "", join_group: default, carries: [gallery_index, eval_protocols]}
  - {id: e21, from: n13_train_stage2, to: n15_eval_retrieval, kind: data, guard: "", join_group: default, carries: [variant_ckpts]}
  - {id: e22, from: n12_promote_index, to: n16_compose_scenes, kind: data, guard: "", join_group: default, carries: [gallery_index, asset_glb]}
  - {id: e22b, from: n12_promote_index, to: n15b_resolve_composition_protocol, kind: data, guard: "", join_group: default, carries: [gallery_index]}
  - {id: e22b2, from: n09b_resolve_stage2_protocol, to: n15b_resolve_composition_protocol, kind: data, guard: "", join_group: protocol, carries: [stage2_protocol]}
  - {id: e22b3, from: n07_scene_graphs, to: n15b_resolve_composition_protocol, kind: data, guard: "", join_group: procthor, carries: [scene_graphs]}
  - {id: e22c, from: n15b_resolve_composition_protocol, to: G7_composition_protocol, kind: data, guard: "", join_group: default, carries: [composition_protocol]}
  - {id: e22d, from: G7_composition_protocol, to: n15c_prepare_eval_scenes, kind: data, guard: "verdict == PASS", join_group: default, carries: [composition_protocol]}
  - {id: e22a2, from: n15b_resolve_composition_protocol, to: n15a_resolve_eval_scene_protocol, kind: data, guard: "composition_protocol.source == 'idesign_generated'", join_group: default, carries: [composition_protocol], rationale: "What I-Design is ASKED for only has meaning once the source is I-Design."}
  - {id: e22a3, from: n15a_resolve_eval_scene_protocol, to: G7_composition_protocol, kind: data, guard: "", join_group: default, carries: [idesign_eval_requests], rationale: "G7 counts the 200 and checks each one is complete; without this the prompts arrive by hand with no record."}
  - {id: e22a4, from: G7_composition_protocol, to: n15c_prepare_eval_scenes, kind: data, guard: "verdict == PASS", join_group: default, carries: [idesign_eval_requests]}
  - {id: e22d2, from: n09c_build_scene_splits, to: n15c_prepare_eval_scenes, kind: data, guard: "composition_protocol.source == 'procthor_leave_one_out'", join_group: procthor, carries: [scene_splits, scene_graphs], rationale: "DIAGNOSTIC ONLY since U-21 resolved to Reading B. Table 2's scenes come from I-Design, so the main line must not be bound to ProcTHOR's held-out houses. The edge is kept and GUARDED rather than deleted: the leave-one-out diagnostic still needs the test split, and running it on anything else would leak."}
  - {id: e22e, from: n15c_prepare_eval_scenes, to: n16_compose_scenes, kind: data, guard: "", join_group: protocol, carries: [evaluation_scene_inputs, composition_protocol]}
  - {id: e22f, from: G7_composition_protocol, to: HALT_BLOCKED, kind: escalation, guard: "verdict == BLOCKED_EVIDENCE", join_group: default, carries: [composition_protocol], rationale: "U-18/U-21 are resolved, so this escalation now fires on a protocol that was never MATERIALISED rather than on a decision nobody made. Table 2 pauses; Table 1 is unaffected either way."}
  - {id: e23, from: n13_train_stage2, to: n16_compose_scenes, kind: data, guard: "", join_group: default, carries: [variant_ckpts]}
  - {id: e24, from: n16_compose_scenes, to: n17_judge_scenes, kind: data, guard: "", join_group: default, carries: [composed_scenes]}

  - {id: e25, from: n15_eval_retrieval, to: n18_train_ablations, kind: control, guard: "", join_group: default, carries: [], rationale: "Ablations start only once the headline numbers exist, so a broken headline is not multiplied by eight."}
  - {id: e26, from: n18_train_ablations, to: n19_eval_ablations, kind: data, guard: "", join_group: default, carries: [variant_ckpts, variant_status]}
  - {id: e26b, from: n15c_prepare_eval_scenes, to: n19_eval_ablations, kind: data, guard: "", join_group: protocol, carries: [evaluation_scene_inputs, composition_protocol]}

  - {id: e27, from: n15_eval_retrieval, to: n20_aggregate, kind: data, guard: "", join_group: core, carries: [retrieval_metrics]}
  - {id: e28, from: n17_judge_scenes, to: n20_aggregate, kind: data, guard: "", join_group: core, carries: [judge_scores]}
  - {id: e29, from: n14_equivariance_probe, to: n20_aggregate, kind: data, guard: "", join_group: core, carries: [equivariance_report]}
  - {id: e30, from: n19_eval_ablations, to: n20_aggregate, kind: data, guard: "", join_group: extended, carries: [retrieval_metrics, variant_status]}

  - {id: e31, from: n20_aggregate, to: n21_compare_to_paper, kind: data, guard: "", join_group: default, carries: [aggregated_tables], rationale: "[CORRECTED] carried nothing. n20 assembles the tables and n21 judges them, so the tables are the entire payload of this edge -- an empty carry meant the whole report chain moved no data on paper."}
  - {id: e32, from: n21_compare_to_paper, to: G5_report_release, kind: data, guard: "", join_group: default, carries: [aggregated_tables, comparison_results, report_staging], rationale: "[CORRECTED] carried nothing, so G5's criterion -- every cell has exactly one verdict, every deviation appears in the report body -- was stated over values it had no way to see."}
  - {id: e33, from: G5_report_release, to: n22_publish_report, kind: data, guard: "verdict == PASS", join_group: default, carries: [gate_records, audit_records, degraded_flags, report_staging, aggregated_tables, comparison_results], rationale: "n22 publishes the STAGED artifact by sha256, the way n12 promotes the index G4 verified. Without this carry it would have had to render a fresh report that no gate ever saw."}

  # error paths -- an invisible failure path is an undesigned failure path (E9)
  - {id: e34, from: G1_sources_valid, to: HALT_FAILED, kind: error, guard: "verdict == FAIL", join_group: default, carries: [gate_records]}
  - {id: e35, from: G2_pc_sanity, to: HALT_FAILED, kind: error, guard: "verdict == FAIL", join_group: default, carries: [gate_records]}
  - {id: e36, from: G3_object_corpus, to: HALT_FAILED, kind: error, guard: "verdict == FAIL", join_group: default, carries: [gate_records]}
  - {id: e37, from: G4_gallery_freeze, to: HALT_FAILED, kind: error, guard: "verdict == FAIL", join_group: default, carries: [gate_records], rationale: "Do NOT promote the staging index."}
  - {id: e38, from: G5_report_release, to: HALT_FAILED, kind: error, guard: "verdict == FAIL", join_group: default, carries: [gate_records]}
  - {id: e39, from: n15c_prepare_eval_scenes, to: HALT_BLOCKED, kind: escalation, guard: "scene_source_unavailable", join_group: default, carries: [degraded_flags], rationale: "R-01: the scene source is what can be unavailable, and n15c is the node that calls it. This edge hung off n16, one node too late -- n16 cannot even start without evaluation_scene_inputs, so the escalation could never fire from there. Tables 2/3 become BLOCKED_EVIDENCE, not FAIL."}

# --- what `reads` means versus what an edge `carries` -----------------------
# These were being used interchangeably, which left two different availability
# semantics in one graph. They are now distinct and each has its own check:
#
#   edge.carries  the JOIN contract -- what must ARRIVE before the node fires.
#                 Checked by the join policies below.
#   node.reads    what the node may ACCESS. Every one of these must be written
#                 by a dependency ANCESTOR (check 8b3, NODE-READ-ANCESTOR), so
#                 availability follows from the DAG rather than from where the
#                 execution_order table happens to put things.
#
# Gates carry the stricter obligation: every channel a gate reads must ALSO
# arrive on an incoming edge (check 8b2). A gate issues a terminal verdict from
# evidence, so it must decide on what it was handed and must not reach into
# ambient state -- otherwise the record cannot say what the verdict was based
# on. Ordinary nodes have no such requirement; requiring it of them would mean
# restating every long-lived channel on every edge that passes near it.
#
# [WHY THIS IS WRITTEN DOWN] Four ordinary nodes declared reads whose writers
# were not ancestors -- n09b (scene_graphs, from a G3 that is deliberately
# decoupled from the ProcTHOR branch), n13 and n18 (post_stage1_embeddings,
# with n10b absent from depends_on), n15b and n15c (scene_graphs,
# stage2_protocol, scene_splits). Each worked only because the layering put
# the writer earlier. Scheduling that happens to be right is not a contract.

# J1 -- every fan-in declared explicitly; no runtime default is inherited
join_policies:
  - node: n09_build_splits
    groups: [{name: pointclouds, policy: all, k: null}, {name: stage1_text_image, policy: any, k: null}]
    trigger: all_groups_satisfied
    rationale: >
      Point clouds are required unconditionally. The text/image side arrives by
      exactly one of two mutually exclusive guarded routes (e11 under `frozen`,
      e11b under `trainable`), so that group is `any` -- but the trigger is
      `all_groups_satisfied`, because dropping either group would let a split be
      computed from part of the data, which is wrong rather than partial.
      [CORRECTED] This was one `all` group over both edges, which made the
      `trainable` reading of U-34 structurally unreachable.
  - node: n09c_build_scene_splits
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "Scene graphs and semantic edges must both be complete for the same reason."
  - node: G3_object_corpus
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "A gate needs complete evidence."
  - node: sg1_reduce
    groups: [{name: default, policy: all_settled, k: null}]
    trigger: any_group_satisfied
    rationale: "Must know WHICH assets failed. The gallery denominator changes with the admitted set, and R@k changes meaning with it."
  - node: sg2_reduce
    groups: [{name: default, policy: all_settled, k: null}]
    trigger: any_group_satisfied
    rationale: "Same as sg1_reduce."
  - node: n15_eval_retrieval
    groups:
      - {name: default, policy: all, k: null}
      - {name: embeddings, policy: all, k: null}
    trigger: all_groups_satisfied
    rationale: "Needs the promoted index, both headline variants, AND the post-Stage-1 text/image embeddings -- Table 1's query side is built from them, and under actual=trainable they are the only place the trained CLIP's output exists."
  - node: n13_train_stage2
    groups:
      - {name: default, policy: all, k: null}
      - {name: protocol, policy: all, k: null}
      - {name: embeddings, policy: all, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Stage 2 needs both the Stage 1 checkpoint and a RESOLVED Stage 2 protocol.
      Separating the groups makes the protocol a hard precondition rather than
      something the trainer discovers missing at runtime.
  - node: G6_stage2_ready
    groups:
      - {name: default, policy: all, k: null}
      - {name: corpus, policy: all, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Two independent preconditions for one spend: the protocol decision
      (n09b) and the scene corpus (n09c). Keeping them in separate groups is
      what lets the gate report BLOCKED_EVIDENCE for the first and FAIL for the
      second instead of collapsing both into one verdict.
  - node: n16_compose_scenes
    groups:
      - {name: default, policy: all, k: null}
      - {name: protocol, policy: all, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Same discipline as n13: the composition protocol and the 200 evaluation
      scenes are a hard precondition, not something SG4 discovers missing on
      iteration one.
  - node: n19_eval_ablations
    groups:
      - {name: default, policy: all, k: null}
      - {name: protocol, policy: all_settled, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Table 3's R@1 column needs only the checkpoints; its two scene columns
      need the composition protocol. all_settled on the protocol group lets the
      R@1 column be produced when I-Design is unavailable (R-01), with the scene
      columns marked INSUFFICIENT_EVIDENCE.

  - node: n20_aggregate
    groups:
      - {name: core, policy: all, k: null}
      - {name: extended, policy: all_settled, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Table 1 and the Table-2 model-judged column are mandatory; Table 3 may
      legitimately be partial, and a missing member there only narrows the claim.
      Using `all` everywhere would let one failed ablation block the report;
      using `all_settled` everywhere would let a missing Table 1 cell pass.
      [CONSEQUENCE, STATED EXPLICITLY] `core` includes n17, so a BLOCKED G7 or
      an unavailable scene source stops the REPORT, not just Table 2. Table 1
      is still computed -- n15 does not pass through G7 -- but it cannot be
      published while Table 2 is outstanding. Documentation that said
      "everything else proceeds as normal" was misleading about this.
      To publish Table 1 alone, n17 must emit an explicit
      INSUFFICIENT_EVIDENCE terminal record rather than nothing, and this group
      must accept it; that is a policy change, not a bug fix, and is not made
      here.
  - node: sg4_fuse
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "Eq. 6 needs both the layout term and the fused query."
  - node: sg4_encode_layout
    groups:
      - {name: init, policy: any, k: null}
      - {name: loop_back, policy: any, k: null}
    trigger: any_group_satisfied
    rationale: "E4 -- the Algorithm 1 feedback edge must not share a group with the initial edge, or the cycle deadlocks."
  - node: sg1_generate
    groups: [{name: init, policy: any, k: null}, {name: repair, policy: any, k: null}]
    trigger: any_group_satisfied
    rationale: "E4 -- the C1 repair edge gets its own group."
  - node: sg2_generate
    groups: [{name: init, policy: any, k: null}, {name: repair, policy: any, k: null}]
    trigger: any_group_satisfied
    rationale: "E4 -- the C2 repair edge gets its own group."

dependencies:
  dag:
    - {node: n01_env_bootstrap, depends_on: []}
    - {node: n02_download, depends_on: [n01_env_bootstrap]}
    - {node: G1_sources_valid, depends_on: [n02_download]}
    - {node: n03_sample_pointclouds, depends_on: [G1_sources_valid]}
    - {node: n04_render_views, depends_on: [G1_sources_valid]}
    - {node: n07_scene_graphs, depends_on: [G1_sources_valid]}
    - {node: G2_pc_sanity, depends_on: [n03_sample_pointclouds]}
    - {node: n05_annotate, depends_on: [n04_render_views]}
    - {node: n08_semantic_edges, depends_on: [n07_scene_graphs]}
    - {node: n07b_procthor_asset_modalities, depends_on: [n07_scene_graphs]}
    - {node: n05b_resolve_stage1_encoding, depends_on: [n05_annotate]}
    - {node: n06_encode_text_image, depends_on: [n05b_resolve_stage1_encoding]}
    # [CORRECTED] n08_semantic_edges was still listed here after the branch split.
    # The edges and n09's reads had been decoupled, but this line had not, so the
    # machine-readable dependency still said Stage 1 waits for Qwen semantic-edge
    # generation over ProcTHOR. Two of the three places were fixed; this was the third.
    - node: n09_build_splits
      depends_on: [G2_pc_sanity, n05b_resolve_stage1_encoding]
      # [SCHEMA EXTENDED] n06 cannot be a plain dependency. Under
      # actual_clip_train_scope == trainable it does not run at all, so a
      # scheduler reading `depends_on` literally would wait forever for a node
      # that was never going to start. The previous version listed it anyway
      # and explained in prose that it was "for ORDERING only" -- a comment
      # cannot be executed, and the set-equality DAG check passed because the
      # guarded edge exists.
      conditional_depends_on:
        - {node: n06_encode_text_image, when: "stage1_encoding_protocol.actual_clip_train_scope == 'frozen'"}
    - {node: G3_object_corpus, depends_on: [n09_build_splits]}
    - {node: n10_train_stage1, depends_on: [G3_object_corpus]}
    - {node: n10b_post_stage1_encode, depends_on: [n10_train_stage1]}
    - {node: n11_gallery_index_staging, depends_on: [n10_train_stage1, n10b_post_stage1_encode]}
    - {node: G4_gallery_freeze, depends_on: [n11_gallery_index_staging]}
    - {node: n12_promote_index, depends_on: [G4_gallery_freeze]}
    - {node: n09b_resolve_stage2_protocol, depends_on: [G3_object_corpus, n07_scene_graphs]}
    - {node: n09c_build_scene_splits, depends_on: [n07_scene_graphs, n08_semantic_edges]}
    - {node: n11b_stage2_gallery_index, depends_on: [n07b_procthor_asset_modalities, n10_train_stage1]}
    - {node: G6_stage2_ready, depends_on: [n09b_resolve_stage2_protocol, n09c_build_scene_splits, n11b_stage2_gallery_index]}
    - {node: n13_train_stage2, depends_on: [n10_train_stage1, n10b_post_stage1_encode, G6_stage2_ready]}
    - {node: n14_equivariance_probe, depends_on: [n13_train_stage2]}
    - {node: n15_eval_retrieval, depends_on: [n12_promote_index, n13_train_stage2, n10b_post_stage1_encode]}
    - {node: n15b_resolve_composition_protocol, depends_on: [n12_promote_index, n09b_resolve_stage2_protocol, n07_scene_graphs]}
    - {node: G7_composition_protocol, depends_on: [n15b_resolve_composition_protocol, n15a_resolve_eval_scene_protocol]}
    - {node: n15a_resolve_eval_scene_protocol, depends_on: [n15b_resolve_composition_protocol]}
    - {node: n15c_prepare_eval_scenes, depends_on: [G7_composition_protocol, n09c_build_scene_splits]}
    - {node: n16_compose_scenes, depends_on: [n12_promote_index, n13_train_stage2, n15c_prepare_eval_scenes]}
    - {node: n17_judge_scenes, depends_on: [n16_compose_scenes]}
    - {node: n18_train_ablations, depends_on: [n15_eval_retrieval, n10b_post_stage1_encode]}
    - {node: n19_eval_ablations, depends_on: [n18_train_ablations, n15c_prepare_eval_scenes]}
    - {node: n20_aggregate, depends_on: [n15_eval_retrieval, n17_judge_scenes, n14_equivariance_probe, n19_eval_ablations]}
    - {node: n21_compare_to_paper, depends_on: [n20_aggregate]}
    - {node: G5_report_release, depends_on: [n21_compare_to_paper]}
    - {node: n22_publish_report, depends_on: [G5_report_release]}

  feedback_edges: [fb_annot, fb_semedge, fb_compose]
  feedback_note: "Main line contains ZERO feedback edges. All cycles live inside subgraphs."

  v1_dependency_bug: >
    An earlier draft scheduled the baseline node parallel with data preparation, reasoning that
    baselines do not depend on MetaFind training. They do depend on the admitted
    asset set, the preprocessing, the split and the gallery protocol -- without
    those, baseline and MetaFind are not on the same evaluation protocol. It
    could at most have run parallel to n10, never to n03. The node is removed
    entirely under D-3.

# ---------------------------------------------------------------- routing
routing:
  - {decision_point: G1_sources_valid, authority: A1, owner: edge, inputs: [manifest_count, glb_coverage, ckpt_behaviour], destinations: [n03_sample_pointclouds, n04_render_views, n07_scene_graphs, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: manifest_count, from: asset_manifest}, {name: glb_coverage, from: asset_glb}, {name: ckpt_behaviour, from: pretrained_weights}]}
  - {decision_point: G2_pc_sanity, authority: A1, owner: edge, inputs: [cloud_shape, finiteness, centroid_offset, max_radius, per_axis_variance, self_retrieval_rank], destinations: [n09_build_splits, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: cloud_shape, from: pointclouds}, {name: finiteness, from: pointclouds}, {name: self_retrieval_rank, from: pointclouds}]}
  - {decision_point: G3_object_corpus, authority: A1, owner: edge, inputs: [leakage_count, admitted_size, quarantine_rate, eval_protocols, "stage1_encoding_protocol.status", "stage1_protocol.status"], destinations: [n10_train_stage1, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: leakage_count, from: splits}, {name: admitted_size, from: splits}, {name: quarantine_rate, from: quarantine}]}
  - {decision_point: G4_gallery_freeze, authority: A1, owner: edge, inputs: [index_dim, index_count, nan_count, zero_vector_count, target_is_argmax, target_in_tie_set], destinations: [n12_promote_index, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: index_dim, from: gallery_index_staging}, {name: index_count, from: gallery_index_staging}, {name: nan_count, from: gallery_index_staging}, {name: zero_vector_count, from: gallery_index_staging}, {name: target_is_argmax, from: gallery_index_staging}, {name: target_in_tie_set, from: gallery_index_staging}]}
  - {decision_point: G6_stage2_ready, authority: A1, owner: edge, inputs: ["stage2_protocol.status", stage2_positive_map, "essgnn_edge_protocol.status", "essgnn_arch_protocol.status", scene_splits], destinations: [n13_train_stage2, HALT_BLOCKED], default_destination: HALT_BLOCKED, derived_inputs: []}
  - {decision_point: G7_composition_protocol, authority: A1, owner: edge, inputs: [composition_protocol.status, composition_protocol.source, g0_source, query_list_source, placement_rule, new_node_t_i, new_phys_edges, new_sem_edges], destinations: [n15c_prepare_eval_scenes, HALT_BLOCKED], default_destination: HALT_BLOCKED, derived_inputs: []}
  - {decision_point: G5_report_release, authority: A1, owner: edge, inputs: [verdict_completeness, report_sha256_matches, comparison_results, report_staging, gate_records, audit_records, degraded_flags], destinations: [n22_publish_report, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: verdict_completeness, from: comparison_results}, {name: report_sha256_matches, from: report_staging}]}
  - {decision_point: sg1_admit_or_repair, authority: A1, owner: edge, inputs: [schema_valid, item_attempt], destinations: [sg1_admit, sg1_generate, sg1_quarantine], default_destination: sg1_quarantine}
  - {decision_point: sg2_cache_lookup, authority: A1, owner: edge, inputs: ["sem_edge_cache.contains(hash)"], destinations: [use_cache, call_llm], default_destination: call_llm}
  - {decision_point: sg3_train_scope, authority: A1, owner: edge, inputs: ["variant.train_scope"], destinations: [fuser_only, point_encoder_and_fuser, full], default_destination: point_encoder_and_fuser}
  - {decision_point: sg4_advance, authority: A1, owner: edge, inputs: [placed_count, n_queries, wallclock], destinations: [sg4_encode_layout, DONE, EXHAUSTED], default_destination: EXHAUSTED}
  - {decision_point: sg4_mode, authority: A1, owner: edge, inputs: ["variant.composition_mode"], destinations: [iterative, parallel, region], default_destination: iterative}

static_fanouts:
  - {name: render_views, cardinality: 11, source: "paper 2.3", bound: 11}
  - {name: modality_conditions, cardinality: 7, source: "paper Table 1 columns", bound: 7}
  - {name: eval_protocols, cardinality: 2, source: "U-09 -- both readings run", bound: 2}
  - {name: headline_variants, cardinality: 2, source: "paper Table 1 last two rows", bound: 2}
  - {name: ablation_variants, cardinality: 8, source: "paper Table 3 has 10 rows: 1 is Full itself, 1 (w/o iterative retrieval) is inference-only, leaving 8 that require training", bound: 9}
  - {name: assets, cardinality: "len(asset_manifest)", source: "manifest, currently 46052", bound: 60000, over_bound_action: truncate_and_record}
  - {name: eval_scenes, cardinality: 200, source: "paper 3.3", bound: 200}
static_fanouts_note: >
  Every fan-out is statically enumerated, which is why max_authority is A1.
  Asset cardinality is len(manifest), never a literal 48000 (U-01, L1-MANIFEST).

# ---------------------------------------------------------------- loops
loops:
  - id: C1
    name: annotation_repair
    location: SG1
    progress_measure: "item_attempt"
    semantic_exit: "annotation passes structured schema validation"
    hard_bound: {iterations: 2, wallclock_s: 120}
    exhaustion_outcome: "quarantine the asset"
    exhaustion_marker: "terminated_by: repair_budget"
    iteration_channels_reset: [item_attempt, annotation_error_feedback]
    note: "An exhausted repair is NOT a successful annotation; the asset leaves the admitted set."

  - id: C2
    name: semantic_edge_repair
    location: SG2
    progress_measure: "item_attempt"
    semantic_exit: "relation sentence non-empty and encodable"
    hard_bound: {iterations: 2, wallclock_s: 60}
    exhaustion_outcome: "mark the edge semantic_edge_missing, degrade to geometry-only"
    exhaustion_marker: "degraded_flags += semantic_edge_missing"
    iteration_channels_reset: [item_attempt]
    note: "Must NOT zero-fill; a zero vector is indistinguishable downstream from a valid semantic edge."

  - id: C3
    name: iterative_composition
    location: SG4
    progress_measure: "placed_count (merge=max, so retries never double-count)"
    semantic_exit: "placed_count == n_queries"
    hard_bound: {iterations: 25, wallclock_s: 600, external_calls: 30}
    hard_bound_provenance: >
      OUR budget choices. The paper states no per-scene object limit, time
      limit or call limit, and F12 measures ProcTHOR houses at 69 objects on
      average (245 maximum), well above 25 -- so this bound is not derived from
      the data either. It caps a scene we are willing to pay for.
    exhaustion_outcome: "scene marked incomplete and added to composition_incomplete"
    exhaustion_marker: "terminated_by: object_budget"
    iteration_channels_reset: [layout_embedding, query_modality_embeds]
    note: >
      Incomplete scenes are excluded from the Table 2 mean, which introduces
      selection bias in our favour if difficulty correlates with exhaustion.
      The completion rate and the counts are therefore reported alongside every
      mean; see composed_scenes. Above 10% incomplete the stage fails -- also
      our threshold, not the paper's.

termination:
  states:
    SUCCESS: "SC-1..SC-8 met, G5 PASS, report published"
    FAILED: "a gate FAILed and diagnosis confirms it is unrecoverable"
    EXHAUSTED: "budget exhausted with core tables incomplete; carries terminated_by=budget"
    BLOCKED: "awaiting an external input (e.g. I-Design access). RESUMABLE, not a failure."
  terminal_nodes: [n22_publish_report, HALT_FAILED, HALT_BLOCKED]

# ---------------------------------------------------------------- execution
execution_order:
  layers:
    - {layer: 1, parallel_nodes: [n01_env_bootstrap], gates: [], est: "2-4 h"}
    - {layer: 2, parallel_nodes: [n02_download], gates: [], est: "1-2 days (46K GLBs dominate) -- CRITICAL PATH"}
