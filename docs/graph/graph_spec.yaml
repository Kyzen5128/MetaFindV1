# MetaFind reproduction -- Graph Specification
#
# 2026-08-15. Every claim re-checked against docs/metafind_paper.md rather
# than from memory. An earlier draft carried six errors that would have changed the
# experimental result; see 01_GRAPH_SPEC.md section 16.
#
# Three kinds of content are kept apart throughout and must not be conflated:
#   [PAPER]    stated in the paper, with the quote
#   [UNKNOWN]  the paper does not say; we chose one and recorded it
#   [DEVIATION] differs from the paper; must be declared in the report

spec_version: "1.0"
graph_id: "metafind-reproduction"
title: "MetaFind paper reproduction (single RTX 4090, Qwen in place of GPT-4o)"
authored_at: "2026-08-15"

classification:
  shapes: [hierarchical, dag, stateful, parallel, conditional, cyclic]
  shapes_note: >
    Main line is a strict DAG with zero feedback edges. All cycles are confined
    to subgraphs: C1 annotation repair, C2 semantic-edge repair, C3 Algorithm 1.

  max_authority: "A1"
  max_authority_reason: >
    No decision point lets a model choose the next node. Qwen appears three
    times (asset annotation, semantic edges, scene judging) but each time only
    produces a payload written into state; routing is always a deterministic
    predicate over state.

  execution_mode: "probabilistic"
  execution_mode_reason: >
    Authority <= A1 but node outputs are not reproducible, so the second
    condition for `deterministic` fails.

  topology_class: "workflow"
  topology_class_reason: >
    Every fan-out has a statically enumerated destination set: 11 views,
    7 modality conditions, 2 gallery protocols, 8 ablation variants.

  nondeterminism_sources:
    - {id: NS-1, source: "Qwen asset annotation", frozen_by: "written once into a versioned artifact; never re-called downstream"}
    - {id: NS-2, source: "Qwen semantic relation sentences", frozen_by: "cached by a hash over both object descriptions plus prompt/model/encoder versions"}
    - {id: NS-3, source: "Qwen scene judging", frozen_by: "greedy decoding, pinned prompt version, recorded model revision"}
    - {id: NS-4, source: "GPU atomics in scatter_add_", frozen_by: "NOT removable; equivariance tests use a numeric tolerance"}
    - {id: NS-5, source: "training stochasticity (init, shuffling, dropout)", frozen_by: "fixed seeds; exact reproducibility not claimed"}
    - {id: NS-6, source: "approximate nearest neighbour search", frozen_by: "ELIMINATED -- 46,052 x 1280 x 4B = 236 MB, exact inner product is affordable"}

goal:
  statement: >
    Reproduce MetaFind on a single RTX 4090 and produce results comparable
    cell-by-cell against paper Tables 1, 2 and 3, giving every cell exactly one
    of REPRODUCED / NOT_REPRODUCED / INSUFFICIENT_EVIDENCE.

  success_criteria:
    - id: SC-1
      criterion: >
        All 14 MetaFind cells of Table 1 produced under BOTH gallery protocols.
        Deviation from the paper's R@1 is REPORTED, not thresholded as a
        pass/fail on the model.
      measured_by: n21_compare_to_paper
      note: >
        An earlier draft required +/-3.0 pp. That is not a fair criterion here.
        D-2 replaces GPT-4o with Qwen for the asset annotations, which are the
        text tower's training data, so Table 1 is affected too -- not just
        Table 2's judge. A cell outside 3 pp may reflect the annotation
        distribution rather than a reproduction failure, and the two cannot be
        separated without also running the GPT-4o annotation. The relative
        ordering and the PC-Only inversion (SC-2) remain meaningful.
    - id: SC-2
      criterion: "PC-Only inversion reproduced: MetaFind lower than the baselines' published figures"
      measured_by: n21_compare_to_paper
      note: "A naive success criterion would call this cell a failure. Reproducing the paper includes reproducing its regressions."
    - id: SC-3
      criterion: "Table 2: w/ESSGNN > w/o ESSGNN on all four dimensions, DIRECTION ONLY"
      measured_by: n21_compare_to_paper
      note: "Absolute values are not comparable to the paper because the judge is Qwen, not GPT-4o (D-2)."
    - id: SC-4
      criterion: "Per-layer coordinate EQUIVARIANCE: ||x^(l+1)(Rx+T) - (R x^(l+1)(x) + T)||inf < 1e-4"
      measured_by: n14_equivariance_probe
    - id: SC-5
      criterion: "Per-layer feature INVARIANCE: h^(l+1)(Rx+T) == h^(l+1)(x)"
      measured_by: n14_equivariance_probe
    - id: SC-6
      criterion: "Layout output INVARIANCE: e_layout(Rx+T) == e_layout(x)"
      measured_by: n14_equivariance_probe
      note: >
        An earlier draft wrote a single criterion ||ESSGNN(Rx+T) - (R ESSGNN(x) + T)|| and called
        it the coordinate channel. e_layout = Pooling({h_i^(L)}) is pooled from h,
        which is INVARIANT; applying R and T to it has no geometric meaning.
    - id: SC-7
      criterion: "Four Table-3 takeaways reproduced by direction"
      measured_by: n21_compare_to_paper
    - id: SC-8
      criterion: "Resume equivalence: killing any stage and restarting yields identical artifacts"
      measured_by: L2-RESUME

boundary:
  in_scope:
    - "ULIP-2 backbone integration"
    - "dual-tower query/gallery encoders with modality-aware fusion"
    - "ESSGNN layout encoder"
    - "two-stage training per paper section 2.6"
    - "Objaverse-LVIS and ProcTHOR-10K pipelines"
    - "Tables 1, 2, 3"
    - "SE(3) verification at three levels"
  out_of_scope:
    - "pretraining ULIP-2 itself"
    - "re-running the six baselines (D-3)"
    - "the human preference study (D-4)"
    - "reproducing I-Design itself"

  deviations:
    - id: D-1
      what: "ViT-bigG-14 stays frozen; only the 3D encoder and fusion train"
      why: "2.5B parameters do not train on a 24 GB card"
      impact: >
        The paper's "fine-tuning the entire encoder" is realised as
        3D encoder + fusion. Must be stated in the report. Audited by RA-3.
    - id: D-2
      what: "Qwen2.5-VL replaces GPT-4o for annotation and scene judging"
      why: "project decision"
      impact: >
        Affects BOTH tables, not just Table 2. Qwen replaces the judge (Table 2)
        AND the 46,052 asset annotations, which are the text tower's training
        data, so Table 1's absolute values shift too. SC-1 therefore reports the
        deviation rather than thresholding it; SC-2 and SC-3 keep only
        directional claims.
    - id: D-3
      what: "The six baselines are not re-run"
      why: "scope is MetaFind only"
      impact: "SC-2 compares against published values, under a different protocol"
    - id: D-4
      what: "No human preference study"
      why: "no annotator capacity"
      impact: "Table 2 human column reported as INSUFFICIENT_EVIDENCE"

  external_systems:
    - {name: "HuggingFace SFXX/ulip", kind: model_provider, failure_semantics: "unavailable => FAILED, no substitute", trust: trusted, validated_by: "sha256 plus a behavioural check"}
    - {name: "Objaverse", kind: database, failure_semantics: "partial => admitted set shrinks; >2% missing fails G3", trust: trusted}
    - {name: "ProcTHOR-10K via prior", kind: database, failure_semantics: "unavailable => Tables 2/3 BLOCKED_EVIDENCE", trust: trusted}
    - {name: "Qwen2.5-VL (local)", kind: model_provider, failure_semantics: "schema violation => repair loop; OOM => reduce batch and record", trust: untrusted_output, validated_by: "structured schema validation before entering state"}
    - {name: "I-Design", kind: api, failure_semantics: "UNVERIFIED (R-01); if unusable, Tables 2/3 => BLOCKED_EVIDENCE, not FAIL", trust: untrusted}

# ---------------------------------------------------------------- state
state:
  channels:
    - name: asset_manifest
      type: "map[uid -> source_path]"
      writers: [n02_download]
      readers: [G1_sources_valid, n03_sample_pointclouds, n04_render_views, n09_build_splits, n11_gallery_index_staging]
      merge: write_once
      lifetime: persistent
      note: >
        [UNKNOWN U-01] The paper says "approximately 48,000"; the released
        manifest holds 46,052. The manifest is the truth. Nothing anywhere may
        hardcode 48000 -- enforced by L1-MANIFEST.

    - name: asset_glb
      type: "map[uid -> {path, sha256, bytes}]"
      writers: [n02_download]
      readers: [n03_sample_pointclouds, n04_render_views, n16_compose_scenes]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [REVERSED from an earlier draft] An earlier draft deleted meshes after rendering. Algorithm 1
        places retrieved assets into a scene and needs real geometry, so they are
        kept.

    - name: procthor_dataset
      type: "{path, sha256, train_count, val_count, test_count}"
      writers: [n02_download]
      readers: [G1_sources_valid, n07_scene_graphs, n09_build_splits]
      merge: write_once
      lifetime: persistent
      note: >
        [CORRECTED] ProcTHOR is one of the two datasets the paper names, but an
        earlier draft never gave it a channel: n02 did not declare writing it,
        n07 read nothing, and G1's reads covered only the Objaverse channels.
        G1's criterion text mentioned ProcTHOR while the gate had no way to see
        it, so a run with Objaverse complete and ProcTHOR absent could PASS.

    - name: pointclouds
      type: "map[uid -> {path, sha256, n_points}]"
      writers: [n03_sample_pointclouds]
      readers: [n10_train_stage1, n11_gallery_index_staging, n15_eval_retrieval]
      merge: upsert_by_key
      lifetime: persistent
      note: "Sampled from the mesh, then pc_norm'd exactly as ULIP does. Gated by G2 (U-02)."

    - name: renders
      type: "map[uid -> {view_paths[11], view_sha256[11]}]"
      writers: [n04_render_views]
      readers: [n05_annotate, n06_encode_text_image]
      merge: upsert_by_key
      lifetime: persistent

    - name: objaverse_annotations
      type: "map[objaverse_uid -> {category, description, dimensions, materials, placement_constraints, annotator_model}]"
      writers: [n05_annotate]
      readers: [n06_encode_text_image]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [PAPER 2.3] "object category, size dimensions, materials, and placement
        constraints". Frozen as an artifact once written (NS-1).
        Keyed by OBJAVERSE uid. ProcTHOR objects live in a different namespace
        and must not read this channel -- see procthor_object_text.

    - name: procthor_object_text
      type: "map[procthor_asset_id -> {text, source}]"
      writers: [n07_scene_graphs]
      readers: [n08_semantic_edges, n09_build_splits, n09b_resolve_stage2_protocol, n13_train_stage2]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [CORRECTED] The node feature t_i for a ProcTHOR scene graph, and the
        object descriptions the semantic-edge LLM is prompted with.
        MEASURED: ProcTHOR assetIds ("Countertop_I_8x2", "Fridge_19") and
        Objaverse uids (32 hex chars) have ZERO overlap -- 995 vs 46,052 ids,
        intersection empty. An earlier draft had n07 and n08 read the Objaverse
        annotation channel, which is both a provenance bug (n07 is not its
        writer) and a category error.
        [PAPER 2.3] ProcTHOR "provides precise spatial coordinates and
        comprehensive semantic metadata for each asset", so the text is built
        from ProcTHOR's own metadata.
        [UNKNOWN U-12] exactly how that metadata becomes a sentence is not
        specified.

    - name: text_image_embeddings
      type: "map[uid -> {text: 1280-d uri, image: 1280-d uri}]"
      writers: [n06_encode_text_image]
      readers: [n10_train_stage1, n13_train_stage2, n11_gallery_index_staging]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        Only text and image are cached. The point encoder is TRAINABLE in
        Stage 1 (paper 2.6: "Both query and gallery encoders are trained"), so
        point-cloud embeddings cannot be precomputed. An earlier draft cached all three, which
        is what made it the "train fuser only" ablation by accident.

    - name: scene_graphs
      type: "map[house_id -> {nodes, positions, phys_edges, sem_edge_ids, uri}]"
      writers: [n07_scene_graphs]
      readers: [n09_build_splits, n13_train_stage2, n16_compose_scenes]
      merge: upsert_by_key
      lifetime: persistent

    - name: sem_edge_cache
      type: "map[hash -> {sentence, embedding_uri}]"
      writers: [n08_semantic_edges]
      readers: [n08_semantic_edges, n13_train_stage2]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [CORRECTED] key = sha256(desc_i, desc_j, prompt_version,
        llm_model, text_encoder_version). An earlier draft keyed on (category_a, category_b),
        which collapses "office chair + desk" and "dining chair + dining table"
        into one relation. Paper 2.5 and Appendix C both say the LLM is prompted
        with object DESCRIPTIONS.

    - name: stage2_protocol
      type: "{status: unresolved|resolved, pairing_method, modality_source, decided_by, decided_at}"
      writers: [n09b_resolve_stage2_protocol]
      readers: [G6_stage2_protocol, n13_train_stage2]
      merge: replace
      lifetime: persistent
      note: >
        [U-08a / U-08b] Holds the decision itself, and stays mutable until it is
        made. An earlier draft had n09_build_splits write stage2_pairing as
        write_once while U-08a was still open -- writing an empty mapping would
        have locked the channel before the answer existed. The decision is now
        its own node, and only once status == resolved is the mapping committed.

    - name: stage2_pairing
      type: "map[procthor_asset_id -> {gallery_uid, method, confidence}]"
      writers: [n09b_resolve_stage2_protocol]
      readers: [n13_train_stage2]
      merge: write_once
      lifetime: persistent
      note: >
        [UNKNOWN U-08a -- BLOCKING] Stage 2's positive for Eq. 7a/7b is the
        gallery embedding of the target object. But the target is a ProcTHOR
        object and the gallery is Objaverse-LVIS, and their identifier spaces do
        not intersect at all (measured: 0 of 995 ProcTHOR assetIds appear among
        the 46,052 Objaverse uids). Without a stated mapping the positive is
        undefined and Stage 2 cannot be built.
        The paper never addresses this. Candidate readings, none confirmed:
          (a) map each ProcTHOR asset to a nearest Objaverse asset by category
              or embedding, and use that as the positive
          (b) build a separate gallery from ProcTHOR's own ~1,467 assets
          (c) treat the target's own modalities as the positive, making Stage 2
              a self-retrieval objective
        Whichever is chosen must be recorded here with its method, and reported
        as a choice rather than a paper requirement. Written only after
        stage2_protocol reaches status == resolved.

    - name: splits
      type: "{object: {train, test}, scene: {train_houses, test_houses}}"
      writers: [n09_build_splits]
      readers: [n10_train_stage1, n13_train_stage2, n15_eval_retrieval, n18_train_ablations]
      merge: write_once
      lifetime: persistent
      note: >
        [PAPER 3.1] "80% of the data for training and reserve 20% for testing".
        House sets must be disjoint. An earlier draft additionally forbade an asset appearing
        in both a train and a test house; the paper does not ask for that, and
        ProcTHOR's 12,000 houses draw on ~1,467 assets, so enforcing it would
        change the scene distribution. Removed.

    - name: split_seed
      type: int
      writers: [n09_build_splits]
      readers: [n10_train_stage1, n13_train_stage2, n22_publish_report]
      merge: write_once
      lifetime: persistent

    - name: eval_protocols
      type: "map[name -> {query_split, gallery_split, gallery_size}]"
      writers: [n09_build_splits]
      readers: [n15_eval_retrieval, n19_eval_ablations, n21_compare_to_paper]
      merge: write_once
      lifetime: persistent
      note: >
        [UNKNOWN U-09, CORRECTED] The paper says retrieval runs against a
        "pre-encoded asset database" and separately that 80/20 splits are used,
        without saying which the gallery is. An earlier draft locked a single integer and
        planned to back-solve it from the baselines' 98-99% PC-Only figure --
        impossible, since PC-Only uses a query embedding identical to its own
        gallery entry, so self-retrieval approaches 100% at either size. Both
        protocols now run:
          A_test_gallery: query=test, gallery=test   (~9,210)
          B_full_gallery: query=test, gallery=full   (46,052)

    - name: stage1_ckpt
      type: "{uri, sha256, config_hash, data_hash, seed, code_revision, train_scope}"
      writers: [n10_train_stage1]
      readers: [n11_gallery_index_staging, n13_train_stage2, n18_train_ablations]
      merge: write_once
      lifetime: persistent

    - name: gallery_index_staging
      type: "map[stage1_sha -> {uri, sha256, dim, count}]"
      writers: [n11_gallery_index_staging]
      readers: [G4_gallery_freeze, n12_promote_index]
      merge: upsert_by_key
      lifetime: run

    - name: gallery_index
      type: "map[stage1_sha -> {uri, sha256, dim, count, promoted_at}]"
      writers: [n12_promote_index]
      readers: [n15_eval_retrieval, n16_compose_scenes, n19_eval_ablations]
      merge: upsert_by_key
      merge_note: "write_once semantics per key"
      lifetime: persistent
      note: "The immutable shared artifact every table reads. Hence G4 is G-CONTAM."

    - name: variant_registry
      type: "list[{variant_id, train_scope, fusion, dropout, layout_encoder, composition_mode, table3_row}]"
      writers: [n02_download]
      readers: [n13_train_stage2, n18_train_ablations, n19_eval_ablations]
      merge: write_once
      lifetime: persistent
      note: "Static registry. Declaring it in state is what makes the fan-out A1 rather than A3."

    - name: variant_ckpts
      type: "map[variant_id -> {uri, sha256}]"
      writers: [n13_train_stage2, n18_train_ablations, sg3_train]
      readers: [n15_eval_retrieval, n16_compose_scenes, n19_eval_ablations]
      merge: upsert_by_key
      lifetime: persistent

    - name: variant_status
      type: "map[variant_id -> {status, reason}]"
      writers: [n13_train_stage2, n18_train_ablations, sg3_train]
      readers: [n19_eval_ablations, n20_aggregate]
      merge: upsert_by_key
      lifetime: persistent

    - name: retrieval_metrics
      type: "map[(variant, condition, protocol) -> {R@1, R@5, n_gallery, n_query}]"
      writers: [n15_eval_retrieval, n19_eval_ablations]
      readers: [n20_aggregate]
      merge: upsert_by_key
      lifetime: persistent
      note: "Keyed by PROTOCOL as well, so both gallery scopes are reported side by side."

    - name: equivariance_report
      type: "{coord_linf_err, feat_max_delta, layout_max_delta, n_scenes, n_transforms, variant}"
      writers: [n14_equivariance_probe]
      readers: [n20_aggregate, n21_compare_to_paper]
      merge: upsert_by_key
      lifetime: persistent
      note: "Three separate quantities, one per level (SC-4/5/6)."

    - name: composed_scenes
      type: "map[(variant, scene_id) -> {graph_uri, placed_count, incomplete}]"
      writers: [n16_compose_scenes, n19_eval_ablations, sg4_instance]
      readers: [n17_judge_scenes, n20_aggregate]
      merge: upsert_by_key
      lifetime: persistent

    - name: composition_incomplete
      type: "set[(variant, scene_id)]"
      writers: [n16_compose_scenes, sg4_instance]
      readers: [n20_aggregate]
      merge: set_union
      lifetime: persistent
      note: "EXHAUSTED scenes are excluded from Table 2 means and reported separately."

    - name: judge_scores
      type: "map[(method, scene_id, dimension) -> float]"
      writers: [n17_judge_scenes, n19_eval_ablations]
      readers: [n20_aggregate]
      merge: upsert_by_key
      lifetime: persistent

    - name: quarantine
      type: "list[{uid, stage, failure_class, exception_type, exception_msg, code_revision, timestamp}]"
      writers: [n03_sample_pointclouds, n04_render_views, n05_annotate, n07_scene_graphs, n08_semantic_edges]
      readers: [G3_corpus_valid, n22_publish_report]
      merge: append
      lifetime: persistent
      note: "Without the real exception per item, a shortfall is undiagnosable months later."

    - name: gate_records
      type: "list[gate_record]"
      writers: [G1_sources_valid, G2_pc_distribution, G3_corpus_valid, G4_gallery_freeze, G6_stage2_protocol, G5_report_release]
      readers: [G5_report_release, n22_publish_report]
      merge: append
      lifetime: persistent
      note: "GD -- a gate may never backfill its own record. Missing record == not passed."

    - name: audit_records
      type: "list[required_audit_record]"
      writers: [n14_equivariance_probe, RA-1, RA-2, RA-3]
      readers: [G5_report_release, n22_publish_report]
      merge: append
      lifetime: persistent
      note: "Separate channel from gate_records so an audit can never be misread as a gate verdict."

    - name: cost_ledger
      type: "map[resource -> float]"
      writers: [ALL_NODES]
      readers: [G5_report_release]
      merge: numeric_add
      lifetime: persistent

    - name: run_progress
      type: "map[stage -> {status, started_at, ended_at, attempt, rc, stdout_broken}]"
      writers: [ALL_NODES]
      readers: [ALL_NODES]
      merge: upsert_by_key
      lifetime: persistent
      note: "B1 -- THIS is canonical progress, not stdout. Atomic tmp -> fsync -> rename."

    - name: degraded_flags
      type: "set[str]"
      writers: [ALL_NODES]
      readers: [n20_aggregate, n21_compare_to_paper, n22_publish_report]
      merge: set_union
      lifetime: persistent
      note: "e.g. batch_size_reduced_oom, semantic_edge_missing, idesign_unavailable."

    # ---- SG4 internal
    - {name: placed_assets, type: "list[{uid, position, step}]", writers: [sg4_place], readers: [sg4_encode_layout, sg4_advance], merge: append, lifetime: run, visibility: private}
    - {name: placed_count, type: int, writers: [sg4_place], readers: [sg4_advance], merge: max, merge_note: "max, not numeric_add -- a retried iteration must not double-count", lifetime: run, visibility: private}
    - {name: layout_embedding, type: "tensor[D]", writers: [sg4_encode_layout], readers: [sg4_fuse], merge: replace, lifetime: iteration, reset_on: loop_entry, visibility: private}
    - {name: query_modality_embeds, type: "dict", writers: [sg4_encode_query], readers: [sg4_fuse], merge: replace, lifetime: iteration, reset_on: loop_entry, visibility: private}
    - {name: retrieval_trace, type: "list[{step, top5_ids, top5_scores, chosen, layout_contribution}]", writers: [n16_compose_scenes, sg4_fuse], readers: [n17_judge_scenes], merge: append, lifetime: run, note: "O4 -- without layout_contribution you cannot explain why a scene is incoherent"}

    # ---- SG1 internal
    - {name: item_attempt, type: int, writers: [sg1_validate], readers: [sg1_generate], merge: replace, lifetime: iteration, reset_on: item_entry, visibility: private}
    - {name: annotation_error_feedback, type: str, writers: [sg1_validate], readers: [sg1_generate], merge: replace, lifetime: iteration, reset_on: item_entry, visibility: private, note: "asset i-1's schema error must never reach asset i's prompt"}

  excluded_from_state:
    - {item: "rendered prompt strings", reason: "recomputable from the version tag plus canonical data"}
    - {item: "render pixels and mesh bytes", reason: "large blobs; only {uri, sha256, bytes} is stored"}
    - {item: "the evolving scene graph inside SG4", reason: "derivable from the initial graph plus placed_assets"}
    - {item: "model clients, CUDA streams", reason: "not serializable; these travel via runtime context"}

nodes_ref: "node_registry.yaml"

# ---------------------------------------------------------------- edges
edges:
  - {id: e01, from: n01_env_bootstrap, to: n02_download, kind: data, guard: "", join_group: default, carries: []}
  - {id: e02, from: n02_download, to: G1_sources_valid, kind: data, guard: "", join_group: default, carries: [asset_manifest, asset_glb, procthor_dataset]}

  - {id: e03, from: G1_sources_valid, to: n03_sample_pointclouds, kind: data, guard: "verdict == PASS", join_group: default, carries: [asset_glb]}
  - {id: e04, from: G1_sources_valid, to: n04_render_views, kind: data, guard: "verdict == PASS", join_group: default, carries: [asset_glb]}
  - {id: e05, from: G1_sources_valid, to: n07_scene_graphs, kind: data, guard: "verdict == PASS", join_group: default, carries: [procthor_dataset]}

  - {id: e06, from: n03_sample_pointclouds, to: G2_pc_distribution, kind: data, guard: "", join_group: default, carries: [pointclouds]}
  - {id: e07, from: n04_render_views, to: n05_annotate, kind: data, guard: "", join_group: default, carries: [renders]}
  - {id: e08, from: n07_scene_graphs, to: n08_semantic_edges, kind: data, guard: "", join_group: default, carries: [scene_graphs, procthor_object_text]}
  - {id: e09, from: n05_annotate, to: n06_encode_text_image, kind: data, guard: "", join_group: default, carries: [objaverse_annotations, renders]}

