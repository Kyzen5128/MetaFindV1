# ---------------------------------------------------------------- §15.5 join policies
# J1 — every fan-in below is declared EXPLICITLY. No runtime default is inherited.
join_policies:
  - node: n06_build_splits
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "Both catalogs must be complete; a split computed from half the data is wrong, not partial."

  - node: G2_corpus_validity
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "A gate needs complete evidence."

  - node: sg1_reduce
    groups: [{name: default, policy: all_settled, k: null}]
    trigger: any_group_satisfied
    rationale: >
      MUST know WHICH assets failed, not just how many. If 300 of 48K fail, the
      gallery denominator changes from 48000 to 47700 and R@1 changes meaning.
      `all` would deadlock on one bad mesh; `any` would lose completeness.

  - node: sg2_reduce
    groups: [{name: default, policy: all_settled, k: null}]
    trigger: any_group_satisfied
    rationale: "Same as sg1_reduce."

  - node: n10_train_headline
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "Needs stage1 ckpt + splits + scene graphs together."

  - node: n12_eval_object_retrieval
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "Needs the promoted index AND both headline variants."

  - node: n14_compose_scenes
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: >
      Needs BOTH the promoted gallery index (to retrieve against) and the trained
      variant checkpoints (to encode with). Composing against one without the
      other is not a partial result, it is a wrong result.

  - node: n22_budget_approval
    groups: [{name: default, policy: any, k: null}]
    trigger: any_group_satisfied
    rationale: >
      Two escalation edges arrive here (e39 from G1, e40 from G4) and they are
      mutually exclusive in time. `any` is correct: whichever gate emitted rc=3
      triggers the approval. `all` would deadlock — G4 has not run yet when G1
      escalates.

  - node: n13_run_baselines
    groups: [{name: default, policy: all_settled, k: null}]
    trigger: any_group_satisfied
    rationale: >
      Table 1 legitimately contains '-' cells (SCA3D and Uni3DL do not support
      image queries). An expected missing cell must be representable, and must
      be distinguishable from 'we failed to run it' (see baseline_metrics.NA_DECLARED).

  - node: G4_human_study_commit
    groups:
      - {name: default, policy: all, k: null}
      - {name: reapproval, policy: any, k: null}
    trigger: any_group_satisfied
    rationale: "E4 — the re-approval feedback edge is in its own group."

  - node: G1_feasibility
    groups:
      - {name: default, policy: all, k: null}
      - {name: reapproval, policy: any, k: null}
    trigger: any_group_satisfied
    rationale: "E4."

  - node: n19_aggregate_tables
    groups:
      - {name: core, policy: all, k: null}
      - {name: extended, policy: all_settled, k: null}
    trigger: all_groups_satisfied
    rationale: >
      THE most consequential join in this graph. Table 1 and the Table-2 GPT-4o
      column are mandatory (`core`/`all`). The Table-2 human column and Table 3
      may legitimately be partial (`extended`/`all_settled`) — a missing member
      only narrows the claim. Using `all` everywhere would let one annotator's
      absence block the whole report; using `all_settled` everywhere would let a
      missing Table 1 cell pass silently.

  - node: sg4_fuse_retrieve
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "Fusion needs both the layout embedding and the query modality embeddings."

  - node: sg4_encode_layout
    groups:
      - {name: init, policy: any, k: null}
      - {name: loop_back, policy: any, k: null}
    trigger: any_group_satisfied
    rationale: >
      E4 — the Algorithm-1 feedback edge is in `loop_back`, separate from the
      initial `init` edge from sg4_init. Merging them deadlocks the cycle.

  - node: sg1_annotate
    groups:
      - {name: init, policy: any, k: null}
      - {name: repair, policy: any, k: null}
    trigger: any_group_satisfied
    rationale: "E4 — the C1 repair feedback edge gets its own group."

  - node: sg2_semantic_edge
    groups:
      - {name: init, policy: any, k: null}
      - {name: repair, policy: any, k: null}
    trigger: any_group_satisfied
    rationale: "E4 — the C2 repair feedback edge gets its own group."

# ---------------------------------------------------------------- §15.6
dependencies:
  dag:
    - {node: n01_env_bootstrap, depends_on: []}
    - {node: n02_acquire_sources, depends_on: [n01_env_bootstrap]}
    - {node: n03_pilot_and_budget, depends_on: [n02_acquire_sources]}
    - {node: G1_feasibility, depends_on: [n03_pilot_and_budget]}
    - {node: n04_object_prep, depends_on: [G1_feasibility]}
    - {node: n05_scene_prep, depends_on: [G1_feasibility]}
    - {node: n13_run_baselines, depends_on: [G1_feasibility]}
    - {node: n06_build_splits, depends_on: [n04_object_prep, n05_scene_prep]}
    - {node: G2_corpus_validity, depends_on: [n04_object_prep, n05_scene_prep, n06_build_splits]}
    - {node: n07_train_stage1_align, depends_on: [G2_corpus_validity]}
    - {node: n08_build_gallery_staging, depends_on: [n07_train_stage1_align]}
    - {node: G3_gallery_freeze, depends_on: [n08_build_gallery_staging]}
    - {node: n09_promote_gallery_index, depends_on: [G3_gallery_freeze]}
    - {node: n10_train_headline, depends_on: [n07_train_stage1_align, n06_build_splits, n05_scene_prep]}
    - {node: n11_equivariance_probe, depends_on: [n10_train_headline]}
    - {node: n12_eval_object_retrieval, depends_on: [n09_promote_gallery_index, n10_train_headline]}
    - {node: n14_compose_scenes, depends_on: [n09_promote_gallery_index, n10_train_headline]}
    - {node: n15_judge_gpt4o, depends_on: [n14_compose_scenes]}
    - {node: G4_human_study_commit, depends_on: [n11_equivariance_probe, n12_eval_object_retrieval, n15_judge_gpt4o]}
    - {node: n16_human_study, depends_on: [G4_human_study_commit]}
    - {node: n17_train_ablations, depends_on: [G4_human_study_commit]}
    - {node: n18_eval_ablations, depends_on: [n17_train_ablations]}
    - {node: n19_aggregate_tables, depends_on: [n12_eval_object_retrieval, n13_run_baselines, n15_judge_gpt4o, n16_human_study, n18_eval_ablations]}
    - {node: n20_compare_to_paper, depends_on: [n19_aggregate_tables]}
    - {node: G5_report_release, depends_on: [n20_compare_to_paper]}
    - {node: n21_publish_report, depends_on: [G5_report_release]}

  feedback_edges: [e41, e42, fb_annot, fb_semedge, fb_compose]
  feedback_note: "Main line contains ZERO feedback edges. All cycles live inside subgraphs or the escalation loop."

  control_dependencies: []
  control_dependencies_note: >
    E1 — there are NO pure control edges in this graph. Every edge carries a real
    data dependency. This was checked during §14 optimization: the only candidate
    was 'run baselines after training for tidiness', which was removed (see e06).

  transitive_edges_removed:
    - "n02 -> G1 (implied by n02 -> n03 -> G1)"
    - "G1 -> n06 (implied by G1 -> n04/n05 -> n06)"
    - "n07 -> n12 (implied by n07 -> n10 -> n12)"

# ---------------------------------------------------------------- §15.7
routing:
  - decision_point: G1_feasibility
    authority: A1
    owner: edge
    inputs: [cost_projection, budget_cap, disk_free, gpu_hours_est]
    destinations: [n04_object_prep, n05_scene_prep, n13_run_baselines, n22_budget_approval, HALT_FAILED]
    cardinality_bound: null
    over_bound_action: ""
    default_destination: HALT_FAILED
    escalation_reason: "N/A (A1)"
    note: "fail closed — the default branch of every gate is HALT."

  - decision_point: n03_annotation_route
    authority: A1
    owner: edge
    inputs: [cost_projection.money, budget_cap.money, cost_projection.schema_pass_rate]
    destinations: [gpt4o_annotate, reuse_ulip2_captions]
    cardinality_bound: null
    over_bound_action: ""
    default_destination: reuse_ulip2_captions
    escalation_reason: "N/A (A1)"
    note: "The DEFAULT is the cheap branch, not the expensive one (F7)."

  - decision_point: G2_corpus_validity
    authority: A1
    owner: edge
    inputs: [leakage_count, admitted_size, quarantine_size, gallery_size_locked, schema_pass_rate]
    destinations: [n07_train_stage1_align, HALT_FAILED]
    default_destination: HALT_FAILED
    escalation_reason: "N/A (A1)"

  - decision_point: G3_gallery_freeze
    authority: A1
    owner: edge
    inputs: [index_dim, index_count, nan_count, zero_vector_count, self_retrieval_recall]
    destinations: [n09_promote_gallery_index, HALT_FAILED]
    default_destination: HALT_FAILED
    escalation_reason: "N/A (A1)"

  - decision_point: G4_human_study_commit
    authority: A1
    owner: edge
    inputs: [equivariance_report, retrieval_metrics, composition_incomplete, human_study_status, budget_cap]
    destinations: [n16_human_study, n17_train_ablations, n22_budget_approval, HALT_FAILED]
    default_destination: HALT_FAILED
    escalation_reason: "N/A (A1)"

  - decision_point: G5_report_release
    authority: A1
    owner: edge
    inputs: [reproduction_verdicts, gate_records, audit_records, degraded_flags]
    destinations: [n21_publish_report, HALT_FAILED]
    default_destination: HALT_FAILED
    escalation_reason: "N/A (A1)"

  - decision_point: sg1_admit_or_quarantine
    authority: A1
    owner: edge
    inputs: [schema_valid, item_attempt, failure_class]
    destinations: [sg1_encode, sg1_annotate, sg1_quarantine]
    default_destination: sg1_quarantine
    escalation_reason: "N/A (A1)"

  - decision_point: sg1_disk_backpressure
    authority: A1
    owner: edge
    inputs: [disk_free, shard_bytes]
    destinations: [proceed, shrink_shard, HALT_BLOCKED]
    default_destination: HALT_BLOCKED
    escalation_reason: "N/A (A1)"
    note: "Out of disk is BLOCKED (resumable), not FAILED."

  - decision_point: sg2_cache_lookup
    authority: A1
    owner: edge
    inputs: ["sem_edge_cache.contains((cat_a, cat_b))"]
    destinations: [use_cache, call_llm]
    default_destination: call_llm
    escalation_reason: "N/A (A1)"

  - decision_point: sg3_retrain_scope
    authority: A1
    owner: edge
    inputs: ["variant_registry[i].requires_stage1_retrain"]
    destinations: [full_pipeline, stage2_only]
    default_destination: stage2_only
    escalation_reason: "N/A (A1)"

  - decision_point: sg4_advance_or_exit
    authority: A1
    owner: edge
    inputs: [placed_count, N, wallclock, retrieval_calls]
    destinations: [sg4_encode_layout, DONE, EXHAUSTED]
    default_destination: EXHAUSTED
    escalation_reason: "N/A (A1)"

  - decision_point: sg4_composition_mode
    authority: A1
    owner: edge
    inputs: ["variant_registry[i].composition_mode"]
    destinations: [iterative, parallel, region]
    default_destination: iterative
    escalation_reason: "N/A (A1)"

static_fanouts:
  - {name: asset_shards, cardinality: 24, source: "ceil(len(asset_catalog)/2000)", bound: 60000, over_bound_action: truncate_and_record}
  - {name: render_views, cardinality: 11, source: "paper 2.3", bound: 11, over_bound_action: truncate_and_record}
  - {name: modality_conditions, cardinality: 7, source: "paper Table 1 columns", bound: 7, over_bound_action: truncate_and_record}
  - {name: baselines, cardinality: 6, source: "paper 3.1", bound: 6, over_bound_action: truncate_and_record}
  - {name: headline_variants, cardinality: 2, source: "paper Table 1 last two rows", bound: 2, over_bound_action: truncate_and_record}
  - {name: ablation_variants, cardinality: 8, source: "paper Table 3 minus 2 reusable rows", bound: 10, over_bound_action: truncate_and_record}
  - {name: annotators, cardinality: 5, source: "paper 3.3", bound: 5, over_bound_action: truncate_and_record}
  - {name: eval_scenes, cardinality: 200, source: "paper 3.3 (Table 3 uses 50 — see U-02)", bound: 200, over_bound_action: truncate_and_record}
static_fanouts_note: >
  E8 — every fan-out has a declared bound. All are STATICALLY enumerated, which
  is exactly why max_authority is A1 and not A3.

# ---------------------------------------------------------------- §15.8
loops:
  - id: C1
    name: annotation_repair
    location: SG1
    nodes: [sg1_annotate, sg1_validate_annotation]
    progress_measure: "item_attempt (monotonically increasing)"
    progress_channel: item_attempt
    semantic_exit: "annotation passes structured schema validation"
    hard_bound: {iterations: 2, cost: null, wallclock_s: 120, external_calls: 3}
    exhaustion_outcome: "quarantine the asset"
    exhaustion_marker: "terminated_by: repair_budget"
    iteration_channels_reset: [item_attempt, annotation_error_feedback]
    note: "L3 — an exhausted repair is NOT a successful annotation. The asset leaves the admitted set."

  - id: C2
    name: semantic_edge_repair
    location: SG2
    nodes: [sg2_semantic_edge, sg2_validate_edge]
    progress_measure: "attempt"
    progress_channel: item_attempt
    semantic_exit: "relation sentence non-empty and encodable"
    hard_bound: {iterations: 2, cost: null, wallclock_s: 60, external_calls: 3}
    exhaustion_outcome: "mark edge semantic_edge_missing, degrade to geometry-only edge"
    exhaustion_marker: "degraded_flags += semantic_edge_missing"
    iteration_channels_reset: [item_attempt]
    note: "Must NOT silently zero-fill the embedding — that would look like a valid semantic edge."

  - id: C3
    name: iterative_composition
    location: SG4
    nodes: [sg4_encode_layout, sg4_encode_query, sg4_fuse_retrieve, sg4_place, sg4_advance]
    progress_measure: "placed_count (merge=max, so retries never double-count)"
    progress_channel: placed_count
    semantic_exit: "placed_count == N (all queries in the list satisfied)"
    hard_bound: {iterations: 25, cost: null, wallclock_s: 600, external_calls: 30}
    exhaustion_outcome: "scene marked incomplete:true and added to composition_incomplete"
    exhaustion_marker: "terminated_by: object_budget"
    iteration_channels_reset: [layout_embedding, query_modality_embeds]
    note: >
      L3 — incomplete scenes are EXCLUDED from Table 2 means and reported
      separately. If the incomplete rate exceeds 10%, G4 fails.

  - id: C4
    name: budget_reapproval
    location: main
    nodes: [n22_budget_approval, G1_feasibility, G4_human_study_commit]
    progress_measure: "approval_round"
    progress_channel: run_progress
    semantic_exit: "human approves or explicitly rejects"
    hard_bound: {iterations: 2, cost: null, wallclock_s: null, external_calls: null}
    exhaustion_outcome: "whole graph BLOCKED (resumable), never FAILED"
    exhaustion_marker: "terminated_by: awaiting_human"
    iteration_channels_reset: []
    note: "Anti-pattern 24 — BLOCKED is not FAILED. Completed stages are not re-run."

nested_loop_budget:
  product: >
    Table 2 worst case: 4 methods x 200 scenes x 25 objects x (1 ESSGNN forward
    + 1 exact 48Kx1280 inner product) = 20,000 iterations.
    Table 3 (U-02, 50 scenes): 8 variants x 50 scenes x 25 objects = 10,000 iterations.
    SG1 worst case: 24 shards x 2000 assets x 3 annotation attempts = 144,000 API calls (ceiling).
  cost_upper_bound: >
    Pure compute for 20,000 iterations ~= 100 s (exact inner product ~3ms at
    246MB; ESSGNN forward on a ~20-node graph ~2ms). The DOMINANT term is the
    external I-Design layout call at an estimated 1-3 s/object => 6-17 hours.
    SG1's 144,000-call ceiling is never reached in practice because the
    cost_ledger cap trips BLOCKED far earlier.
  unknown: "I-Design per-call latency is UNMEASURED (R-05). The 6-17h figure is an interval estimate, NOT an upper bound."

termination:
  states:
    SUCCESS: "SC-1..SC-8 all met, G5 verdict PASS, report published"
    FAILED: "any gate FAIL confirmed unrecoverable after diagnosis (e.g. ULIP-2 weights unobtainable; equivariance fails even with the correct h0=t implementation)"
    EXHAUSTED: "cost_ledger hits the G1-approved cap while core tables are incomplete; carries terminated_by=budget"
    BLOCKED: "awaiting budget re-approval / annotators / disk space / I-Design access. RESUMABLE — completed stages are not re-run."
  terminal_nodes: [n21_publish_report, HALT_FAILED, HALT_BLOCKED, QUARANTINE_REPORT]

