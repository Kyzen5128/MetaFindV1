# MetaFind reproduction -- Graph Specification
#
# 2026-08-16: formula authority moved to the authors' arXiv TeX source under
# docs/paper/*_source/. Every contradiction was re-derived from it and ALL of
# them survived -- none was a Markdown conversion artifact. See docs/audit/.
# 2026-08-15. Every claim re-checked against the paper rather
# than from memory. An earlier draft carried six errors that would have changed the
# experimental result; see 01_GRAPH_SPEC.md section 16.
#
# Three kinds of content are kept apart throughout and must not be conflated:
#   [PAPER]    stated in the paper, with the quote
#   [UNKNOWN]  the paper does not say; we chose one and recorded it
#   [DEVIATION] differs from the paper; must be declared in the report

spec_version: "1.0"
graph_id: "metafind-reproduction"
title: "MetaFind paper reproduction (single RTX 4090, Qwen in place of GPT-4o)"
authored_at: "2026-08-15"

classification:
  shapes: [hierarchical, dag, stateful, parallel, conditional, cyclic]
  shapes_note: >
    Main line is a strict DAG with zero feedback edges. All cycles are confined
    to subgraphs: C1 annotation repair, C2 semantic-edge repair, C3 Algorithm 1.

  max_authority: "A1"
  max_authority_reason: >
    No decision point lets a model choose the next node. Qwen appears four
    times (asset annotation, semantic edges, scene judging, and I-Design's
    scene planning under D-5) but each time only produces a payload written
    into state; routing is always a deterministic predicate over state.

  execution_mode: "probabilistic"
  execution_mode_reason: >
    Authority <= A1 but node outputs are not reproducible, so the second
    condition for `deterministic` fails.

  topology_class: "workflow"
  topology_class_reason: >
    Every fan-out has a statically enumerated destination set: 11 views,
    7 modality conditions, 2 gallery protocols, 8 ablation variants.

  nondeterminism_sources:
    - {id: NS-1, source: "Qwen asset annotation", frozen_by: "written once into a versioned artifact; never re-called downstream"}
    - {id: NS-2, source: "Qwen semantic relation sentences", frozen_by: "cached by a hash over both object descriptions plus prompt/model/encoder versions"}
    - {id: NS-3, source: "Qwen scene judging", frozen_by: "greedy decoding, pinned prompt version, recorded model revision"}
    - {id: NS-4, source: "GPU atomics in scatter_add_", frozen_by: "NOT removable; equivariance tests use a numeric tolerance"}
    - {id: NS-5, source: "training stochasticity (init, shuffling, dropout)", frozen_by: "fixed seeds; exact reproducibility not claimed"}
    - {id: NS-7, source: "I-Design scene planning with Qwen2.5-7B-Instruct (D-5)", frozen_by: "evaluation_scene_inputs persists prompt, prompt_sha256, room dimensions, object count, seed, planner model, I-Design revision and patch hashes before any retrieval runs against the scene"}
    - {id: NS-6, source: "approximate nearest neighbour search", frozen_by: "ELIMINATED -- 46,052 x 1280 x 4B = 236 MB, exact inner product is affordable"}

goal:
  statement: >
    Reproduce MetaFind on a single RTX 4090 and produce results comparable
    cell-by-cell against paper Tables 1, 2 and 3, giving every cell exactly one
    of REPRODUCED / NOT_REPRODUCED / INSUFFICIENT_EVIDENCE.

  success_criteria:
    - id: SC-1
      criterion: >
        All 14 MetaFind cells of Table 1 produced under BOTH gallery protocols.
        Deviation from the paper's R@1 is REPORTED, not thresholded as a
        pass/fail on the model.
      measured_by: n21_compare_to_paper
      note: >
        An earlier draft required +/-3.0 pp. That is not a fair criterion here.
        D-2 replaces GPT-4o with Qwen for the asset annotations, which are the
        text tower's training data, so Table 1 is affected too -- not just
        Table 2's judge. A cell outside 3 pp may reflect the annotation
        distribution rather than a reproduction failure, and the two cannot be
        separated without also running the GPT-4o annotation. The relative
        ordering and the PC-Only inversion (SC-2) remain meaningful.
    - id: SC-2
      criterion: "PC-Only inversion reproduced: MetaFind lower than the baselines' published figures"
      measured_by: n21_compare_to_paper
      note: "A naive success criterion would call this cell a failure. Reproducing the paper includes reproducing its regressions."
    - id: SC-3
      criterion: "Table 2: w/ESSGNN > w/o ESSGNN on all four dimensions, DIRECTION ONLY"
      measured_by: n21_compare_to_paper
      note: "Absolute values are not comparable to the paper because the judge is Qwen, not GPT-4o (D-2)."
    - id: SC-4
      criterion: "Per-layer coordinate EQUIVARIANCE: ||x^(l+1)(Rx+T) - (R x^(l+1)(x) + T)||inf < 1e-4"
      measured_by: n14_equivariance_probe
    - id: SC-5
      criterion: "Per-layer feature INVARIANCE: h^(l+1)(Rx+T) == h^(l+1)(x)"
      measured_by: n14_equivariance_probe
    - id: SC-6
      criterion: "Layout output INVARIANCE: e_layout(Rx+T) == e_layout(x)"
      measured_by: n14_equivariance_probe
      note: >
        An earlier draft wrote a single criterion ||ESSGNN(Rx+T) - (R ESSGNN(x) + T)|| and called
        it the coordinate channel. e_layout = Pooling({h_i^(L)}) is pooled from h,
        which is INVARIANT; applying R and T to it has no geometric meaning.
    - id: SC-7
      criterion: "Four Table-3 takeaways reproduced by direction"
      measured_by: n21_compare_to_paper
    - id: SC-8
      criterion: >
        Resume equivalence, scoped by stage kind. Killing a PREPROCESSING stage
        and restarting yields byte-identical artifacts and no extra external
        calls. Killing a TRAINING stage resumes from the saved optimizer and RNG
        state with the step counter continuing and no sample consumed twice in
        an epoch.
      measured_by: L2-RESUME
      note: >
        [CORRECTED] This said "killing any stage ... yields identical
        artifacts", which contradicts NS-4 and NS-5 in this same file: GPU
        atomics and training stochasticity are declared non-removable and exact
        reproducibility is explicitly not claimed. A checkpoint cannot be both.

boundary:
  in_scope:
    - "ULIP-2 backbone integration"
    - "dual-tower query/gallery encoders with modality-aware fusion"
    - "ESSGNN layout encoder"
    - "two-stage training per paper section 2.6"
    - "Objaverse-LVIS and ProcTHOR-10K pipelines"
    - "Tables 1, 2, 3"
    - "SE(3) verification at three levels"
  out_of_scope:
    - "pretraining ULIP-2 itself"
    - "re-running the six baselines (D-3)"
    - "the human preference study (D-4)"
    - "reproducing I-Design itself"

  deviations:
    # NOTE: D-1 is NOT here. It lives under conditional_deviations below,
    # because whether it is a deviation at all depends on U-34.
    - id: D-2
      what: "Qwen2.5-VL replaces GPT-4o for annotation and scene judging"
      why: "project decision"
      impact: >
        Affects BOTH tables, not just Table 2. Qwen replaces the judge (Table 2)
        AND the 46,052 asset annotations, which are the text tower's training
        data, so Table 1's absolute values shift too. SC-1 therefore reports the
        deviation rather than thresholding it; SC-2 and SC-3 keep only
        directional claims.
    - id: D-3
      what: "The six baselines are not re-run"
      why: "scope is MetaFind only"
      impact: "SC-2 compares against published values, under a different protocol"
    - id: D-4
      what: "No human preference study"
      why: "no annotator capacity"
      impact: "Table 2 human column reported as INSUFFICIENT_EVIDENCE"
    - id: D-6
      what: "Behavioural modifications to I-Design beyond the model swap"
      why: >
        Without them no scene completed: five attempts ended in an unbounded
        correction loop, a wall id in objects_in_room, a preposition outside
        the schema's enum, a dangling object reference, and duplicate object ids.
      impact: >
        SEPARATE from D-5, which is only the planner model. Patches 02 and 03
        change what the pipeline PRODUCES, not just who produces it:
          layout-reference normalisation (walls moved to the list whose enum
            accepts them, spellings canonicalised)
          prepositions mapped onto the schema's enums, unmappable ones to "on"
          dangling object references dropped
          duplicate new_object_id entries collapsed, keeping the first
          correction loops bounded (12 rounds, 3 attempts per conflict)
          cache_seed varied per retry, so a retry is not served the identical
            cached response and reaches the model again -- a fresh invocation,
            not a statistically independent sample, which would require
            controlling the sampler's RNG and is not demonstrated here
          scenes abandoned on exhaustion instead of looping
        Each changes scene content, which scenes survive, and the completion
        rate -- so every Table 2 row and Table 3 scene column is affected.
        [WHAT THIS DOES AND DOES NOT CLAIM] These modifications do not exist in
        the currently public atcelen/IDesign. That is not evidence the MetaFind
        authors ran it unmodified: their integration code and I-Design
        configuration were never published, so whether they needed similar
        changes is unknown. The honest statement is that we deviate from the
        public implementation, not that we deviate from what the paper did.

    - id: D-5
      what: "Every I-Design LLM path configured for gpt-4 or gpt-4-1106-preview is rerouted to local qwen2.5-7b-instruct"
      why: "no proprietary API; consistent with D-2's project decision"
      impact: >
        SEPARATE from D-2, which covers GPT-4o for annotation and judging.
        Every I-Design LLM path configured for "gpt-4" or "gpt-4-1106-preview"
        is rerouted to qwen2.5-7b-instruct -- which is exactly what patch 01
        does, and is a more accurate statement than counting agents. The public
        repo defines at least six AssistantAgent roles (interior designer,
        interior architect, engineer, spatial corrector, object deletion, layout
        refiner) plus the GroupChat managers that share those configs; an
        earlier version of this entry said "five planning agents".
        The JSON-mode difference is tracked separately as D-7, not here: the
        two are independently fixable, and describing both in this entry made
        the report attribute one behavioural deviation to two ids.
        temperature 0.7 and top_p 1.0, which paper 4.1 specifies, ARE
        inherited: I-Design's own agents.py sets both.
        All are text-only. Implemented by PATCHING I-Design's filter_dict
        (setup/patches/idesign-01), not by aliasing Qwen as "gpt-4" in vLLM --
        that was the first approach and was abandoned because every log line
        then read gpt-4 while Qwen did the work. Changing the planner changes THE SCENES THEMSELVES, so every
        Table 2 row and Table 3 scene column shifts together; it does not touch
        Table 1, which never runs the planner. The model name is
        qwen2.5-7b-instruct everywhere -- vLLM, the config, the patched filter
        and every scene sidecar. No alias exists.

    - id: D-7
      what: "I-Design's JSON-constrained decoding is not reproduced"
      why: "no guided-decoding equivalent is configured on the local vLLM endpoint"
      impact: >
        SEPARATE from D-5, which is only which model answers. I-Design's
        supplementary 7 states "All agents utilize GPT-4's JSON mode to
        restrict outputs exclusively to valid JSON, which significantly
        reduces token consumption". Our endpoint serves Qwen with ordinary
        sampling, so a structurally invalid response is POSSIBLE here and was
        not possible upstream. That lands in the Engineer agent's schema
        validation retry loop, which changes how many rounds a scene takes and
        which scenes survive at all -- one of the paths our runs fail on.
        Numbered separately rather than folded into D-5 because they are
        independently fixable: enabling guided JSON would retire D-7 while
        leaving D-5 exactly as it is.
        Affects the same surface as D-5: all of Table 2 and Table 3's scene
        columns. Table 1 never runs the planner.

  conditional_deviations:
    - id: D-1
      what: "ViT-bigG-14 stays frozen; only the 3D encoder and fusion train"
      active_if: "stage1_encoding_protocol.paper_clip_train_scope == 'trainable' AND stage1_encoding_protocol.actual_clip_train_scope == 'frozen'"
      status: resolved_inactive
      current_evaluation: false
      resolved_by: U-34
      resolved_at: '2026-08-16'
      why: >
        U-34 resolved to frozen, so paper_clip_train_scope == actual_clip_train_scope
        == 'frozen' and active_if is false. D-1 is NOT an active deviation.
        The rule is kept rather than deleted because it is the only encoding of
        the state "the paper wants CLIP trained and we froze it anyway", and
        that state becomes reachable again if MetaFind's code or its authors
        show an optimizer update reaching OpenCLIP.
        NOTE the reason changed. This entry previously turned on whether
        training ViT-bigG-14 fits in 24 GB. That is no longer what decides it:
        D-1 is inactive because of the READING, not because of the hardware.
        Feasibility is now RA-3's own question and it reports rather than
        settles anything here.
      impact: >
        Listed separately from boundary.deviations because it is not currently
        established as one, and enumerating it among the active deviations
        would assert something we cannot support.
          paper=frozen                  -> NOT a deviation whatever we run.
            ULIP-2's paper 3.3 freezes OpenCLIP and MetaFind builds on ULIP-2,
            so the main line agrees with its own backbone's specification.
          paper=trainable, actual=frozen -> IS a deviation. Whether it was
            FORCED depends on RA-3, which has not run. Until it does, the run
            record must say "we chose frozen", not "we could not train it".
          paper=trainable, actual=trainable -> NOT a deviation; we did what we
            read the paper to require. Requires RA-3 to have succeeded.
          paper=frozen, actual=trainable -> not a deviation either, but a
            VARIANT beyond the paper. Must be reported as such.
        [CORRECTED] The condition used to be a single field being `trainable`,
        which marked D-1 active exactly when the run was NOT deviating.
        The earlier justification is withdrawn, and why matters: it rested on
        ULIP-2's public ULIP2_PointBERT_Colored calling eval() without setting
        requires_grad=False, so main.py's optimizer would have included those
        parameters. That observation about the CODE is correct and verifiable.
        Using it to conclude something about the DESIGN was not: ULIP-2's paper
        3.3 states "We adopt the largest version of encoders from OpenCLIP
        (ViT-G/14) ... and freeze it during pre-training", and the five ULIP-1
        factories in that same file DO freeze explicitly -- so the omission
        reads as the code disagreeing with its own paper. Why it disagrees is
        unknown and is not asserted here.
        G5 evaluates active_if at report time rather than printing a fixed list.

  external_systems:
    - {name: "HuggingFace SFXX/ulip", kind: model_provider, failure_semantics: "unavailable => FAILED, no substitute", trust: trusted, validated_by: "sha256 plus a behavioural check"}
    - {name: "Objaverse", kind: database, failure_semantics: "partial => admitted set shrinks; >2% missing fails G3", trust: trusted}
    - {name: "ProcTHOR-10K via prior", kind: database, failure_semantics: "unavailable => Tables 2/3 BLOCKED_EVIDENCE", trust: trusted}
    - {name: "Qwen2.5-VL (local)", kind: model_provider, failure_semantics: "schema violation => repair loop; OOM => reduce batch and record", trust: untrusted_output, validated_by: "structured schema validation before entering state"}
    - {name: "I-Design", kind: api, failure_semantics: "R-01 PARTIALLY MEASURED: installs and its first stage runs; five attempts with a 7B planner completed zero scenes, with no baseline for a normal rate. If unusable, Tables 2/3 => BLOCKED_EVIDENCE, not FAIL", trust: untrusted, revision: "7bc891c plus three MetaFind patches, two of which change behaviour"}

# ---------------------------------------------------------------- state
state:
  channels:
    - name: asset_manifest
      type: "map[uid -> source_path]"
      writers: [n02_download]
      readers: [G1_sources_valid, G3_object_corpus, G4_gallery_freeze, n03_sample_pointclouds, n04_render_views, n09_build_splits, n09b_resolve_stage2_protocol, n11_gallery_index_staging, n22_publish_report]
      merge: write_once
      lifetime: persistent
      note: >
        [UNKNOWN U-01] The paper says "approximately 48,000"; the released
        manifest holds 46,052. The manifest is the truth. Nothing anywhere may
        hardcode 48000 -- enforced by L1-MANIFEST.

    - name: asset_glb
      type: "map[uid -> {path, sha256, bytes}]"
      writers: [n02_download]
      readers: [G1_sources_valid, n03_sample_pointclouds, n04_render_views, n16_compose_scenes, n19_eval_ablations]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [REVERSED from an earlier draft] An earlier draft deleted meshes after rendering. Algorithm 1
        places retrieved assets into a scene and needs real geometry, so they are
        kept.

    - name: pretrained_weights
      type: "map[name -> {uri, sha256, revision, behavioural_check: {probe, expected, observed, passed}}]"
      writers: [n02_download]
      readers: [G1_sources_valid, n06_encode_text_image, n10_train_stage1, n10b_post_stage1_encode, n11_gallery_index_staging, n11b_stage2_gallery_index, n13_train_stage2, n15_eval_retrieval, n18_train_ablations, n22_publish_report]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [ADDED] The frozen weights every stage runs on -- the ULIP-2
        checkpoint, ViT-bigG-14, Qwen2.5-VL -- were not graph state at all.
        n02 downloaded them, G1's criterion said "the ULIP-2 checkpoint passes
        a behavioural check, not merely a sha256", and G1 read no channel that
        could hold one. Every node that loads them reached outside the graph
        for a path in paths.py.
        Surfaced by the check requiring a derived routing input to name the
        channel it comes from: G1 routes on ckpt_behaviour and had nowhere to
        derive it. A sha256 is deliberately not enough here -- the failure this
        guards against is a checkpoint that loads and produces plausible
        garbage, which hashes fine.

    - name: procthor_dataset
      type: "{path, sha256, train_count, val_count, test_count}"
      writers: [n02_download]
      readers: [G1_sources_valid, n07_scene_graphs, n07b_procthor_asset_modalities, n09c_build_scene_splits, n15c_prepare_eval_scenes]
      merge: write_once
      lifetime: persistent
      note: >
        [CORRECTED] ProcTHOR is one of the two datasets the paper names, but an
        earlier draft never gave it a channel: n02 did not declare writing it,
        n07 read nothing, and G1's reads covered only the Objaverse channels.
        G1's criterion text mentioned ProcTHOR while the gate had no way to see
        it, so a run with Objaverse complete and ProcTHOR absent could PASS.

    - name: pointclouds
      type: "map[uid -> {path, sha256, n_points, seed, sampler_version, rgb_scale, colour_source, coloured_point_fraction, raw_bbox_extents, raw_bbox_volume, centroid_offset, max_radius, per_axis_variance}]"
      writers: [n03_sample_pointclouds]
      readers: [G2_pc_sanity, n09_build_splits, n10_train_stage1, n11_gallery_index_staging, n15_eval_retrieval, n18_train_ablations, n19_eval_ablations]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [TYPE CORRECTED against the implementation] This declared
        {path, sha256, n_points} while n03 produced neither `path` nor
        `sha256`, and omitted the three fields G2 actually routes on --
        centroid_offset, max_radius and per_axis_variance. The gate's routing
        inputs name them as bare identifiers, so the `channel.field` check
        could not see the gap: a gate was configured to decide on fields the
        channel did not declare and the producer did not write.
        `sha256` is now produced rather than dropped from the type, because
        L2-RESUME asserts byte-identical preprocessing artifacts across a
        restart and has nothing to compare without a digest.
        `colour_source` and `coloured_point_fraction` are here because a cloud
        whose colour channel silently collapsed to a constant is structurally
        valid: it passes every shape and normalisation check, trains, embeds,
        and shows up only as a lower Table 1 number. Three separate defects in
        the first implementation did exactly that -- see F20.
        Sampled from the mesh, then pc_norm'd exactly as ULIP does.
        G2_pc_sanity gates STRUCTURAL validity. The comparison against ULIP's
        released clouds (U-02) is L2-PC-ULIP-REF, a diagnostic that does not gate.

    - name: renders
      type: "map[uid -> {view_paths[11], view_sha256[11], raw_bbox_extents, projection, camera_layout, resolution}]"
      writers: [n04_render_views]
      readers: [n05_annotate, n05b_resolve_stage1_encoding, n06_encode_text_image, n09_build_splits, n10_train_stage1, n10b_post_stage1_encode]
      merge: upsert_by_key
      lifetime: persistent

    - name: objaverse_annotations
      type: "map[objaverse_uid -> {category, description, dimensions, materials, placement_constraints, annotator_model}]"
      writers: [n05_annotate]
      readers: [n05b_resolve_stage1_encoding, n06_encode_text_image, n09_build_splits, n09b_resolve_stage2_protocol, n10_train_stage1, n10b_post_stage1_encode]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [PAPER 2.3] "object category, size dimensions, materials, and placement
        constraints". Frozen as an artifact once written (NS-1).
        Keyed by OBJAVERSE uid. ProcTHOR objects live in a different namespace
        and must not read this channel -- see procthor_object_text.

    - name: procthor_object_text
      type: "map[procthor_asset_id -> {text, source}]"
      writers: [n07_scene_graphs]
      readers: [n07b_procthor_asset_modalities, n08_semantic_edges, n09b_resolve_stage2_protocol, n09c_build_scene_splits, n13_train_stage2, n18_train_ablations]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [CORRECTED] The node feature t_i for a ProcTHOR scene graph, and the
        object descriptions the semantic-edge LLM is prompted with.
        MEASURED: ProcTHOR assetIds ("Countertop_I_8x2", "Fridge_19") and
        Objaverse uids (32 hex chars) have ZERO overlap -- 995 vs 46,052 ids,
        intersection empty. An earlier draft had n07 and n08 read the Objaverse
        annotation channel, which is both a provenance bug (n07 is not its
        writer) and a category error.
        [PAPER 2.3] ProcTHOR "provides precise spatial coordinates and
        comprehensive semantic metadata for each asset", so the text is built
        from ProcTHOR's own metadata.
        [UNKNOWN U-12] exactly how that metadata becomes a sentence is not
        specified.

    - name: text_image_embeddings
      type: "map[uid -> {text: uri, image: uri | list[uri] per view, aggregation, n_views}]"
      writers: [n06_encode_text_image]
      readers: [n09_build_splits, n10_train_stage1, n10b_post_stage1_encode]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        Cached ONLY when stage1_encoding_protocol.actual_clip_train_scope == frozen.
        The point encoder is TRAINABLE in Stage 1 (paper 2.6: "Both query and
        gallery encoders are trained"), so point-cloud embeddings cannot be
        precomputed -- an earlier draft cached all three, which made it the
        "train fuser only" ablation by accident. The same rule binds CLIP: an
        embedding cache is the output of a network that is not being updated,
        so under `trainable` this channel stays empty and n10 consumes renders
        and annotations directly.
        [U-14] `image` holds ONE vector only when the aggregation is fixed in
        advance (fixed view, mean, max). For a per-step choice such as "random
        single view" it holds the per-view list -- the schema must keep what
        the protocol needs, or the option is declarable and unexecutable.

    - name: scene_graphs
      type: "map[house_id -> {nodes, positions, phys_edges, sem_edge_ids, uri}]"
      writers: [n07_scene_graphs]
      readers: [n07b_procthor_asset_modalities, n08_semantic_edges, n09b_resolve_stage2_protocol, n09c_build_scene_splits, n13_train_stage2, n14_equivariance_probe, n15b_resolve_composition_protocol, n15c_prepare_eval_scenes, n18_train_ablations]
      merge: upsert_by_key
      lifetime: persistent

    - name: procthor_node_embeddings
      type: "{uri, sha256, asset_ids, embedding_dim, text_encoder_version, n_assets}"
      writers: [n08_semantic_edges]
      readers: [G6_stage2_ready, n13_train_stage2, n18_train_ablations]
      merge: write_once
      lifetime: persistent
      note: >
        [U-20] ESSGNN's node feature t_i, as a vector. The decision that t_i uses
        the SAME frozen text encoder as e_ij was recorded and had no artifact --
        `procthor_object_text` holds the strings and nothing held the
        embeddings, so n13 had a node feature it could not obtain. Third time
        this shape has appeared: a resolution that reads as complete and leaves
        the trainer with nothing to read.
        Written by n08 rather than a node of its own because n08 already loads
        that encoder for the edge sentences, and U-20 pins t_i to it precisely
        so the two live in one space. Encoding them anywhere else would make
        "the same encoder" a claim rather than a fact.
        NOT text_image_embeddings: that is Objaverse, ViT-bigG-14, 1280-d --
        wrong corpus and wrong encoder on both counts.

    - name: sem_edge_cache
      type: "map[hash -> {sentence, embedding_uri}]"
      writers: [n08_semantic_edges]
      readers: [n08_semantic_edges, n09c_build_scene_splits, n13_train_stage2, n18_train_ablations]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [CORRECTED] key = sha256(desc_i, desc_j, prompt_version,
        llm_model, text_encoder_version). An earlier draft keyed on (category_a, category_b),
        which collapses "office chair + desk" and "dining chair + dining table"
        into one relation. Paper 2.5 and Appendix C both say the LLM is prompted
        with object DESCRIPTIONS.

    - name: post_stage1_embeddings
      type: "{query: map[uid -> {text: uri, image: uri | list[uri] per view, aggregation, n_views}], gallery: map[uid -> same], towers_are_identical: bool, source: cache_passthrough|reencoded, produced_from_ckpt_sha}"
      writers: [n10b_post_stage1_encode]
      readers: [n11_gallery_index_staging, n15_eval_retrieval, n18_train_ablations, n19_eval_ablations]
      merge: replace
      lifetime: persistent
      note: >
        [ADDED] n11, n13, n15 and n18 all read text_image_embeddings, which
        n06 writes -- and n06 does not run when actual_clip_train_scope is
        `trainable`. So the trainable reading of U-34 could be trained and then
        had nowhere to go: Stage 1 finished, and every consumer downstream
        demanded a cache that route never produces. Fixing the n06/n09 branch
        opened the front door and left the back one shut.
        This channel is what those four read instead. It is produced AFTER
        Stage 1, when the encoders are final either way:
          actual=frozen     -> source=cache_passthrough. CLIP never moved, so
                               n06's cache is still exactly right.
          actual=trainable  -> source=reencoded from renders and annotations
                               with the trained encoders.
        SEPARATE query and gallery maps, because one map cannot express
        tower_sharing=fully_separate under actual=trainable: the two towers
        then hold DIFFERENT trained CLIP weights, so "the text embedding of
        asset X" is two different vectors. towers_are_identical records
        whether they coincided, so a reader can assert rather than assume.

    - name: stage1_encoding_protocol
      type: "{status: unresolved|resolved, text_serialization, image_aggregation, paper_clip_train_scope: frozen|trainable, paper_clip_train_scope_basis, paper_clip_train_scope_confidence: low|moderate|high, actual_clip_train_scope: frozen|trainable, missing_modality_representation: learned_token|validity_mask|drop_slot, decided_by, decided_at}"
      writers: [n05b_resolve_stage1_encoding]
      readers: [G3_object_corpus, n06_encode_text_image, n10_train_stage1, n10b_post_stage1_encode, n11_gallery_index_staging, n11b_stage2_gallery_index, n15_eval_retrieval, n21_compare_to_paper]
      merge: replace
      lifetime: persistent
      note: >
        [ORDERING DEFECT, CORRECTED] These three fields lived in
        stage1_protocol, which n09_build_splits writes -- one layer AFTER
        n06_encode_text_image has already produced the cache. Each of them
        decides what n06 should produce, so deciding them afterwards meant the
        embeddings were built before it was settled how to build them:

          text_serialization (U-15)  the exact string the text encoder sees.
            Fixed after encoding, the cache answers a different question.
          image_aggregation (U-14)   how 11 views become one e_image. A
            protocol resolving to "random single view per training step" was
            declarable and unexecutable, because the cache had already
            collapsed 11 embeddings into one vector.
          paper_clip_train_scope (U-34)   what we read MetaFind as REQUIRING.
          actual_clip_train_scope (U-34)  what this run actually does.
            [SPLIT] These were ONE field, which made D-1 inexpressible. The
            deviation is "the paper wants CLIP trained and we froze it anyway",
            a statement about the GAP between the two -- so a single field
            could never carry it. Setting the old field to `trainable` marked
            D-1 active while the run trained CLIP and therefore did NOT
            deviate; and the state that D-1 actually describes, paper=trainable
            with actual=frozen, had no representation at all. Interpreting
            evidence and executing an experiment are different acts and now
            have different fields. Only `actual` branches the graph, because
            only `actual` decides whether a cache exists. Under `trainable`
            there must be NO frozen cache at all -- gradient has to reach
            OpenCLIP -- so this decides whether n06 runs in this form.

        Resolved by a human before n06, for the same reason as the Stage 2
        protocols: these are readings of an underspecified paper, not values a
        default may supply.

    - name: stage1_hyperparameters
      type: "{uri, sha256, values: {optimizer, learning_rate, weight_decay, scheduler, batch_size, epochs, p_mask, init_temperature, learnable_temperature, max_logit_scale, seed}, decided_by, decided_at}"
      writers: [n05b_resolve_stage1_encoding]
      readers: [G3_object_corpus, n09_build_splits, n10_train_stage1, n18_train_ablations, n22_publish_report]
      merge: replace
      lifetime: persistent
      note: >
        [ADDED] U-22's values had a hash in stage1_protocol and no artifact
        anywhere. Stage1RuntimeConfig.from_protocols therefore took a dict from
        outside the graph and checked it against that hash -- which catches a
        WRONG dict but says nothing about where the right one comes from, and
        G3 claimed to verify a dereference it had no channel to perform.
        The paper gives none of these values (U-22), so every one of them is
        ours and has to be recorded as such. sha256 must equal
        stage1_protocol.hyperparameter_config_hash; the two exist separately
        because the protocol is the decision and this is the artifact, and
        L1-STAGE1-PROTOCOL-APPLIED compares them.
        p_mask is here for provenance but is NOT free: paper 2.6 fixes it at
        0.30 on the main line -- see the note on stage1_protocol.

    - name: stage1_protocol
      type: "{status: unresolved|resolved, fusion, tower_sharing: shared_backbone_separate_fusion|fully_shared|fully_separate, allow_all_masked, similarity, hyperparameter_config_hash, decided_by, decided_at}"
      writers: [n09_build_splits]
      readers: [G3_object_corpus, G6_stage2_ready, n10_train_stage1, n10b_post_stage1_encode, n11_gallery_index_staging, n15_eval_retrieval, n18_train_ablations]
      merge: replace
      lifetime: persistent
      note: >
        [ADDED] Stage 2's unknowns are held in stage2_protocol and enforced by
        G6, so Stage 2 cannot start on defaults. Stage 1's unknowns had no such
        home: U-13 (fusion), U-14 (multi-view aggregation), U-15 (text
        serialization), U-16 (tower sharing), U-22 (hyperparameters), U-23
        (all-masked query) and U-24 (similarity) were all recorded in prose
        while n10 could still begin training on whatever the code defaulted to.
        Finding an UNKNOWN is not the same as putting it in the graph.
        [SPLIT] The three fields that decide what n06 PRODUCES moved to
        stage1_encoding_protocol, resolved before n06 runs. What remains here
        is used at training time, so n09 is early enough.
        Unlike stage2_protocol this does NOT get its own gate -- every value
        has a defensible default, so the risk is silence, not incoherence.
        G3_object_corpus checks that the record is complete and that each field
        names a choice, which makes the choices appear in the report.
        [CONSUMED] Every field now reaches an object, checked by
        L1-STAGE1-PROTOCOL-APPLIED. Four of them previously did not:
        allow_all_masked never reached sample_modality_mask, similarity was
        accepted as any string while the loss computed cosine regardless,
        hyperparameter_config_hash dereferenced nothing so all of U-22 ran on
        library defaults, and tower_sharing shared a FusionConfig object while
        each tower still built its own ModalityFusion. A protocol field nobody
        consumes is a claim in the report with nothing behind it.
        tower_sharing is an explicit three-way enum because U-16's registry
        lists three readings, and a reading the code cannot take is not an
        option.

    - name: essgnn_arch_protocol
      type: "{status: unresolved|resolved, use_io_projections, distance, coord_feat, layer_sharing, pooling, hidden_dim, n_layers, mlp_structure, decided_by, decided_at}"
      writers: [n09b_resolve_stage2_protocol]
      readers: [G6_stage2_ready, n13_train_stage2, n14_equivariance_probe, n18_train_ablations]
      merge: replace
      lifetime: persistent
      note: >
        [U-33 / U-17 / U-26 / U-31 / U-22] The ESSGNN architecture choices the
        paper leaves open, in one place a gate can see.

        U-33 is why this channel exists. A `use_io_projections: bool = True`
        default in ESSGNNConfig is not a decision -- it is the EGNN reference
        implementation's convention winning by inheritance, and it changes the
        ARCHITECTURE, not a hyperparameter: `True` adds Linear(node_feat_dim,
        hidden) before the layers and Linear(hidden, out_dim) after, neither of
        which appears in 2.5, which goes t_i -> h^(0) -> L layers ->
        Pooling({h^(L)}) = e_layout.

        The argument for `False` as the faithful primary is straightforward:
        the paper does not describe the projections. The consequence has to be
        stated with it -- `False` forces node_feat_dim == hidden_dim ==
        out_dim, so the hidden width becomes the embedding width (1280 for
        ULIP-2) rather than something small, which is a much larger network and
        interacts with finding F8, where a 1280-wide e_ij was measured to
        suppress the geometric signal about 45x.
        That trade is a person's call, which is why this is a `human` node's
        output and not a default in a dataclass.

        The remaining fields collect choices already registered elsewhere so
        they cannot drift apart: distance (U-17, squared vs euclidean),
        coord_feat (U-26, f_x sees h^(l+1) or h^(l)), layer_sharing (U-31),
        pooling and the two hyperparameters (U-22).

    - name: essgnn_edge_protocol
      type: "{status: unresolved|resolved, topology, physical_relation_encoding, semantic_missing_representation, directionality, decided_by, decided_at}"
      writers: [n09b_resolve_stage2_protocol]
      readers: [G6_stage2_ready, n13_train_stage2, n14_equivariance_probe, n18_train_ablations]
      merge: replace
      lifetime: persistent
      note: >
        [U-29 / U-30 / U-19 -- BLOCKING for Stage 2] Registering these as
        UNKNOWNs was not enough: metafind/models/essgnn.py already decides them.
        Its forward takes edge_attr with one row per edge and concatenates it
        straight into f_h and f_x, so the implementation assumes EVERY
        message-passing edge carries a fixed-width semantic embedding. There is
        no physical-edge type feature, no validity bit, no missing-edge
        embedding, no geometry-only path. That is one answer to U-29 and U-30,
        chosen by code rather than recorded as a decision, and G6 did not stop
        Stage 2 from training on it.
        Fields:
          topology                        physical only | semantic only | union | parallel edges
          physical_relation_encoding      how support vs adjacency is represented, if at all
          semantic_missing_representation what the e-wide slot holds when there is no
                                          sentence; must be distinguishable from a valid
                                          embedding, so not zeros
          directionality                  U-19: directed or symmetric, per edge type

    - name: stage2_protocol
      type: "{status: unresolved|resolved, gallery_scope: procthor|objaverse, positive_identity: same_asset_id|mapped, modality_source: ai2thor_isolated|objaverse_proxy, image_protocol, pointcloud_source, query_pointcloud: required|optional, sampling_unit: object_instance|house, target_eligibility, target_removed_before_essgnn: true|false, samples_per_house: all_eligible|fixed_k, epoch_definition, instance_resampling: fixed|per_epoch, batch_positive_uniqueness: true|false, scene_dropout_granularity: batch|sample, decided_by, decided_at}"
      writers: [n09b_resolve_stage2_protocol]
      readers: [G6_stage2_ready, n13_train_stage2, n15b_resolve_composition_protocol, n18_train_ablations]
      merge: replace
      lifetime: persistent
      note: >
        [U-08a / U-08b RESOLVED 2026-08-16] Main line: gallery_scope = procthor,
        positive_identity = same_asset_id, modality_source = ai2thor_isolated,
        image_protocol = n04-compatible, pointcloud_source =
        multiview_depth_shell, query_pointcloud = optional.
        [FIELDS RENAMED] `pairing_method` was the single field describing how a
        ProcTHOR target reached an Objaverse gallery entry. There is no pairing
        under the resolution -- the positive is the target -- so the field named
        an operation that no longer happens, and G6 could not state what it
        needed to check. `gallery_scope` and `positive_identity` say the two
        things that actually vary, and the enums keep the rejected readings
        expressible so an ablation can record one and be seen to differ.
        [U-08d RESOLVED 2026-08-16] The sample-construction policy, which was
        missing entirely: U-08a said WHO the positive is and U-08b said where its
        modalities come from, but nothing said how a training tuple
        (G_context, Q_j, A_j+) is produced at all. Without it the DataLoader's
        defaults would have decided, silently, a question the paper leaves open.
          sampling_unit                  object_instance
          target_eligibility             the instance's assetId has an entry in
                                         procthor_asset_modalities
          target_removed_before_essgnn   true -- G_context is the house graph
                                         MINUS the target. Leaving it in lets
                                         ESSGNN see the answer, and the loss
                                         would fall without learning anything
                                         about compatibility.
          samples_per_house              all_eligible
          instance_resampling            fixed -- the sample set is enumerated
                                         once and recorded, so a rerun trains on
                                         the same tuples
          epoch_definition               one pass over the enumerated samples
          batch_positive_uniqueness      true  [U-08e]
        [U-08e] 665,320 train instances draw on 1,467 assets, so an assetId
        recurs constantly and Eq. 7's denominator would count it as a negative
        against itself. MEASURED: at batch 64, 99.3% of batches contain a
        duplicate positive; at 128 and above, 100%. The loss floor this creates
        is small (0.098 nats against log(64)=4.159) but the floor is not the
        harm -- a frozen encoder gives one assetId ONE embedding, so
        sim(q, g_dup) == sim(q, g_pos) exactly and the gradient asks the model
        to separate two identical vectors. The sampler admits each
        positive_asset_id at most once per batch; every instance is still used
        within an epoch.
        MEASURED: 827,730 object instances across the 12,000 houses, about
        662,000 of them in the 9,600 train houses. That is the sample count this
        policy implies, and it is recorded because "all eligible instances" is a
        very different training budget from "one target per house" (9,600).
        `query_pointcloud: optional` is 2.4's "any subset of modalities" applied
        to the one modality whose ProcTHOR version is not equivalent to the
        gallery's: n03 samples a complete mesh, the ProcTHOR side is a
        visible-hull depth shell, and the gallery encoder is frozen so PointBERT
        cannot adapt to the shift.

    - name: procthor_asset_modalities
      type: "map[procthor_asset_id -> {text, view_paths, view_bytes, pointcloud_uri, n_points, provenance: {ai2thor_version, build_hash, procthor_revision}}]"
      writers: [n07b_procthor_asset_modalities]
      readers: [G6_stage2_ready, n11b_stage2_gallery_index, n13_train_stage2, n18_train_ablations]
      merge: upsert_by_key
      lifetime: persistent
      note: >
        [U-08b RESOLVED 2026-08-16] The Stage 2 target's three modalities.
        Without this channel the resolution was a sentence in a document: n13
        would have had no way to obtain e_query for a ProcTHOR asset, and
        "Fridge_19 -> Fridge_19" would have named a positive nobody could encode.
        MEASURED (F24): AI2-THOR renders one asset in isolation under n04's
        protocol -- 11 orbital views, orthographic, 224x224, white background --
        once the house is stripped of doors, windows, walls and ceilings and the
        asset is lifted clear of the floor.
        The point cloud is NOT equivalent to n03's. n03 samples a complete mesh
        surface; this is a depth shell back-projected from the same 11 views, so
        it carries visible geometry only. The gallery encoder is frozen, so
        PointBERT cannot adapt to that shift -- which is why the query side may
        omit the point cloud entirely (2.4 permits any modality subset) and why
        `provenance` travels with every entry.

    - name: stage2_gallery_index
      type: "{uri, sha256, n_assets, asset_ids, embedding_dim, gallery_encoder_sha256, modality_completeness}"
      writers: [n11b_stage2_gallery_index]
      readers: [G6_stage2_ready, n13_train_stage2, n18_train_ablations]
      merge: write_once
      lifetime: persistent
      note: >
        [U-08a RESOLVED] The index Eq. 7a/7b actually reads. Separate from
        `gallery_index`, which is Stage 1's Objaverse index and stays exactly as
        it is -- Table 1's protocol must not move.
        `gallery_encoder_sha256` is the point of the channel: 2.6 says the
        gallery encoder is frozen during Stage 2, and freezing is only checkable
        if the weights that produced this index are pinned and compared against
        the Stage 1 checkpoint. An index built by a drifted encoder would train
        against embeddings the deployed model never produces, and nothing in the
        loss would reveal it.
        [U-08c] n_assets is DERIVED, never hard-coded. Four published or
        measured figures disagree (MetaFind 3,000+, ProcTHOR 1,633, this build's
        asset database 1,934, and 1,467 actually appearing in the 12,000
        houses), so the count is whatever the installed build yields, recorded
        with the provenance it came from.

    - name: stage2_positive_map
      type: "map[procthor_asset_id -> {positive_asset_id, gallery_scope: procthor|objaverse, method: identity|category_match|embedding_match, confidence}]"
      writers: [n09b_resolve_stage2_protocol]
      readers: [G6_stage2_ready, n13_train_stage2, n18_train_ablations]
      merge: write_once
      lifetime: persistent
      note: >
        [U-08a RESOLVED 2026-08-16] Main line: gallery_scope = procthor,
        method = identity, positive_asset_id == the target's own assetId.
        Fridge_19's positive is Fridge_19.
        [RENAMED] This channel was `stage2_pairing` and its type was
        `{gallery_uid, method, confidence}` -- a ProcTHOR-to-OBJAVERSE mapping.
        That schema encoded a premise the paper never states and that U-08a
        removed: 2.6 freezes the gallery ENCODER's weights and Eq. 7a/7b sum
        over the batch, so nothing binds the Stage 2 index to Objaverse.
        A `gallery_uid` field has no referent under the resolved decision, and
        leaving it would have let a reader rebuild the mapping the decision
        exists to avoid. `positive_asset_id` names the thing that is actually
        looked up in stage2_gallery_index.
        The other two methods stay in the enum so an ablation can record them
        and be seen to differ; they are pseudo-labels and are not the main line.

    - name: splits
      type: "{object: {train, test}}"
      writers: [n09_build_splits]
      readers: [G3_object_corpus, n10_train_stage1, n15_eval_retrieval, n18_train_ablations, n19_eval_ablations]
      merge: write_once
      lifetime: persistent
      note: >
        [PAPER 3.1] "80% of the data for training and reserve 20% for testing".
        [CORRECTED] Object-level only. An earlier draft put the ProcTHOR house
        split in the same channel, which forced n09 to read the ProcTHOR
        branch, which put Qwen semantic-edge generation on the critical path to
        Stage 1. Stage 1 is object-level pretraining on Objaverse-LVIS
        (paper 2.6) and does not need ProcTHOR at all. See scene_splits.

    - name: scene_splits
      type: "{train_houses, test_houses}"
      writers: [n09c_build_scene_splits]
      readers: [G6_stage2_ready, n13_train_stage2, n15c_prepare_eval_scenes, n18_train_ablations, n19_eval_ablations]
      merge: write_once
      lifetime: persistent
      note: >
        [PAPER 3.1] Same 80/20 statement, applied to ProcTHOR houses. House sets
        must be disjoint. An earlier draft additionally forbade an asset appearing
        in both a train and a test house; the paper does not ask for that, and
        ProcTHOR's 12,000 houses draw on ~1,467 assets, so enforcing it would
        change the scene distribution. Removed.
        [DECOUPLING] Split out of `splits` so that a failure anywhere in the
        ProcTHOR branch -- scene-graph extraction, Qwen semantic edges --
        cannot block Stage 1.

    - name: split_seed
      type: int
      writers: [n09_build_splits]
      readers: [n10_train_stage1, n13_train_stage2, n18_train_ablations, n22_publish_report]
      merge: write_once
      lifetime: persistent

    - name: eval_protocols
      type: "map[name -> {query_split, gallery_split, gallery_size, layout_free_context}]"
      writers: [n09_build_splits]
      readers: [G3_object_corpus, n15_eval_retrieval, n19_eval_ablations, n21_compare_to_paper]
      merge: write_once
      lifetime: persistent
      note: >
        [UNKNOWN U-09, CORRECTED] The paper says retrieval runs against a
        "pre-encoded asset database" and separately that 80/20 splits are used,
        without saying which the gallery is. An earlier draft locked a single integer and
        planned to back-solve it from the baselines' 98-99% PC-Only figure --
        impossible, since PC-Only uses a query embedding identical to its own
        gallery entry, so self-retrieval approaches 100% at either size. Both
        protocols now run:
          A_test_gallery: query=test, gallery=test   (~9,210)
          B_full_gallery: query=test, gallery=full   (46,052)
        [U-28] `layout_free_context` records what happens to Eq. 6's
        lambda * e_layout when Table 1 evaluates "MetaFind w/ ESSGNN" on
        Objaverse-LVIS, which has no scenes. Paper 3.2 acknowledges the
        situation ("feature-attribution mismatch when evaluating on layout-free
        datasets") without saying whether the term is omitted, zeroed or routed
        to a second head. The implementation omits it (QueryTower returns the
        fused vector when layout is None), which is a choice affecting 7 of
        Table 1's 14 MetaFind cells; recording it here stops it being silent.
        [WIDENED] U-09 covers the QUERY set too. Paper 3.1 states only
        "80% of the data for training and reserve 20% for testing"; it never
        says Table 1's queries are the 20% test split. Both protocols above
        assume query=test. That assumption is recorded here, not deduced.

    - name: stage1_ckpt
      type: "{uri, sha256, config_hash, data_hash, seed, code_revision, train_scope, trainable_only: true, n_params_saved, size_bytes}"
      note: >
        [DISK, recorded before it bites] `trainable_only` is not bookkeeping.
        torch.save(model.state_dict()) on the dual tower writes ViT-bigG-14 too:
        2.5B parameters at 10.2 GB, frozen, reconstructible from the pinned
        OpenCLIP weights. The parameters that actually move are PointBERT
        (32.5M), the projection and the fusion modules -- about 170 MB.
        Table 3 has ten variants plus the main line, so the difference is
        1.9 GB against 112 GB, and $METAFIND_DATA is a SHARED volume with 374 GB
        free. A checkpoint that includes the frozen tower is also misleading in
        a second way: it looks like a self-contained artifact while silently
        depending on the same pinned weights anyway.
        `n_params_saved` travels with it so the claim is checkable rather than
        asserted by a filename.
      writers: [n10_train_stage1]
      readers: [G6_stage2_ready, n10b_post_stage1_encode, n11_gallery_index_staging, n11b_stage2_gallery_index, n13_train_stage2, n18_train_ablations]
      merge: write_once
      lifetime: persistent

