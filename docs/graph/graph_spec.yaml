# --- what `reads` means versus what an edge `carries` -----------------------
# These were being used interchangeably, which left two different availability
# semantics in one graph. They are now distinct and each has its own check:
#
#   edge.carries  the JOIN contract -- what must ARRIVE before the node fires.
#                 Checked by the join policies below.
#   node.reads    what the node may ACCESS. Every one of these must be written
#                 by a dependency ANCESTOR (check 8b3, NODE-READ-ANCESTOR), so
#                 availability follows from the DAG rather than from where the
#                 execution_order table happens to put things.
#
# Gates carry the stricter obligation: every channel a gate reads must ALSO
# arrive on an incoming edge (check 8b2). A gate issues a terminal verdict from
# evidence, so it must decide on what it was handed and must not reach into
# ambient state -- otherwise the record cannot say what the verdict was based
# on. Ordinary nodes have no such requirement; requiring it of them would mean
# restating every long-lived channel on every edge that passes near it.
#
# [WHY THIS IS WRITTEN DOWN] Four ordinary nodes declared reads whose writers
# were not ancestors -- n09b (scene_graphs, from a G3 that is deliberately
# decoupled from the ProcTHOR branch), n13 and n18 (post_stage1_embeddings,
# with n10b absent from depends_on), n15b and n15c (scene_graphs,
# stage2_protocol, scene_splits). Each worked only because the layering put
# the writer earlier. Scheduling that happens to be right is not a contract.

# J1 -- every fan-in declared explicitly; no runtime default is inherited
join_policies:
  - node: n09_build_splits
    groups: [{name: pointclouds, policy: all, k: null}, {name: stage1_text_image, policy: any, k: null}]
    trigger: all_groups_satisfied
    rationale: >
      Point clouds are required unconditionally. The text/image side arrives by
      exactly one of two mutually exclusive guarded routes (e11 under `frozen`,
      e11b under `trainable`), so that group is `any` -- but the trigger is
      `all_groups_satisfied`, because dropping either group would let a split be
      computed from part of the data, which is wrong rather than partial.
      [CORRECTED] This was one `all` group over both edges, which made the
      `trainable` reading of U-34 structurally unreachable.
  - node: n09c_build_scene_splits
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "Scene graphs and semantic edges must both be complete for the same reason."
  - node: G3_object_corpus
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "A gate needs complete evidence."
  - node: sg1_reduce
    groups: [{name: default, policy: all_settled, k: null}]
    trigger: any_group_satisfied
    rationale: "Must know WHICH assets failed. The gallery denominator changes with the admitted set, and R@k changes meaning with it."
  - node: sg2_reduce
    groups: [{name: default, policy: all_settled, k: null}]
    trigger: any_group_satisfied
    rationale: "Same as sg1_reduce."
  - node: n15_eval_retrieval
    groups:
      - {name: default, policy: all, k: null}
      - {name: embeddings, policy: all, k: null}
    trigger: all_groups_satisfied
    rationale: "Needs the promoted index, both headline variants, AND the post-Stage-1 text/image embeddings -- Table 1's query side is built from them, and under actual=trainable they are the only place the trained CLIP's output exists."
  - node: n13_train_stage2
    groups:
      - {name: default, policy: all, k: null}
      - {name: protocol, policy: all, k: null}
      - {name: embeddings, policy: all, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Stage 2 needs both the Stage 1 checkpoint and a RESOLVED Stage 2 protocol.
      Separating the groups makes the protocol a hard precondition rather than
      something the trainer discovers missing at runtime.
  - node: G6_stage2_ready
    groups:
      - {name: default, policy: all, k: null}
      - {name: corpus, policy: all, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Two independent preconditions for one spend: the protocol decision
      (n09b) and the scene corpus (n09c). Keeping them in separate groups is
      what lets the gate report BLOCKED_EVIDENCE for the first and FAIL for the
      second instead of collapsing both into one verdict.
  - node: n16_compose_scenes
    groups:
      - {name: default, policy: all, k: null}
      - {name: protocol, policy: all, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Same discipline as n13: the composition protocol and the 200 evaluation
      scenes are a hard precondition, not something SG4 discovers missing on
      iteration one.
  - node: n19_eval_ablations
    groups:
      - {name: default, policy: all, k: null}
      - {name: protocol, policy: all_settled, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Table 3's R@1 column needs only the checkpoints; its two scene columns
      need the composition protocol. all_settled on the protocol group lets the
      R@1 column be produced when I-Design is unavailable (R-01), with the scene
      columns marked INSUFFICIENT_EVIDENCE.

  - node: n20_aggregate
    groups:
      - {name: core, policy: all, k: null}
      - {name: extended, policy: all_settled, k: null}
    trigger: all_groups_satisfied
    rationale: >
      Table 1 and the Table-2 model-judged column are mandatory; Table 3 may
      legitimately be partial, and a missing member there only narrows the claim.
      Using `all` everywhere would let one failed ablation block the report;
      using `all_settled` everywhere would let a missing Table 1 cell pass.
      [CONSEQUENCE, STATED EXPLICITLY] `core` includes n17, so a BLOCKED G7 or
      an unavailable scene source stops the REPORT, not just Table 2. Table 1
      is still computed -- n15 does not pass through G7 -- but it cannot be
      published while Table 2 is outstanding. Documentation that said
      "everything else proceeds as normal" was misleading about this.
      To publish Table 1 alone, n17 must emit an explicit
      INSUFFICIENT_EVIDENCE terminal record rather than nothing, and this group
      must accept it; that is a policy change, not a bug fix, and is not made
      here.
  - node: sg4_fuse
    groups: [{name: default, policy: all, k: null}]
    trigger: any_group_satisfied
    rationale: "Eq. 6 needs both the layout term and the fused query."
  - node: sg4_encode_layout
    groups:
      - {name: init, policy: any, k: null}
      - {name: loop_back, policy: any, k: null}
    trigger: any_group_satisfied
    rationale: "E4 -- the Algorithm 1 feedback edge must not share a group with the initial edge, or the cycle deadlocks."
  - node: sg1_generate
    groups: [{name: init, policy: any, k: null}, {name: repair, policy: any, k: null}]
    trigger: any_group_satisfied
    rationale: "E4 -- the C1 repair edge gets its own group."
  - node: sg2_generate
    groups: [{name: init, policy: any, k: null}, {name: repair, policy: any, k: null}]
    trigger: any_group_satisfied
    rationale: "E4 -- the C2 repair edge gets its own group."

dependencies:
  dag:
    - {node: n01_env_bootstrap, depends_on: []}
    - {node: n02_download, depends_on: [n01_env_bootstrap]}
    - {node: G1_sources_valid, depends_on: [n02_download]}
    - {node: n03_sample_pointclouds, depends_on: [G1_sources_valid]}
    - {node: n04_render_views, depends_on: [G1_sources_valid]}
    - {node: n07_scene_graphs, depends_on: [G1_sources_valid]}
    - {node: G2_pc_sanity, depends_on: [n03_sample_pointclouds]}
    - {node: n05_annotate, depends_on: [n04_render_views]}
    - {node: n08_semantic_edges, depends_on: [n07_scene_graphs]}
    - {node: n05b_resolve_stage1_encoding, depends_on: [n05_annotate]}
    - {node: n06_encode_text_image, depends_on: [n05b_resolve_stage1_encoding]}
    # [CORRECTED] n08_semantic_edges was still listed here after the branch split.
    # The edges and n09's reads had been decoupled, but this line had not, so the
    # machine-readable dependency still said Stage 1 waits for Qwen semantic-edge
    # generation over ProcTHOR. Two of the three places were fixed; this was the third.
    - node: n09_build_splits
      depends_on: [G2_pc_sanity, n05b_resolve_stage1_encoding]
      # [SCHEMA EXTENDED] n06 cannot be a plain dependency. Under
      # actual_clip_train_scope == trainable it does not run at all, so a
      # scheduler reading `depends_on` literally would wait forever for a node
      # that was never going to start. The previous version listed it anyway
      # and explained in prose that it was "for ORDERING only" -- a comment
      # cannot be executed, and the set-equality DAG check passed because the
      # guarded edge exists.
      conditional_depends_on:
        - {node: n06_encode_text_image, when: "stage1_encoding_protocol.actual_clip_train_scope == 'frozen'"}
    - {node: G3_object_corpus, depends_on: [n09_build_splits]}
    - {node: n10_train_stage1, depends_on: [G3_object_corpus]}
    - {node: n10b_post_stage1_encode, depends_on: [n10_train_stage1]}
    - {node: n11_gallery_index_staging, depends_on: [n10_train_stage1, n10b_post_stage1_encode]}
    - {node: G4_gallery_freeze, depends_on: [n11_gallery_index_staging]}
    - {node: n12_promote_index, depends_on: [G4_gallery_freeze]}
    - {node: n09b_resolve_stage2_protocol, depends_on: [G3_object_corpus, n07_scene_graphs]}
    - {node: n09c_build_scene_splits, depends_on: [n07_scene_graphs, n08_semantic_edges]}
    - {node: G6_stage2_ready, depends_on: [n09b_resolve_stage2_protocol, n09c_build_scene_splits]}
    - {node: n13_train_stage2, depends_on: [n10_train_stage1, n10b_post_stage1_encode, G6_stage2_ready]}
    - {node: n14_equivariance_probe, depends_on: [n13_train_stage2]}
    - {node: n15_eval_retrieval, depends_on: [n12_promote_index, n13_train_stage2, n10b_post_stage1_encode]}
    - {node: n15b_resolve_composition_protocol, depends_on: [n12_promote_index, n09b_resolve_stage2_protocol, n07_scene_graphs]}
    - {node: G7_composition_protocol, depends_on: [n15b_resolve_composition_protocol]}
    - {node: n15c_prepare_eval_scenes, depends_on: [G7_composition_protocol, n09c_build_scene_splits]}
    - {node: n16_compose_scenes, depends_on: [n12_promote_index, n13_train_stage2, n15c_prepare_eval_scenes]}
    - {node: n17_judge_scenes, depends_on: [n16_compose_scenes]}
    - {node: n18_train_ablations, depends_on: [n15_eval_retrieval, n10b_post_stage1_encode]}
    - {node: n19_eval_ablations, depends_on: [n18_train_ablations, n15c_prepare_eval_scenes]}
    - {node: n20_aggregate, depends_on: [n15_eval_retrieval, n17_judge_scenes, n14_equivariance_probe, n19_eval_ablations]}
    - {node: n21_compare_to_paper, depends_on: [n20_aggregate]}
    - {node: G5_report_release, depends_on: [n21_compare_to_paper]}
    - {node: n22_publish_report, depends_on: [G5_report_release]}

  feedback_edges: [fb_annot, fb_semedge, fb_compose]
  feedback_note: "Main line contains ZERO feedback edges. All cycles live inside subgraphs."

  v1_dependency_bug: >
    An earlier draft scheduled the baseline node parallel with data preparation, reasoning that
    baselines do not depend on MetaFind training. They do depend on the admitted
    asset set, the preprocessing, the split and the gallery protocol -- without
    those, baseline and MetaFind are not on the same evaluation protocol. It
    could at most have run parallel to n10, never to n03. The node is removed
    entirely under D-3.

# ---------------------------------------------------------------- routing
routing:
  - {decision_point: G1_sources_valid, authority: A1, owner: edge, inputs: [manifest_count, glb_coverage, ckpt_behaviour], destinations: [n03_sample_pointclouds, n04_render_views, n07_scene_graphs, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: manifest_count, from: asset_manifest}, {name: glb_coverage, from: asset_glb}, {name: ckpt_behaviour, from: pretrained_weights}]}
  - {decision_point: G2_pc_sanity, authority: A1, owner: edge, inputs: [cloud_shape, finiteness, centroid_offset, max_radius, per_axis_variance, self_retrieval_rank], destinations: [n09_build_splits, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: cloud_shape, from: pointclouds}, {name: finiteness, from: pointclouds}, {name: self_retrieval_rank, from: pointclouds}]}
  - {decision_point: G3_object_corpus, authority: A1, owner: edge, inputs: [leakage_count, admitted_size, quarantine_rate, eval_protocols, "stage1_encoding_protocol.status", "stage1_protocol.status"], destinations: [n10_train_stage1, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: leakage_count, from: splits}, {name: admitted_size, from: splits}, {name: quarantine_rate, from: quarantine}]}
  - {decision_point: G4_gallery_freeze, authority: A1, owner: edge, inputs: [index_dim, index_count, nan_count, zero_vector_count, target_is_argmax, target_in_tie_set], destinations: [n12_promote_index, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: index_dim, from: gallery_index_staging}, {name: index_count, from: gallery_index_staging}, {name: nan_count, from: gallery_index_staging}, {name: zero_vector_count, from: gallery_index_staging}, {name: target_is_argmax, from: gallery_index_staging}, {name: target_in_tie_set, from: gallery_index_staging}]}
  - {decision_point: G6_stage2_ready, authority: A1, owner: edge, inputs: ["stage2_protocol.status", stage2_pairing, "essgnn_edge_protocol.status", "essgnn_arch_protocol.status", scene_splits], destinations: [n13_train_stage2, HALT_BLOCKED], default_destination: HALT_BLOCKED, derived_inputs: []}
  - {decision_point: G7_composition_protocol, authority: A1, owner: edge, inputs: [composition_protocol.status, composition_protocol.source, g0_source, query_list_source, placement_rule, new_node_t_i, new_phys_edges, new_sem_edges], destinations: [n15c_prepare_eval_scenes, HALT_BLOCKED], default_destination: HALT_BLOCKED, derived_inputs: []}
  - {decision_point: G5_report_release, authority: A1, owner: edge, inputs: [verdict_completeness, report_sha256_matches, comparison_results, report_staging, gate_records, audit_records, degraded_flags], destinations: [n22_publish_report, HALT_FAILED], default_destination: HALT_FAILED, derived_inputs: [{name: verdict_completeness, from: comparison_results}, {name: report_sha256_matches, from: report_staging}]}
  - {decision_point: sg1_admit_or_repair, authority: A1, owner: edge, inputs: [schema_valid, item_attempt], destinations: [sg1_admit, sg1_generate, sg1_quarantine], default_destination: sg1_quarantine}
  - {decision_point: sg2_cache_lookup, authority: A1, owner: edge, inputs: ["sem_edge_cache.contains(hash)"], destinations: [use_cache, call_llm], default_destination: call_llm}
  - {decision_point: sg3_train_scope, authority: A1, owner: edge, inputs: ["variant.train_scope"], destinations: [fuser_only, point_encoder_and_fuser, full], default_destination: point_encoder_and_fuser}
  - {decision_point: sg4_advance, authority: A1, owner: edge, inputs: [placed_count, n_queries, wallclock], destinations: [sg4_encode_layout, DONE, EXHAUSTED], default_destination: EXHAUSTED}
  - {decision_point: sg4_mode, authority: A1, owner: edge, inputs: ["variant.composition_mode"], destinations: [iterative, parallel, region], default_destination: iterative}

static_fanouts:
  - {name: render_views, cardinality: 11, source: "paper 2.3", bound: 11}
  - {name: modality_conditions, cardinality: 7, source: "paper Table 1 columns", bound: 7}
  - {name: eval_protocols, cardinality: 2, source: "U-09 -- both readings run", bound: 2}
  - {name: headline_variants, cardinality: 2, source: "paper Table 1 last two rows", bound: 2}
  - {name: ablation_variants, cardinality: 8, source: "paper Table 3 has 10 rows: 1 is Full itself, 1 (w/o iterative retrieval) is inference-only, leaving 8 that require training", bound: 9}
  - {name: assets, cardinality: "len(asset_manifest)", source: "manifest, currently 46052", bound: 60000, over_bound_action: truncate_and_record}
  - {name: eval_scenes, cardinality: 200, source: "paper 3.3", bound: 200}
static_fanouts_note: >
  Every fan-out is statically enumerated, which is why max_authority is A1.
  Asset cardinality is len(manifest), never a literal 48000 (U-01, L1-MANIFEST).

# ---------------------------------------------------------------- loops
loops:
  - id: C1
    name: annotation_repair
    location: SG1
    progress_measure: "item_attempt"
    semantic_exit: "annotation passes structured schema validation"
    hard_bound: {iterations: 2, wallclock_s: 120}
    exhaustion_outcome: "quarantine the asset"
    exhaustion_marker: "terminated_by: repair_budget"
    iteration_channels_reset: [item_attempt, annotation_error_feedback]
    note: "An exhausted repair is NOT a successful annotation; the asset leaves the admitted set."

  - id: C2
    name: semantic_edge_repair
    location: SG2
    progress_measure: "item_attempt"
    semantic_exit: "relation sentence non-empty and encodable"
    hard_bound: {iterations: 2, wallclock_s: 60}
    exhaustion_outcome: "mark the edge semantic_edge_missing, degrade to geometry-only"
    exhaustion_marker: "degraded_flags += semantic_edge_missing"
    iteration_channels_reset: [item_attempt]
    note: "Must NOT zero-fill; a zero vector is indistinguishable downstream from a valid semantic edge."

  - id: C3
    name: iterative_composition
    location: SG4
    progress_measure: "placed_count (merge=max, so retries never double-count)"
    semantic_exit: "placed_count == n_queries"
    hard_bound: {iterations: 25, wallclock_s: 600, external_calls: 30}
    hard_bound_provenance: >
      OUR budget choices. The paper states no per-scene object limit, time
      limit or call limit, and F12 measures ProcTHOR houses at 69 objects on
      average (245 maximum), well above 25 -- so this bound is not derived from
      the data either. It caps a scene we are willing to pay for.
    exhaustion_outcome: "scene marked incomplete and added to composition_incomplete"
    exhaustion_marker: "terminated_by: object_budget"
    iteration_channels_reset: [layout_embedding, query_modality_embeds]
    note: >
      Incomplete scenes are excluded from the Table 2 mean, which introduces
      selection bias in our favour if difficulty correlates with exhaustion.
      The completion rate and the counts are therefore reported alongside every
      mean; see composed_scenes. Above 10% incomplete the stage fails -- also
      our threshold, not the paper's.

termination:
  states:
    SUCCESS: "SC-1..SC-8 met, G5 PASS, report published"
    FAILED: "a gate FAILed and diagnosis confirms it is unrecoverable"
    EXHAUSTED: "budget exhausted with core tables incomplete; carries terminated_by=budget"
    BLOCKED: "awaiting an external input (e.g. I-Design access). RESUMABLE, not a failure."
  terminal_nodes: [n22_publish_report, HALT_FAILED, HALT_BLOCKED]

