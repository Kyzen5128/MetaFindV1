risks_unknowns:
  - id: R-01
    item: "Only 108GB disk free (3.6T at 98%)"
    marked: RISK
    affects_decision: "D3 streaming architecture; G1 criterion"
    missing_information: "none — measured"
    resolution: "free space or attach external storage"
    fallback_if_unresolved: "shrink shard to 500 assets; BLOCKED between shards awaiting space"

  - id: R-02
    item: "Single 24GB GPU vs the paper's 8-GPU script"
    marked: RISK
    affects_decision: "D1 and D2"
    missing_information: "none — measured"
    resolution: "not resolvable (hardware)"
    fallback_if_unresolved: "D2 cached-embedding architecture; if contrastive batch is still too small, use gradient caching and declare it"

  - id: R-03
    item: "Using the released ULIP-2 checkpoint instead of pretraining it (D1)"
    marked: ASSUMPTION
    affects_decision: "absolute values in Table 1"
    missing_information: "how much of the paper's numbers depend on their own pretraining run"
    resolution: "would need 8xA100"
    fallback_if_unresolved: "declare as a deviation in the report; SC-1's +/-3pp tolerance already accounts for it"

  - id: R-04
    item: "Frozen backbone (D2) prevents full verification of Table 3 row 9"
    marked: ASSUMPTION
    affects_decision: SC-6
    missing_information: "none"
    resolution: "same as R-03"
    fallback_if_unresolved: "Required Audit RA-3 narrows the claim"

  - id: R-05
    item: "I-Design pipeline may be unobtainable or unrunnable"
    marked: RISK
    affects_decision: "the entire scene-level evaluation (Tables 2 and 3)"
    missing_information: "I-Design availability and per-call latency"
    resolution: "trial-run I-Design early (do this during layer 2)"
    fallback_if_unresolved: "ProcTHOR native layout + degraded flag; if still unusable, Tables 2/3 => BLOCKED_EVIDENCE (rc=3), NOT FAIL"

  - id: R-06
    item: "GPT-4o annotation cost extrapolation may underestimate"
