# MetaFind reproduction — Graph Specification
# Framework-independent. Maps 1:1 to SKILL.md §15 items 1,2,3,5,6,7,8,13,14,15.
# Human-readable companion: 01_GRAPH_SPEC.md   Findings that drove this: 00_FINDINGS.md

spec_version: "1.0"
graph_id: "metafind-reproduction-v1"
title: "MetaFind paper reproduction pipeline (single RTX 4090)"
authored_at: "2026-08-14"
authored_by: "graph-engineering skill, §5 15-step process"

# ---------------------------------------------------------------- §15.1
classification:
  shapes: [hierarchical, dag, stateful, parallel, conditional, cyclic]
  shapes_note: >
    Main line is a strict DAG with zero feedback edges. All three cycles are
    confined to subgraphs (SG1 annotation repair, SG2 semantic-edge repair,
    SG4 Algorithm-1 composition). A fourth cycle (budget re-approval) is an
    escalation loop through a human node.

  max_authority: "A1"
  max_authority_reason: >
    No decision point anywhere in the graph lets a model choose the next node.
    GPT-4o appears three times (asset annotation, semantic edge generation,
    scene judging) but each time it only produces a PAYLOAD written into state;
    routing is always a deterministic predicate over state (schema valid?
    score >= threshold? i < N?). Per terminology.md: "agentic is about control
    authority, not about whether a model is used".

  execution_mode: "probabilistic"
  execution_mode_reason: >
    Authority is <= A1 but node outputs are NOT reproducible, so the second
    condition for `deterministic` fails.

  topology_class: "workflow"
  topology_class_reason: >
    Entire graph <= A2, no A4 autonomous loop, and every fan-out has a
    STATICALLY ENUMERATED destination set (7 modality conditions, 6 baselines,
    10 ablation variants, 11 render views, 24 asset shards, 5 annotators).
    Even the 48K-asset fan-out is a map over an existing catalog, not a
    model-decided partition — so it is not A3.

  nondeterminism_sources:
    - id: NS-1
      source: "GPT-4o sampling (asset annotation)"
      frozen_by: "annotation written once into a versioned artifact; never re-called downstream"
    - id: NS-2
      source: "GPT-4o sampling (semantic relation sentences)"
      frozen_by: "sem_edge_cache keyed by (category_a, category_b), persistent across runs"
    - id: NS-3
      source: "GPT-4o sampling (scene judging)"
      frozen_by: "temperature=0 + pinned prompt version + recorded model snapshot id"
    - id: NS-4
      source: "human annotator subjectivity"
      frozen_by: "raw per-annotator per-scene scores persisted; never averaged-then-discarded"
    - id: NS-5
      source: "GPU atomics in scatter_add_ (egnn_clean.py:149-154)"
      frozen_by: "NOT fully removable; equivariance test uses 1e-4 numeric tolerance, not exact"
    - id: NS-6
      source: "approximate nearest neighbour search"
      frozen_by: "ELIMINATED — 48K x 1280 x 4B = 246MB, exact inner product is affordable"
    - id: NS-7
      source: "dataloader shuffling / parallel arrival order at fan-in"
      frozen_by: "fixed seeds; all reduces use commutative merge policies"

  runtime_candidates: [LangGraph, Prefect, plain-python-with-checkpoints]
  runtime_note: "Informational only. This spec must not depend on any of these."

# ---------------------------------------------------------------- §15.2
goal:
  statement: >
    Build MetaFind from scratch on a single RTX 4090 and produce results that can
    be compared cell-by-cell against paper Tables 1, 2 and 3, giving every cell
    exactly one of three verdicts: REPRODUCED / NOT_REPRODUCED / INSUFFICIENT_EVIDENCE.
  consumers:
    - "readers of the reproduction report"
    - "future work building on MetaFind"
    - "reviewers checking the paper's claims"

  success_criteria:
    - id: SC-1
      criterion: "All 14 MetaFind cells of Table 1 produced; R@1 within +/-3.0 absolute percentage points of the paper"
      measured_by: n20_compare_to_paper
      tolerance: "3.0 pp"
    - id: SC-2
      criterion: "Relative ordering holds: MetaFind beats every baseline on Text/Image/T+I/T+PC/I+PC/T+I+PC"
      measured_by: n20_compare_to_paper
      tolerance: "strict inequality"
    - id: SC-3
      criterion: "PC-Only INVERSION reproduced: MetaFind (63-75) is LOWER than baselines (98-99)"
      measured_by: n20_compare_to_paper
      tolerance: "direction only"
      note: "A naive success criterion would call this cell a failure. Reproducing the paper means reproducing its regressions."
    - id: SC-4
      criterion: "Table 2: w/ESSGNN > w/oESSGNN on all four dimensions, in BOTH the GPT-4o and human columns"
      measured_by: n20_compare_to_paper
      tolerance: "direction + gap >= 0.3"
    - id: SC-5
      criterion: "SE(3) equivariance holds: coord channel L-inf error < 1e-4 and h channel exactly invariant"
      measured_by: n11_equivariance_probe
      tolerance: "1e-4"
    - id: SC-6
      criterion: "Four Table-3 takeaways reproduced by direction (ESSGNN>GAT, iterative>non-iterative, dropout 30% best, masked>zero-pad)"
      measured_by: n20_compare_to_paper
      tolerance: "direction only"
    - id: SC-7
      criterion: "Resume equivalence: killing any stage mid-run and restarting yields byte-identical artifacts"
      measured_by: L2-RESUME
      tolerance: "exact"
    - id: SC-8
      criterion: "Total spend stays within the cap approved at G1"
      measured_by: cost_ledger
      tolerance: "hard cap"

boundary:
  in_scope:
    - "ULIP-2 backbone integration (frozen)"
    - "dual-tower query/gallery encoders + modality-aware fusion"
    - "ESSGNN layout encoder"
    - "two-stage training (alignment pretrain, layout fine-tune)"
    - "Objaverse-LVIS and ProcTHOR-10K data pipelines"
    - "Tables 1, 2, 3"
    - "SE(3) equivariance verification"
    - "reproduction report"
  out_of_scope:
    - "pretraining ULIP-2 itself (decision D1 — use released checkpoint)"
    - "reproducing the I-Design scene generator (treated as external black box)"
    - "paper section 4 future work (RL, open-world dynamic catalogs)"
    - "any improvement beyond what the paper claims"

  external_systems:
    - name: "HuggingFace SFXX/ulip"
      kind: model_provider
      owner: Salesforce
      failure_semantics: "unavailable => whole reproduction FAILED, no substitute exists"
      trust: trusted
      validated_by: "sha256 + L1-SRC-LOAD behavioural check (ModelNet40 top-1 ~= 50.6)"
    - name: "Objaverse / Objaverse-LVIS"
      kind: database
      owner: AI2
      failure_semantics: "partial unavailability => admitted_set shrinks => gallery denominator must be recomputed"
      trust: trusted
    - name: "ProcTHOR-10K"
      kind: database
      owner: AI2
      failure_semantics: "unavailable => Tables 2 and 3 become BLOCKED_EVIDENCE (rc=3), not FAILED"
      trust: trusted
    - name: "OpenAI GPT-4o"
      kind: model_provider
      owner: OpenAI
      failure_semantics: "429 => backoff retry; schema violation => repair loop; price change => BLOCKED pending re-approval"
      trust: untrusted
      validated_by: "every response passes structured schema validation before entering state"
    - name: "5 expert human annotators"
      kind: human
      owner: "this project"
      failure_semantics: "timeout => BLOCKED (NOT FAILED); <4 complete => Table 2 human column BLOCKED_EVIDENCE"
      trust: trusted
    - name: "I-Design pipeline"
      kind: api
      owner: third_party
      failure_semantics: "unavailable => degrade to ProcTHOR native layout + degraded flag; if still unusable => Tables 2/3 BLOCKED_EVIDENCE"
      trust: untrusted

  trust_boundary: >
    GPT-4o output and I-Design output must pass schema validation before entering
    state. Violations are DETERMINISTIC_INPUT -> quarantine, and must never be
    written directly into a shared immutable artifact.

# ---------------------------------------------------------------- §15.3
state:
  channels:
    # ---- sources and provenance
    - name: source_manifest
      type: "map[str -> {uri, sha256, bytes}]"
      writers: [n02_acquire_sources]
      readers: [n01_env_bootstrap, n04_object_prep, n05_scene_prep, n07_train_stage1_align, n21_publish_report]
      merge: write_once
      lifetime: persistent
      visibility: internal
      note: "Immutable identity of every external input. Mismatch => CONTRACT_VIOLATION, fail closed."

    - name: asset_catalog
      type: "list[{asset_id, mesh_uri, sha256, source}]"
      writers: [n02_acquire_sources]
      readers: [n03_pilot_and_budget, n04_object_prep, n06_build_splits]
      merge: write_once
      lifetime: persistent
      visibility: internal

    - name: procthor_raw
      type: "{uri, sha256, house_count}"
      writers: [n02_acquire_sources]
      readers: [n05_scene_prep]
      merge: write_once
      lifetime: persistent
      visibility: internal

    # ---- pilot / budget
    - name: cost_projection
      type: "{money, gpu_hours, bytes, seconds, schema_pass_rate}"
      writers: [n03_pilot_and_budget]
      readers: [G1_feasibility, n22_budget_approval]
      merge: write_once
      lifetime: run
      visibility: internal
      note: "Extrapolated from a 500-asset pilot. UNKNOWN is not allowed here — G1 checks it."

    - name: budget_cap
      type: "{money, gpu_hours, human_minutes}"
      writers: [n22_budget_approval]
      readers: [G1_feasibility, G4_human_study_commit, cost_ledger_monitor]
      merge: replace
      lifetime: persistent
      visibility: input
      note: "Single writer, so replace is legal. NEVER raised to make a gate green (GE)."

    # ---- object prep (SG1)
    - name: asset_artifacts
      type: "map[asset_id -> {render_uris[11], pc_uri, annotation_uri, sha256s}]"
      writers: [sg1_worker]
      readers: [sg1_encode, n04_object_prep]
      merge: upsert_by_key
      merge_note: "N parallel shard workers. Key = asset_id, so writes are disjoint and commutative."
      lifetime: persistent
      visibility: internal
      note: "S7 — large artifacts stored as {uri, sha256, bytes, content_type}, never inline."

    - name: asset_embeddings
      type: "map[asset_id -> {text_uri, image_uri, pc_uri, sha256, dim:1280}]"
      writers: [sg1_encode]
      readers: [n07_train_stage1_align, n08_build_gallery_staging, n10_train_headline, n17_train_ablations]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal
      note: "Decision D2 — the whole point. 48K x 3 x 1280 x 4B ~= 737MB, trains on a single 4090."

    - name: asset_admitted
      type: "set[asset_id]"
      writers: [sg1_reduce]
      readers: [n06_build_splits, G2_corpus_validity, n08_build_gallery_staging]
      merge: set_union
      lifetime: persistent
      visibility: internal

    - name: asset_quarantine
      type: "list[{asset_id, source_uri, sha256, failure_class, exception_type, exception_msg, attempt, code_revision, timestamp}]"
      writers: [sg1_worker]
      readers: [G2_corpus_validity, n21_publish_report]
      merge: append
      lifetime: persistent
      visibility: internal
      note: "F3 — without the real exception recorded per item, a 300-asset shortfall is undiagnosable forever."

    # ---- scene prep (SG2)
    - name: scene_store
      type: "map[house_id -> {nodes, positions, phys_edges, sem_edge_ids, uri, sha256}]"
      writers: [sg2_worker]
      readers: [n06_build_splits, n10_train_headline, n14_compose_scenes]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal

    - name: sem_edge_cache
      type: "map[(category_a, category_b) -> {sentence, embedding_uri, sha256}]"
      writers: [sg2_worker]
      readers: [sg2_worker, n05_scene_prep]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal
      note: >
        Cost lever. Without cache ~1.9M LLM calls; with cache ~50K. About 40x.
        Persistent ACROSS runs, so re-runs are nearly free.

    - name: scene_admitted
      type: "set[house_id]"
      writers: [sg2_reduce]
      readers: [n06_build_splits, G2_corpus_validity]
      merge: set_union
      lifetime: persistent
      visibility: internal

    - name: scene_quarantine
      type: "list[record]"
      writers: [sg2_worker]
      readers: [G2_corpus_validity]
      merge: append
      lifetime: persistent
      visibility: internal

    # ---- splits (the integrity core)
    - name: split_seed
      type: int
      writers: [n06_build_splits]
      readers: [n07_train_stage1_align, n10_train_headline, n17_train_ablations, n21_publish_report]
      merge: write_once
      lifetime: persistent
      visibility: internal

    - name: splits
      type: "{object: {train_ids, test_ids}, scene: {train_houses, test_houses}}"
      writers: [n06_build_splits]
      readers: [n07_train_stage1_align, n10_train_headline, n12_eval_object_retrieval, n13_run_baselines, n17_train_ablations]
      merge: write_once
      lifetime: persistent
      visibility: internal
      note: "Leakage is G-INVALID. Once decided, immutable — otherwise no number is comparable."

    - name: gallery_size_locked
      type: int
      writers: [n06_build_splits]
      readers: [G2_corpus_validity, G3_gallery_freeze, n12_eval_object_retrieval, n13_run_baselines, n20_compare_to_paper]
      merge: write_once
      lifetime: persistent
      visibility: internal
      note: >
        U-04 is the one unknown that, if guessed wrong, makes all of Table 1
        meaningless. Locking it write_once turns a silent assumption into a
        recorded decision; a second differing write is an error, not an overwrite.

    # ---- training artifacts
    - name: stage1_ckpt
      type: "{uri, sha256, config_hash, data_hash, seed, code_revision}"
      writers: [n07_train_stage1_align]
      readers: [n08_build_gallery_staging, n10_train_headline, n17_train_ablations]
      merge: write_once
      lifetime: persistent
      visibility: internal
      note: "Content-addressed path => never overwrites => naturally idempotent under retry."

    - name: gallery_index_staging
      type: "map[stage1_sha -> {uri, sha256, dim, count}]"
      writers: [n08_build_gallery_staging]
      readers: [G3_gallery_freeze, n09_promote_gallery_index]
      merge: upsert_by_key
      lifetime: run
      visibility: internal

    - name: gallery_index
      type: "map[stage1_sha -> {uri, sha256, dim, count, promoted_at}]"
      writers: [n09_promote_gallery_index]
      readers: [n12_eval_object_retrieval, n14_compose_scenes, n18_eval_ablations]
      merge: upsert_by_key
      merge_note: "write_once semantics PER KEY — a given stage1 checkpoint promotes exactly one index"
      lifetime: persistent
      visibility: internal
      note: "The immutable shared artifact everything downstream reads. Hence G3 is G-CONTAM."

    - name: variant_registry
      type: "list[{variant_id, fusion, dropout, layout_encoder, composition_mode, requires_stage1_retrain, table3_row}]"
      writers: [n02_acquire_sources]
      readers: [n10_train_headline, n17_train_ablations, n18_eval_ablations]
      merge: write_once
      lifetime: persistent
      visibility: input
      note: "STATIC registry of 10 variants. Declaring it in state is what makes the fan-out auditable and A1 rather than A3."

    - name: variant_ckpts
      type: "map[variant_id -> {uri, sha256, config_hash}]"
      writers: [sg3_train]
      readers: [n12_eval_object_retrieval, n14_compose_scenes, n18_eval_ablations]
      merge: upsert_by_key
      merge_note: "Parallel variant trainers write disjoint keys."
      lifetime: persistent
      visibility: internal

    - name: variant_status
      type: "map[variant_id -> {status: SUCCESS|FAILED|EXHAUSTED, reason}]"
      writers: [sg3_train]
      readers: [n18_eval_ablations, n19_aggregate_tables, n20_compare_to_paper]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal

    # ---- results
    - name: retrieval_metrics
      type: "map[(variant_id, condition) -> {R@1, R@5, n_gallery, n_query}]"
      writers: [n12_eval_object_retrieval, n18_eval_ablations]
      readers: [G4_human_study_commit, n19_aggregate_tables]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal

    - name: baseline_metrics
      type: "map[(baseline, condition) -> {R@1, R@5, n_gallery} | NA_DECLARED]"
      writers: [n13_run_baselines]
      readers: [n19_aggregate_tables, RA-2]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal
      note: "NA_DECLARED distinguishes 'baseline does not support this modality' from 'we failed to run it'."

    - name: equivariance_report
      type: "{coord_linf_err, h_exact_invariant, n_scenes, n_transforms, variant}"
      writers: [n11_equivariance_probe]
      readers: [G4_human_study_commit, n20_compare_to_paper]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal

    - name: composed_scenes
      type: "map[(variant_id, scene_id) -> {graph_uri, sha256, placed_count, incomplete}]"
      writers: [sg4_instance]
      readers: [n15_judge_gpt4o, n16_human_study, G4_human_study_commit]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal

    - name: composition_incomplete
      type: "set[(variant_id, scene_id)]"
      writers: [sg4_instance]
      readers: [G4_human_study_commit, n19_aggregate_tables]
      merge: set_union
      lifetime: persistent
      visibility: internal
      note: "L3 — EXHAUSTED scenes are EXCLUDED from Table 2 means and reported separately. Never silently averaged in."

    - name: gpt4o_scores
      type: "map[(method, scene_id, dimension) -> float]"
      writers: [n15_judge_gpt4o]
      readers: [n19_aggregate_tables]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal

    - name: human_scores
      type: "map[(annotator_hash, method, scene_id, dimension) -> float]"
      writers: [n16_human_study]
      readers: [n19_aggregate_tables]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal
      sensitive: true
      note: "B5 — annotator identity replaced by hash; the mapping table is never logged and never published."

    - name: human_study_status
      type: "map[annotator_hash -> {completed, total, last_activity}]"
      writers: [n16_human_study]
      readers: [n19_aggregate_tables, G4_human_study_commit]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal

    - name: paper_reference
      type: "map[(table, row, col) -> {value, tolerance}]"
      writers: [n02_acquire_sources]
      readers: [n20_compare_to_paper]
      merge: write_once
      lifetime: persistent
      visibility: input
      note: "Transcribed from docs/metafind_paper.md Tables 1/2/3. write_once so targets cannot drift to match results."

    - name: result_tables
      type: "{table1, table2, table3}"
      writers: [n19_aggregate_tables]
      readers: [n20_compare_to_paper, G5_report_release, n21_publish_report]
      merge: write_once
      lifetime: run
      visibility: output

    - name: reproduction_verdicts
      type: "map[(table, row, col) -> {verdict: REPRODUCED|NOT_REPRODUCED|INSUFFICIENT_EVIDENCE, observed, expected, delta}]"
      writers: [n20_compare_to_paper]
      readers: [G5_report_release, n21_publish_report]
      merge: write_once
      lifetime: run
      visibility: output

    # ---- cross-cutting
    - name: gate_records
      type: "list[gate_record]"
      writers: [G1_feasibility, G2_corpus_validity, G3_gallery_freeze, G4_human_study_commit, G5_report_release]
      readers: [G5_report_release, n21_publish_report]
      merge: append
      lifetime: persistent
      visibility: internal
      note: "GD — a gate may never backfill its own record. Missing record == not passed."

    - name: audit_records
      type: "list[required_audit_record]"
      writers: [RA-1, RA-2, RA-3]
      readers: [G5_report_release, n21_publish_report]
      merge: append
      lifetime: persistent
      visibility: internal
      note: "GH — separate channel from gate_records so an audit can never be misread as a gate verdict."

    - name: cost_ledger
      type: "map[resource -> float]"
      writers: [ALL_NODES]
      readers: [G1_feasibility, G4_human_study_commit, G5_report_release]
      merge: numeric_add
      merge_note: "Commutative and associative — safe under arbitrary parallel arrival order."
      lifetime: persistent
      visibility: internal
      note: "O5. Resources: gpt4o_tokens, money_usd, gpu_seconds, wallclock_seconds, external_calls, human_minutes."

    - name: run_progress
      type: "map[stage -> {status, started_at, ended_at, attempt, rc, stdout_broken}]"
      writers: [ALL_NODES]
      readers: [ALL_NODES]
      merge: upsert_by_key
      lifetime: persistent
      visibility: internal
      note: >
        B1 — THIS is the canonical progress, not stdout. Atomic write:
        tmp -> fsync -> rename. A broken stdout must never fail the work; it
        only sets stdout_broken=true.

    - name: degraded_flags
      type: "set[str]"
      writers: [ALL_NODES]
      readers: [n19_aggregate_tables, n20_compare_to_paper, n21_publish_report]
      merge: set_union
      lifetime: persistent
      visibility: output
      note: >
        Anti-pattern 'silent degradation'. Examples: batch_size_reduced_oom,
        idesign_unavailable_native_layout, semantic_edge_missing,
        ulip2_captions_reused_instead_of_gpt4o.

    # ---- SG4 internal (iteration-scoped)
    - name: placed_assets
      type: "list[{asset_id, position, step}]"
      writers: [sg4_place]
      readers: [sg4_encode_layout, sg4_advance]
      merge: append
      lifetime: run
      visibility: private
      note: "S1(b) — the evolving scene graph G is DERIVABLE from initial_scene_graph + this, so G itself is not stored."

    - name: placed_count
      type: int
      writers: [sg4_place]
      readers: [sg4_advance]
      merge: max
      merge_note: "max, not numeric_add — a retried iteration must not double-count. This is the cycle's progress measure."
      lifetime: run
      visibility: private

    - name: layout_embedding
      type: "tensor[1280]"
      writers: [sg4_encode_layout]
      readers: [sg4_fuse_retrieve]
      merge: replace
      lifetime: iteration
      reset_on: loop_entry
      visibility: private
      note: "L5 — forgetting to clear this contaminates round i with round i-1's layout. Classic bug, hence an explicit L1 test."

    - name: query_modality_embeds
      type: "{text, image, pc} tensors[1280]"
      writers: [sg4_encode_query]
      readers: [sg4_fuse_retrieve]
      merge: replace
      lifetime: iteration
      reset_on: loop_entry
      visibility: private

    - name: retrieval_trace
      type: "list[{step, top5_ids, top5_scores, chosen_id, layout_contribution}]"
      writers: [sg4_fuse_retrieve]
      readers: [n15_judge_gpt4o, n21_publish_report]
      merge: append
      lifetime: run
      visibility: internal
      note: >
        O4 decision log. layout_contribution = lambda * ||e_layout||.
        Without this you cannot explain WHY a composed scene is incoherent.

    # ---- SG1 internal (iteration-scoped)
    - name: item_attempt
      type: int
      writers: [sg1_validate_annotation]
      readers: [sg1_annotate, sg1_admit_or_quarantine]
      merge: replace
      lifetime: iteration
      reset_on: item_entry
      visibility: private

    - name: annotation_error_feedback
      type: str
      writers: [sg1_validate_annotation]
      readers: [sg1_annotate]
      merge: replace
      lifetime: iteration
      reset_on: item_entry
      visibility: private
      note: "MODEL_RECOVERABLE feedback. Must reset per item — asset i-1's schema error must never reach asset i's prompt."

  excluded_from_state:
    - item: "rendered prompt strings for GPT-4o"
      reason: "S2 — recomputable from annotation_prompt_version + canonical data. Storing it means template changes become schema changes."
    - item: "the 11 rendered images themselves"
      reason: "S7 — large blobs. Only {uri, sha256, bytes, content_type}; and under D3 the raw files are deleted after verification."
    - item: "the evolving scene graph G inside SG4"
      reason: "S1(b) — derivable from initial_scene_graph + placed_assets. Storing it would blow up every checkpoint."
    - item: "model clients, CUDA streams, file handles"
      reason: "S9 — not serializable. These travel via runtime context, not state."

# ---------------------------------------------------------------- §15.4
nodes_ref: "node_registry.yaml"

# ---------------------------------------------------------------- §15.5
edges:
  - {id: e01, from: n01_env_bootstrap, to: n02_acquire_sources, kind: data, guard: "", join_group: default, carries: [], rationale: ""}
  - {id: e02, from: n02_acquire_sources, to: n03_pilot_and_budget, kind: data, guard: "", join_group: default, carries: [asset_catalog, source_manifest], rationale: ""}
