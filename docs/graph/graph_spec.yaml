        [CORRECTED] `requires_training` was added because an earlier draft sent
        all eight Table 3 rows through n18_train_ablations. Table 3's
        "w/o iterative retrieval" is not a model -- Algorithm 1 runs at
        inference only (paper 2.7), so that row is the Full checkpoint
        evaluated with composition_mode: parallel. It is declared
