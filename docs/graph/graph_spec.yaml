  feedback_edges: [fb_annot, fb_semedge, fb_compose]
  feedback_note: "Main line contains ZERO feedback edges. All cycles live inside subgraphs."

  v1_dependency_bug: >
    An earlier draft scheduled the baseline node parallel with data preparation, reasoning that
    baselines do not depend on MetaFind training. They do depend on the admitted
    asset set, the preprocessing, the split and the gallery protocol -- without
    those, baseline and MetaFind are not on the same evaluation protocol. It
    could at most have run parallel to n10, never to n03. The node is removed
    entirely under D-3.

# ---------------------------------------------------------------- routing
routing:
  - {decision_point: G1_sources_valid, authority: A1, owner: edge, inputs: [manifest_count, glb_coverage, ckpt_behaviour], destinations: [n03_sample_pointclouds, n04_render_views, n07_scene_graphs, HALT_FAILED], default_destination: HALT_FAILED}
  - {decision_point: G2_pc_distribution, authority: A1, owner: edge, inputs: [pc_embedding_agreement, baseline_cross_similarity], destinations: [n09_build_splits, HALT_FAILED], default_destination: HALT_FAILED}
  - {decision_point: G3_corpus_valid, authority: A1, owner: edge, inputs: [leakage_count, admitted_size, quarantine_rate, eval_protocols], destinations: [n10_train_stage1, HALT_FAILED], default_destination: HALT_FAILED}
  - {decision_point: G4_gallery_freeze, authority: A1, owner: edge, inputs: [index_dim, index_count, nan_count, self_retrieval_recall], destinations: [n12_promote_index, HALT_FAILED], default_destination: HALT_FAILED}
  - {decision_point: G6_stage2_protocol, authority: A1, owner: edge, inputs: [stage2_protocol.status, stage2_pairing], destinations: [n13_train_stage2, HALT_BLOCKED], default_destination: HALT_BLOCKED}
  - {decision_point: G5_report_release, authority: A1, owner: edge, inputs: [verdict_completeness, gate_records, audit_records, degraded_flags], destinations: [n22_publish_report, HALT_FAILED], default_destination: HALT_FAILED}
  - {decision_point: sg1_admit_or_repair, authority: A1, owner: edge, inputs: [schema_valid, item_attempt], destinations: [sg1_admit, sg1_generate, sg1_quarantine], default_destination: sg1_quarantine}
  - {decision_point: sg2_cache_lookup, authority: A1, owner: edge, inputs: ["sem_edge_cache.contains(hash)"], destinations: [use_cache, call_llm], default_destination: call_llm}
  - {decision_point: sg3_train_scope, authority: A1, owner: edge, inputs: ["variant.train_scope"], destinations: [fuser_only, point_encoder_and_fuser, full], default_destination: point_encoder_and_fuser}
  - {decision_point: sg4_advance, authority: A1, owner: edge, inputs: [placed_count, n_queries, wallclock], destinations: [sg4_encode_layout, DONE, EXHAUSTED], default_destination: EXHAUSTED}
  - {decision_point: sg4_mode, authority: A1, owner: edge, inputs: ["variant.composition_mode"], destinations: [iterative, parallel, region], default_destination: iterative}

static_fanouts:
  - {name: render_views, cardinality: 11, source: "paper 2.3", bound: 11}
  - {name: modality_conditions, cardinality: 7, source: "paper Table 1 columns", bound: 7}
  - {name: eval_protocols, cardinality: 2, source: "U-09 -- both readings run", bound: 2}
  - {name: headline_variants, cardinality: 2, source: "paper Table 1 last two rows", bound: 2}
  - {name: ablation_variants, cardinality: 8, source: "paper Table 3 minus 2 reusable rows", bound: 10}
  - {name: assets, cardinality: "len(asset_manifest)", source: "manifest, currently 46052", bound: 60000, over_bound_action: truncate_and_record}
  - {name: eval_scenes, cardinality: 200, source: "paper 3.3", bound: 200}
static_fanouts_note: >
  Every fan-out is statically enumerated, which is why max_authority is A1.
  Asset cardinality is len(manifest), never a literal 48000 (U-01, L1-MANIFEST).

# ---------------------------------------------------------------- loops
loops:
  - id: C1
    name: annotation_repair
    location: SG1
    progress_measure: "item_attempt"
    semantic_exit: "annotation passes structured schema validation"
    hard_bound: {iterations: 2, wallclock_s: 120}
    exhaustion_outcome: "quarantine the asset"
    exhaustion_marker: "terminated_by: repair_budget"
    iteration_channels_reset: [item_attempt, annotation_error_feedback]
    note: "An exhausted repair is NOT a successful annotation; the asset leaves the admitted set."

  - id: C2
    name: semantic_edge_repair
    location: SG2
    progress_measure: "item_attempt"
    semantic_exit: "relation sentence non-empty and encodable"
    hard_bound: {iterations: 2, wallclock_s: 60}
    exhaustion_outcome: "mark the edge semantic_edge_missing, degrade to geometry-only"
    exhaustion_marker: "degraded_flags += semantic_edge_missing"
    iteration_channels_reset: [item_attempt]
    note: "Must NOT zero-fill; a zero vector is indistinguishable downstream from a valid semantic edge."

  - id: C3
    name: iterative_composition
    location: SG4
    progress_measure: "placed_count (merge=max, so retries never double-count)"
    semantic_exit: "placed_count == n_queries"
    hard_bound: {iterations: 25, wallclock_s: 600, external_calls: 30}
    exhaustion_outcome: "scene marked incomplete and added to composition_incomplete"
    exhaustion_marker: "terminated_by: object_budget"
    iteration_channels_reset: [layout_embedding, query_modality_embeds]
    note: "Incomplete scenes are EXCLUDED from Table 2 means; above 10% incomplete, the stage fails."

termination:
  states:
    SUCCESS: "SC-1..SC-8 met, G5 PASS, report published"
    FAILED: "a gate FAILed and diagnosis confirms it is unrecoverable"
    EXHAUSTED: "budget exhausted with core tables incomplete; carries terminated_by=budget"
    BLOCKED: "awaiting an external input (e.g. I-Design access). RESUMABLE, not a failure."
  terminal_nodes: [n22_publish_report, HALT_FAILED, HALT_BLOCKED]

# ---------------------------------------------------------------- execution
execution_order:
  layers:
    - {layer: 1, parallel_nodes: [n01_env_bootstrap], gates: [], est: "2-4 h"}
    - {layer: 2, parallel_nodes: [n02_download], gates: [], est: "1-2 days (46K GLBs dominate) -- CRITICAL PATH"}
    - {layer: 3, parallel_nodes: [], gates: [G1_sources_valid], est: "-"}
    - {layer: 4, parallel_nodes: [n03_sample_pointclouds, n04_render_views, n07_scene_graphs], gates: [], est: "1-3 h"}
    - {layer: 5, parallel_nodes: [], gates: [G2_pc_distribution], est: "-"}
    - {layer: 6, parallel_nodes: [n05_annotate, n08_semantic_edges], gates: [], est: "1-2 days (Qwen over 46K assets) -- CRITICAL PATH"}
    - {layer: 7, parallel_nodes: [n06_encode_text_image], gates: [], est: "2-4 h"}
    - {layer: 8, parallel_nodes: [n09_build_splits], gates: [], est: "<1 h"}
    - {layer: 9, parallel_nodes: [], gates: [G3_corpus_valid], est: "-"}
    - {layer: 10, parallel_nodes: [n10_train_stage1], gates: [], est: "hours to 1 day (trains the point encoder, unlike the earlier draft)"}
    - {layer: 10b, parallel_nodes: [n09b_resolve_stage2_protocol], gates: [G6_stage2_protocol], est: "human decision -- BLOCKS Stage 2 until U-08a and U-08b are answered"}
    - {layer: 11, parallel_nodes: [n11_gallery_index_staging, n13_train_stage2], gates: [], est: "3-8 h"}
    - {layer: 12, parallel_nodes: [], gates: [G4_gallery_freeze], est: "-"}
    - {layer: 13, parallel_nodes: [n12_promote_index, n14_equivariance_probe], gates: [], est: "<1 h"}
    - {layer: 14, parallel_nodes: [n15_eval_retrieval, n16_compose_scenes], gates: [], est: "6-17 h"}
    - {layer: 15, parallel_nodes: [n17_judge_scenes], gates: [], est: "2-4 h"}
    - {layer: 16, parallel_nodes: [n18_train_ablations], gates: [], est: "6-12 h"}
    - {layer: 17, parallel_nodes: [n19_eval_ablations], gates: [], est: "3-8 h"}
    - {layer: 18, parallel_nodes: [n20_aggregate, n21_compare_to_paper], gates: [], est: "<1 h"}
    - {layer: 19, parallel_nodes: [], gates: [G5_report_release], est: "-"}
    - {layer: 20, parallel_nodes: [n22_publish_report], gates: [], est: "<1 h"}
  notes: "Critical path is layer 2 (GLB download) and layer 6 (Qwen annotation over 46,052 assets)."

# ---------------------------------------------------------------- risks
risks_unknowns:
  - {id: U-01, marked: UNKNOWN, item: "asset count: paper says ~48,000, manifest holds 46,052", affects: "every denominator", resolution: "use len(manifest); record its sha256", fallback: "n/a"}
  - {id: U-02, marked: UNKNOWN, item: "whether self-sampled point clouds match ULIP-2's training distribution", affects: "every PC embedding", resolution: "G2 blocks on a 500-asset comparison against ULIP's released clouds", fallback: "download ULIP's 185 GB of point clouds"}
  - {id: U-03, marked: UNKNOWN, item: "camera placement for the 11 views", affects: "the image modality", resolution: "Fibonacci lattice by default, recorded per asset", fallback: "axis-aligned variant available"}
  - {id: U-04, marked: UNKNOWN, item: "render resolution", affects: "image tower input", resolution: "224px, matching ULIP-2's convention", fallback: "512px if annotation quality suffers"}
  - {id: U-05, marked: UNKNOWN, item: "adjacency criterion for physical edges", affects: "ESSGNN input", resolution: "kNN k=8, recorded with the artifact", fallback: "radius mode available"}
  - {id: U-06, marked: UNKNOWN, item: "which object pairs get a semantic edge", affects: "ESSGNN input", resolution: "record the choice; list in the report", fallback: "n/a"}
  - {id: U-07, marked: UNKNOWN, item: "ProcTHOR ships 10k/1k/1k but the paper says 80/20", affects: "scene splits", resolution: "main line follows the paper; both recorded", fallback: "n/a"}
  - {id: U-08, marked: UNKNOWN, item: "how Stage 2 training samples are constructed from ProcTHOR", affects: "all of Table 2 and 3", resolution: "the paper never defines it; our protocol is stated explicitly in 02_BUILD_STEPS", fallback: "n/a"}
  - {id: U-09, marked: UNKNOWN, item: "gallery scope for Table 1", affects: "every R@k", resolution: "run both protocols and report both", fallback: "n/a"}
  - {id: U-10, marked: UNKNOWN, item: "which IDesign aspect maps to Table 2's Scene Coherence", affects: "Table 2 column mapping", resolution: "record the assumed mapping", fallback: "n/a"}
  - {id: R-01, marked: RISK, item: "I-Design has not been verified to run", affects: "all of Tables 2 and 3", resolution: "trial-run it early -- cheap to check, expensive to discover late", fallback: "Tables 2/3 => BLOCKED_EVIDENCE"}
  - {id: R-02, marked: RISK, item: "24 GB limits the trainable scope", affects: "D-1 and RA-3", resolution: "not resolvable on this hardware", fallback: "declare the scope actually trained"}
  - {id: R-03, marked: RISK, item: "Qwen annotation quality is unmeasured", affects: "the text tower", resolution: "pilot then manual spot-check", fallback: "escalate model size"}
