# ---------------------------------------------------------------- §14 optimization record
optimization_passes:
  - check: "nodes that always succeed/fail together with no useful checkpoint between => merge"
    result: "Merged 'download mesh' and 'validate mesh' into sg1_validate_mesh. Kept n08/n09 SEPARATE despite the temptation — the split is what enables late commit."
  - check: "nodes with mixed roles making retry policy unsolvable => split"
    result: "Split sg1_write_vectors (compute) from sg1_delete_raw (mutate, irreversible). Merged, a retry would re-delete."
  - check: "sequential sections with no data dependency => parallelize"
    result: "MAIN WIN — moved n13_run_baselines to layer 5 (parallel with data prep). Also n08 || n10, and n09 || n11."
  - check: "transitive redundant edges => remove"
    result: "Removed 3 (see dependencies.transitive_edges_removed)."
  - check: "repeated substructure => extract subgraph"
    result: "SG1 reused by n03 (pilot) and n04 (full). SG3 reused by n10 (2 variants) and n17 (8 variants). SG4 reused by n14 and n18."
  - check: "decision points with excessive authority => downgrade"
    result: "The annotation-route choice was initially sketched as an A2 model call ('let the model decide if quality is good enough'). Downgraded to A1: compare measured cost against budget_cap. Cheaper, testable, reproducible."
  - check: "pure nodes that could be cached"
    result: "asset_embeddings cached with key [asset_sha256, code_revision, ulip2_ckpt_sha]. sem_edge_cache keyed by category pair, persistent across runs (~40x saving)."
  - check: "join policies that are too strict"
    result: "MAIN WIN — sg1_reduce and sg2_reduce changed from `all` to `all_settled` (one bad mesh would otherwise deadlock 48K assets). n19 split into core/extended groups."
  - check: "gates that are really just tests => demote"
    result: "Demoted 5 (see validation_plan.yaml rejected_gate_candidates). Notably 'baselines match published values' became Required Audit RA-2."
  - check: "cycles that could be fixed-count parallel + pick best"
    result: "C1 and C2 kept as cycles (error feedback genuinely improves the retry). C3 CANNOT be parallelized — that IS the paper's iterative claim, and 'w/o iterative retrieval' is Table 3 row 2, i.e. the parallel version is an ablation, not an optimization."

