# MetaFind reproduction -- Validation Plan
#
# Principle: MANY TESTS, FEW GATES.
#
# Every `verified_blocks` below is false. That is deliberate at specification
# time: it flips to true only once the negative injection has been observed to
# actually fail. A check whose injection was never seen to fail is a check you
# cannot trust.

spec_version: "1.0"
graph_id: "metafind-reproduction"

# ================================================================== L1
level_1:

  # ---- environment
  - id: L1-ENV-ULIP
    target: n01_env_bootstrap
    target_kind: node
    asserts: "ULIP2_PointBERT_Colored builds and pc_projection is (768, 1280)"
    negative_injection: "assert against 512, the ULIP-1 width"
    expected_on_injection: "AssertionError -- proves the test reads the real width"
    verified_blocks: false

  - id: L1-ENV-THOR
    target: n01_env_bootstrap
    target_kind: node
    asserts: >
      ai2thor is EXACTLY 5.0.0, the CloudRendering build is exactly
      f0825767cd50d69f666c7f282e54abfe58f1e917, ~/.ai2thor is a symlink off the
      root partition, headless CloudRendering returns a frame, and
      GetAssetDatabase returns a non-empty database. The asset COUNT is reported,
      not asserted -- U-08c makes it a derived quantity.
    negative_injection: "pin the version as a range (>=5.0,<6) and rebuild"
    expected_on_injection: "a later 5.x installs, renders fine, and reports a different asset database with nothing failing"
    verified_blocks: false
    note: >
      Importing ai2thor proves nothing; the Unity build has to run. It fails for
      reasons an import cannot see -- a missing build, a GPU the runtime refuses,
      a driver mismatch -- and finding out inside a 1,467-asset render loop is
      expensive.
      MEASURED: GetAssetDatabase returns NOTHING on a hand-authored iTHOR scene
      such as FloorPlan1. It belongs to the procedural API, so the probe must
      load a ProcTHOR house. The first version of this check used FloorPlan1 and
      failed -- which also confirmed F25's 1,934 was measured in the right
      context.
      The version is exact rather than a range because F24 and F25 are pinned to
      this build. A range lets a rebuild render fine, load 12,000 houses, report
      a different asset database, and say nothing.

  - id: L1-ENV-PRIOR
    target: n01_env_bootstrap
    target_kind: node
    asserts: >
      prior is exactly 1.0.3 and procthor-10k resolves to commit
      439193522244720b86d8c81cde2e51e3a4d150cf, with splits 10,000 / 1,000 /
      1,000.
    negative_injection: "check only the split sizes"
    expected_on_injection: "a different revision with the same three counts passes"
    verified_blocks: false
    note: >
      Split sizes are a weak pin: a revision can change every house and stay
      10k/1k/1k. `prior` clones a git repo, so the revision is directly
      checkable, and F25's 1,467 assets and 93 categories are statements about
      THIS commit. The loader itself advertises an older revision
      (ab3cacd0...), which is two commits earlier with the data update between
      them -- so the two really are different artifacts even though their asset
      sets happen to match.

  - id: L1-ENV-EGNN
    target: n01_env_bootstrap
    target_kind: node
    asserts: "EGNN forward returns h (n, d) and x (n, 3) for the configured widths"
    negative_injection: "pass in_edge_nf=0 while supplying edge_attr"
    expected_on_injection: "RuntimeError on the edge MLP input width"
    verified_blocks: false

  - id: L1-VENDOR
    target: metafind/vendor/egnn_clean.py
    target_kind: node
    asserts: "the vendored EGNN body hashes to the recorded UPSTREAM_SHA256"
    negative_injection: "append a comment line to the body"
    expected_on_injection: "digest mismatch"
    verified_blocks: false

  # ---- manifest and counts
  - id: L1-MANIFEST
    target: asset_manifest
    target_kind: channel
    asserts: >
      No module contains the literal 48000; every asset count derives from
      len(manifest).
    negative_injection: "introduce `N = 48000` anywhere under metafind/"
    expected_on_injection: "the source scan fails"
    verified_blocks: false
    note: >
      [U-01] The paper says "approximately 48,000"; the manifest holds 46,052.
      An earlier draft hardcoded 48000 in shard arithmetic and in the gallery denominator.

  # ---- point clouds
  - id: L1-PC-NONDEGENERATE
    target: pointclouds
    target_kind: channel
    asserts: >
      For every axis where per_axis_variance is at or near zero, the mesh's own
      raw_bbox_extents is correspondingly flat. A cloud that is planar while its
      mesh is not indicates a sampler that collapsed the geometry.
    negative_injection: "project every sampled point onto the xy plane"
    expected_on_injection: "variance along z is zero while raw_bbox_extents[z] is not"
    verified_blocks: false
    note: >
      [MEASURED] An absolute variance floor cannot tell a flat ASSET from a
      flattening BUG. 21 of 46,052 assets have exactly zero variance on one
      axis, and their mesh bounding boxes are 1.8e-12, 0.0, 3.6e-15 and 1.7e-08
      thick on that axis -- planes, decals, 2D cutouts. All 10,000 of their
      points are distinct, so the sampler worked; the object is flat.
      Quarantining them would discard valid data, and raising the floor until
      they pass would blind the check to the failure it exists for. Comparing
      against the mesh separates the two.

  - id: L1-PC-RGB-SCALE
    target: pointclouds
    target_kind: channel
    asserts: >
      Every cloud's rgb columns lie in [0, 1], and every sidecar records
      rgb_scale == "unit". The ULIP-2 checkpoint was trained on colour at that
      scale, and xyz is unit-normalised, so a 0-255 channel would dominate the
      input by two orders of magnitude.
    negative_injection: "store rgb as uint8 0-255"
    expected_on_injection: "the range assertion fails before any encoding runs"
    verified_blocks: false

  - id: L1-PC-COLOUR-PROVENANCE
    target: pointclouds
    target_kind: channel
    asserts: >
      Every sidecar names a colour_source in {texture, flat, vertex, face,
      fallback_grey} and a coloured_point_fraction in [0, 1], and the corpus
      distribution of both is reported.
    negative_injection: "drop colour_source from the sidecar"
    expected_on_injection: "the field check fails"
    verified_blocks: false
    note: >
      Provenance, not a threshold. What fraction of Objaverse assets carry
      readable colour is a property of the dataset, and inventing a floor for
      it would be a number we made up.

  - id: L1-PC-NORM
    target: n03_sample_pointclouds
    target_kind: node
    asserts: "centroid at the origin and largest radius exactly 1, matching ULIP's pc_norm"
    negative_injection: "skip normalisation"
    expected_on_injection: "the centroid and radius assertions fail"
    verified_blocks: false

  - id: L1-PC-SHAPE
    target: pointclouds
    target_kind: channel
    asserts: "(10000, 6) xyz+rgb, finite, not all zeros"
    negative_injection: "inject a NaN"
    expected_on_injection: "finiteness assertion fails before the write"
    verified_blocks: false

  - id: L1-PC-DETERMINISTIC
    target: n03_sample_pointclouds
    target_kind: node
    asserts: "sampling the same mesh twice yields identical clouds"
    negative_injection: "remove the per-uid seed"
    expected_on_injection: "the two clouds differ"
    verified_blocks: false

  # ---- renders
  - id: L1-RENDER-COUNT
    target: n04_render_views
    target_kind: node
    asserts: "exactly 11 views, all non-empty, all distinct by sha256"
    negative_injection: "return the same frame 11 times"
    expected_on_injection: "the distinctness assertion fails"
    verified_blocks: false
    note: "A mis-framed camera returns a plausible blank white image, which every shape assertion would accept."

  - id: L1-RENDER-PROJECTION-CONSISTENT
    target: n04_render_views
    target_kind: node
    asserts: >
      The configured projection behaves as configured: under orthographic,
      moving the camera from 3 to 30 units changes silhouette area by <= 2 px.
    negative_injection: "keep the orthographic setting but swap in a perspective camera"
    expected_on_injection: "apparent size changes with distance"
    verified_blocks: false
    note: >
      [UNKNOWN U-03a] The paper says "11 orthogonal viewpoints" without naming a
      projection. Eleven mutually orthogonal directions do not exist in 3D,
      which makes "orthographic projection" a plausible reading, but the author
      may equally have meant "spread-out" loosely. An earlier draft marked this
      RESOLVED and required a perspective camera to fail the test; it is a
      choice, and it changes the image embedding distribution, so both
      projections stay available and the choice is recorded per asset.

  - id: L1-RENDER-SCALE-INVARIANT
    target: n04_render_views
    target_kind: node
    asserts: "a millimetre-scaled and a metre-scaled copy of one mesh render identically"
    negative_injection: "remove the unit-sphere normalisation"
    expected_on_injection: "the two renders differ"
    verified_blocks: false

  - id: L1-RENDER-PARTIAL-BLANK
    target: renders
    target_kind: channel
    asserts: >
      Every record carries blank_views, and the corpus-wide distribution is
      reported. An asset whose views are ALL blank is quarantined; an asset
      with some blank views is admitted and counted.
    negative_injection: "drop blank_views from the record"
    expected_on_injection: "the field check fails"
    verified_blocks: false
    note: >
      [MEASURED over 45,955 assets] 45,773 have no blank view, 135 have one,
      and 47 have between two and nine. These are thin or sheet-like objects
      seen edge-on, not a rendering fault -- the same geometry that makes 21
      point clouds legitimately planar (L1-PC-NONDEGENERATE). They are admitted
      because a partial view set still describes the object, but the count is
      recorded: a regression that starts blanking views on ORDINARY assets
      would move this distribution and nothing else, since every other render
      check passes on a blank frame of the right shape.
      Only all-blank is fatal, and it is: 104 of the 143 quarantine records are
      "every view is blank -- the asset never entered frame".

  - id: L1-RENDER-EXTENTS
    target: renders
    target_kind: channel
    asserts: "the pre-normalisation mesh extents are recorded per asset"
    negative_injection: "drop extents_m from the record"
    expected_on_injection: "record schema validation fails"
    verified_blocks: false
    note: "[F13] Normalisation destroys absolute scale, so the annotator's size field is a category prior; the true extents make it auditable."

  # ---- annotation
  - id: L1-ANNOT-SCHEMA
    target: sg1_validate
    target_kind: predicate
    asserts: >
      Truth table over: valid / each of the four required fields missing /
      wrong type / placement value outside the vocabulary / millimetres.
    negative_injection: "supply a placement value not in the vocabulary"
    expected_on_injection: "SchemaError naming the offending value"
    verified_blocks: false

  - id: L1-ANNOT-REPAIR
    target: C1
    target_kind: loop
    asserts: "the repair prompt differs from the original and names the specific error"
    negative_injection: "resend the identical prompt"
    expected_on_injection: "the prompts compare equal, so the loop cannot converge"
    verified_blocks: false

  - id: L1-ANNOT-EXHAUST
    target: C1
    target_kind: loop
    asserts: "after 2 failed attempts the asset is quarantined with terminated_by=repair_budget and is absent from the admitted set"
    negative_injection: "mark the exhausted item as admitted"
    expected_on_injection: "the test fails -- a bound treated as success"
    verified_blocks: false

  - id: L1-ANNOT-NO-FALLBACK
    target: n05_annotate
    target_kind: node
    asserts: "no code path substitutes ULIP-2's shipped captions"
    negative_injection: "re-add the fallback branch"
    expected_on_injection: "the source scan fails"
    verified_blocks: false
    note: "An earlier draft made that fallback the cheap default, which quietly turns the experiment into a different one."

  # ---- fusion and masking
  - id: L1-MASK-NOTZERO
    target: n10_train_stage1
    target_kind: node
    asserts: >
      An absent modality is NOT represented by a zero vector: the fused output
      must differ from what zero-padding produces.
    negative_injection: "zero-pad instead"
    expected_on_injection: "the two paths agree, so the distinction is unimplemented"
    verified_blocks: false
    note: >
      [PAPER 2.6] "Rather than zero-padding, we apply masked embeddings", which
      is what Table 3's last row measures. That rules zero-padding OUT but does
      not say what is used instead.
      [UNKNOWN U-11] An earlier draft asserted a learned mask token as a paper
      requirement. Several implementations satisfy the sentence: a learned mask
      token, a validity mask the fusion honours, an attention mask in the
      Transformer variant, or gating the modality out. Our choice is a learned
      mask token, recorded as a choice; the assertion here only pins the paper's
      actual claim, that the result must differ from zero-padding.

  - id: L1-DROPOUT-30
    target: n10_train_stage1
    target_kind: node
    asserts: "each modality is masked at 30% +/- 2%, independently"
    negative_injection: "mask all modalities jointly"
    expected_on_injection: "the pairwise correlation approaches 1"
    verified_blocks: false

  - id: L1-SCENE-DROPOUT-30
    target: n13_train_stage2
    target_kind: node
    asserts: >
      The layout term is dropped at 30% +/- 1%, at the granularity named by
      stage2_protocol.scene_dropout_granularity. Under `batch`, every sample in
      a dropped batch has no layout and every sample in a kept batch has one --
      the within-batch variance of the drop mask is zero. Under `sample`, draws
      are independent within a batch.
    negative_injection: "set the rate to 0; and separately, apply per-sample draws while the protocol says batch"
    expected_on_injection: "the measured rate assertion fails; and the within-batch variance is non-zero where the protocol requires zero"
    verified_blocks: false
    note: >
      [U-32] Paper 2.6 says "omitted in 30% of batches" for scene dropout, and
      separately says each modality is masked "independently" at 30% for Stage
      1. Those are different statements; an earlier version of this check
      asserted a per-sample rate for both.

  # ---- losses
  - id: L1-LOSS-STAGE1-UNIDIRECTIONAL
    target: n10_train_stage1
    target_kind: node
    asserts: "Stage 1 uses Eq. 5, query->gallery only; no gallery->query term"
    negative_injection: "add the reverse term"
    expected_on_injection: "the loss becomes symmetric under tower swap, which Stage 1 must not be"
    verified_blocks: false

  - id: L1-LOSS-STAGE2-BIDIRECTIONAL
    target: n13_train_stage2
    target_kind: node
    asserts: "Stage 2 averages Eq. 7a and 7b, and is invariant to swapping the towers"
    negative_injection: "drop the g2q term"
    expected_on_injection: "the symmetry assertion fails"
    verified_blocks: false

  # ---- ESSGNN
  - id: L1-EGNN-H0
    target: n13_train_stage2
    target_kind: node
    asserts: "h0 = t_i only; raw coordinates are not concatenated into h"
    negative_injection: "use h0 = Concat(x, t)"
    expected_on_injection: "the width changes and L2-EQUIVAR-FEAT subsequently fails"
    verified_blocks: false
    note: "[F1] The literal 2.5 formulation contradicts Appendix C's premise; measured by RA-1, never by a gate."

  - id: L1-EGNN-FX-SCALAR
    target: n13_train_stage2
    target_kind: node
    asserts: "f_x is scalar-valued"
    negative_injection: "make f_x output R^3 and multiply elementwise"
    expected_on_injection: "L2-EQUIVAR-COORD fails, because Q cannot be factored out"
    verified_blocks: false
    note: "[F10] 2.5 types f_x as R^3, but Appendix C's proof needs a scalar. Measured by RA-2."

  - id: L1-EGNN-AGG
    target: n13_train_stage2
    target_kind: node
    asserts: "neighbour aggregation for the coordinate update is a sum, per Eq. 3"
    negative_injection: "use the reference implementation's default mean"
    expected_on_injection: "numeric mismatch against a hand-computed 3-node example"
    verified_blocks: false

  - id: L1-EGNN-LAMBDA
    target: n13_train_stage2
    target_kind: node
    asserts: "lambda is a learnable scalar with a non-None gradient"
    negative_injection: "hard-code lambda = 1.0"
    expected_on_injection: "grad is None"
    verified_blocks: false

  - id: L1-EGNN-DIMS-NOT-HARDCODED
    target: metafind/models/essgnn.py
    target_kind: node
    asserts: >
      Dimensions that a checkpoint or protocol determines -- node_feat_dim,
      edge_feat_dim, out_dim, and the tower's `dim` -- are REQUIRED arguments
      with no defaults, so no call site can inherit a paper-looking constant.
      Implementation hyperparameters (hidden_dim, n_layers) may keep defaults,
      but must be written into the run config and reported (U-22).
    negative_injection: "hardcode 1280 or 128 as a module-level constant"
    expected_on_injection: "the source scan fails"
    verified_blocks: false
    note: >
      Grepping the paper for 1280|768|512|128|64 returns nothing. It writes only
      t_i in R^d and f_h : R^(2d+1+e) -> R^d. An earlier draft treated these as paper values
      and even asserted that changing 64 must fail.

  - id: L1-EGNN-NO-EDGE-PROJ-BY-DEFAULT
    target: metafind/models/essgnn.py
    target_kind: node
    asserts: "edge_proj_dim defaults to None; the paper has no such layer"
    negative_injection: "set a default projection width"
    expected_on_injection: "the default assertion fails"
    verified_blocks: false

  # ---- semantic edges
  - id: L1-SEMEDGE-KEY
    target: sem_edge_cache
    target_kind: channel
    asserts: >
      The cache key hashes both object DESCRIPTIONS plus prompt, model and
      encoder versions. Two objects of the same category with different
      descriptions must not share an entry.
    negative_injection: "key on (category_a, category_b)"
    expected_on_injection: "'office chair + desk' and 'dining chair + dining table' collide"
    verified_blocks: false
    note: "[CORRECTED] 2.5 and Appendix C both say the LLM is prompted with object descriptions."

  - id: L1-SEMEDGE-NO-ZEROFILL
    target: C2
    target_kind: loop
    asserts: "an exhausted semantic edge is flagged semantic_edge_missing, not zero-filled"
    negative_injection: "zero-fill instead of flagging"
    expected_on_injection: "degraded_flags lacks the entry"
    verified_blocks: false
    note: "A zero vector is indistinguishable downstream from a valid semantic edge."

  # ---- scene graphs
  - id: L1-SCENE-SUPPORT
    target: n07_scene_graphs
    target_kind: node
    asserts: "a cup nested under a table becomes a support edge in both directions"
    negative_injection: "ignore the children tree"
    expected_on_injection: "no support edges are produced"
    verified_blocks: false
    note: >
      [UNKNOWN U-19] Symmetry here is OUR convention. Paper 2.3 names
      "physical-relation edges" and "semantic-relation edges" without saying
      whether either is directed, and never says relation(A,B) equals
      relation(B,A). The choice changes message passing: a directed support edge
      and a symmetric one produce different h updates. This test pins our
      convention so it cannot drift; it does not assert a paper requirement.

  - id: L1-SCENE-COORDS-RAW
    target: n07_scene_graphs
    target_kind: node
    asserts: "translating a house by 100 m translates the stored positions by 100 m and leaves the edge structure unchanged"
    negative_injection: "re-centre positions"
    expected_on_injection: "the offset assertion fails"
    verified_blocks: false
    note: >
      The reason is NOT that centring breaks equivariance -- it does not;
      x'_i = x_i - mean(x) leaves an EGNN equivariant. It is that paper 2.5
      states the setting as "large and often unnormalized coordinate systems,
      with no guarantee that scenes are aligned or centered". Pre-centring would
      remove the very global translation the design claims robustness to, so the
      claim would never be exercised.

  # ---- splits
  - id: L1-SPLIT-WRITEONCE
    target: splits
    target_kind: channel
    asserts: "a second differing write raises; an identical write is a no-op"
    negative_injection: "regenerate splits with a different seed"
    expected_on_injection: "WriteOnceViolation"
    verified_blocks: false

  - id: L1-SPLIT-NO-ASSET-DISJOINTNESS
    target: n09c_build_scene_splits
    target_kind: node
    asserts: "an asset appearing in both a train and a test house is NOT treated as leakage"
    negative_injection: "re-add the asset-disjointness rule"
    expected_on_injection: "most ProcTHOR houses become unusable"
    verified_blocks: false
    note: >
      An earlier draft invented this rule. The paper only asks for 80/20, and ProcTHOR's
      12,000 houses draw on ~1,467 assets, so enforcing it changes the scene
      distribution.
      [RETARGETED] This asserts about HOUSES, so it belongs to n09c after the
      Objaverse/ProcTHOR branch split; it was still pointing at n09_build_splits,
      which no longer touches ProcTHOR at all.

  - id: L1-PROTOCOLS-DEFINED
    target: eval_protocols
    target_kind: channel
    asserts: "both protocols are defined with explicit gallery sizes before any evaluation runs"
    negative_injection: "define only one"
    expected_on_injection: "the evaluation refuses to start"
    verified_blocks: false

  - id: L1-STAGE1-PROTOCOL-APPLIED
    target: stage1_protocol
    target_kind: channel
    asserts: >
      Every field of BOTH Stage 1 protocols reaches the object that acts on it,
      checked against the instantiated modules rather than against the config:
        fusion                      -> query.fusion.cfg.kind and gallery.fusion.cfg.kind
        tower_sharing               -> PARAMETER identity between the towers, and
                                       the number of distinct ULIP backbones
        allow_all_masked            -> the allow_empty actually passed to
                                       sample_modality_mask
        similarity                  -> refuses to start on anything the loss does
                                       not implement, rather than accepting the
                                       string and computing cosine anyway
        hyperparameter_config_hash  -> canonical sha256 of the hyperparameter
                                       artifact the run loaded
        actual_clip_train_scope            -> backbone train_scope, and whether a cache
                                       may be read at all
        image_aggregation           -> cache layout (one vector vs eleven)
        text_serialization          -> the template the encoder was given
    status: partially_implementable
    pending_until_n10: >
      Six of these cannot be checked yet because there is no Stage 1 trainer:
      learning_rate / weight_decay -> optimizer.param_groups, scheduler ->
      the actual scheduler, batch_size -> the DataLoader, epochs -> the loop,
      seed -> the sampler and RNG, and tower_sharing's BACKBONE half ->
      whether query_backbone is gallery_backbone. What holds today is the
      config-construction half: fusion, tower_sharing's FUSION parameters,
      allow_all_masked, similarity, the hash, both clip scopes,
      image_aggregation and missing_modality_representation.
      Recorded rather than left implied, because an assertion listing objects
      that do not exist reads as coverage.
    negative_injection: "resolve tower_sharing=fully_shared, then build the towers with independent fusion modules"
    expected_on_injection: "parameter identity fails and Stage 1 does not start"
    verified_blocks: false
    note: >
      The Stage 1 counterpart of L1-ESSGNN-ARCH-PROTOCOL-APPLIED, added after a
      review found four fields that G3 required but nothing consumed:
      allow_all_masked never reached sample_modality_mask, similarity was
      accepted as any string while the loss computed cosine unconditionally,
      hyperparameter_config_hash was a presence check that dereferenced nothing
      so the run used library defaults for every value of U-22, and
      tower_sharing shared a CONFIG OBJECT while each tower still constructed
      its own ModalityFusion -- config identity, not weight sharing.
      Comparing against the config would have missed the last one entirely,
      which is why this compares against parameters.

  - id: L1-STAGE2-POSITIVE-DEFINED
    target: stage2_positive_map
    target_kind: channel
    asserts: >
      For every Stage 2 sample: positive_asset_id == the target's own assetId;
      that id is present in stage2_gallery_index; its embedding loads; and it is
      locatable within the batch. On the main line gallery_scope == procthor and
      method == identity.
    negative_injection: "set Fridge_19's positive to Chair_007"
    expected_on_injection: "the identity assertion fails immediately"
    verified_blocks: false
    note: >
      [REWRITTEN 2026-08-16, U-08a] The previous version asserted that every
      ProcTHOR asset "resolves to exactly one GALLERY ENTRY, with the mapping
      method recorded", and injected an empty map. It was verifying a
      cross-dataset correspondence that the resolution removed: the positive is
      the target itself, so there is no mapping left to get wrong.
      The empty-map injection was also weak -- it tests that a required channel
      is non-empty, which any schema check already catches. Pointing a positive
      at a DIFFERENT asset is the failure that can actually happen and that
      nothing else would see: every count and every shape stays valid while the
      model is trained to retrieve the wrong object.
      The three existence clauses are separate from identity on purpose.
      "Fridge_19's positive is Fridge_19" is satisfiable by an id that was never
      encoded, and the loss then has a name with no vector behind it.

  # ---- channels
  - id: L1-MERGE-COMM
    target: pointclouds
    target_kind: channel
    asserts: "upsert_by_key is order-independent across shuffled worker completion"
    negative_injection: "change merge to replace"
    expected_on_injection: "results diverge across shuffles"
    verified_blocks: false

  - id: L1-ITER-RESET
    target: layout_embedding
    target_kind: channel
    asserts: "the channel is empty on entering iteration i+1"
    negative_injection: "leave iteration i's value in place"
    expected_on_injection: "the residue detector fires"
    verified_blocks: false

  - id: L1-PROGRESS-MAX
    target: placed_count
    target_kind: channel
    asserts: "merge=max, so a retried iteration does not increment the count"
    negative_injection: "change merge to numeric_add"
    expected_on_injection: "the count double-counts"
    verified_blocks: false

  - id: L1-QUAR-REASON
    target: quarantine
    target_kind: channel
    asserts: "every record carries a real exception type, message, uid and code revision"
    negative_injection: "write only {'status': 'failed'}"
    expected_on_injection: "record schema validation fails"
    verified_blocks: false

  # ---- loops
  - id: L1-EXHAUST-MARK
    target: C3
    target_kind: loop
    asserts: "hitting a hard bound yields EXHAUSTED with terminated_by, and the scene is marked incomplete"
    negative_injection: "mark the exhausted scene SUCCESS"
    expected_on_injection: "the test fails"
    verified_blocks: false

  - id: L1-TRACE-LAYOUT
    target: retrieval_trace
    target_kind: channel
    asserts: "every step records top-5 ids, scores, the chosen id and lambda*||e_layout||"
    negative_injection: "omit layout_contribution"
    expected_on_injection: "record schema validation fails"
    verified_blocks: false

  # ---- mutate discipline
  - id: L1-IDEMPOTENT
    target: "all mutate nodes"
    target_kind: node
    asserts: "running each mutate node twice produces identical external effects"
    negative_injection: "remove the content-addressed path from the training checkpoint"
    expected_on_injection: "a second run overwrites the first"
    verified_blocks: false

  - id: L1-GALLERY-FROZEN
    target: n13_train_stage2
    target_kind: node
    asserts: "the gallery tower receives no gradient and is in eval mode"
    negative_injection: "leave requires_grad True"
    expected_on_injection: "gallery parameters accumulate gradient"
    verified_blocks: false
    note: "[PAPER 2.6] 'Only the query-side fuser and the ESSGNN module are updated; the gallery encoder is frozen'."

  - id: L1-CKPT-TRAINABLE-ONLY
    target: stage1_ckpt
    target_kind: channel
    asserts: >
      Every checkpoint holds ONLY parameters with requires_grad True at save
      time. n_params_saved matches the optimizer's parameter count, and no
      ViT-bigG-14 tensor appears in the state dict.
    negative_injection: "save model.state_dict() whole"
    expected_on_injection: >
      n_params_saved jumps by ~2.5 billion, the file grows past 10 GB, and
      OpenCLIP keys appear in the state dict
    verified_blocks: false
    note: >
      [DISK] Recorded before n10 is written, because the failure is silent until
      it is expensive: torch.save on the dual tower includes the frozen
      ViT-bigG-14 -- 2.5B parameters, 10.2 GB -- which is reconstructible from
      the pinned OpenCLIP weights and moves not at all. Table 3 has ten variants
      plus the main line: 1.9 GB against 112 GB, on a SHARED volume with 374 GB
      free.
      The check is on the state dict's KEYS, not on file size, because a size
      threshold would pass a checkpoint that happens to be small for another
      reason -- a variant that trained fewer modules, say -- and would need
      retuning every time the architecture changed.

  - id: L1-STAGE2-SAMPLE-CONSTRUCTION
    target: n13_train_stage2
    target_kind: node
    asserts: >
      The Stage 2 sampler obeys stage2_protocol: the target is absent from the
      graph the layout encoder receives; every eligible instance of a house is
      enumerated, not a fixed k; the enumeration is identical across reruns with
      the same seed; and no contrastive batch contains two samples with the same
      positive_asset_id.
    negative_injection: >
      four, run separately: (1) leave the target in G_context; (2) set
      samples_per_house to fixed_k; (3) set instance_resampling to per_epoch;
      (4) let one batch carry the same positive_asset_id twice.
    expected_on_injection: >
      (1) the target's own node id appears in the graph handed to ESSGNN;
      (2) the enumerated sample count no longer matches the eligible instance
      count; (3) two runs at the same seed produce different sample sets;
      (4) the batch's positive ids are not unique.
    verified_blocks: false
    note: >
      [U-08d / U-08e] Both decisions were recorded in stage2_protocol and in
      three documents, and neither was enforceable: nothing read the fields, so
      a DataLoader could ignore all six and every structural check would stay
      green. That is the same shape as the U-08a schema drift -- a decision that
      exists only as a value nobody validates.
      Injection (1) is the one that matters most and the one that would be
      hardest to notice afterwards. A target left in G_context makes the loss
      fall faster, which reads as the model learning.
      Injection (4) is measurable rather than theoretical: at batch 64, 99.3% of
      batches drawn from the real frequency distribution contain a duplicate
      positive, and the duplicate's gallery embedding is bit-identical to the
      positive's because the encoder is frozen.

  - id: L1-STAGE2-QUERY-ENCODERS-FROZEN
    target: n13_train_stage2
    target_kind: node
    asserts: >
      After one Stage 2 optimizer step, the query-side text, image and POINT
      encoders are all bit-identical to their Stage 1 values, and the only
      parameters that moved are the fusion module, the ESSGNN and lambda.
    negative_injection: "leave the query point encoder's requires_grad True, as Stage 1 sets it"
    expected_on_injection: "query PointBERT parameters change and the assertion fails"
    verified_blocks: false
    note: >
      [PAPER 2.6] "Only the query-side fuser and the ESSGNN module are updated;
      the gallery encoder is frozen." Both halves matter. An earlier plan checked
      only L1-GALLERY-FROZEN, but the query point encoder is the dangerous one:
      Stage 1 trains it (train_scope: point_encoder_and_fuser), so it arrives at
      Stage 2 with requires_grad already True and will keep training unless
      explicitly frozen. Nothing would have caught that.

  - id: L1-STAGE1-POINT-ENCODER-TRAINS
    target: n10_train_stage1
    target_kind: node
    asserts: >
      Under train_scope=point_encoder_and_fuser, one Stage 1 optimizer step
      changes PointBERT's parameters and pc_projection, while every
      ViT-bigG-14 parameter is bit-identical. Under fuser_only, PointBERT is
      bit-identical too.
    negative_injection: "freeze the point encoder while leaving train_scope on the main line"
    expected_on_injection: "PointBERT parameters are unchanged, revealing the fuser_only ablation running as the main line"
    verified_blocks: false
    note: >
      [PAPER 2.6 / 3.4] "Both query and gallery encoders are trained";
      "Fine-tuning the entire encoder outperformed training the fuser only"
      (8.7 against 11.4).
      This exists because the specification said one thing and the code did
      another for several rounds: ulip_backbone.py froze every parameter and
      wrapped all three encoders in no_grad, which IS the 8.7 row. Documents
      were corrected; the module was not. L2-TRAIN-SCOPE measures the same
      property at the training level -- this one pins it at the module, where
      the regression actually lived.

  - id: L1-STAGE1-CACHE-DISCIPLINE
    target: text_image_embeddings
    target_kind: channel
    asserts: >
      No cached point-cloud embedding is read on the main line. A cache of an
      encoder's output is only valid while that encoder is frozen, so a
      pc-embedding cache under train_scope=point_encoder_and_fuser is the
      fuser_only ablation by construction, whatever the config says.
    negative_injection: "add a pc_embeddings cache and read it in Stage 1"
    expected_on_injection: "the scan finds a cached pc read on the main line"
    verified_blocks: false

  - id: L1-ESSGNN-ARCH-PROTOCOL-APPLIED
    target: essgnn_arch_protocol
    target_kind: channel
    asserts: >
      The ESSGNNConfig the trainer builds equals the resolved protocol field by
      field: use_io_projections, distance, coord_feat, layer_sharing, pooling,
      hidden_dim, n_layers. Any mismatch refuses to start.
    negative_injection: "resolve the protocol with layer_sharing=shared but build the config with independent"
    expected_on_injection: "the comparison fails and Stage 2 does not start"
    verified_blocks: false
    note: >
      A gate that checks a protocol is RESOLVED has not checked that the
      protocol was FOLLOWED. Without this the channel records an intention
      while the model runs something else -- the same protocol-versus-code
      divergence this project has now corrected several times, just relocated
      one level up.
      Two of these fields only became checkable when they became executable:
      `distance` and `layer_sharing` were declarable in the protocol before
      ESSGNNConfig had them at all, so a run could declare `euclidean` and
      `shared` and still execute squared distance over independent layers.

  - id: L1-ESSGNN-PAPER-LOCKED-CONFIG
    target: metafind/models/essgnn.py
    target_kind: node
    asserts: >
      h0_mode == "semantic", coords_agg == "sum", edge_proj_dim is None and
      normalize_coord_diff is False in every run of the main line, and
      ESSGNNConfig.from_protocol forces them regardless of the protocol.
    negative_injection: "set normalize_coord_diff=True in the trainer's config"
    expected_on_injection: "the assertion fails; the coordinate update is a different model"
    verified_blocks: false
    note: >
      A DIFFERENT KIND of decision from the fields in essgnn_arch_protocol, and
      mixing the two would blur the distinction the registry exists to keep.
      The protocol holds questions the paper leaves open, which a person must
      answer (U-33, U-17, U-26, U-31). These four are our primary READING of
      things the paper does state or imply:
        h0_mode=semantic            Appendix C's premise; Concat(x,t) is RA-1
        coords_agg=sum              Eq. 3 sums; reference EGNN defaults to mean
        edge_proj_dim=None          the paper has no such layer
        normalize_coord_diff=False  nor any normalisation of (x_i - x_j)
      Without this, a config could satisfy every protocol field and still be a
      different model: normalize_coord_diff=True replaces (x_i - x_j) with a
      unit vector, and edge_proj_dim=64 inserts a layer the paper lacks.
      L1-ESSGNN-ARCH-PROTOCOL-APPLIED does not compare them -- they are not
      protocol fields.

  - id: L1-ABLATION-INFERENCE-ONLY
    target: n18_train_ablations
    target_kind: node
    asserts: >
      No checkpoint is produced for any variant whose requires_training is false;
      the "w/o iterative retrieval" row resolves to the Full checkpoint named by
      reuses_ckpt, with composition_mode: parallel.
    negative_injection: "mark the iterative row requires_training: true"
    expected_on_injection: "a second checkpoint appears for a row that is not a different model"
    verified_blocks: false
    note: >
      Algorithm 1 is an inference-time procedure (paper 2.7). Training a model
      for "w/o iterative retrieval" would compare two different checkpoints and
      attribute the difference to the composition strategy.

  - id: L1-TEXT-SERIALIZATION
    target: n06_encode_text_image
    target_kind: node
    asserts: >
      The annotation -> string serialization is a pinned template: a fixed
      golden annotation produces a byte-identical string, and its embedding is
      stable across runs.
    negative_injection: "reorder two fields in the template"
    expected_on_injection: "the golden string comparison fails"
    verified_blocks: false
    note: >
      [UNKNOWN U-15] Paper 2.3 lists the fields ("object category, size
      dimensions, materials, and placement constraints") but gives no
      serialization format. Whether the encoder sees "wooden dining chair" or a
      labelled multi-line record or raw JSON changes every text embedding. The
      template is ours; this test stops it changing silently.

  - id: L1-TEXT-TOKEN-BUDGET
    target: n06_encode_text_image
    target_kind: node
    asserts: >
      Every serialized annotation is COUNTED against the text encoder's context
      length before it is encoded, and one that exceeds it is recorded rather
      than truncated. No asset reaches the encoder whose placement constraint
      was silently dropped.
    negative_injection: "encode without counting, letting the tokenizer truncate"
    expected_on_injection: "an over-length annotation encodes with no record of the loss"
    verified_blocks: false
    note: >
      MEASURED: the pinned text encoder is OpenCLIP ViT-bigG-14 (U-20, and
      ulip_backbone.py:90 EMBED_DIM = 1280), which truncates at 77 tokens
      SILENTLY. This note said "CLIP ViT-B/32", the 512-d encoder U-20
      SUPERSEDED on 2026-08-27 -- the 77-token budget happens to be the same
      for both, so the number stayed right while the encoder named was wrong,
      which is exactly the kind of agreement that hides. The pinned
      template puts the description first, so an overlong one does not lose
      itself -- it loses the TAIL, where placement_constraints lives. n05b caps
      description, category, materials and placement by CHARACTER count, which
      after the caps holds 1,406 real annotations to 70 tokens worst case with
      none over 77. But characters are not tokens: an artificial 40-character
      run of one letter still reaches 81. The character caps are a bound on the
      realistic case; this check is the bound on the rest, and it belongs to
      n06 because n06 owns the tokenizer. Same principle as
      L1-SEMEDGE-NO-ZEROFILL -- a degraded input must be visible, not quiet.

  - id: L1-IMAGE-AGGREGATION
    target: n06_encode_text_image
    target_kind: node
    asserts: >
      The 11-view -> single-embedding rule is the one declared in the run config,
      is applied identically at training and evaluation time, and is recorded
      alongside the embedding.
    negative_injection: "mean-pool at training time and take view 0 at evaluation time"
    expected_on_injection: "the recorded rule and the applied rule disagree"
    verified_blocks: false
    note: >
      [UNKNOWN U-14] Paper 2.3 says each asset is "rendered from 11 orthogonal
      viewpoints" and never says how those become the single e_image that Eq. 6
      consumes. Four of Table 1's seven conditions depend on the answer. The
      failure this guards against is not choosing wrong -- it is choosing
      differently in two places.

  - id: L1-NODE-TEXT-POS-INDEPENDENT
    target: procthor_object_text
    target_kind: channel
    asserts: >
      No object description used to build t_i contains world-frame coordinates,
      an orientation, or any other function of x: no numeric triples, no
      "at (x, y, z)", no "facing north", no distances in metres. Rebuilding the
      text after translating and rotating the whole house yields byte-identical
      strings.
    negative_injection: "append the object's position to its description"
    expected_on_injection: "the translated house produces different text and the assertion fails"
    verified_blocks: false
    note: >
      [APPENDIX C PREMISE] The proof assumes h^0 is invariant to SE(3)
      transforms of x. We satisfy that by setting h^0 = t_i (RA-1) -- but only
      if t_i itself does not depend on x. A description like "red chair located
      at (4.1, 0.0, -2.6)" makes t_i = t_i(x) and silently breaks the premise
      again, one level down.
      This runs BEFORE training. n14 would catch the consequence, but only
      after a full Stage 2 run has been spent.

  - id: L1-SEMEDGE-POS-INDEPENDENT
    target: sem_edge_cache
    target_kind: channel
    asserts: >
      The prompt that produces a relation sentence, and the sentence itself,
      contain no world-frame coordinates or orientations. Two houses identical
      up to a rigid transform produce the same cache key and the same e_ij.
    negative_injection: "include both objects' positions in the relation prompt"
    expected_on_injection: "the transformed house produces a different cache key and a different embedding"
    verified_blocks: false
    note: >
      [APPENDIX C] "these semantic edge embeddings are invariant to the input
      node positions x, as they depend solely on object-level text
      descriptions". That is stated as a PREMISE of the proof, not as something
      the implementation gets for free -- the descriptions are ours to build,
      and nothing stops coordinates entering them.

  # ---- gates
  - id: L1-GATE-NORECORD
    target: gate_records
    target_kind: channel
    asserts: "a missing gate record is treated as NOT PASSED and downstream refuses to run"
    negative_injection: "treat a missing record as pass-by-default"
    expected_on_injection: "downstream runs"
    verified_blocks: false

  - id: L1-GATE-RC1
    target: gate_records
    target_kind: channel
    asserts: "rc=1 (the checker itself errored) is never conflated with rc=2 (the data failed)"
    negative_injection: "map any exception to rc=2"
    expected_on_injection: "a script bug is reported as a data problem"
    verified_blocks: false

# ================================================================== L2
level_2:

  - id: L2-PC-COLOUR-COVERAGE
    target: pointclouds
    target_kind: channel
    asserts: >
      The corpus-wide rate of colour_source == fallback_grey, and the mean
      coloured_point_fraction, are within tolerance of the values measured on
      the smoke corpus with the same sampler_version. A regression that
      silently turns the colour channel constant changes these and nothing
      else.
    negative_injection: "revert to reading colours after trimesh concatenates the scene"
    expected_on_injection: "the grey rate jumps to ~100% while every shape and normalisation check still passes"
    verified_blocks: false
    note: >
      This exists because it already happened three times while implementing
      n03: 40 of 40 grey, then 14 of 40 lost, then 27 of 60 grey. Each produced
      clouds that were (10000, 6), finite, correctly normalised and
      non-degenerate -- everything G2 checked -- and would have trained.
      Baseline comes from the smoke corpus, not from a guess; a threshold
      invented before measuring would be a number nobody could defend.
      MEASURED 2026-08-15, sampler_version 3, 60 assets: colour_source =
      {texture 33, flat 18, gltf_default 9}, fallback_grey 0, mean
      coloured_point_fraction 1.000. Against ULIP's released clouds for the 6
      comparable assets, mean absolute difference in rgb mean is 0.0021 (F21).

  - id: L2-PC-SELF-CONSISTENT
    kind: scientific
    seam: "n03 -> the frozen ULIP-2 point encoder"
    asserts: >
      A cloud sampled from mesh A, encoded by the frozen checkpoint, is closer to
      an independently resampled cloud of the same mesh than to clouds of 1,000
      other assets -- and by a wide margin.
    method: "resample each of 500 meshes twice with different seeds; compare paired cosine against the off-diagonal distribution"
    tolerance: "paired mean must exceed the cross-asset mean by a wide, pre-registered margin"
    sample: fixture
    negative_injection: "sample 500 points instead of 10,000"
    expected_on_injection: "paired similarity collapses toward the baseline"
    verified_blocks: false
    cited_by_gate: G2_pc_sanity
    note: >
      This is the part of the old L2-PC-DISTRIBUTION that does not depend on
      ULIP's released clouds, and therefore the part that can gate. It catches a
      sampler producing noise while requiring no external reference.

  - id: L2-PC-ULIP-REF
    kind: scientific
    seam: "self-sampled point clouds vs ULIP's released clouds"
    asserts: >
      For a small reference sample, cos(ULIP's cloud, our cloud) through the same
      encoder is far above the cross-asset baseline.
    method: "download a reference subset of ULIP's released clouds; encode both; compare paired cosine against the off-diagonal distribution"
    tolerance: "reported, not thresholded"
    sample: fixture
    negative_injection: "sample 500 points instead of 10,000"
    expected_on_injection: "paired similarity collapses toward the baseline"
    verified_blocks: false
    blocks: false
    cited_by_gate: ""
    note: >
      [UNKNOWN U-02, DEMOTED FROM GATE] Diagnostic only. A low score here is
      informative -- it says our preprocessing differs from ULIP's -- but it does
      not invalidate the reproduction, because the paper never says MetaFind
      reuses ULIP's pre-sampled clouds and Stage 1 fine-tunes the point encoder
      anyway. Recorded in the report either way.
      It is also the evidence for not downloading ULIP's 185 GB of clouds.
      [DUPLICATE KEY REMOVED] This entry carried two `note:` keys. YAML keeps the
      last silently, so the whole justification above was discarded at parse time
      and only the one-line version survived -- invisible to any tool that reads
      the parsed document rather than the file. `cited_by_gate` also still named
      G2_pc_distribution, a gate that no longer exists, while the entry itself
      says it was demoted out of gating.

  - id: L2-EQUIVAR-COORD
    kind: scientific
    seam: "ESSGNN layer"
    asserts: "||x^(l+1)(Rx+T) - (R x^(l+1)(x) + T)||inf < 1e-4 per layer"
    method: "random SO(3) via QR with the reflection removed; translations up to 1e3"
    tolerance: "1e-4"
    sample: fixture
    negative_injection: "make f_x output R^3 and multiply elementwise"
    expected_on_injection: "the error grows by orders of magnitude (RA-2)"
    verified_blocks: false
    cited_by_gate: ""

  - id: L2-EQUIVAR-FEAT
    kind: scientific
    seam: "ESSGNN layer"
    asserts: "h^(l+1)(Rx+T) == h^(l+1)(x) -- features are INVARIANT"
    method: "same transforms"
    tolerance: "1e-8"
    sample: fixture
    negative_injection: "use h0 = Concat(x, t)"
    expected_on_injection: "invariance breaks (RA-1)"
    verified_blocks: false
    cited_by_gate: ""

  - id: L2-EQUIVAR-LAYOUT
    kind: scientific
    seam: "ESSGNN readout"
    asserts: "e_layout(Rx+T) == e_layout(x) -- the pooled output is INVARIANT"
    method: "same transforms, measured on the pooled vector"
    tolerance: "1e-8"
    sample: fixture
    negative_injection: "assert R*e_layout + T instead"
    expected_on_injection: "the assertion is ill-typed and fails"
    verified_blocks: false
    cited_by_gate: ""
    note: >
      [EARLIER ERROR] An earlier draft had a single criterion asserting R*ESSGNN(x)+T for e_layout
      and called it the coordinate channel. e_layout is pooled from h, which is
      invariant; applying R and T to it has no geometric meaning.

  - id: L2-LEAK-OBJECT
    kind: scientific
    seam: "n09_build_splits -> Stage 1"
    asserts: "train_ids and test_ids are disjoint"
    method: "set intersection"
    tolerance: exact
    sample: full
    negative_injection: "move one test asset into the train set"
    expected_on_injection: "leakage_count == 1 and G3_object_corpus fails"
    verified_blocks: false
    cited_by_gate: G3_object_corpus

  - id: L2-LEAK-SCENE
    kind: scientific
    seam: "n09c_build_scene_splits -> Stage 2"
    asserts: "train_houses and test_houses are disjoint"
    method: "set intersection"
    tolerance: exact
    sample: full
    negative_injection: "move one test house into the train set"
    expected_on_injection: "leakage_count == 1 and G6_stage2_ready fails"
    verified_blocks: false
    cited_by_gate: G6_stage2_ready
    note: >
      [SPLIT OUT of the old single L2-LEAK] Object and house leakage are now
      guarded by different gates, because the branches were decoupled: object
      leakage invalidates Stage 1 (G3), house leakage invalidates Stage 2 (G6).
      One check citing only G3 would have left house leakage ungated.
      Asset-level disjointness is deliberately NOT asserted; see
      L1-SPLIT-NO-ASSET-DISJOINTNESS.

  - id: L2-COMPLETE
    kind: structural
    seam: "every fan-out -> reduce"
    asserts: "admitted + quarantined == len(manifest); no duplicates; no unexpected members"
    method: "set algebra over uids"
    tolerance: exact
    sample: full
    negative_injection: "drop one worker result silently"
    expected_on_injection: "the equality fails"
    verified_blocks: false
    cited_by_gate: G3_object_corpus
    note: >
      [MEASURED 2026-08-16] `quarantined` here means UNIQUE uids MINUS the
      admitted set, and both subtractions are load-bearing. The quarantine
      channel is append-only and written as failures happen, so n04's file holds
      143 records for 99 distinct uids -- a uid reappears each time a batch
      retried it. Two of those 99 succeeded on a later pass and are in the
      renders index as well. Taking the file at face value gives
      45,955 + 99 = 46,054 against a 46,052 manifest, and the equality this
      check asserts FAILS by exactly the two recovered assets. The danger is not
      the arithmetic, it is the repair: the obvious way to make a failing
      equality pass is to loosen it. Counting lines instead of uids inflates the
      rate the other way, 0.31% against a true 0.21%, which would be reported
      against G3's 2% ceiling as if it were the measured value.

  - id: L2-RESUME
    kind: resume_equivalence
    seam: "the whole interruptible pipeline"
    asserts: >
      kill -9 mid-stage and restart. For PREPROCESSING artifacts -- point clouds,
      renders, annotations, embeddings, semantic edges, splits, the gallery index
      -- the result is byte-identical and the external call count does not
      increase. For TRAINING, the restart resumes from the saved optimizer and
      RNG state, the step counter continues rather than restarting, and no
      sample is consumed twice within an epoch.
    method: "run twice, once interrupted; diff artifact hashes and the cost ledger; for training, diff the resumed state dict against the pre-kill checkpoint"
    tolerance: "exact for preprocessing artifacts; state-continuation for training"
    sample: pilot
    negative_injection: "decide completion on file existence rather than content hash"
    expected_on_injection: "a truncated file is treated as complete"
    verified_blocks: false
    note: >
      [CORRECTED] SC-8 previously demanded byte-identical artifacts everywhere,
      which contradicts NS-4 and NS-5 in the spec: scatter_add_ atomics and
      training stochasticity are declared non-removable and exact reproducibility
      is explicitly not claimed. A checkpoint cannot be both. Byte-identity is
      the right bar for deterministic preprocessing and the wrong bar for a
      training run.
    cited_by_gate: ""

  - id: L2-GALLERY-SELF
    kind: scientific
    seam: "n11 -> G4 -> n12"
    asserts: >
      For 1000 sampled gallery vectors used as their own queries, the target's
      similarity EQUALS the maximum similarity and the target is a member of the
      argmax tie set.
    method: "exact inner product self-retrieval, compared as sim[target] == sim.max()"
    tolerance: exact
    sample: "1000 gallery vectors, drawn with splits.split_seed and pinned in the gate record by sample_uid_sequence_sha256"
    negative_injection: "shuffle the index id mapping -- [REFUTED 2026-08-30: THIS CONTROL DOES NOT FIRE]"
    expected_on_injection: >
      [REFUTED 2026-08-30. The injected index PASSES.] This said "the target's
      score stops being the maximum and the index is not promoted". It does not.
      The criterion scores each gallery ROW against ITSELF, so shuffling ids
      against rows leaves every similarity bit-identical and every target still
      tied for the maximum. Held as a NAMED TEST rather than a comment:
      tests/test_gallery_freeze_gate.py::test_the_declared_negative_injection_does_not_fire
      asserts PASS, and goes red the day someone strengthens the criterion so
      the injection does fire.
      Detecting a row/id misalignment needs a reference OUTSIDE the index --
      re-encoding a sampled asset with the checkpoint and comparing it against
      the row its id claims -- which this criterion does not specify and the
      gate does not do. G4 records `observed.ids_are_sorted` so the shuffle is
      at least VISIBLE in the artifact; that is not a pass condition and it is
      not a substitute for a control that fires.
      This entry is the SINGLE item in G4's `evidence:` list, which is why the
      refutation is filed here and not only under the gate: a reader who runs
      the declared injection, sees PASS, and finds no marking here concludes
      either that the gate is broken or that the control fired.
    verified_blocks: false
    cited_by_gate: G4_gallery_freeze
    note: >
      [CORRECTED] The assertion was recall@1 == 1.0, which is not tie-safe: two
      assets with identical embeddings make argmax return either id, so a
      correctly built index can score below 1.0 and a broken one can reach it.
      What the gate actually needs to know is that the target is ranked top,
      ties included.

  - id: L2-DUAL-PROTOCOL
    kind: structural
    seam: "n15_eval_retrieval"
    asserts: >
      Both gallery protocols produce a complete set of R@1/R@5, each recording
      its own n_gallery, and the two n_gallery values differ.
    method: "compare the recorded denominators against eval_protocols"
    tolerance: exact
    sample: full
    negative_injection: "run only one protocol"
    expected_on_injection: "the completeness check fails"
    verified_blocks: false
    cited_by_gate: ""
    note: >
      [U-09] An earlier draft locked a single gallery size and planned to back-solve it from
      the baselines' 98-99% PC-Only figure. That cannot work: PC-Only uses a
      query embedding identical to its own gallery entry, so self-retrieval
      approaches 100% at either size.

  - id: L2-JOIN-GROUPS
    kind: structural
    seam: "n20_aggregate dual join groups"
    asserts: "a missing `core` member does not trigger; a missing `extended` member does, and records a narrowed claim"
    method: "two runs, one withholding n15, one withholding n19"
    tolerance: exact
    sample: fixture
    negative_injection: "put every edge in one `all` group"
    expected_on_injection: "one failed ablation blocks the whole report"
    verified_blocks: false
    cited_by_gate: ""

  - id: L2-DEADLOCK
    kind: structural
    seam: "SG4 feedback edge"
    asserts: "the C3 feedback edge sits in its own join group and the cycle progresses"
    method: "run a 5-object composition to completion"
    tolerance: exact
    sample: fixture
    negative_injection: "move the feedback edge into the init group"
    expected_on_injection: "deadlock -- iteration 2 waits for an edge that never arrives"
    verified_blocks: false
    cited_by_gate: ""

  - id: L2-ROUTING-COV
    kind: routing_coverage
    seam: "all decision points"
    asserts: "every destination is exercised at least once, including EXHAUSTED, BLOCKED and HALT"
    method: "coverage counter per (decision_point, destination)"
    tolerance: exact
    sample: fixture
    negative_injection: "remove the fixture that triggers quarantine"
    expected_on_injection: "an unexercised destination is reported"
    verified_blocks: false
    cited_by_gate: ""

  - id: L2-COST-BOUND
    kind: cost
    seam: "whole graph"
    asserts: "one full run stays within the declared GPU-hour, wall-clock and storage budgets"
    method: "compare cost_ledger totals against the declared bounds"
    tolerance: "hard cap"
    sample: full
    negative_injection: "remove the per-stage budget check"
    expected_on_injection: "the run exceeds the cap without entering BLOCKED"
    verified_blocks: false
    cited_by_gate: G5_report_release

  - id: L2-DEGRADE-VISIBLE
    kind: structural
    seam: "degraded_flags -> report"
    asserts: "every degradation path writes a flag and the flag reaches the published report"
    method: "force each degradation and grep the report"
    tolerance: exact
    sample: fixture
    negative_injection: "degrade without writing the flag"
    expected_on_injection: "the report looks normal while the result is degraded"
    verified_blocks: false
    cited_by_gate: G5_report_release

  - id: L2-TRAIN-SCOPE
    kind: scientific
    seam: "n10_train_stage1"
    asserts: >
      Under train_scope=point_encoder_and_fuser the point encoder's parameters
      change during training; under fuser_only they do not.
    method: "snapshot parameters before and after, compare"
    tolerance: exact
    sample: fixture
    negative_injection: "run the main line with a frozen point encoder"
    expected_on_injection: "the parameters are unchanged, revealing it is the fuser_only ablation"
    verified_blocks: false
    cited_by_gate: ""
    note: >
      This is the test that would have caught the worst earlier error: it installed the
      Table 3 'train fuser only' row (8.7) as the primary path against the full
      model's 11.4.

# ================================================================== L3
level_3_gates:

  - gate_id: G1_sources_valid
    gate_class: G-INVALID
    justification: >
      "If we carry this error forward, does the conclusion still hold?" -- no.
      Processing an incomplete asset set silently changes every denominator, and
      an unverified checkpoint produces plausible embeddings that encode nothing.
    record_kind: gate
    position: "between n02_download and the processing stages"
    criterion: >
      manifest present and parseable
      AND len(glbs_on_disk) / len(manifest) >= 0.98
      AND the ULIP-2 checkpoint passes a behavioural check, not merely a sha256
      AND procthor_dataset is populated with all three splits and their counts
    evidence: [L1-ENV-ULIP, L1-MANIFEST]
    rc_contract: {PASS: 0, FAIL: 2, BLOCKED_EVIDENCE: 3, INVALIDATED: 4}
    record_path: "outputs/logs/gates/G1_sources_valid.yaml"
    implemented: false
    record_fields: [gate_id, gate_class, scope, record_kind, criterion, inputs, observed, verdict, rc, timestamp, code_revision, is_terminal]
    on_fail: "Resume the download. Never lower the coverage threshold to pass."
    downstream_blocked: [n03_sample_pointclouds, n04_render_views, n07_scene_graphs]

  - gate_id: G2_pc_sanity
    gate_class: G-INVALID
    justification: >
      A point cloud that is malformed, degenerate or wrongly normalised makes
      every point-cloud embedding silently wrong, and every retrieval number
      built on it invalid, with no error anywhere. That is an invalidity
      condition and belongs in a gate.
    record_kind: gate
    position: "between n03_sample_pointclouds and n09_build_splits"
    criterion: >
      Every admitted cloud is (10000, 6), finite, pc_norm'd (centroid within
      1e-5 of the origin, max radius within 1e-5 of 1) and non-degenerate
      RELATIVE TO ITS OWN MESH -- a cloud may be flat along an axis only if the
      mesh's raw_bbox_extents is flat along that axis too; its rgb columns lie in [0, 1] with
      rgb_scale == "unit" and a recorded colour_source; the corpus-wide
      fallback_grey rate and mean coloured_point_fraction are within tolerance
      of the smoke-corpus baseline for this sampler_version; and a sampled
      cloud encoded by the frozen checkpoint retrieves its own asset far above
      chance against a 1,000-asset probe set.
    evidence: [L1-PC-SHAPE, L1-PC-NORM, L1-PC-RGB-SCALE, L1-PC-COLOUR-PROVENANCE, L2-PC-COLOUR-COVERAGE, L2-PC-SELF-CONSISTENT]
    rc_contract: {PASS: 0, FAIL: 2, BLOCKED_EVIDENCE: 3, INVALIDATED: 4}
    record_path: "outputs/logs/gates/G2_pc_sanity.yaml"
    implemented: false
    record_fields: [gate_id, gate_class, scope, record_kind, criterion, inputs, observed, verdict, rc, timestamp, code_revision, is_terminal]
    on_fail: "Fix the sampler. Never relax the thresholds to pass."
    downstream_blocked: [n09_build_splits, n10_train_stage1]
    rescoped: >
      [NARROWED, and the reason matters] This gate previously required our
      sampled clouds to match ULIP's RELEASED clouds through the same encoder,
      failing the run otherwise. That criterion tested a proposition the paper
      never makes: nothing in MetaFind says it reuses ULIP's pre-sampled point
      clouds, and Stage 1 fine-tunes the point encoder (paper 2.6), so the
      encoder is free to adapt to our sampling. "Differs from ULIP's released
      cloud" therefore does not imply "reproduction invalid".
      The comparison is still worth having and is kept as L2-PC-ULIP-REF, a
      diagnostic. It is being demoted because it was testing the wrong claim,
      and for no other reason. (Removed 2026-08-30: this previously added "it
      has never been run, and the reference clouds are not on disk". Both
      clauses were retracted; neither is an argument for the demotion anyway,
      so restating them here only reintroduced a withdrawn claim as support.) If the authors are found to state
      that MetaFind reuses ULIP's preprocessing, it goes back to being a gate.

  - gate_id: G3_object_corpus
    gate_class: G-INVALID
    justification: >
      Split leakage makes every retrieval number meaningless, and the error is
      invisible in the output.
    record_kind: gate
    position: "between n09_build_splits and n10_train_stage1"
    criterion: >
      object-level leakage_count == 0
      AND admitted + quarantined == len(manifest)
      AND quarantine_rate <= 0.02
      AND both evaluation protocols are defined with explicit query and gallery scopes
      AND stage1_encoding_protocol.status == "resolved", with text_serialization,
          image_aggregation, paper_clip_train_scope, actual_clip_train_scope and
          missing_modality_representation each naming a choice
      AND paper_clip_train_scope_basis is non-empty
      AND paper_clip_train_scope_confidence in {low, moderate, high}
          -- without these two, a protocol reading `paper_clip_train_scope: frozen`
          with an empty basis PASSES, and n21 reaches the report with a decision
          it cannot cite. The scope alone does not say why.
          (U-15, U-14, U-34 x2, U-11)
          [CORRECTED] This listed three fields after the channel grew to five.
          A protocol missing paper_clip_train_scope or
          missing_modality_representation therefore PASSED the gate and was
          then rejected by Stage1RuntimeConfig.from_protocols. Failing closed
          at the executor is right, but a gate that says PASS on something the
          executor refuses is not a barrier -- it is a second opinion nobody
          asked for.
      AND stage1_protocol.status == "resolved", with fusion, tower_sharing,
          allow_all_masked, similarity and hyperparameter_config_hash each
          naming a choice (U-13, U-16, U-23, U-24, U-22)
      AND stage1_hyperparameters.sha256 == stage1_protocol.hyperparameter_config_hash,
          and stage1_hyperparameters.values names every field of U-22
          (optimizer, learning_rate, weight_decay, scheduler, batch_size,
           epochs, p_mask, init_temperature, learnable_temperature,
           max_logit_scale, seed) -- presence of the hash is not enough,
          because a hash nothing dereferences leaves the run on library
          defaults. [CORRECTED] This clause used to demand a dereference G3 had
          no channel to perform: the artifact existed only as a dict passed
          into Python from outside the graph.
      AND stage1_hyperparameters.values.p_mask == 0.30 unless the run is a
          declared Table 3 modality-dropout variant
          (paper 2.6 fixes 30%; Table 3 ablates 10% and 50%. Carrying p_mask
           in the U-22 artifact made a paper-stated constant look like one of
           the values the paper omits, so an artifact saying 0.50 would hash
           correctly and silently run the ablation as the main line.)
    evidence: [L2-LEAK-OBJECT, L2-COMPLETE, L1-PROTOCOLS-DEFINED, L1-QUAR-REASON, L1-STAGE1-PROTOCOL-APPLIED]
    scope_note: >
      [CORRECTED] The criterion said "at object and house level" and cited
      L2-LEAK, a check that no longer exists -- it was split into
      L2-LEAK-OBJECT and L2-LEAK-SCENE when the Objaverse and ProcTHOR branches
      were decoupled. Leaving house leakage here quietly reattached Stage 1 to
      the ProcTHOR branch through the validation contract, undoing the
      decoupling. House leakage belongs to G6_stage2_ready, in front of the
      spend that needs it.
      The two protocol clauses are what make n10 unable to start on silent
      defaults; an earlier attempt to add the first did not match the file text
      and was lost.
      [CORRECTED] This criterion still demanded image_aggregation,
      text_serialization and actual_clip_train_scope FROM stage1_protocol after those
      three fields had been moved to stage1_encoding_protocol. The gate was
      validating a schema that no longer existed -- it would have failed a
      correctly resolved pair, and it checked nothing about the channel that
      actually governs n06. Splitting the clause is not cosmetic: G3 is the
      formal barrier in front of Stage 1.
    rc_contract: {PASS: 0, FAIL: 2, BLOCKED_EVIDENCE: 3, INVALIDATED: 4}
    record_path: "outputs/logs/gates/G3_object_corpus.yaml"
    implemented: false
    record_fields: [gate_id, gate_class, scope, record_kind, criterion, inputs, observed, verdict, rc, timestamp, code_revision, is_terminal]
    on_fail: "Fix the pipeline and re-run. Do not widen the quarantine threshold."
    downstream_blocked: [n10_train_stage1, n13_train_stage2]

  - gate_id: G4_gallery_freeze
    gate_class: G-CONTAM
    justification: >
      "Once the bad thing is written in, can you still tell which parts are bad?"
      -- no. The gallery index is the shared immutable artifact every table reads;
      a corrupted one lowers every metric uniformly and leaves no signature.
    record_kind: gate
    position: "between n11_gallery_index_staging and n12_promote_index"
    criterion: >
      index width equals the checkpoint's embedding width
      AND index count equals len(admitted)
      AND no NaN and no zero vectors
      AND for each of 1000 sampled gallery vectors used as its own query,
          sim(target) == max(sim) and the target is a member of the argmax
          tie set
          [CORRECTED from "recall@1 == 1.0", which is not tie-safe: two
           identical embeddings let argmax return either id, so a correct index
           can score below 1.0 and a broken one can reach it]
    evidence: [L2-GALLERY-SELF]
    rc_contract: {PASS: 0, FAIL: 2, BLOCKED_EVIDENCE: 3, INVALIDATED: 4}
    record_path: "outputs/logs/gates/G4_gallery_freeze.yaml"
    history_path: "outputs/logs/gates/G4_gallery_freeze.history.yaml"
    history_note: >
      `record_path` holds the CURRENT terminal record, in the shape
      `record_fields` describes, and is what n12 reads. `history_path` holds
      every record ever written -- PASS, FAIL and BLOCKED_EVIDENCE alike -- as
      the `list[gate_record]` that graph_spec.yaml declares the gate-records
      channel to be, with `merge: append, lifetime: persistent`.
      (Channel named with a hyphen on purpose: check 8 blobs every field of this
      entry and would read the bare token as the CRITERION demanding a channel
      G4 does not read. G4 writes it.) The two documents describe
      this channel differently and both files are written so that neither is
      overruled. Without the history, a FAIL followed by a repaired re-run PASS
      destroyed the FAIL, and the run nobody needs a record of is the one that
      survived.
    implemented: true
    implementation: "metafind/gates/g4_gallery_freeze.py"
    record_fields: [gate_id, gate_class, scope, record_kind, criterion, inputs, observed, verdict, rc, timestamp, code_revision, code_dirty, runtime_source_sha256, runtime_source_status, is_terminal, index_uri, index_sha256, staging_record_sha256, stage1_checkpoint_sha256, gallery_encoder_sha256, expected_uid_set_sha256, sample_uid_sequence_sha256]
    record_fields_note: >
      Longer than the other gates' shared list, and the extra fields are the
      ones n12 READS. Promotion re-verifies three identities against the
      artifacts on disk -- staging record bytes, index bytes, checkpoint sha --
      and it must not have to dig them out of `observed`, whose shape depends on
      the verdict. `sample_uid_sequence_sha256` is what makes the "fixed 1000"
      auditable: the seed names a recipe whose output depends on the RNG
      implementation, the digest names what was actually drawn.
    observed_but_not_a_criterion: >
      `effective_rank` / `effective_rank_centred` and `ids_are_sorted` are
      RECORDED and are NOT pass conditions. Both exist because the criterion
      above cannot see what they measure. [MEASURED 2026-08-30] a fully
      collapsed gallery satisfies the corrected self-retrieval criterion in
      120 of 120 trials, because every vector ties for the maximum -- the
      [CORRECTED] change bought tie-safety and paid in collapse-blindness. And
      L2-GALLERY-SELF's own `negative_injection` ("shuffle the index id
      mapping") does NOT fail this criterion: it scores each gallery ROW against
      itself, so shuffling ids against rows leaves the arithmetic bit-identical.
      `tests/test_gallery_freeze_gate.py::test_the_declared_negative_injection_does_not_fire`
      holds that refutation. Detecting a row/id misalignment needs a re-encode
      against the checkpoint, which this criterion does not specify.
    on_fail: "Do NOT promote. Discard the staging index and rebuild; the promoted location stays untouched."
    downstream_blocked: [n12_promote_index, n15_eval_retrieval, n16_compose_scenes]

  - gate_id: G6_stage2_ready
    gate_class: G-INVALID
    justification: >
      "If we carry this error forward, does the conclusion still hold?" -- no.
      Eq. 7a/7b needs a gallery positive for the target object, and training
      Stage 2 with an undefined or silently defaulted positive makes every Table
      2 and Table 3 number meaningless with nothing in the output to show it.
      [REFRAMED 2026-08-16] U-08a and U-08b are RESOLVED, so this gate no longer
      waits for a decision -- it verifies the decision was IMPLEMENTED. That is
      a different and harder question: the resolution can be recorded in every
      document and still leave n13 with no ProcTHOR modalities to encode, no
      Stage 2 index to look a positive up in, and no way to tell whether the
      index was built by the frozen encoder or a drifted one. A protocol that
      exists only as prose is exactly what this gate now catches.
    record_kind: gate
    position: "between n09b_resolve_stage2_protocol and n13_train_stage2"
    criterion: >
      stage2_protocol.status == "resolved"
      AND stage2_protocol.gallery_scope == "procthor"
          AND stage2_protocol.positive_identity == "same_asset_id"   (U-08a)
      AND stage2_protocol.modality_source == "ai2thor_isolated"      (U-08b)
      AND procthor_asset_modalities is populated: every admitted assetId carries
          its text, its 11 isolated views and its depth-shell point cloud, each
          stamped with the ai2thor version, build hash and procthor revision
      AND stage2_gallery_index exists, its asset_ids cover every Stage 2 target,
          and its n_assets was DERIVED from the installed build rather than
          taken from any published figure (U-08c)
      AND stage2_gallery_index.gallery_encoder_sha256 == the Stage 1 checkpoint's
          gallery tower hash
          (2.6 freezes the gallery encoder DURING Stage 2. An index built by a
           drifted encoder trains the model against embeddings it will never
           produce at inference, and no term in the loss would reveal it. The
           equality is the only place that is checkable.)
      AND for every entry of stage2_positive_map, positive_asset_id equals the
          target's own assetId and is present in stage2_gallery_index
      AND stage2_protocol.sampling_unit == "object_instance"
          AND target_removed_before_essgnn == true
          AND samples_per_house == "all_eligible"
          AND instance_resampling == "fixed"
          AND epoch_definition is non-empty                       (U-08d)
          (target_removed_before_essgnn is the load-bearing one: leaving the
           target in G_context lets the layout encoder see the answer, the loss
           falls, and nothing downstream distinguishes that from learning.)
      AND stage2_protocol.batch_positive_uniqueness == true       (U-08e)
          (665,320 train instances over 1,467 assets. MEASURED: at batch 64,
           99.3% of batches contain a duplicate positive. A frozen encoder gives
           one assetId ONE embedding, so a duplicate is a negative that is
           bit-identical to the positive and the gradient asks the model to
           separate two identical vectors.)
      AND scene_splits is populated with disjoint train_houses and test_houses
          (house-level leakage_count == 0; moved here from G3, which no longer
           touches the ProcTHOR branch)
      AND stage2_protocol.scene_dropout_granularity is one of {batch, sample}
          (U-32: paper 2.6 says the layout vector "is omitted in 30% of
           BATCHES", which reads as one draw per batch, and which the
           implementation now follows; `sample` stays selectable as a variant. The two give different in-batch contrastive
           distributions, so Stage 2 must not start without the answer on
           record)
      AND essgnn_arch_protocol.status == "resolved", naming use_io_projections
          (U-33 -- an ARCHITECTURE difference inherited from the reference
           EGNN, not a hyperparameter, and not something a dataclass default
           may decide), distance (U-17), coord_feat (U-26), layer_sharing
           (U-31), pooling, hidden_dim, n_layers (U-22) and mlp_structure
           (U-35 -- MetaFind says only "approximated using MLPs", and EGNN's
            Appendix C specifies a DIFFERENT shape for each of its three
            functions, so one shared Linear-SiLU-Linear was a silent choice
            rather than the reference architecture)
      AND stage1_protocol.tower_sharing != "fully_shared"
          (U-16: 2.6 requires the gallery encoder frozen while the query-side
           fuser trains. If the towers are ONE module those cannot both hold,
           so `fully_shared` is a Table 1-only variant and must not enter a
           run that reaches Stage 2. MetaFindDualTower.freeze_gallery already
           refuses -- but it refuses inside n13, AFTER Stage 1 has spent hours
           training a checkpoint that was never usable. This is a
           deterministic incompatibility knowable at the gate.)
      AND essgnn_edge_protocol.status == "resolved", naming topology,
          physical_relation_encoding, semantic_missing_representation and
          directionality (U-29, U-30, U-19) -- without these the ESSGNN edge
          semantics are decided by whatever essgnn.py happens to do
    evidence: [L1-STAGE2-POSITIVE-DEFINED, L1-STAGE2-SAMPLE-CONSTRUCTION, L1-STAGE2-QUERY-ENCODERS-FROZEN, L2-LEAK-SCENE]
    rc_contract: {PASS: 0, FAIL: 2, BLOCKED_EVIDENCE: 3, INVALIDATED: 4}
    record_path: "outputs/logs/gates/G6_stage2_ready.yaml"
    implemented: false
    record_fields: [gate_id, gate_class, scope, record_kind, criterion, inputs, observed, verdict, rc, timestamp, code_revision, is_terminal]
    on_fail: >
      Do NOT re-decide U-08a or U-08b -- they are resolved. Find which part of
      the resolution was not built: the protocol record, the ProcTHOR modality
      artifact, the Stage 2 index, or the encoder-hash equality. Never fall back
      to a silent default positive.
    on_blocked_evidence: >
      Unresolved is rc=3, not rc=2: nothing is broken, a decision is outstanding.
      Everything upstream of Stage 2 continues.
    verdict_semantics: >
      Two failure modes deliberately share one gate because they guard one spend:
      protocol unresolved -> BLOCKED_EVIDENCE (rc=3); scene_splits leaked or
      absent -> FAIL (rc=2).
    scene_corpus_note: >
      [MOVED HERE from G3] Scene-corpus validity used to sit in G3, which meant
      Stage 1 -- object-level pretraining on Objaverse-LVIS that needs no
      ProcTHOR data at all -- waited on Qwen semantic-edge generation over
      ProcTHOR. A fault in the ProcTHOR branch stopped training that did not
      depend on it. The check belongs in front of the spend that needs it.
    downstream_blocked: [n13_train_stage2]

  - gate_id: G7_composition_protocol
    gate_class: G-INVALID
    justification: >
      Composing scenes against an undefined protocol produces numbers whose
      meaning cannot be stated afterwards. Algorithm 1 needs an initial graph, a
      query list, and a rule for what placing an asset does to the graph; the
      paper supplies none of the three, and the choice changes every retrieval
      after the first.
    record_kind: gate
    position: "between n15b_resolve_composition_protocol and n15c_prepare_eval_scenes"
    criterion: >
      composition_protocol.status == resolved
      AND source == "idesign_generated"
          [procthor_via_idesign is NOT accepted. U-27 measured that I-Design's
           only entry point is IDesign(no_of_objects, user_input,
           room_dimensions) -- there is no way to hand it a finished ProcTHOR
           house, and procthor_to_idesign_adapter does not exist. A gate that
           can mark a protocol "resolved" when nothing downstream can execute
           it is not a gate. U-21 resolved to Reading B; Reading A is the
           `procthor_leave_one_out` diagnostic only;
           RESOLVING to it is what is refused, and this line changes the moment
           the adapter is specified and validated.]
      AND g0_source,
      query_list_source, placement_rule, new_node_t_i, new_phys_edges and
      new_sem_edges are all populated with a stated method
      AND idesign_eval_requests holds exactly 200 entries
      AND every entry has a non-empty prompt, a recorded prompt_sha256, valid
          room_dimensions, n_objects > 0, a recorded seed and a provenance string
          (U-27: paper 3.3 gives "200 randomly sampled scenes" and nothing else.
           Under Reading B the prompts ARE the experiment, so an unrecorded
           prompt set is an unreproducible Table 2, and the failure mode is
           someone typing them at the console.)
      AND composition_protocol.new_phys_edges and new_sem_edges each name a
          concrete rule, not "recompute"
          (U-18: line 7 feeds line 3 of the next iteration. A field that says
           only "recompute" leaves ESSGNN reading edges nobody specified.)
    evidence: [L1-GATE-NORECORD]
    rc_contract: {PASS: 0, FAIL: 2, BLOCKED_EVIDENCE: 3, INVALIDATED: 4}
    record_path: "outputs/logs/gates/G7_composition_protocol.yaml"
    implemented: false
    record_fields: [gate_id, gate_class, scope, record_kind, criterion, inputs, observed, verdict, rc, timestamp, code_revision, is_terminal]
    on_fail: "Answer U-18 and U-21. Do not substitute ProcTHOR houses for I-Design scenes -- a house is a finished layout, not a generation request."
    downstream_blocked: [n15c_prepare_eval_scenes, n16_compose_scenes]
    verdict_semantics: >
      status != resolved -> BLOCKED_EVIDENCE (rc=3), not FAIL. Table 1 does not
      pass through this gate and continues regardless; only Table 2 and Table 3's
      two scene columns wait.

  - gate_id: G5_report_release
    gate_class: G-IRREVERSIBLE
    justification: >
      "Can it be undone afterwards?" -- no. Once published, readers may cite it.
      An erratum can be issued; the original claim cannot be recalled.
    record_kind: gate
    position: "between n21_compare_to_paper and n22_publish_report"
    criterion: >
      report_staging exists and its sha256 matches the artifact on disk
      AND every cell of aggregated_tables has a matching entry in
          comparison_results carrying exactly one of REPRODUCED /
          NOT_REPRODUCED / INSUFFICIENT_EVIDENCE
      AND report_staging.deviations_stated covers every id in
          boundary.deviations, plus D-1 when its active_if evaluates true
      AND report_staging.unknowns_disposed covers every id in
          risks_unknowns.unknowns
      AND every Required Audit has a record, whatever its outcome
      AND no table cell is blank
      [CORRECTED] This criterion previously spoke about "every table cell" and
      "the report body" while G5 read neither: n20 and n21 wrote only
      only a stage record, and the body did not exist until n22, AFTER the gate. It
      was a gate over a document that had not been written, in front of a node
      free to publish something else. n21 now stages the report, G5 verifies
      THIS artifact by sha256, and n22 publishes that exact sha256 -- the same
      shape as n11 staging the index, G4 verifying it and n12 promoting it.
    evidence: [L2-DEGRADE-VISIBLE, L2-COST-BOUND, L1-GATE-NORECORD]
    unknown_registry_note: >
      [CORRECTED] The criterion used to read "every UNKNOWN U-01..U-10". A range
      silently excludes anything added later, and U-11 through U-22 plus U-03a,
      U-08a and U-08b already exist -- so a new UNKNOWN could have been left out
      of the report while G5 still passed. The gate now iterates the registry.
    rc_contract: {PASS: 0, FAIL: 2, BLOCKED_EVIDENCE: 3, INVALIDATED: 4}
    record_path: "outputs/logs/gates/G5_report_release.yaml"
    implemented: false
    record_fields: [gate_id, gate_class, scope, record_kind, criterion, inputs, observed, verdict, rc, timestamp, code_revision, is_terminal]
    on_fail: "Fill the gaps and re-run the aggregation. Publication waits."
    downstream_blocked: [n22_publish_report]

# ==================================================================
gate_discipline:
  total_l1: 64
  total_l2: 18
  total_gates: 7
  rejected_gate_candidates:
    - {candidate: "all 7 modality conditions produced", why_not_a_gate: "fails all four criteria -- nothing is invalidated, contaminated, expensively redone or irreversible", demoted_to: L2}
    - {candidate: "annotation schema pass rate", why_not_a_gate: "a criterion inside G3, not a separate checkpoint", demoted_to: "criterion of G3"}
    - {candidate: "resume equivalence", why_not_a_gate: "failure means fix a bug, not stop the pipeline", demoted_to: L2-RESUME}
    - candidate: "equivariance holds"
      why_not_a_gate: >
        Tempting, but the paper contains two self-contradictions about it. A gate
        here invites relaxing the tolerance to accommodate the paper's own error.
        Measured as SC-4/5/6 and audited by RA-1/RA-2 instead.
      demoted_to: "SC-4/5/6 plus RA-1/RA-2"
    - {candidate: "ESSGNN improves object-level R@1", why_not_a_gate: "it is FALSE in the paper itself -- Table 1 shows w/ESSGNN is worse. A gate would block on correctly reproducing the paper.", demoted_to: "SC-2 direction check"}

required_audits:
  - audit_id: RA-1
    record_kind: required_audit
    blocks: false
    why_not_a_gate: >
      EXPECTED TO FAIL. It reproduces a contradiction in the source: 2.5
      specifies h0 = Concat(x_i, t_i) while Appendix C's proof explicitly assumes
      h0 is invariant to SE(3) transforms of x. Gating on it would mean blocking
      on the paper's own inconsistency, and the tempting fix -- loosening the
      tolerance -- is exactly what must not happen.
    criterion: "ESSGNN with h0 = Concat(x, t): coordinate equivariance and feature invariance under random (R,T)"
    claim_controlled: "We reproduced the literal formulation given in section 2.5."
    claim_on_failure: >
      "Section 2.5's h0 = Concat(x_i, t_i) is inconsistent with Appendix C's
      equivariance proof. Our results use h0 = t_i, the formulation the proof
      requires."
    must_not_affect: [G3_object_corpus, G4_gallery_freeze, G5_report_release, SC-4, SC-5, SC-6]
    record_path: "outputs/logs/audits/RA1_h0_concat.yaml"
    implemented: false

  - audit_id: RA-2
    record_kind: required_audit
    blocks: false
    why_not_a_gate: >
      EXPECTED TO FAIL. Section 2.5 types f_x as R^(2d+1+e) -> R^3, but
      Appendix C factors the rotation out as
      sum (Q x_i - Q x_j) phi_x = Q sum (x_i - x_j) phi_x, which holds only for a
      scalar phi_x. The reference EGNN agrees (coord_mlp ends in Linear(h, 1)).
    criterion: "ESSGNN with f_x -> R^3 and elementwise multiplication: coordinate equivariance under random (R,T)"
    claim_controlled: "We reproduced section 2.5's stated type for f_x."
    claim_on_failure: >
      "Section 2.5's f_x : ... -> R^3 is inconsistent with Appendix C's proof,
      which requires a scalar. Our implementation uses the scalar form."
    must_not_affect: [G3_object_corpus, G4_gallery_freeze, G5_report_release, SC-4, SC-5, SC-6]
    record_path: "outputs/logs/audits/RA2_fx_range.yaml"
    implemented: false

  - audit_id: RA-3
    record_kind: required_audit
    blocks: false
    why_not_a_gate: >
      [REFRAMED 2026-08-16] U-34 is RESOLVED to frozen for the reproduction
      mainline, so this audit no longer stands for an undecided reading. It
      measures the ALTERNATIVE full/OpenCLIP-trainable configuration for
      sensitivity and hardware feasibility only, and it settles nothing about
      D-1 -- D-1 is already inactive because paper and actual scope agree.

      MetaFind 3.4 concludes that fine-tuning the entire encoder beats training
      the fuser only, without saying which modules "entire" covers. Read as
      including OpenCLIP, ViT-bigG-14's 2.5B parameters must enter the
      optimizer on a 24 GB card. RA-3 attempts exactly that and records what
      happens.
      What a failure proves and does not prove: it shows THAT INTERPRETATION is
      infeasible on this hardware. It does not show the paper requires that
      interpretation -- ULIP-2, which MetaFind builds on, freezes OpenCLIP in
      its own 3.3, and the reproduction has resolved U-34 that way. Blocking on
      this would be blocking the mainline on the feasibility of a configuration
      the mainline does not use.
    criterion: "train_scope=full completes without exhausting GPU memory"
    claim_controlled: "We tested the alternative trainable-scope configuration rather than assuming it infeasible."
    claim_on_failure: >
      "'Entire encoder' in our reproduction means the 3D encoder plus fusion.
      OpenCLIP stays frozen. That is the reproduction's resolved reading of
      U-34, taken because MetaFind explicitly builds on ULIP-2, ULIP-2's own
      3.3 freezes OpenCLIP, and MetaFind never states a change to that policy --
      NOT because MetaFind says CLIP is frozen, which it does not say anywhere.
      Where the alternative trainable-scope configuration was attempted it did
      not fit on 24 GB, which bounds what we can say about that configuration --
      not what the paper says."
    must_not_affect: [G3_object_corpus, G4_gallery_freeze, G5_report_release, "other Table 3 rows"]
    record_path: "outputs/logs/audits/RA3_train_scope.yaml"
    implemented: false

  - audit_id: RA-4
    record_kind: required_audit
    blocks: false
    why_not_a_gate: >
      Measures a gap between what the paper claims and what it proves. Section
      2.5 motivates ESSGNN by saying "Standard Graph Attention Networks (GATs)
      are highly sensitive to global translation AND SCALING", and 3.4's
      takeaway repeats it. The property proved in Appendix C is SE(3)
      equivariance -- rotation and translation. SE(3) does not contain scaling.
      There is therefore NO STRUCTURAL GUARANTEE of scale robustness: under
      x -> s*x the message input ||x_i - x_j||^2 becomes s^2 ||x_i - x_j||^2,
      so every message changes by construction.
      [WORDING CORRECTED] An earlier version said the architecture "cannot be
      scale-invariant" and that this audit was "expected to fail". That is too
      strong. Absence of a structural guarantee is not proof of absence of the
      behaviour: the MLPs could still learn responses that are insensitive to
      scale over the range seen in training. This audit measures how much
      e_layout actually moves; it does not predict the answer.
      Gating on it would mean blocking on the paper's own overclaim.
    criterion: >
      Scale a scene by s in {0.5, 2, 10} with no other change and measure
      ||e_layout(s*x) - e_layout(x)||. Report it beside the translation and
      rotation numbers (SC-4/5/6), which DO hold.
    claim_controlled: "ESSGNN is robust to the global scaling that section 2.5 names."
    claim_on_failure: >
      "ESSGNN is equivariant to rotation and translation, as Appendix C proves
      and as we verify (SC-4/5/6). Scale robustness has no structural guarantee
      -- SE(3) excludes scaling -- and we measure e_layout's sensitivity to it
      rather than assuming either way. Our Table 3 ESSGNN-vs-GAT comparison
      supports the translation/rotation half of section 2.5's motivation with a
      proof; any scale-related benefit is empirical only."
    must_not_affect: [G3_object_corpus, G4_gallery_freeze, G6_stage2_ready, G5_report_release, "SC-4", "SC-5", "SC-6"]
    record_path: "outputs/logs/audits/RA4_scale_sensitivity.yaml"
    implemented: false
    note: >
      Found on a word-by-word re-reading of the paper, not by any structural
      check -- nothing in the graph was inconsistent, the paper was.

coverage_check:
  every_node_has_l1: true
  every_concurrent_channel_has_merge_test: true
  every_predicate_has_truth_table: true
  every_loop_has_bound_and_exhaustion_test: true
  every_seam_has_l2: true
  resume_equivalence_tested: true
  every_check_has_negative_injection: true
  no_existence_only_assertions: true
  open_items:
    - item: "verified_blocks is false for all 82 checks (64 L1 + 18 L2, COUNTED 2026-08-30 from this file; it said 75)"
      status: "BY DESIGN at specification time"
      action: "During implementation, flip each to true only after its negative injection has been observed to fail."
    - item: "every record_path in this file carries implemented: false"
      status: >
        OBSERVED DATA 2026-08-30. All seven gates and all four Required Audits
        declare a record_path under outputs/logs/gates/ or outputs/logs/audits/.
        NEITHER DIRECTORY EXISTS: data/outputs/logs/gates and
        data/outputs/logs/audits are both absent, and a repository-wide search
        (find -L, because data/ is a symlink) finds no directory named gates or
        audits and no G*_*.yaml or RA*_*.yaml record anywhere. Zero records have
        ever been written. The declarations are a contract, not a description.
      action: >
        Flip implemented to true per gate/audit only when that record file has
        actually been written by a run and its record_fields verified against
        what landed on disk. A record_path with no implemented flag reads as a
        working artifact to anyone who does not go look.
    - item: "I-Design's completion rate has no baseline"
      status: "R-01, PARTIALLY MEASURED 2026-08-15"
      action: >
        Installs; create_initial_design completes and passes I-Design's own
        schema validation; five attempts with a 7B planner produced zero
        finished scenes, each failing in a different downstream path. What is
        missing is a BASELINE: I-Design has not been run here with its original
        planner and neither paper names one, so those failures cannot yet be
        called defects rather than an ordinary rate. Establishing that -- by
        contacting the authors or running the original planner -- is the open
        action, not "trial-run it".
