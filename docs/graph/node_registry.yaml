    failure:
      classes: [TRANSIENT, DETERMINISTIC_INPUT, RESOURCE]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: quarantine, record_fields: [scene_id, step, exception_type]}
        - {class: DETERMINISTIC_INPUT, action: quarantine, max_attempts: 1, backoff: none, on_exhausted: quarantine, record_fields: [scene_id, reason]}
