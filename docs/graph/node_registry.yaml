# MetaFind reproduction — Node Registry
# SKILL.md §15.4 + §15.9 (failure policy is per-node, so it lives here).
# Node != Agent. There is not a single `agent` role in this graph.

spec_version: "1.0"
graph_id: "metafind-reproduction-v1"

# Registry-level invariants (verified in SKILL.md §16):
#   - every node has exactly one role                                    OK
#   - every node has >= 1 decomposition_rationale                        OK
#   - every node has >= 1 failure class (NONE requires a reason)         OK
#   - role == mutate => idempotent AND rollback != N/A                   OK (5 mutate nodes)
#   - authority >= A2 => decision_log true                               N/A (max authority is A1)
#   - all mutating operations ordered after every relevant gate          OK (see mutate_ordering_proof)

mutate_ordering_proof:
  - node: n07_train_stage1_align
    after_gates: [G1_feasibility, G2_corpus_validity]
    why: "GPU spend is gated by G1 (budget) and G2 (corpus validity — training on leaked splits is wasted spend)"
  - node: n08_build_gallery_staging
    after_gates: [G1_feasibility, G2_corpus_validity]
    why: "writes to a STAGING path only; the shared immutable artifact is written by n09"
  - node: n09_promote_gallery_index
    after_gates: [G1_feasibility, G2_corpus_validity, G3_gallery_freeze]
    why: "G-CONTAM. This is the late-commit point for the shared gallery index."
  - node: sg1_delete_raw
    after_gates: [G1_feasibility]
    after_local_check: "sg1_write_vectors fsync + sha256 verified for this shard"
    why: "irreversible deletion; the only compensation is refetch via sidecar source_uri"
  - node: n21_publish_report
    after_gates: [G1_feasibility, G2_corpus_validity, G3_gallery_freeze, G4_human_study_commit, G5_report_release]
    why: "G-IRREVERSIBLE. Publication cannot be undone; every gate precedes it."

nodes:

# ============================================================ PHASE 0
  - id: n01_env_bootstrap
    title: "Environment bootstrap and compatibility patching"
    role: compute
    authority: A0
    purpose: >
      Pin a dependency set compatible with torch 2.9.1, patch the removed
      torch._six import, and prove both backbones actually load and run.
    decomposition_rationale: [N1_distinct_failure_mode, N4_independent_observability]
    decomposition_note: >
      N1 — its failures are version conflicts, which share no retry policy with
      anything else in the graph. Without this as its own node, every downstream
      node fails in a way that LOOKS like a data problem (F4).
    reads: []
    writes: [run_progress, cost_ledger, degraded_flags]
    precondition: "clone of ULIP and egnn present at /home/kyzen/ULIP and /home/kyzen/egnn"
    postcondition: >
      ULIP2_PointBERT_Colored instantiates with pc_projection.shape[1] == 1280;
      EGNN(in_node_nf=1280, hidden_nf=128, out_node_nf=1280, in_edge_nf=64)
      forward returns h.shape==(n,1280) and x.shape==(n,3);
      determinism capability recorded.
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    cacheable: false
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 14400, tokens: 0, money: 0, gpu_s: 60, external_calls: 0}
    failure:
      classes: [DETERMINISTIC_INPUT, RESOURCE]
      policies:
        - class: DETERMINISTIC_INPUT
          action: fail_closed
          max_attempts: 1
          backoff: none
          on_exhausted: HALT_FAILED
          record_fields: [conflicting_packages, resolved_versions, python_version, torch_version]
          note: "Anti-pattern 8 — retrying a version conflict 10,000 times yields the same error. Do NOT retry."
        - class: RESOURCE
          action: fail_closed
          max_attempts: 1
          backoff: none
          on_exhausted: HALT_FAILED
          record_fields: [disk_free, cuda_version, driver_version]
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: false, per_item_sidecar: false, cost_metered: true, sensitive_redaction: []}
    notes: "Do NOT edit the cloned repos in place. Patch via metafind/compat/ulip_patch.py so the clones stay re-clonable."

  - id: n02_acquire_sources
    title: "Acquire ULIP-2 checkpoint, Objaverse-LVIS, ProcTHOR-10K"
    role: retrieve
    authority: A0
    purpose: "Fetch every external input and pin its immutable identity."
    decomposition_rationale: [N1_distinct_failure_mode, N3_checkpoint_needed]
    reads: []
    writes: [source_manifest, asset_catalog, procthor_raw, variant_registry, paper_reference, cost_ledger, run_progress]
    precondition: "n01 postcondition holds; network reachable"
    postcondition: >
      Every source has a recorded sha256 in source_manifest AND the ULIP-2
      checkpoint reproduces ModelNet40 zero-shot top-1 of ~50.6 (+/-1.0).
    deterministic: true
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [source_uri, expected_sha256]
    checkpoint_after: true
    parallelizable: true
    cost: {wallclock_s: 43200, tokens: 0, money: 0, gpu_s: 300, external_calls: 20}
    failure:
      classes: [TRANSIENT, DETERMINISTIC_INPUT, CONTRACT_VIOLATION, RESOURCE]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 5, backoff: exponential_jitter, on_exhausted: HALT_BLOCKED, record_fields: [url, http_status, bytes_received]}
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [expected_sha256, actual_sha256, uri]}
        - {class: RESOURCE, action: degrade, max_attempts: 1, backoff: none, on_exhausted: HALT_BLOCKED, record_fields: [disk_free, required_bytes]}
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: false, per_item_sidecar: true, cost_metered: true, sensitive_redaction: [api_tokens]}
    notes: >
      The behavioural check (ModelNet40 ~50.6) matters more than the hash.
      A hash proves the file is not corrupt; only behaviour proves it is the
      RIGHT file (V2 — verifying not-broken is not verifying correct).

  - id: n03_pilot_and_budget
    title: "500-asset pilot and cost extrapolation"
    role: subgraph
    authority: A1
    purpose: "Measure real cost/throughput/schema-pass-rate before committing to 48K assets."
    decomposition_rationale: [N8_reusable, N5_gate_point]
    decomposition_note: "N8 — this IS SG1 with mode=pilot, limit=500. Same code path, so the extrapolation is valid."
    reads: [asset_catalog, source_manifest]
    writes: [cost_projection, asset_quarantine, cost_ledger, run_progress]
    precondition: "asset_catalog non-empty; GPT-4o credentials available OR reuse_ulip2_captions selected"
    postcondition: "cost_projection has all five fields populated with real measurements (no UNKNOWN)"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: false
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 7200, tokens: 6000000, money: 20, gpu_s: 3600, external_calls: 500}
    failure:
      classes: [TRANSIENT, MODEL_RECOVERABLE, RESOURCE]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 4, backoff: exponential_jitter, on_exhausted: quarantine, record_fields: [asset_id, http_status]}
        - {class: MODEL_RECOVERABLE, action: feedback_loop, max_attempts: 2, backoff: none, on_exhausted: quarantine, record_fields: [asset_id, schema_errors, raw_response]}
        - {class: RESOURCE, action: degrade, max_attempts: 1, backoff: none, on_exhausted: HALT_BLOCKED, record_fields: [disk_free]}
      partial_failure_semantics: proceed_with_admitted
      rollback: quarantine_forward
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: true, cost_metered: true, sensitive_redaction: []}
    subgraph:
      spec_ref: "SG1 (mode=pilot, limit=500)"
      state_contract:
        reads_parent: [asset_catalog, source_manifest]
        writes_parent: [cost_projection, asset_quarantine, cost_ledger]
        sharing: io_mapping
      failure_surface: transparent
      internal_gate_blocks_parent: false

  - id: G1_feasibility
    title: "GATE — feasibility and budget commitment"
    role: evaluate
    authority: A1
    purpose: "Refuse to start the expensive data phase unless disk, money and GPU budget all check out."
    decomposition_rationale: [N5_gate_point]
    reads: [cost_projection, budget_cap, source_manifest]
    writes: [gate_records, run_progress]
    precondition: "cost_projection fully populated"
    postcondition: "a gate_record exists with is_terminal=true and an rc in {0,2,3}"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    cacheable: false
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 10, tokens: 0, money: 0, gpu_s: 0, external_calls: 0}
    failure:
      classes: [CONTRACT_VIOLATION]
      policies:
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [missing_evidence]}
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: false, sensitive_redaction: []}
    notes: "GE — if this fails, the fix is to shrink scope, NOT to raise budget_cap until it turns green."

# ============================================================ PHASE 1
  - id: n04_object_prep
    title: "Object asset preparation (24-shard streaming)"
    role: subgraph
    authority: A1
    purpose: "Turn 48K raw meshes into cached 1280-d tri-modal embeddings without exceeding disk."
    decomposition_rationale: [N2_independent_retry, N3_checkpoint_needed, N7_parallelizable, N6_side_effects]
    decomposition_note: >
      N6 — contains the only irreversible file deletion in the graph (D3), which
      must be its own inner node so a retry cannot re-delete.
    reads: [asset_catalog, source_manifest, cost_projection]
    writes: [asset_artifacts, asset_embeddings, asset_admitted, asset_quarantine, cost_ledger, run_progress, degraded_flags]
    precondition: "G1 verdict == PASS; disk_free >= peak_shard_bytes * 3"
    postcondition: >
      len(asset_admitted) + len(asset_quarantine) == len(asset_catalog);
      every admitted asset has three 1280-d embeddings with recorded sha256;
      every quarantined asset has a real exception_type and message.
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    idempotency_note: "Skip decision is based on CONTENT sha256, never on file existence (V3)."
    cacheable: true
    cache_key: [asset_sha256, code_revision, ulip2_ckpt_sha, annotation_prompt_version]
    checkpoint_after: true
    parallelizable: true
    cost: {wallclock_s: 432000, tokens: 600000000, money: 2000, gpu_s: 400000, external_calls: 48000}
    failure:
      classes: [TRANSIENT, DETERMINISTIC_INPUT, MODEL_RECOVERABLE, RESOURCE, CONTRACT_VIOLATION]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: quarantine, record_fields: [asset_id, exception_type, exception_msg, attempt]}
        - class: DETERMINISTIC_INPUT
          action: quarantine
          max_attempts: 1
          backoff: none
          on_exhausted: quarantine
          record_fields: [asset_id, source_uri, source_sha256, exception_type, exception_msg, code_revision, timestamp]
          note: "Non-manifold or empty meshes will fail identically forever. Do NOT retry (anti-pattern 8)."
        - {class: MODEL_RECOVERABLE, action: feedback_loop, max_attempts: 2, backoff: none, on_exhausted: quarantine, record_fields: [asset_id, schema_errors, raw_response]}
        - class: RESOURCE
          action: degrade
          max_attempts: 1
          backoff: none
          on_exhausted: HALT_BLOCKED
          record_fields: [disk_free, shard_bytes, shard_id, degraded_flags]
          note: "Shrink the shard, or BLOCK awaiting space. Degradation must be RECORDED, never silent."
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [shard_id, reason]}
      partial_failure_semantics: proceed_with_admitted
      partial_failure_note: >
        F4 — written down here, not decided at runtime. Gallery denominator
        becomes len(asset_admitted). If quarantine_rate > 2%, G2 fails, because
        a denominator that far from 48K makes Table 1 incomparable.
      rollback: compensating_action
      compensating_node: sg1_refetch
      rollback_note: >
        Raw files are deleted (D3). The ONLY recovery path is refetch via the
        sidecar's source_uri + source_sha256. This is precisely why the sidecar
        must be fsynced BEFORE the delete.
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: true, cost_metered: true, sensitive_redaction: [api_tokens]}
    subgraph:
      spec_ref: "SG1 (mode=full)"
      state_contract:
        reads_parent: [asset_catalog, source_manifest]
        writes_parent: [asset_artifacts, asset_embeddings, asset_admitted, asset_quarantine, cost_ledger, degraded_flags]
        sharing: shared_state
      failure_surface: transparent
      failure_surface_note: "Per-asset failures stay visible as individual quarantine records; they are NOT collapsed into a single boolean."
      internal_gate_blocks_parent: false
      internal_gate_note: "A single asset failing must not stop the run — it only shrinks the admitted set."

  - id: n05_scene_prep
    title: "ProcTHOR house -> scene graph preparation"
    role: subgraph
    authority: A1
    purpose: "Build spatial-semantic scene graphs with physical and LLM-generated semantic edges."
    decomposition_rationale: [N1_distinct_failure_mode, N7_parallelizable]
    decomposition_note: "N7 — runs in parallel with n04 under assumption U-05 (ProcTHOR supplies its own t_i metadata)."
    reads: [procthor_raw, source_manifest]
    writes: [scene_store, sem_edge_cache, scene_admitted, scene_quarantine, cost_ledger, run_progress, degraded_flags]
    precondition: "G1 verdict == PASS"
    postcondition: >
      len(scene_admitted) + len(scene_quarantine) == house_count;
      every admitted house has a SPARSE edge_index (not fully connected);
      every semantic edge embedding is projected to 64 dims.
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [house_id, code_revision, sem_edge_prompt_version]
    checkpoint_after: true
    parallelizable: true
    cost: {wallclock_s: 86400, tokens: 50000000, money: 60, gpu_s: 7200, external_calls: 50000}
    failure:
      classes: [TRANSIENT, DETERMINISTIC_INPUT, MODEL_RECOVERABLE]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: quarantine, record_fields: [house_id, exception_type, exception_msg]}
        - {class: DETERMINISTIC_INPUT, action: quarantine, max_attempts: 1, backoff: none, on_exhausted: quarantine, record_fields: [house_id, missing_fields]}
        - class: MODEL_RECOVERABLE
          action: feedback_loop
          max_attempts: 2
          backoff: none
          on_exhausted: degrade
          record_fields: [category_pair, schema_errors]
          note: >
            On exhaustion the edge is marked semantic_edge_missing and degrades
            to geometry-only. It must NOT be silently zero-filled — a zero vector
            is indistinguishable from a valid semantic edge downstream.
      partial_failure_semantics: proceed_with_admitted
      partial_failure_note: "If scene quarantine_rate > 5%, G2 fails."
      rollback: quarantine_forward
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: true, cost_metered: true, sensitive_redaction: []}
    subgraph:
      spec_ref: SG2
      state_contract:
        reads_parent: [procthor_raw]
        writes_parent: [scene_store, sem_edge_cache, scene_admitted, scene_quarantine, cost_ledger, degraded_flags]
        sharing: shared_state
      failure_surface: transparent
      internal_gate_blocks_parent: false

  - id: n13_run_baselines
    title: "Run 6 baselines x 7 modality conditions"
    role: evaluate
    authority: A0
    purpose: "Produce the baseline rows of Table 1 under our evaluation protocol."
    decomposition_rationale: [N1_distinct_failure_mode, N7_parallelizable]
    decomposition_note: >
      N7 — OPTIMIZATION: depends on no MetaFind training, so it is scheduled at
      layer 5 in parallel with data prep rather than sitting on the critical path.
    reads: [asset_embeddings, splits, gallery_size_locked, source_manifest]
    writes: [baseline_metrics, audit_records, cost_ledger, run_progress]
    precondition: "G1 verdict == PASS; splits available"
    postcondition: >
      Every (baseline, condition) cell holds either a metric or the explicit
      sentinel NA_DECLARED. A cell is never left blank.
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [baseline_name, condition, splits_hash, code_revision]
    checkpoint_after: true
    parallelizable: true
    cost: {wallclock_s: 172800, tokens: 0, money: 0, gpu_s: 100000, external_calls: 0}
    failure:
      classes: [TRANSIENT, DETERMINISTIC_INPUT, RESOURCE]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: quarantine, record_fields: [baseline, condition, exception_type]}
        - {class: DETERMINISTIC_INPUT, action: quarantine, max_attempts: 1, backoff: none, on_exhausted: quarantine, record_fields: [baseline, condition, reason]}
        - {class: RESOURCE, action: degrade, max_attempts: 2, backoff: fixed, on_exhausted: quarantine, record_fields: [baseline, gpu_mem_required]}
      partial_failure_semantics: proceed_with_admitted
      partial_failure_note: >
        A baseline that fails to run gets '-' in the table PLUS an explicit
        reason in the report. It must never be left blank, because the paper's
        Table 1 already contains legitimate '-' cells and a reader could not
        otherwise tell the two apart.
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: true, cost_metered: true, sensitive_redaction: []}
    notes: >
      Must deliberately reproduce the PC-Only inflation described in the paper's
      Table 1 footnote: baselines use IDENTICAL embeddings for query and gallery
      (F3). This is the protocol, not a bug. Verified by L2-PCONLY, and the
      published-value comparison is Required Audit RA-2 (never a gate).

  - id: n06_build_splits
    title: "Build object-level and house-level 80/20 splits; lock gallery size"
    role: compute
    authority: A0
    purpose: "Fix the experimental partition immutably and resolve unknown U-04."
    decomposition_rationale: [N5_gate_point, N3_checkpoint_needed]
    reads: [asset_admitted, scene_admitted, asset_catalog]
    writes: [splits, split_seed, gallery_size_locked, run_progress]
    precondition: "both admitted sets available (join policy = all)"
    postcondition: >
      train/test disjoint at BOTH object and house level; no asset appears in
      both a train house and a test house; gallery_size_locked written.
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    cacheable: true
    cache_key: [asset_admitted_hash, scene_admitted_hash, split_seed]
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 600, tokens: 0, money: 0, gpu_s: 0, external_calls: 0}
    failure:
      classes: [CONTRACT_VIOLATION]
      policies:
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [leaked_ids, leak_type]}
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: false, sensitive_redaction: []}
    notes: "House-level splitting is what prevents the subtle leak where the same asset appears in both a train house and a test house."

  - id: G2_corpus_validity
    title: "GATE — corpus validity"
    role: evaluate
    authority: A1
    purpose: "Refuse to train on a leaked or incomplete corpus."
    decomposition_rationale: [N5_gate_point]
    reads: [splits, gallery_size_locked, asset_admitted, asset_quarantine, scene_admitted, scene_quarantine, asset_catalog]
    writes: [gate_records, run_progress]
    precondition: "n04, n05, n06 all complete (join = all)"
    postcondition: "gate_record with is_terminal=true"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    cacheable: false
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 300, tokens: 0, money: 0, gpu_s: 0, external_calls: 0}
    failure:
      classes: [CONTRACT_VIOLATION]
      policies:
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [criterion, observed, expected]}
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: false, sensitive_redaction: []}

# ============================================================ PHASE 2
  - id: n07_train_stage1_align
    title: "Stage-1 cross-modal alignment pretraining (on cached embeddings)"
    role: mutate
    authority: A0
    purpose: "Train the dual-tower projection + fusion with 30% stochastic modality masking (Eq. 5)."
    decomposition_rationale: [N3_checkpoint_needed, N6_side_effects]
    decomposition_note: "N6 — training writes a durable checkpoint, which SKILL.md §4.4 classifies as a mutate side effect."
    reads: [asset_embeddings, splits, split_seed, stage1_config]
    writes: [stage1_ckpt, cost_ledger, run_progress, degraded_flags]
    precondition: "G2 verdict == PASS; asset_embeddings complete for all admitted assets"
    postcondition: >
      stage1_ckpt written at a content-addressed path; masked embeddings are
      NOT zero vectors; bidirectional loss is symmetric under query/gallery swap.
    deterministic: false
    deterministic_note: "GPU atomics + dataloader shuffling. Seeds fixed, but bit-exactness is not guaranteed (NS-5, NS-7)."
    idempotent: true
    idempotency_mechanism: read_before_write
    idempotency_note: "Path = runs/ckpt/{config_hash}_{data_hash}_{seed}_{code_rev}.pt — never overwrites."
    cacheable: true
    cache_key: [config_hash, data_hash, seed, code_revision]
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 21600, tokens: 0, money: 0, gpu_s: 21600, external_calls: 0}
    failure:
      classes: [TRANSIENT, RESOURCE, CATASTROPHIC]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 2, backoff: fixed, on_exhausted: fail_closed, record_fields: [epoch, step, exception_type]}
        - class: RESOURCE
          action: degrade
          max_attempts: 3
          backoff: fixed
          on_exhausted: HALT_BLOCKED
          record_fields: [batch_size_before, batch_size_after, gpu_mem_free]
          note: >
            OOM => reduce batch size, but RECORD it in degraded_flags. Batch size
            directly controls in-batch negatives in Eq. 5, so a silent reduction
            would quietly change the science.
        - {class: CATASTROPHIC, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [traceback, loss_history, step]}
      partial_failure_semantics: halt
      rollback: checkpoint_restore
      rollback_note: "Content-addressed paths mean a restore never clobbers a good checkpoint."
    observability: {emits_trace: true, state_diff: true, decision_log: false, per_item_sidecar: false, cost_metered: true, sensitive_redaction: []}
    notes: >
      Loss MUST be a new MetaFindDualTowerLoss. ULIP's ULIPWithImageLoss is a
      SINGLE-tower tri-modal loss (pc<->text, pc<->image) and does not implement
      Eq. 5 / 7a / 7b (F3).

  - id: n08_build_gallery_staging
    title: "Build STAGING gallery embedding index"
    role: mutate
    authority: A0
    purpose: "Embed every admitted asset with the frozen gallery tower into a staging index."
    decomposition_rationale: [N6_side_effects, N5_gate_point]
    decomposition_note: >
      Deliberately separate from n09. The split is what makes late commit
      possible: G3 inspects the staging artifact before it becomes shared.
    reads: [stage1_ckpt, asset_embeddings, asset_admitted, gallery_size_locked]
    writes: [gallery_index_staging, cost_ledger, run_progress]
    precondition: "stage1_ckpt exists"
    postcondition: "staging index has dim==1280 and count==gallery_size_locked"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [stage1_ckpt_sha, asset_admitted_hash, code_revision]
    checkpoint_after: true
    parallelizable: true
    cost: {wallclock_s: 3600, tokens: 0, money: 0, gpu_s: 3600, external_calls: 0}
    failure:
      classes: [TRANSIENT, RESOURCE, CONTRACT_VIOLATION]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: fail_closed, record_fields: [asset_id, exception_type]}
        - {class: RESOURCE, action: degrade, max_attempts: 2, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [gpu_mem_free]}
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [expected_count, actual_count, expected_dim, actual_dim]}
      partial_failure_semantics: halt
      partial_failure_note: "A partial index is worthless — a missing gallery entry silently lowers R@k for every query."
      rollback: checkpoint_restore
    observability: {emits_trace: true, state_diff: true, decision_log: false, per_item_sidecar: false, cost_metered: true, sensitive_redaction: []}
    notes: "Use EXACT inner product, not ANN. 48K x 1280 x 4B = 246MB — affordable, and it removes nondeterminism source NS-6."

  - id: G3_gallery_freeze
