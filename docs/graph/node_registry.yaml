        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [existing_sha, new_sha, key]}
        - {class: RESOURCE, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_BLOCKED, record_fields: [disk_free]}
      partial_failure_semantics: halt
      rollback: quarantine_forward
      rollback_note: >
