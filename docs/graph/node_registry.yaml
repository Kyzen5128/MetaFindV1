    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: false, sensitive_redaction: []}
    notes: "G-COST: 5 annotators x 200 scenes x 4 methods. Human time, once spent, is not refundable."

  - id: n16_human_study
    title: "Expert human preference study (5 annotators x 200 scenes)"
    role: human
    authority: A0
    purpose: "Produce the human column of Table 2."
    decomposition_rationale: [N5_gate_point, N1_distinct_failure_mode]
    reads: [composed_scenes]
    writes: [human_scores, human_study_status, cost_ledger, run_progress]
    precondition: "G4 verdict == PASS; the interrupt point is at the very START of this node"
    postcondition: ">= 4 annotators complete => scores usable with recorded n; < 4 => BLOCKED_EVIDENCE"
    deterministic: false
    idempotent: false
    idempotency_mechanism: N/A
    idempotency_note: "Not applicable — a human cannot be asked twice and give the same answer. Hence scores are persisted immediately per response."
    cacheable: false
    checkpoint_after: true
    parallelizable: true
    cost: {wallclock_s: 604800, tokens: 0, money: 0, gpu_s: 0, external_calls: 0, human_minutes: 4000}
    failure:
      classes: [HUMAN_RECOVERABLE]
      policies:
        - class: HUMAN_RECOVERABLE
          action: interrupt
          max_attempts: 3
          backoff: fixed
          on_exhausted: HALT_BLOCKED
          record_fields: [annotator_hash, completed, total, last_activity]
          note: >
            Anti-pattern 24 — a waiting annotator is BLOCKED, not FAILED.
            Completed stages must NOT be re-run when they return.
      partial_failure_semantics: proceed_with_admitted
      partial_failure_note: ">=4 complete => compute with the completed set and record n. <4 => Table 2 human column = BLOCKED_EVIDENCE (rc=3)."
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: false, per_item_sidecar: true, cost_metered: true, sensitive_redaction: [annotator_identity]}
    notes: >
      The interrupt MUST be the first thing this node does. On resume the whole
