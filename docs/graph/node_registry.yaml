# MetaFind reproduction -- Node Registry
#
# One entry per node. Node != Agent: there is no `agent` role in this graph.
# Failure policy is per-node, so it lives here.
#
# Registry invariants:
#   every node has exactly one role
#   every node has >= 1 decomposition rationale (N1..N8)
#   every node has >= 1 failure class (NONE requires a reason)
#   role == mutate  =>  idempotent AND rollback != N/A
#   all mutating operations are ordered after every relevant gate

spec_version: "1.0"
graph_id: "metafind-reproduction"

mutate_ordering_proof:
  - {node: n10_train_stage1, after_gates: [G1_sources_valid, G2_pc_sanity, G3_object_corpus], why: "GPU spend gated by corpus validity; training on leaked splits is wasted"}
  - {node: n11_gallery_index_staging, after_gates: [G3_object_corpus], why: "writes only to a staging path; the shared artifact is written by n12"}
  - {node: n12_promote_index, after_gates: [G4_gallery_freeze], why: "G-CONTAM. This is the late-commit point for the shared gallery index."}
  - {node: n13_train_stage2, after_gates: [G3_object_corpus, G6_stage2_ready], why: "Stage 2 has no positive until the protocol is resolved, and no corpus until scene_splits exists"}
  - {node: n22_publish_report, after_gates: [G1_sources_valid, G2_pc_sanity, G3_object_corpus, G4_gallery_freeze, G6_stage2_ready, G5_report_release], why: "G-IRREVERSIBLE. Publication cannot be undone."}

nodes:

# ============================================================ PHASE 0
  - id: n01_env_bootstrap
    role: compute
    purpose: "Pin dependencies, patch ULIP for modern PyTorch, prove both backbones load and run."
    decomposition_rationale: [N1_distinct_failure_mode, N4_independent_observability]
    reads: []
    writes: [run_progress]
    precondition: "vendored ULIP and EGNN present under metafind/vendor"
    postcondition: >
      ULIP2_PointBERT_Colored instantiates with pc_projection (768, 1280);
      EGNN forward returns the expected shapes; determinism capability recorded.
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [DETERMINISTIC_INPUT, RESOURCE]
      policies:
        - {class: DETERMINISTIC_INPUT, action: fail_closed, max_attempts: 1, record_fields: [conflicting_packages, torch_version], note: "Retrying a version conflict yields the same error."}
      partial_failure_semantics: halt
      rollback: N/A

  - id: n02_download
    role: retrieve
    purpose: "Fetch the two datasets the paper names, plus the frozen weights they run on."
    decomposition_rationale: [N1_distinct_failure_mode, N3_checkpoint_needed]
    reads: []
    writes: [asset_manifest, asset_glb, procthor_dataset, variant_registry, run_progress, cost_ledger]
    precondition: "n01 postcondition holds"
    postcondition: >
      manifest present with len(manifest) assets; >=98% of GLBs on disk;
      ProcTHOR splits written; ULIP-2, ViT-bigG-14 and Qwen2.5-VL cached.
    deterministic: true
    idempotent: true
    idempotency_mechanism: read_before_write
    idempotency_note: "An asset counts as present only if its file exists AND is non-trivially sized."
    cost: {wallclock_s: 172800, bytes: 250000000000}
    failure:
      classes: [TRANSIENT, CONTRACT_VIOLATION, RESOURCE]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 5, backoff: exponential_jitter, on_exhausted: quarantine, record_fields: [uid, http_status, attempt]}
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [expected_sha256, actual_sha256], note: "Never accept weights of unknown provenance."}
        - {class: RESOURCE, action: degrade, max_attempts: 1, on_exhausted: HALT_BLOCKED, record_fields: [disk_free, required_bytes]}
      partial_failure_semantics: proceed_with_admitted
      rollback: N/A
    notes: >
      [REVERSED from an earlier draft] GLBs are KEPT, not deleted after rendering.
      Algorithm 1 places retrieved assets into a scene and needs real geometry.
      Deliberately NOT downloaded: ULIP-2's pre-sampled point clouds (185 GB),
      its renders (474 GB, and not the 11-view configuration the paper describes),
      and the ShapeNet triplets (409 GB, a different paper).

  - id: G1_sources_valid
    role: evaluate
    purpose: "Refuse to process an incomplete or unverified corpus."
    decomposition_rationale: [N5_gate_point]
    reads: [asset_manifest, asset_glb, procthor_dataset]
    writes: [gate_records, run_progress]
    postcondition: "gate_record with is_terminal=true"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [criterion, observed]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      Checkpoint validity is a BEHAVIOURAL check, not just sha256: a hash proves
      the file is not corrupt, not that it is the right file.
      [CORRECTED] procthor_dataset is now among the reads. An earlier draft
      mentioned ProcTHOR in the criterion text but gave the gate no channel to
      see it, so a run with Objaverse complete and ProcTHOR absent could pass.

# ============================================================ PHASE 1
  - id: n03_sample_pointclouds
    role: compute
    purpose: "Sample 10,000 xyz+rgb points per asset from its mesh."
    decomposition_rationale: [N1_distinct_failure_mode, N7_parallelizable, N5_gate_point]
    reads: [asset_glb, asset_manifest]
    writes: [pointclouds, quarantine, run_progress, cost_ledger]
    precondition: "G1 verdict == PASS"
    postcondition: >
      Every admitted asset has a (10000, 6) cloud, pc_norm'd exactly as ULIP's
      dataset does: centroid at the origin, largest radius 1.
    deterministic: true
    deterministic_note: "Fixed sampling seed per uid, so the same mesh always yields the same cloud."
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [glb_sha256, sampler_version, n_points, seed]
    failure:
      classes: [DETERMINISTIC_INPUT, RESOURCE]
      policies:
        - {class: DETERMINISTIC_INPUT, action: quarantine, max_attempts: 1, record_fields: [uid, exception_type, exception_msg], note: "A non-manifold or empty mesh fails identically forever; do not retry."}
        - {class: RESOURCE, action: degrade, max_attempts: 2, record_fields: [mem_free]}
      partial_failure_semantics: proceed_with_admitted
      rollback: quarantine_forward
    notes: >
      [UNKNOWN U-02] The ULIP-2 checkpoint was trained on point clouds sampled by
      ULIP's own pipeline, so sampling differently shifts every embedding with no
      error raised. Measured by L2-PC-ULIP-REF and reported. It does not gate:
      the paper never says MetaFind reuses ULIP's clouds, and Stage 1 trains the
      point encoder anyway. G2_pc_sanity gates the part that genuinely
      invalidates -- malformed or degenerate clouds.

  - id: G2_pc_sanity
    role: evaluate
    purpose: "Refuse to train on malformed, degenerate or wrongly normalised point clouds."
    decomposition_rationale: [N5_gate_point]
    reads: [pointclouds]
    writes: [gate_records, run_progress]
    postcondition: "gate_record with is_terminal=true"
    deterministic: false
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [shape, centroid, max_radius, min_axis_var, self_retrieval_rank]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [NARROWED, and the reason matters] This gate used to require our clouds to
      match ULIP's RELEASED clouds through the same encoder, failing the run
      otherwise. That tested a proposition the paper never makes: nothing in
      MetaFind says it reuses ULIP's pre-sampled clouds, and Stage 1 fine-tunes
      the point encoder (paper 2.6), so the encoder can adapt to our sampling.
      "Differs from ULIP's cloud" does not imply "reproduction invalid".
      What remains is genuinely an invalidity condition: shape, finiteness,
      pc_norm (centroid at origin, max radius 1), non-degeneracy, and that a
      sampled cloud retrieves its own asset well above chance. The ULIP
      comparison survives as L2-PC-ULIP-REF, a diagnostic.
      It is NOT demoted because it was failing -- it has never been run and the
      reference clouds are not on disk. It is demoted because it tested the wrong
      claim. If the authors are found to say MetaFind reuses ULIP's
      preprocessing, it becomes a gate again.

  - id: n04_render_views
    role: compute
    purpose: "Render 11 views per asset at 224px under the configured projection."
    decomposition_rationale: [N7_parallelizable, N3_checkpoint_needed]
    reads: [asset_glb, asset_manifest]
    writes: [renders, quarantine, run_progress, cost_ledger]
    precondition: "G1 verdict == PASS"
    postcondition: "11 distinct non-empty views per admitted asset; mesh extents recorded before normalisation"
    deterministic: true
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [glb_sha256, n_views, layout, resolution]
    cost: {wallclock_s: 1500, note: "31 ms/asset measured"}
    failure:
      classes: [DETERMINISTIC_INPUT, RESOURCE]
      policies:
        - {class: DETERMINISTIC_INPUT, action: quarantine, max_attempts: 1, record_fields: [uid, exception_type, exception_msg]}
        - {class: RESOURCE, action: retry, max_attempts: 3, backoff: fixed, on_exhausted: quarantine, record_fields: [gpu_mem_free]}
      partial_failure_semantics: proceed_with_admitted
      rollback: quarantine_forward
    notes: >
      [PAPER 2.3] "11 orthogonal viewpoints" -- the count is stated, nothing else.
      [UNKNOWN U-03a] The projection is not named. Eleven mutually orthogonal
      directions do not exist in 3D, which makes orthographic a plausible
      reading, but the author may have meant "spread out" loosely. Orthographic
      is our default and is recorded per asset; both projections stay available,
      and the choice changes the image embedding distribution.
      [UNKNOWN U-03] Camera placement is also unspecified; Fibonacci lattice by
      default.
      [F13] Normalising to a unit sphere destroys absolute scale, so the
      annotator's size estimate is a category prior; true extents are recorded
      alongside so the estimate is auditable.

  - id: n05_annotate
    role: subgraph
    purpose: "Structured captions from the 11 views."
    decomposition_rationale: [N1_distinct_failure_mode, N8_reusable]
    reads: [renders]
    writes: [objaverse_annotations, quarantine, run_progress, cost_ledger]
    precondition: "renders complete for the asset"
    postcondition: >
      Every admitted asset has category, description, dimensions, materials and
      placement_constraints, with placement values drawn from a closed vocabulary.
      [IMPLEMENTATION CONTRACT, NOT A PAPER REQUIREMENT] Paper 2.3 says
      "attributes SUCH AS object category, size dimensions, materials, and
      placement constraints". "Such as" gives examples, not a schema. Exactly
      these four fields, all of them required, a closed placement vocabulary and
      metres are all ours. Keeping them is right -- without a schema there is no
      verifiable artifact -- but they are reported as choices.
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [render_sha256, prompt_version, model_revision]
    failure:
      classes: [MODEL_RECOVERABLE, TRANSIENT, RESOURCE]
      policies:
        - {class: MODEL_RECOVERABLE, action: feedback_loop, max_attempts: 2, on_exhausted: quarantine, record_fields: [uid, schema_errors, raw_response], note: "The specific error is fed back; resending an identical prompt reproduces the identical mistake."}
        - {class: TRANSIENT, action: retry, max_attempts: 4, backoff: exponential_jitter, on_exhausted: quarantine}
        - {class: RESOURCE, action: degrade, max_attempts: 2, record_fields: [gpu_mem_free]}
      partial_failure_semantics: proceed_with_admitted
      rollback: quarantine_forward
    subgraph: {spec_ref: SG1, failure_surface: transparent, internal_gate_blocks_parent: false}
    notes: >
      [DEVIATION D-2] Qwen2.5-VL replaces GPT-4o. Recorded per asset as
      annotator_model. An earlier draft offered a fallback to ULIP-2's shipped captions as the
      cheap default; removed, because those lack placement constraints and using
      them turns the experiment into a different one. If ever used, the whole
      result is marked DEGRADED.

  - id: n05b_resolve_stage1_encoding
    role: human
    purpose: "Decide what n06 should produce, before it produces it."
    decomposition_rationale: [N5_gate_point, N1_distinct_failure_mode]
    reads: [objaverse_annotations, renders]
    writes: [stage1_encoding_protocol, stage1_hyperparameters, run_progress]
    precondition: "annotations and renders exist for the admitted set"
    postcondition: >
      stage1_encoding_protocol.status == resolved, naming text_serialization,
      image_aggregation, paper_clip_train_scope, actual_clip_train_scope and
      missing_modality_representation.
    deterministic: false
    idempotent: false
    idempotency_mechanism: N/A
    idempotency_note: "A human decision, recorded once."
    failure:
      classes: [HUMAN_RECOVERABLE]
      policies:
        - {class: HUMAN_RECOVERABLE, action: interrupt, max_attempts: 3, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [status, text_serialization, image_aggregation, paper_clip_train_scope, actual_clip_train_scope, missing_modality_representation]}
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [ORDERING] Added because these three decisions sat in stage1_protocol,
      which n09 writes AFTER n06 has already encoded everything. Each of them
      determines what the encoding should be, so resolving them afterwards
      produced a cache built before its own specification existed:
        U-15 text_serialization  the exact string the encoder sees
        U-14 image_aggregation   how 11 views become one e_image; a per-step
             choice cannot be honoured once the cache holds one vector
        U-34 paper_clip_train_scope   our reading of what MetaFind requires
        U-34 actual_clip_train_scope  what this run does. Under `trainable`
             nothing may be cached at all, because gradient has to reach
             OpenCLIP. Only this one branches the graph; D-1 is the GAP
             between the two and was inexpressible while they were one field
        U-11 missing_modality_representation  how an absent modality is
             represented. 2.6 only rules out zero-padding; it never says what
             replaces it, and `learned_token` was being chosen by a
             FusionConfig default while the registry called it UNKNOWN
      No separate gate: n06 simply cannot start without the channel, which is
      the enforcement. Unresolved therefore halts the Objaverse branch at n06
      rather than being discovered at training time.

  - id: n06_encode_text_image
    role: model
    purpose: "Cache the frozen CLIP halves of every asset's embedding."
    decomposition_rationale: [N3_checkpoint_needed, N7_parallelizable]
    reads: [objaverse_annotations, renders, stage1_encoding_protocol]
    writes: [text_image_embeddings, run_progress, cost_ledger]
    postcondition: "Every admitted asset has a text and an image embedding at the checkpoint's width"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [annotation_sha256, render_sha256, ulip2_ckpt_sha]
    failure:
      classes: [RESOURCE, TRANSIENT]
      policies:
        - {class: RESOURCE, action: degrade, max_attempts: 3, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [batch_size_before, batch_size_after]}
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: fixed, on_exhausted: quarantine}
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      SKIPPED ENTIRELY under actual_clip_train_scope == trainable -- e09's guard, not
      an internal branch. Gradient must reach OpenCLIP under that reading, so
      there is nothing a cache could contribute, and n09 gets its text/image
      completeness from e11b instead.
      ONLY text and image, and only under actual_clip_train_scope == frozen. The point
      encoder is trainable in Stage 1, so point-cloud embeddings cannot be
      precomputed -- caching all three is what made an earlier draft the "train
      fuser only" ablation by accident, and the same reasoning binds CLIP under
      the trainable reading of U-34.
      Reads stage1_encoding_protocol because it decides what to produce:
      the serialization template (U-15), whether to store one aggregated image
      embedding or all eleven (U-14), and whether to run at all (U-34).

  - id: n07_scene_graphs
    role: compute
    purpose: "ProcTHOR houses into spatial-semantic graphs."
    decomposition_rationale: [N1_distinct_failure_mode, N7_parallelizable]
    reads: [procthor_dataset]
    writes: [scene_graphs, procthor_object_text, quarantine, run_progress]
    postcondition: >
      Nodes carry a world-frame position and a text-derived feature; support
      edges are read from ProcTHOR's object tree; positions are NOT normalised.
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [DETERMINISTIC_INPUT]
      policies: [{class: DETERMINISTIC_INPUT, action: quarantine, max_attempts: 1, record_fields: [house_id, missing_fields]}]
      partial_failure_semantics: proceed_with_admitted
      rollback: quarantine_forward
    notes: >
      Support comes free: ProcTHOR nests a cup as a child of its table, which is
      exactly the paper's example. [UNKNOWN U-05] adjacency has no stated
      criterion; kNN k=8 by default.
      [CORRECTED] An earlier draft had this node read the Objaverse annotation
      channel, which it does not write and which is keyed by a different
      namespace: ProcTHOR assetIds and Objaverse uids have zero overlap
      (measured, 995 vs 46,052 ids, empty intersection). The node feature t_i
      comes from ProcTHOR's own semantic metadata, which paper 2.3 says it
      supplies. [UNKNOWN U-12] how that metadata becomes a sentence is not
      specified.
      Coordinates stay raw. Not because centring would break the network's
      equivariance -- it would not -- but because the paper's stated setting is
      unnormalised open-world coordinates, and pre-centring would remove the
      very global translation the design is meant to be robust to.

  - id: n08_semantic_edges
    role: subgraph
    purpose: "LLM relation sentences between objects, encoded into edge features."
    decomposition_rationale: [N1_distinct_failure_mode, N8_reusable]
    reads: [scene_graphs, procthor_object_text, sem_edge_cache]
    writes: [sem_edge_cache, quarantine, run_progress, cost_ledger]
    postcondition: "Every selected object pair has an edge embedding or an explicit semantic_edge_missing flag"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [desc_i_sha, desc_j_sha, prompt_version, llm_model, text_encoder_version]
    failure:
      classes: [MODEL_RECOVERABLE, TRANSIENT]
      policies:
        - {class: MODEL_RECOVERABLE, action: feedback_loop, max_attempts: 2, on_exhausted: degrade, record_fields: [pair, schema_errors], note: "On exhaustion the edge degrades to geometry-only and is flagged; it must NOT be zero-filled, which would be indistinguishable from a valid edge."}
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: degrade}
      partial_failure_semantics: proceed_with_admitted
      rollback: quarantine_forward
    subgraph: {spec_ref: SG2, failure_surface: transparent, internal_gate_blocks_parent: false}
    notes: >
      [CORRECTED] Paper 2.5 and Appendix C both say the LLM is prompted
      with object DESCRIPTIONS. An earlier draft cached on (category_a, category_b), collapsing
      "office chair + desk" and "dining chair + dining table" into one relation.
      [UNKNOWN U-06] which pairs get an edge is unspecified.

  - id: n09_build_splits
    role: compute
    purpose: "Fix the object-level 80/20 partition and define both evaluation protocols."
    decomposition_rationale: [N5_gate_point, N3_checkpoint_needed]
    reads: [asset_manifest, pointclouds, text_image_embeddings, objaverse_annotations, renders, stage1_hyperparameters]
    writes: [splits, split_seed, eval_protocols, stage1_protocol, run_progress]
    precondition: "Objaverse preparation complete (join = all)"
    postcondition: >
      Object train/test are disjoint; both evaluation protocols are defined with
      explicit query and gallery scopes.
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [leaked_ids, leak_type]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [PAPER 3.1] 80/20.
      [DECOUPLED] Objaverse only. An earlier draft also read scene_graphs,
      procthor_object_text and sem_edge_cache to build the house split here,
      which put Qwen semantic-edge generation over ProcTHOR on the critical path
      to Stage 1. Stage 1 is object-level pretraining on Objaverse-LVIS
      (paper 2.6) and needs no ProcTHOR data at all, so a fault anywhere in the
      ProcTHOR branch used to stop training that does not depend on it. House
      splits moved to n09c_build_scene_splits.
      [UNKNOWN U-09] query=test is our assumption; paper 3.1 states only the
      80/20 allocation.
      Writes the TRAINING half of the Stage 1 protocol only. The encoding half
      (U-14/U-15/U-34) is resolved earlier, at n05b, because n06 needs it.
      [BRANCH] The text/image completeness this node requires arrives on ONE of
      two guarded edges: e11 (text_image_embeddings) under actual_clip_train_scope ==
      frozen, e11b (objaverse_annotations + renders) under trainable. An
      unconditional e11 made the trainable reading of U-34 unreachable -- the
      join demanded a cache that reading forbids producing. `n06` is therefore
      listed as a dependency for ORDERING only; under trainable it is skipped
      and the join is satisfied by e11b.

  - id: G3_object_corpus
    role: evaluate
    purpose: "Refuse to run Stage 1 on a leaked or incomplete object corpus."
    decomposition_rationale: [N5_gate_point]
    reads: [splits, eval_protocols, stage1_protocol, stage1_encoding_protocol, stage1_hyperparameters, asset_manifest, quarantine]
    writes: [gate_records, run_progress]
    postcondition: "gate_record with is_terminal=true"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [criterion, observed]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [RENAMED from G3_object_corpus] The old name promised more than the gate
      checked. Scene-corpus validity is now checked by G6_stage2_ready, which
      guards the spend that actually depends on it.

  - id: n09c_build_scene_splits
    role: compute
    purpose: "Fix the ProcTHOR house 80/20 partition."
    decomposition_rationale: [N5_gate_point, N1_distinct_failure_mode]
    reads: [procthor_dataset, scene_graphs, procthor_object_text, sem_edge_cache]
    writes: [scene_splits, run_progress]
    precondition: "ProcTHOR preparation complete (join = all)"
    postcondition: "train_houses and test_houses are disjoint"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [leaked_ids, leak_type]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [PAPER 3.1] Same 80/20 statement, applied to houses. An earlier draft also
      forbade an asset appearing in both a train and a test house; the paper does
      not ask for it, and ProcTHOR's 12,000 houses draw on ~1,467 assets, so
      enforcing it would change the scene distribution. Removed.
      [UNKNOWN U-07] ProcTHOR also ships its own 10k/1k/1k split.
      This node exists so that the ProcTHOR branch can fail without stopping
      Stage 1.

  - id: n09b_resolve_stage2_protocol
    role: human
    purpose: "Resolve every blocking Stage 2 protocol: the gallery positive and its modalities, the ESSGNN edge semantics, and the ESSGNN architecture."
    decomposition_rationale: [N5_gate_point, N1_distinct_failure_mode]
    reads: [scene_graphs, asset_manifest, procthor_object_text, objaverse_annotations]
    writes: [stage2_protocol, stage2_pairing, essgnn_edge_protocol, essgnn_arch_protocol, run_progress]
    precondition: "G3_object_corpus verdict == PASS"
    postcondition: >
      stage2_protocol.status == resolved, naming both the pairing method and the
      modality source; stage2_pairing populated accordingly.
    deterministic: false
    idempotent: false
    idempotency_mechanism: N/A
    idempotency_note: "A human decision; recorded once and thereafter immutable via stage2_pairing's write_once."
    failure:
      classes: [HUMAN_RECOVERABLE]
      policies:
        - {class: HUMAN_RECOVERABLE, action: interrupt, max_attempts: 3, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [status, pairing_method, modality_source]}
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [U-08a / U-08b -- BLOCKING] Split out from n09_build_splits deliberately.
      An earlier draft had n09 write stage2_pairing as write_once while the
      answer was still unknown, so writing an empty mapping would have locked the
      channel before the decision existed.
      The paper never states how a ProcTHOR target object corresponds to a
      gallery entry, and measurement shows the two identifier spaces do not
      intersect at all (995 ProcTHOR assetIds against 46,052 Objaverse uids,
      empty intersection). Nor does it say where the target's text, image and
      point cloud come from, since ProcTHOR ships metadata and coordinates only.
      Both are decisions, not derivations, so a person makes them and they are
      reported as choices.

  - id: G6_stage2_ready
    role: evaluate
    purpose: "Refuse to train Stage 2 until its positive, its modalities and its scene corpus are all in place."
    decomposition_rationale: [N5_gate_point]
    reads: [stage2_protocol, stage2_pairing, essgnn_edge_protocol, essgnn_arch_protocol, scene_splits, stage1_protocol]
    writes: [gate_records, run_progress]
    postcondition: "gate_record with is_terminal=true"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [status, coverage]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      Three distinct failure modes, deliberately in one gate because they guard
      the same spend:
        stage2_protocol.status != resolved      -> BLOCKED_EVIDENCE (rc=3)
        essgnn_edge_protocol.status != resolved -> BLOCKED_EVIDENCE (rc=3).
          U-29/U-30/U-19. Without it the ESSGNN edge semantics are whatever
          essgnn.py happens to do, which currently assumes every edge carries a
          fixed-width semantic embedding.
        scene_splits leaked or absent           -> FAIL (rc=2)
      BLOCKED_EVIDENCE means nothing is broken and a decision is outstanding;
      FAIL means something is wrong and must be fixed.
      [WIDENED from G6_stage2_ready] Scene-corpus validity used to sit inside
      G3, which forced Stage 1 to wait on the ProcTHOR branch. It belongs here,
      in front of the spend that actually needs it.

# ============================================================ PHASE 2
  - id: n10_train_stage1
    role: mutate
    purpose: "Cross-modal alignment: train the point encoder and the fusion modules."
    decomposition_rationale: [N3_checkpoint_needed, N6_side_effects]
    reads: [pointclouds, text_image_embeddings, renders, objaverse_annotations, stage1_hyperparameters,
            splits, split_seed, stage1_protocol, stage1_encoding_protocol,
            variant_registry]
    writes: [stage1_ckpt, run_progress, cost_ledger, degraded_flags]
    precondition: "G3_object_corpus verdict == PASS"
    postcondition: >
      Checkpoint written at a content-addressed path recording train_scope;
      an absent modality produces a fused output that DIFFERS from what
      zero-padding gives (paper 2.6: "Rather than zero-padding, we apply masked
      embeddings"). A learned mask token is our implementation of that, not a
      paper requirement -- see U-11. An earlier draft asserted the token itself
      here, which is the round-2 blocker; this is its second surviving copy.
    deterministic: false
    deterministic_note: "GPU atomics, dataloader shuffling, dropout. Seeds fixed; bit-exactness not claimed."
    idempotent: true
    idempotency_mechanism: read_before_write
    idempotency_note: "Path = {config_hash}_{data_hash}_{seed}_{code_rev}.pt, so a rerun never overwrites."
    cacheable: true
    cache_key: [config_hash, data_hash, seed, code_revision]
    failure:
      classes: [RESOURCE, CATASTROPHIC, TRANSIENT]
      policies:
        - {class: RESOURCE, action: degrade, max_attempts: 3, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [batch_size_before, batch_size_after], note: "Batch size controls the in-batch negatives in Eq. 5, so a silent reduction changes the science. Always written to degraded_flags."}
        - {class: CATASTROPHIC, action: fail_closed, max_attempts: 1, record_fields: [traceback, loss_history, step]}
        - {class: TRANSIENT, action: retry, max_attempts: 2, backoff: fixed, on_exhausted: fail_closed}
      partial_failure_semantics: halt
      rollback: checkpoint_restore
    notes: >
      [PAPER 2.6] "Both query and gallery encoders are trained on large-scale
      object-level data from Objaverse-LVIS ... each modality in the query has a
      30% probability of being independently masked. Rather than zero-padding,
      we apply masked embeddings."
      [PAPER 3.4] "Fine-tuning the entire encoder outperformed training the
      fuser only." Table 3 puts that row at 8.7 against 11.4.
      [WORST EARLIER ERROR] An earlier draft froze the backbone and trained only the heads, which
      IS that 8.7 row, installed as the primary path.
      train_scope has three values: fuser_only (the Table 3 ablation),
      point_encoder_and_fuser (the main line), full (includes CLIP, not feasible
      on 24 GB -- see D-1 and RA-3).
      Loss is Eq. 5, one-directional. ULIP's ULIPWithImageLoss is a single-tower
      tri-modal objective and cannot be reused.
      [U-34] Reads renders and objaverse_annotations as well as the cache,
      because actual_clip_train_scope decides which it consumes:
        frozen     -> text_image_embeddings; renders/annotations unused
        trainable  -> renders and annotations, encoded every step so gradient
                      reaches OpenCLIP; the cache MUST NOT be read, since a
                      cache is by construction the output of a frozen network
      Declaring both is what makes the trainable reading executable at all. An
      earlier version read only the cache, so a protocol resolving to
      `trainable` passed G3 and then had no raw inputs to train on.

  - id: n10b_post_stage1_encode
    role: model
    purpose: "Produce the text/image embeddings every downstream consumer reads, using the FINAL Stage 1 encoders."
    decomposition_rationale: [N3_checkpoint_needed, N1_distinct_failure_mode]
    reads: [stage1_ckpt, stage1_encoding_protocol, stage1_protocol, text_image_embeddings, renders, objaverse_annotations]
    writes: [post_stage1_embeddings, run_progress, cost_ledger]
    postcondition: >
      post_stage1_embeddings holds a query map and a gallery map over the
      admitted set, tagged with the checkpoint sha they were produced from.
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [stage1_ckpt_sha, render_sha256, annotation_sha256, text_serialization, image_aggregation]
    failure:
      classes: [RESOURCE, TRANSIENT]
      policies:
        - {class: RESOURCE, action: degrade, max_attempts: 3, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [batch_size_before, batch_size_after]}
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: fixed, on_exhausted: quarantine}
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [ADDED] n11, n13, n15 and n18 read text_image_embeddings, which n06
      writes -- and n06 is skipped when actual_clip_train_scope is `trainable`.
      That reading of U-34 could therefore be trained and then went nowhere:
      every consumer after Stage 1 required a cache that route never produces.
      Two behaviours, decided by actual_clip_train_scope:
        frozen     -> passthrough. CLIP never moved during Stage 1, so n06's
                      cache is still correct and re-encoding would only burn
                      2-4 h to reproduce it.
        trainable  -> re-encode from renders and annotations with the trained
                      encoders. n06's cache does not exist, and even if it did
                      it would be the pre-training weights.
      Writes SEPARATE query and gallery maps. Under tower_sharing =
      fully_separate with actual = trainable the two towers hold different
      trained CLIP weights, so one map per asset is not expressible -- that
      combination is exactly what a single cache silently got wrong.

  - id: n11_gallery_index_staging
    role: mutate
    purpose: "Encode every admitted asset with the frozen gallery tower into a staging index."
    decomposition_rationale: [N6_side_effects, N5_gate_point]
    reads: [stage1_ckpt, pointclouds, post_stage1_embeddings, asset_manifest, stage1_protocol, stage1_encoding_protocol]
    writes: [gallery_index_staging, run_progress, cost_ledger]
    postcondition: "Staging index has the checkpoint's embedding width and len(admitted) rows"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [stage1_ckpt_sha, admitted_hash, code_revision]
    failure:
      classes: [RESOURCE, CONTRACT_VIOLATION]
      policies:
        - {class: RESOURCE, action: degrade, max_attempts: 2, backoff: fixed, on_exhausted: HALT_BLOCKED}
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [expected_count, actual_count]}
      partial_failure_semantics: halt
      partial_failure_note: "A partial index is worthless: a missing entry silently lowers R@k for every query."
      rollback: checkpoint_restore
    notes: "Separate from n12 on purpose -- the split is what makes late commit possible. Exact inner product, no ANN."

  - id: G4_gallery_freeze
    role: evaluate
    purpose: "Stop a bad index from becoming the shared immutable artifact."
    decomposition_rationale: [N5_gate_point]
    reads: [gallery_index_staging, asset_manifest]
    writes: [gate_records, run_progress]
    postcondition: "gate_record with is_terminal=true"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [criterion, observed]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      Key criterion: sample 1000 gallery vectors, query with each, and require
      that the target's similarity EQUALS the maximum and the target is in the
      argmax tie set. An index that cannot retrieve itself is broken.
      [CORRECTED] This said recall@1 == 1.0, which is not tie-safe: two identical
      embeddings let argmax return either id, so a correct index can score below
      1.0 and a broken one can reach it.

  - id: n12_promote_index
    role: mutate
    purpose: "Late commit of the artifact every downstream evaluation reads."
    decomposition_rationale: [N6_side_effects]
    reads: [gallery_index_staging, gate_records]
    writes: [gallery_index, run_progress]
    precondition: "G4 verdict == PASS with is_terminal=true"
    postcondition: "gallery_index[stage1_sha] written; a second differing write is an error"
    deterministic: true
    idempotent: true
    idempotency_mechanism: late_commit
    failure:
      classes: [CONTRACT_VIOLATION, RESOURCE]
      policies:
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [existing_sha, new_sha]}
        - {class: RESOURCE, action: fail_closed, max_attempts: 1, on_exhausted: HALT_BLOCKED}
      partial_failure_semantics: halt
      rollback: quarantine_forward
      rollback_note: "A promoted index is never deleted, only marked INVALIDATED; deleting it would orphan any record already citing it."

  - id: n13_train_stage2
    role: mutate
    purpose: "Layout-aware fine-tuning of the fuser and ESSGNN."
    decomposition_rationale: [N3_checkpoint_needed, N6_side_effects, N8_reusable]
    reads: [stage1_ckpt, scene_graphs, sem_edge_cache, procthor_object_text,
            stage2_protocol, stage2_pairing, essgnn_edge_protocol,
            essgnn_arch_protocol, pointclouds, post_stage1_embeddings, splits,
            scene_splits, split_seed, variant_registry]
    writes: [variant_ckpts, variant_status, run_progress, cost_ledger, degraded_flags]
    precondition: "G3_object_corpus verdict == PASS; stage1_ckpt exists; G6_stage2_ready verdict == PASS (stage2_protocol.status == resolved AND essgnn_edge_protocol.status == resolved AND scene_splits valid)"
    postcondition: >
      Both headline variants trained; lambda is a learnable scalar with gradient;
      the gallery tower received no gradient.
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [variant_config_hash, stage1_ckpt_sha, splits_hash, seed, code_revision]
    failure:
      classes: [RESOURCE, CATASTROPHIC, TRANSIENT]
      policies:
        - {class: RESOURCE, action: degrade, max_attempts: 3, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [variant_id, batch_size_before, batch_size_after]}
        - {class: CATASTROPHIC, action: fail_closed, max_attempts: 1, record_fields: [variant_id, traceback]}
        - {class: TRANSIENT, action: retry, max_attempts: 2, backoff: fixed, on_exhausted: fail_closed}
      partial_failure_semantics: halt
      partial_failure_note: "Both headline variants are required for Table 1; unlike the ablations, a failure here halts."
      rollback: checkpoint_restore
    subgraph: {spec_ref: SG3, failure_surface: transparent, internal_gate_blocks_parent: true}
    notes: >
      [PAPER 2.6] "e_query = Fusion(...) + lambda * e_layout" (Eq. 6, lambda
      learnable); "stochastic scene dropout (30%)"; "Only the query-side fuser
      and the ESSGNN module are updated; the gallery encoder is frozen";
      bidirectional Eq. 7a/7b averaged as Eq. 8.
      Note Stage 1 is one-directional and Stage 2 is bidirectional -- the paper
      is explicit about the difference.
      [UNKNOWN U-08] The paper never defines how a training sample is built from
      a ProcTHOR room: which object is the target, what the partial scene is, how
      many samples per room, how negatives are drawn. Our protocol is stated in
      02_BUILD_STEPS and must be reported as a choice, not a requirement.
      [PAPER 2.6 -- freeze scope] "Only the query-side fuser and the ESSGNN
      module are updated". That excludes the query-side TEXT, IMAGE and POINT
      encoders as well as the whole gallery tower. An earlier draft validated
      only the gallery side, so a gradient leaking into the query PointBERT --
      which Stage 1 does train, so it is not frozen by default -- would have gone
      unnoticed. Enforced by L1-STAGE2-QUERY-ENCODERS-FROZEN.

  - id: n14_equivariance_probe
    role: evaluate
    purpose: "Verify SE(3) behaviour at all three levels, and record the paper's contradictions and overclaims."
    decomposition_rationale: [N4_independent_observability, N5_gate_point]
    reads: [variant_ckpts, scene_graphs, essgnn_edge_protocol, essgnn_arch_protocol]
    writes: [equivariance_report, audit_records, run_progress]
    postcondition: >
      Three separate quantities recorded: per-layer coordinate equivariance,
      per-layer feature invariance, layout-output invariance.
    deterministic: false
    deterministic_note: "scatter_add_ atomics, hence a numeric tolerance rather than exact equality."
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION, TRANSIENT]
      policies:
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [coord_err, feat_delta, layout_delta]}
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: fixed, on_exhausted: fail_closed}
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [EARLIER ERROR] An earlier draft asserted ||ESSGNN(Rx+T) - (R ESSGNN(x) + T)|| for e_layout
      and called it the coordinate channel. e_layout = Pooling({h_i^(L)}) is
      pooled from h, which is INVARIANT; applying R and T to it is meaningless.
      Split into SC-4 (coords equivariant), SC-5 (features invariant),
      SC-6 (layout invariant).
      Also runs RA-1 (h0 = Concat(x,t)), RA-2 (f_x -> R^3) and RA-4 (global
      scaling). None may block, and the tolerance is never relaxed to
      accommodate them.
      RA-4 measures ||e_layout(s*x) - e_layout(x)|| for several scale factors.
      Sections 2.5 and 3.4 motivate ESSGNN by GAT's sensitivity to translation
      AND SCALING, but the property proved is SE(3), which does not contain
      scaling. The audit records how much the layout embedding actually moves;
      it bounds the claim rather than predicting a specific outcome.

# ============================================================ PHASE 3
  - id: n15_eval_retrieval
    role: evaluate
    purpose: "Table 1: instance-level retrieval, 7 modality conditions x 2 gallery protocols."
    decomposition_rationale: [N4_independent_observability, N7_parallelizable]
    reads: [gallery_index, variant_ckpts, eval_protocols, splits, pointclouds, post_stage1_embeddings, stage1_protocol, stage1_encoding_protocol]
    writes: [retrieval_metrics, run_progress, cost_ledger]
    postcondition: "Every (variant, condition, protocol) cell holds a metric with its n_gallery and n_query"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [gallery_index_sha, variant_ckpt_sha, condition, protocol]
    failure:
      classes: [RESOURCE, CONTRACT_VIOLATION]
      policies:
        - {class: RESOURCE, action: degrade, max_attempts: 2, backoff: fixed, on_exhausted: HALT_BLOCKED}
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [n_gallery, expected]}
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      Must be written from scratch: ULIP's test_zeroshot_3d_core performs
      zero-shot CLASSIFICATION over LVIS categories, not instance retrieval.
      [UNKNOWN U-09] Both gallery protocols run; The earlier plan to back-solve the
      denominator from the baselines' 98-99% PC-Only figure cannot work, since
      self-retrieval approaches 100% at either size.

  - id: n15b_resolve_composition_protocol
    role: human
    purpose: "Decide where Algorithm 1's G_0 and query list come from, and what placing an asset does to the graph."
    decomposition_rationale: [N5_gate_point, N1_distinct_failure_mode]
    reads: [scene_graphs, gallery_index, stage2_protocol]
    writes: [composition_protocol, run_progress]
    precondition: "gallery_index promoted"
    postcondition: >
      composition_protocol.status == resolved, naming g0_source, query_list_source,
      placement_rule, and how a newly placed node acquires t_i, physical edges and
      semantic edges.
    deterministic: false
    idempotent: false
    idempotency_mechanism: N/A
    idempotency_note: "A human decision, recorded once."
    failure:
      classes: [HUMAN_RECOVERABLE]
      policies:
        - {class: HUMAN_RECOVERABLE, action: interrupt, max_attempts: 3, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [status, g0_source, placement_rule]}
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      [U-21 -- BLOCKING] Paper 3.3 evaluates "on the scene generation pipeline of
      I-Design on a set of 200 randomly sampled scenes". An earlier draft had n16
      read `scene_graphs`, which holds ProcTHOR houses. A ProcTHOR house is a
      finished layout; Algorithm 1 needs a generation request. The Table 2
      dataflow was therefore never closed, and no gate noticed because no channel
      for I-Design output existed.
      [U-18 -- BLOCKING] Algorithm 1 line 7 says only "Place A*_i into the scene,
      update scene graph". Line 3 of the next iteration calls ESSGNN(G). For that
      to be defined, the placed node needs t_i, a position, an orientation, a
      scale, physical edges and semantic edges. The paper specifies none of it,
      and the choice changes every subsequent retrieval in the sequence.
      Same discipline as n09b: the decision is a person's, held in a mutable
      channel until made, then committed.

  - id: G7_composition_protocol
    role: evaluate
    purpose: "Refuse to compose scenes until the composition protocol and its evaluation input are defined."
    decomposition_rationale: [N5_gate_point]
    reads: [composition_protocol]
    writes: [gate_records, run_progress]
    postcondition: "gate_record with is_terminal=true"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [status, missing_fields]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      Unresolved is BLOCKED_EVIDENCE (rc=3), not FAIL. Table 1 does not depend on
      this gate and continues regardless; only Table 2 and Table 3's two scene
      columns wait.

  - id: n15c_prepare_eval_scenes
    role: compute
    purpose: "Produce the 200 evaluation scenes: initial graph plus asset query list."
    decomposition_rationale: [N1_distinct_failure_mode, N3_checkpoint_needed]
    reads: [composition_protocol, procthor_dataset, scene_graphs, scene_splits]
    writes: [evaluation_scene_inputs, run_progress, cost_ledger, degraded_flags]
    precondition: "G7_composition_protocol verdict == PASS"
    postcondition: "200 scenes, each with a G_0 and a non-empty query list, recorded with the generator revision"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    failure:
      classes: [DETERMINISTIC_INPUT, RESOURCE, TRANSIENT]
      policies:
        - {class: DETERMINISTIC_INPUT, action: fail_closed, max_attempts: 1, record_fields: [idesign_available, traceback], note: "R-01: if I-Design cannot run at all, Tables 2/3 become BLOCKED_EVIDENCE, not FAIL."}
        - {class: RESOURCE, action: degrade, max_attempts: 2, backoff: fixed, on_exhausted: HALT_BLOCKED}
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: quarantine}
      partial_failure_semantics: halt
      partial_failure_note: "Fewer than 200 scenes changes the comparison to the paper and must be declared, not silently averaged."
      rollback: N/A
    notes: >
      [PAPER 3.3] "200 randomly sampled scenes".
      [U-21 -- BOTH READINGS REMAIN EPISTEMIC CANDIDATES; ONLY ONE IS EXECUTABLE]
      An earlier version read
      only composition_protocol, which silently committed to Reading B: with no
      ProcTHOR channel in its reads, "sample ProcTHOR scenes and run them
      through I-Design" could be written in prose but never actually run. The
      ProcTHOR channels are now among the reads so the decision recorded in
      composition_protocol.source is one the graph can honour either way:
        procthor_via_idesign -> sample from scene_graphs within scene_splits.
          NOT CURRENTLY EXECUTABLE, and G7 refuses it: I-Design's entry point
          is IDesign(no_of_objects, user_input, room_dimensions), which takes a
          PROMPT, not a house. No ProcTHOR-house adapter exists upstream or
          here. The reading stays registered because MetaFind 3.3 does not rule
          it out -- but "registered" and "runnable" are different claims, and
          this note used to assert the second.
        idesign_generated    -> generate from prompts, ProcTHOR reads unused.
          The only executable reading today.
      Declaring reads it may not use is the correct trade here: a node that
      cannot reach the data for a live reading is a node that has decided the
      UNKNOWN.
      [R-01 -- MEASURED, NOT SETTLED] I-Design installs and its first stage
      runs; five attempts with a 7B planner completed zero scenes, each failing
      in a different downstream path. There is no baseline for a normal
      completion rate -- I-Design has not been run here with its original
      planner, and neither paper names one -- so this is not yet grounds to
      call those failures defects.

  - id: n16_compose_scenes
    role: subgraph
    purpose: "Algorithm 1: retrieve and place one object at a time."
    decomposition_rationale: [N7_parallelizable, N8_reusable, N3_checkpoint_needed]
    reads: [gallery_index, variant_ckpts, asset_glb, composition_protocol, evaluation_scene_inputs]
    writes: [composed_scenes, composition_incomplete, retrieval_trace, run_progress, degraded_flags]
    postcondition: "Each (variant, scene) yields either a complete scene or an entry in composition_incomplete -- never both, never neither"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    failure:
      classes: [TRANSIENT, DETERMINISTIC_INPUT, RESOURCE]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: quarantine}
        - {class: DETERMINISTIC_INPUT, action: quarantine, max_attempts: 1, record_fields: [scene_id, reason]}
        - {class: RESOURCE, action: degrade, max_attempts: 1, record_fields: [idesign_available], note: "R-01: if I-Design is unusable, Tables 2/3 become BLOCKED_EVIDENCE rather than FAIL."}
      partial_failure_semantics: proceed_with_admitted
      partial_failure_note: "Incomplete scenes are excluded from Table 2 means and reported separately; above 10% the stage fails."
      rollback: quarantine_forward
    subgraph: {spec_ref: SG4, failure_surface: transparent, internal_gate_blocks_parent: false}
    notes: >
      Needs real mesh geometry, which is why GLBs are kept.
      O4: retrieval_trace records top-5 candidates, scores, the chosen id and
      lambda*||e_layout|| at every step -- without the last, an incoherent scene
      cannot be explained.
      [CORRECTED] Reads evaluation_scene_inputs, not scene_graphs. ProcTHOR houses are
      finished layouts and cannot serve as Algorithm 1's G_0; paper 3.3 sources
      the 200 scenes from I-Design. See U-21.

  - id: n17_judge_scenes
    role: model
    purpose: "Table 2's model-judged column, four dimensions."
    decomposition_rationale: [N1_distinct_failure_mode, N6_side_effects]
    reads: [composed_scenes, composition_incomplete, retrieval_trace]
    writes: [judge_scores, run_progress, cost_ledger]
    postcondition: "Every (method, scene, dimension) has a score in range; incomplete scenes excluded"
    deterministic: false
    deterministic_note: "Greedy decoding, pinned prompt version, recorded model revision."
    idempotent: true
    idempotency_mechanism: read_before_write
    cacheable: true
    cache_key: [scene_sha256, judge_prompt_version, model_revision]
    failure:
      classes: [MODEL_RECOVERABLE, RESOURCE]
      policies:
        - {class: MODEL_RECOVERABLE, action: feedback_loop, max_attempts: 2, on_exhausted: quarantine, record_fields: [scene_id, raw_response]}
        - {class: RESOURCE, action: degrade, max_attempts: 2, backoff: fixed, on_exhausted: HALT_BLOCKED}
      partial_failure_semantics: proceed_with_admitted
      rollback: quarantine_forward
    notes: >
      [DEVIATION D-2] Qwen2.5-VL replaces GPT-4o, so Table 2's absolute values
      are not comparable to the paper; only the direction survives (SC-3).
      [UNKNOWN U-10] IDesign's shipped evaluator grades 5 aspects on 1-10 while
      the paper reports 4 on 1-5, and the modified prompt was never published;
      which aspect maps to Scene Coherence is unclear.

  - id: n18_train_ablations
    role: subgraph
    purpose: "Train the Table 3 variants that are genuinely different models."
    decomposition_rationale: [N7_parallelizable, N8_reusable]
    reads: [variant_registry, stage1_ckpt, splits, scene_splits, scene_graphs,
            sem_edge_cache, procthor_object_text, stage1_protocol, stage2_protocol,
            stage2_pairing, essgnn_edge_protocol, essgnn_arch_protocol,
            pointclouds, post_stage1_embeddings, split_seed, stage1_hyperparameters]
    writes: [variant_ckpts, variant_status, run_progress, cost_ledger]
    precondition: "headline numbers exist; variant.requires_training is true"
    postcondition: "Every variant has a status in {SUCCESS, FAILED, EXHAUSTED} with a reason"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    failure:
      classes: [RESOURCE, CATASTROPHIC, TRANSIENT]
      policies:
        - {class: RESOURCE, action: degrade, max_attempts: 3, backoff: fixed, on_exhausted: quarantine, record_fields: [variant_id]}
        - {class: CATASTROPHIC, action: quarantine, max_attempts: 1, record_fields: [variant_id, traceback]}
        - {class: TRANSIENT, action: retry, max_attempts: 2, backoff: fixed, on_exhausted: quarantine}
      partial_failure_semantics: proceed_with_admitted
      partial_failure_note: "Unlike n13, a failed ablation marks its Table 3 row N/A and narrows SC-7 rather than halting."
      rollback: checkpoint_restore
    subgraph: {spec_ref: SG3, failure_surface: transparent, internal_gate_blocks_parent: false}
    notes: >
      [CORRECTED -- reads] An earlier draft read only
      {variant_registry, stage1_ckpt, splits, scene_graphs}, which cannot train a
      layout-aware variant at all: n13 needs eleven channels to do the same job.
      A GAT variant, a fusion variant or a dropout variant needs the point
      clouds, the cached text/image embeddings, the semantic edges, the ProcTHOR
      object text and the resolved Stage 2 protocol. The declaration was a
      dependency contract that could not be satisfied.
      [CORRECTED -- scope] Table 3's "w/o iterative retrieval" is NOT trained
      here. Algorithm 1 is an inference-time procedure (paper 2.7), so that row
      is the Full checkpoint evaluated with composition_mode: parallel. It
      carries requires_training: false and reuses_ckpt: full in variant_registry,
      and n19 evaluates it directly.

  - id: n19_eval_ablations
    role: evaluate
    purpose: "Table 3 metrics per variant, including the inference-only row."
    decomposition_rationale: [N4_independent_observability]
    reads: [variant_ckpts, variant_status, gallery_index, eval_protocols,
            scene_splits, variant_registry, composition_protocol, evaluation_scene_inputs,
            splits, pointclouds, post_stage1_embeddings, asset_glb]
    writes: [retrieval_metrics, composed_scenes, judge_scores, run_progress, cost_ledger]
    postcondition: "Every SUCCESS variant has metrics; every failed one is explicitly N/A with a reason"
    deterministic: false
    idempotent: true
    idempotency_mechanism: read_before_write
    failure:
      classes: [RESOURCE, TRANSIENT]
      policies:
        - {class: RESOURCE, action: degrade, max_attempts: 2, backoff: fixed, on_exhausted: quarantine}
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: quarantine}
      partial_failure_semantics: proceed_with_admitted
      rollback: N/A
    notes: >
      [INPUTS CORRECTED] This read only variant_ckpts, variant_status,
      gallery_index and the protocols -- which cannot produce a single number
      in Table 3. A variant's R@1 needs the QUERY side encoded through that
      variant's checkpoint, so it needs splits, pointclouds and
      post_stage1_embeddings exactly as n15 does; a checkpoint plus an index
      answers nothing on its own. And the two scene columns need asset_glb,
      because `w/o iterative retrieval` composes real meshes.
      The gap was invisible because the node declared the right OUTPUTS.
      Evaluates two kinds of row. Trained variants come from n18. The
      inference-only row ("w/o iterative retrieval") reuses the Full checkpoint
      named by variant.reuses_ckpt and simply runs SG4 with
      composition_mode: parallel.

  - id: n20_aggregate
    role: compute
    purpose: "Assemble Tables 1, 2 and 3."
    decomposition_rationale: [N4_independent_observability]
    reads: [retrieval_metrics, judge_scores, equivariance_report, variant_status,
            composed_scenes, composition_incomplete, degraded_flags]
    writes: [run_progress]
    precondition: "join: core = {n15, n17, n14} all AND extended = {n19} all_settled"
    postcondition: "Every cell holds a value, an explicit NA, or an explicit INSUFFICIENT_EVIDENCE marker -- never blank"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [missing_cells]}]
      partial_failure_semantics: proceed_with_admitted
      rollback: N/A

  - id: n21_compare_to_paper
    role: evaluate
    purpose: "Give every table cell exactly one of three verdicts."
    decomposition_rationale: [N4_independent_observability, N5_gate_point]
    reads: [retrieval_metrics, judge_scores, equivariance_report, degraded_flags, variant_status, eval_protocols]
    writes: [run_progress]
    postcondition: "SC-1..SC-8 each evaluated with a recorded observed value and delta"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [criterion, observed, expected]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      SC-2 needs care: the PC-Only cell EXPECTS MetaFind to be worse than the
      baselines. Reproducing the paper includes reproducing its regressions, so
      the comparator checks direction, not superiority.

  - id: G5_report_release
    role: evaluate
    purpose: "Last check before an irreversible publication."
    decomposition_rationale: [N5_gate_point]
    reads: [gate_records, audit_records, degraded_flags, cost_ledger]
    writes: [gate_records, run_progress]
    postcondition: "gate_record with is_terminal=true"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    failure:
      classes: [CONTRACT_VIOLATION]
      policies: [{class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [missing_item]}]
      partial_failure_semantics: halt
      rollback: N/A
    notes: >
      Criteria are enumerated in validation_plan.yaml, not here. This note used
      to hard-code "RA-1/2/3" and "D-1..D-4", both of which went stale: there
      are four Required Audits, and the deviations are D-2..D-6 with D-1 held
      in boundary.conditional_deviations and EVALUATED rather than listed. A
      hard-coded range in a second place is a second thing to forget.

  - id: n22_publish_report
    role: mutate
    purpose: "The single outward-facing, irreversible action."
    decomposition_rationale: [N6_side_effects]
    reads: [gate_records, audit_records, degraded_flags, asset_manifest, split_seed, quarantine, stage1_hyperparameters]
    writes: [run_progress]
    precondition: "G5 verdict == PASS with is_terminal=true"
    postcondition: "Report published; a git tag records the revision and artifact hashes"
    deterministic: true
    idempotent: true
    idempotency_mechanism: idempotency_key
    idempotency_note: "Key = report_content_sha256; republishing identical content is a no-op."
    failure:
      classes: [TRANSIENT, CONTRACT_VIOLATION]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: HALT_BLOCKED}
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, record_fields: [missing_gate_record]}
      partial_failure_semantics: halt
      rollback: compensating_action
      compensating_node: n22b_publish_erratum
      rollback_note: "An erratum can be issued and the tag marked INVALIDATED, but content already read cannot be recalled. That is why G5 exists."

# ==================================================================
subgraph_nodes:

  SG1_annotate_asset:
    purpose: "Qwen annotation with schema validation and a bounded repair loop."
    cycle: C1
    nodes:
      - {id: sg1_generate, role: model, purpose: "Qwen2.5-VL over the 11 views", join_groups: [init, repair]}
      - {id: sg1_validate, role: evaluate, authority: A1, purpose: "schema check: four required fields, closed placement vocabulary, dimensions in metres"}
      - {id: sg1_admit_or_repair, role: decide, authority: A1, purpose: "admit | repair | quarantine", default: quarantine}
      - {id: sg1_reduce, role: compute, purpose: "all_settled reduce -> admitted set plus quarantine ledger"}
    edges_note: "sg1_validate -> sg1_generate is the C1 feedback edge, join_group=repair (E4)."

  SG2_semantic_edge:
    purpose: "Relation sentences between object descriptions, encoded as edge features."
    cycle: C2
    nodes:
      - {id: sg2_select_pairs, role: compute, purpose: "choose which object pairs get an edge (U-06)"}
      - {id: sg2_cache_lookup, role: decide, authority: A1, purpose: "hash(desc_i, desc_j, versions) hit?", default: call_llm}
      - {id: sg2_generate, role: model, purpose: "Qwen relation sentence from both descriptions", join_groups: [init, repair]}
      - {id: sg2_validate, role: evaluate, authority: A1, purpose: "non-empty and encodable"}
      - {id: sg2_encode, role: model, purpose: "frozen text encoder -> e_ij"}
      - {id: sg2_reduce, role: compute, purpose: "all_settled reduce"}

  SG3_train_variant:
    purpose: "Train one variant. Reused by n13 (headline) and n18 (ablations)."
    cycle: none
    nodes:
      - {id: sg3_scope, role: decide, authority: A1, purpose: "fuser_only | point_encoder_and_fuser | full", default: point_encoder_and_fuser}
      - {id: sg3_train, role: mutate, purpose: "train within the chosen scope"}
      - {id: sg3_record, role: compute, purpose: "write variant_status with SUCCESS | FAILED | EXHAUSTED plus a reason"}

  SG4_iterative_composition:
    purpose: "Algorithm 1 -- retrieve and place one object at a time."
    cycle: C3
    nodes:
      - {id: sg4_init, role: compute, purpose: "load the initial graph and the query list"}
      - {id: sg4_mode, role: decide, authority: A1, purpose: "iterative | parallel | region", default: iterative}
      - {id: sg4_encode_layout, role: model, purpose: "ESSGNN over the current graph", join_groups: [init, loop_back]}
      - {id: sg4_encode_query, role: model, purpose: "encode the available modalities of Q_i", join_groups: [init, loop_back]}
      - {id: sg4_fuse, role: retrieve, purpose: "Eq. 6 then exact inner product over the gallery index", join: all}
      - {id: sg4_place, role: compute, purpose: "place the asset using its real geometry; update placed_assets"}
      - {id: sg4_advance, role: decide, authority: A1, purpose: "loop_back | DONE | EXHAUSTED", default: EXHAUSTED}
    edges_note: "sg4_advance -> {sg4_encode_layout, sg4_encode_query} is the C3 feedback, join_group=loop_back, strictly separate from the init edges (E4)."
