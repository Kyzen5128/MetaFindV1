    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: false, sensitive_redaction: []}
    notes: >
      Key criterion: sample 1000 gallery vectors, use each as its own query, and
      require recall@1 == 1.0. If the index cannot retrieve itself, it is broken.
      This also demonstrates the mechanism behind the baselines' inflated PC-Only.

  - id: n09_promote_gallery_index
    title: "Promote staging index to the shared immutable location"
    role: mutate
    authority: A0
