    observability: {emits_trace: true, state_diff: true, decision_log: false, per_item_sidecar: false, cost_metered: false, sensitive_redaction: []}

  - id: n10_train_headline
    title: "Stage-2 layout-aware fine-tuning (2 headline variants)"
