      partial_failure_semantics: proceed_with_admitted
      partial_failure_note: "Missing `extended` members narrow the claim and are recorded in degraded_flags; missing `core` members block."
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: false, sensitive_redaction: [annotator_identity]}

  - id: n20_compare_to_paper
    title: "Cell-by-cell reproduction comparison"
    role: evaluate
    authority: A0
    purpose: "Give every table cell exactly one of REPRODUCED / NOT_REPRODUCED / INSUFFICIENT_EVIDENCE."
    decomposition_rationale: [N4_independent_observability, N5_gate_point]
    reads: [result_tables, paper_reference, degraded_flags, variant_status, human_study_status]
    writes: [reproduction_verdicts, run_progress]
    precondition: "result_tables complete"
    postcondition: "SC-1..SC-8 each evaluated with a recorded observed value and delta"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    cacheable: true
    cache_key: [result_tables_hash, paper_reference_hash, code_revision]
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 300, tokens: 0, money: 0, gpu_s: 0, external_calls: 0}
    failure:
      classes: [CONTRACT_VIOLATION]
      policies:
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [criterion, observed, expected]}
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: false, sensitive_redaction: []}
    notes: >
      SC-3 deserves care: the PC-Only cell EXPECTS MetaFind to be WORSE than the
      baselines. Reproducing the paper means reproducing its regressions, so the
      comparator must check direction, not superiority.

  - id: G5_report_release
    title: "GATE — reproduction report release"
    role: evaluate
    authority: A1
    purpose: "Last check before an irreversible publication."
    decomposition_rationale: [N5_gate_point]
    reads: [reproduction_verdicts, gate_records, audit_records, degraded_flags, result_tables]
    writes: [gate_records, run_progress]
    precondition: "n20 complete"
    postcondition: "gate_record with is_terminal=true"
    deterministic: true
    idempotent: true
    idempotency_mechanism: natural
    cacheable: false
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 60, tokens: 0, money: 0, gpu_s: 0, external_calls: 0}
    failure:
      classes: [CONTRACT_VIOLATION]
      policies:
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [missing_item]}
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: false, sensitive_redaction: []}
    notes: "Criteria include that all three Required Audit records exist and that deviations D1/D2/D3 are stated in the report."

  - id: n21_publish_report
    title: "Publish the reproduction report and artifacts"
    role: mutate
    authority: A0
    purpose: "The single outward-facing, irreversible action in this graph."
    decomposition_rationale: [N6_side_effects]
    reads: [result_tables, reproduction_verdicts, gate_records, audit_records, degraded_flags, source_manifest]
    writes: [run_progress]
    precondition: "G5 verdict == PASS with is_terminal=true"
    postcondition: "report published; a git tag records the exact revision and artifact hashes"
    deterministic: true
    idempotent: true
    idempotency_mechanism: idempotency_key
    idempotency_note: "Key = (report_content_sha256). Re-publishing identical content is a no-op."
    cacheable: false
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 600, tokens: 0, money: 0, gpu_s: 0, external_calls: 5}
    failure:
      classes: [TRANSIENT, CONTRACT_VIOLATION]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: exponential_jitter, on_exhausted: HALT_BLOCKED, record_fields: [target, http_status]}
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [missing_gate_record]}
      partial_failure_semantics: halt
      rollback: compensating_action
      compensating_node: n21b_publish_erratum
      rollback_note: >
        HONEST LIMIT (§11.2): a compensating action can publish an erratum and
        mark the tag INVALIDATED, but content already read by others cannot be
        recalled. This is why G5 exists.
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: true, sensitive_redaction: [annotator_identity]}

  - id: n22_budget_approval
    title: "Human budget / staffing approval"
    role: human
    authority: A0
    purpose: "Escalation target for G1 and G4 when the verdict is BLOCKED_EVIDENCE (rc=3)."
    decomposition_rationale: [N5_gate_point]
    reads: [cost_projection, cost_ledger, gate_records]
    writes: [budget_cap, run_progress]
    precondition: "a gate emitted rc=3"
    postcondition: "budget_cap updated with an explicit human decision, or the graph enters BLOCKED"
    deterministic: false
    idempotent: false
    idempotency_mechanism: N/A
    cacheable: false
    checkpoint_after: true
    parallelizable: false
    cost: {wallclock_s: 86400, tokens: 0, money: 0, gpu_s: 0, external_calls: 0, human_minutes: 30}
    failure:
      classes: [HUMAN_RECOVERABLE]
      policies:
        - {class: HUMAN_RECOVERABLE, action: interrupt, max_attempts: 2, backoff: fixed, on_exhausted: HALT_BLOCKED, record_fields: [approval_round, decision, rationale]}
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: true, sensitive_redaction: []}
    notes: >
      Raising budget_cap here is legitimate ONLY as an explicit, recorded human
      decision to spend more. It is NOT legitimate as a way to turn a red gate
      green (GE). The gate_record and the approval record are separate entries,
      so the distinction stays auditable.

# ==================================================================
# Subgraph internals (compact). Each is a full graph in its own right.
# ==================================================================
subgraph_nodes:

  SG1_object_prep_stream:
    purpose: "Shard-streaming asset prep with disk backpressure and irreversible cleanup (D3)."
    cycle: C1
    nodes:
      - {id: sg1_shard_gate, role: decide, authority: A1, purpose: "disk backpressure: proceed | shrink_shard | BLOCKED", writes: [degraded_flags]}
      - {id: sg1_validate_mesh, role: compute, purpose: "manifold / non-empty / licence checks", failure: [DETERMINISTIC_INPUT]}
      - {id: sg1_render_views, role: compute, purpose: "11 orthogonal views", failure: [TRANSIENT, RESOURCE], parallel_with: sg1_sample_pc}
      - {id: sg1_sample_pc, role: compute, purpose: "10000 points, xyz+rgb, pc_norm", failure: [DETERMINISTIC_INPUT]}
      - {id: sg1_annotate, role: model, purpose: "GPT-4o structured annotation from 11 views", failure: [TRANSIENT, MODEL_RECOVERABLE], join_groups: [init, repair]}
      - {id: sg1_validate_annotation, role: evaluate, authority: A1, purpose: "schema + required fields + category in LVIS vocab"}
      - {id: sg1_admit_or_quarantine, role: decide, authority: A1, purpose: "admit | repair | quarantine", default: quarantine}
      - {id: sg1_encode, role: model, purpose: "frozen ULIP-2 -> three 1280-d vectors (D2)"}
      - {id: sg1_write_vectors, role: mutate, purpose: "write embeddings + sidecar, fsync", idempotency: read_before_write}
      - {id: sg1_delete_raw, role: mutate, purpose: "IRREVERSIBLE: delete this shard's raw files", precondition: "sg1_write_vectors fsynced AND sha256 verified", rollback: compensating_action, compensating_node: sg1_refetch}
      - {id: sg1_refetch, role: retrieve, purpose: "compensating action: re-download via sidecar source_uri + sha256"}
      - {id: sg1_reduce, role: compute, purpose: "all_settled reduce -> admitted set + quarantine ledger"}
    edges_note: "sg1_validate_annotation -> sg1_annotate is the C1 feedback edge, join_group=repair (E4)."

  SG2_scene_graph_prep:
    purpose: "ProcTHOR houses -> sparse spatial-semantic graphs."
    cycle: C2
    nodes:
      - {id: sg2_parse_house, role: compute, purpose: "house -> rooms -> objects{position, metadata}"}
      - {id: sg2_physical_edges, role: compute, purpose: "geometric rules: adjacency, support", deterministic: true}
      - {id: sg2_enumerate_pairs, role: compute, purpose: "co-occurring object pairs per room, capped"}
      - {id: sg2_semantic_edge, role: model, purpose: "cache lookup then LLM relation sentence", join_groups: [init, repair]}
      - {id: sg2_validate_edge, role: evaluate, authority: A1, purpose: "non-empty and encodable"}
      - {id: sg2_encode_edge_text, role: model, purpose: "frozen text encoder -> 1280-d"}
      - {id: sg2_project_edge, role: compute, purpose: "Linear(1280 -> 64) — F8, prevents semantics swamping geometry"}
      - {id: sg2_assemble_graph, role: compute, purpose: "build SPARSE edge_index (do NOT use egnn get_edges, which is fully connected)"}
      - {id: sg2_reduce, role: compute, purpose: "all_settled reduce"}

  SG3_train_variant:
    purpose: "Train one variant config. Reused by n10 (2 headline) and n17 (8 ablations)."
    cycle: none
    nodes:
      - {id: sg3_route, role: decide, authority: A1, purpose: "requires_stage1_retrain ? full : stage2_only", default: stage2_only}
      - {id: sg3_stage1_head, role: mutate, purpose: "optional Stage-1 head retrain on cached embeddings (cheap thanks to D2)"}
      - {id: sg3_stage2, role: mutate, purpose: "train fuser + ESSGNN; 30% scene dropout; learnable lambda; gallery frozen"}
      - {id: sg3_record_status, role: compute, purpose: "write variant_status with SUCCESS | FAILED | EXHAUSTED + reason"}

  SG4_iterative_composition:
    purpose: "Algorithm 1 — retrieve and place one object at a time."
    cycle: C3
    nodes:
      - {id: sg4_init, role: compute, purpose: "load G_0 and the query list Q_1..Q_N"}
      - {id: sg4_mode, role: decide, authority: A1, purpose: "iterative | parallel | region", default: iterative}
      - {id: sg4_encode_layout, role: model, purpose: "ESSGNN(G) -> e_layout (1280-d)", join_groups: [init, loop_back], writes: [layout_embedding]}
      - {id: sg4_encode_query, role: model, purpose: "encode available modalities of Q_i", join_groups: [init, loop_back], writes: [query_modality_embeds]}
      - {id: sg4_fuse_retrieve, role: retrieve, purpose: "Eq.6 fusion then EXACT inner product over the gallery index", join: all, writes: [retrieval_trace]}
      - {id: sg4_place, role: compute, purpose: "place asset via I-Design or native layout; update placed_assets", writes: [placed_assets, placed_count]}
      - {id: sg4_advance, role: decide, authority: A1, purpose: "loop_back | DONE | EXHAUSTED", default: EXHAUSTED}
    edges_note: >
      sg4_advance -> {sg4_encode_layout, sg4_encode_query} is the C3 feedback,
      join_group=loop_back, kept strictly separate from the init edges out of
      sg4_init (E4). Merging them deadlocks the cycle.
