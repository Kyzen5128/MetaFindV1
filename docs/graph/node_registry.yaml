      failure_surface: transparent
      internal_gate_blocks_parent: true
      internal_gate_note: "Unlike n17, a headline variant failure DOES block the parent."

  - id: n11_equivariance_probe
    title: "SE(3) equivariance verification (SC-5) + Required Audit RA-1"
    role: evaluate
    authority: A0
    purpose: "Prove the central ESSGNN claim numerically, and record the paper's internal contradiction."
    decomposition_rationale: [N4_independent_observability, N5_gate_point]
    reads: [variant_ckpts, scene_store]
    writes: [equivariance_report, audit_records, run_progress]
    precondition: "w/ESSGNN variant checkpoint exists"
    postcondition: >
      For 100 scenes x 100 random (R,T): coord-channel L-inf error < 1e-4 and
      the h channel is exactly invariant. RA-1 record written for the
      h0=Concat(x,t) variant regardless of its outcome.
    deterministic: false
    deterministic_note: "scatter_add_ atomics (NS-5) — hence a numeric tolerance rather than exact equality."
    idempotent: true
    idempotency_mechanism: natural
    cacheable: true
    cache_key: [variant_ckpt_sha, probe_seed, code_revision]
    checkpoint_after: true
    parallelizable: true
    cost: {wallclock_s: 1800, tokens: 0, money: 0, gpu_s: 1800, external_calls: 0}
    failure:
      classes: [CONTRACT_VIOLATION, TRANSIENT]
      policies:
        - {class: TRANSIENT, action: retry, max_attempts: 3, backoff: fixed, on_exhausted: fail_closed, record_fields: [exception_type]}
        - {class: CONTRACT_VIOLATION, action: fail_closed, max_attempts: 1, backoff: none, on_exhausted: HALT_FAILED, record_fields: [max_coord_err, h_delta, variant]}
      partial_failure_semantics: halt
      rollback: N/A
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: false, cost_metered: true, sensitive_redaction: []}
    notes: >
      RA-1 runs the SAME probe on the literal §2.5 formulation h0=Concat(x,t),
      which is EXPECTED TO FAIL (F1). Its failure writes an audit_record and
      narrows one claim. It must NEVER block, and the 1e-4 tolerance must NEVER
      be loosened to accommodate it (anti-pattern 13, rule GE).

# ============================================================ PHASE 3
  - id: n12_eval_object_retrieval
