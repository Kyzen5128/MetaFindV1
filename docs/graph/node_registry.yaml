      rollback: quarantine_forward
    observability: {emits_trace: true, state_diff: true, decision_log: true, per_item_sidecar: true, cost_metered: true, sensitive_redaction: [api_tokens]}
    notes: "A score outside [1,5] is a schema violation, not a valid score. It goes to the repair loop."

  - id: G4_human_study_commit
